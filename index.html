在“属于哪类”上设混淆点。","sourcePages":[9],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N076"},{"id":"N077","chapter":4,"type":"single","stem":"里程碑已超过规定延期天数，看板却继续显示绿色，团队准备追回进度后再告诉客户。最合理的处理是什么？","options":["如实更新预警、升级处理，并主动同步客户与纠偏方案","等待下一次月度会议再决定是否上报","保留绿色，避免客户担忧","只在项目总结中记录，不影响当前沟通"],"answers":[0],"explanation":"里程碑看板应真实反映节点状态。达到升级条件时，不能用“先内部消化”延迟风险沟通，应主动告知客户并提供纠偏方案，保留记录。","focus":"里程碑预警与延期升级","difficulty":"应用","sourceSection":"二、进度与计划管理","sourceEvidence":"延期处理三原则：延期超规定天数需升级处理；主动告知客户并提供纠偏方案；\n杜绝隐瞒不报。先内部消化、追回进度再说的做法是错误的。","sourcePages":[9],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N077"},{"id":"N078","chapter":4,"type":"single","stem":"供应商称“正在催货”，但未给交期；项目仍保留原初验日期，客户也未收到影响说明。哪项组合措施最有针对性？","options":["只要求供应商每天重复“催货中”","明确到货排期，评估延期影响，修订项目计划并争取客户确认","立即认定所有功能无需硬件即可验收","保留原计划且不通知客户，等设备到后再说"],"answers":[1],"explanation":"没有到货排期就无法判断后续安装、联调和初验依赖。应先明确排期，再梳理影响、修订计划并做好客户和内部风险同步。","focus":"交期不确定的计划纠偏","difficulty":"应用","sourceSection":"二、进度与计划管理","sourceEvidence":"硬件到货滞后：初验因硬件到货延期，对接供应商后的首要动作是明确硬件到\n货排期，而非换供应商或索赔。","sourcePages":[8],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N078"},{"id":"N079","chapter":4,"type":"single","stem":"每天开会45分钟汇报PPT，却始终没有记录阻塞项；里程碑延期又不能及时发现。应怎样改进？","options":["用每日15分钟站会聚焦阻塞，并结合里程碑看板跟踪关键节点","只记录成本，不再展示里程碑状态","把PPT改成更长的月报，停止每日同步","只保留会议签到，不再记录阻塞"],"answers":[0],"explanation":"站会与看板服务于不同但互补的目标：站会快速同步阻塞，看板展示关键节点与预警。会议形式和材料数量不能替代问题暴露与纠偏。","focus":"站会与看板协同","difficulty":"应用","sourceSection":"二、进度与计划管理","sourceEvidence":"站会规范：每日15分钟站会，同步阻塞问题；不是每周大会或月度评审。","sourcePages":[9],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N079"},{"id":"N080","chapter":4,"type":"single","stem":"需求规格已书面确认，客户又在会议中提出一组扩展功能，交付负责人承诺全部免费且不延工期。哪种复核意见最准确？","options":["删除既有需求规格，完全以本次会议口述为准","只要客户提出，就自动属于原合同功能","确认新增内容与原范围的关系，再评估工作量和商务条件，不能个人先行承诺","负责人承诺可以替代双方变更确认"],"answers":[2],"explanation":"书面需求基线建立后，扩展功能仍需核实范围、评估工作量与商务决策。个人口头承诺无法替代双方对范围、工期和费用影响的确认。","focus":"新增诉求与个人承诺","difficulty":"应用","sourceSection":"一、需求管理与变更控制","sourceEvidence":"新增需求第一步：客户以取消采购计划施压提出定制化需求时，第一步是逐项\n核实新增需求是否属于原有交付范围，不能直接拒绝，也不能立即组织开发。","sourcePages":[8],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N080"},{"id":"N081","chapter":4,"type":"single","stem":"需求评审只有研发和客户参加，功能可行但测试不可验、现场无法安装。最应该补齐什么机制？","options":["让技术、测试、交付及客户共同评审，提前统一需求与可验可交付认知","只由研发签字即可，不必保留客户参与","等正式验收时再请测试和交付参加","只增设销售旁听，仍不需要测试和交付"],"answers":[0],"explanation":"需求不只是能否开发，还涉及可测试、可实施和客户认知一致。资料要求技术、测试、交付及客户共同参与，缺少任一维度都可能把问题后移。","focus":"需求评审的跨角色闭环","difficulty":"应用","sourceSection":"四、质量管理","sourceEvidence":"需求评审参与方：技术团队、测试团队、交付团队、客户（对接对齐需求认\n知），客户必须参与。","sourcePages":[9],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N081"},{"id":"N082","chapter":4,"type":"single","stem":"测试报告写“全部通过”，却没有测试环境、用例明细和已知遗留问题，验收演示也未预演。最合理的改进是什么？","options":["只提交投资概算替代测试记录","补齐测试报告四要素，并提前进行验收预演暴露问题","删除已知问题，避免影响验收","把结论字号加大即可提高可信度"],"answers":[1],"explanation":"测试结论需要环境、用例、结果、遗留问题支撑；验收预演则将现场风险前置。缺少可追溯证据时，一句“全部通过”不能证明交付质量。","focus":"测试证据与验收预演","difficulty":"应用","sourceSection":"六、测试验收与收尾","sourceEvidence":"测试报告四要素：测试环境、用例清单、测试结果与遗留问题；项目投资概算\n不属于测试报告内容。","sourcePages":[10],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N082"},{"id":"N083","chapter":4,"type":"single","stem":"预演发现演示链路频繁失败，团队准备正式验收时只播放录像，不再披露遗留问题。应怎样调整？","options":["延后全部沟通，正式验收当天再解释","只要录像成功，就认定实际系统稳定","把预演记录删除，视为问题不存在","记录遗留问题并推进整改或确认可行安排，再与客户对齐验收标准和演示内容"],"answers":[3],"explanation":"预演的价值是提前发现问题，不能通过隐藏问题抵消。应将问题纳入测试与整改管理，并提前对齐验收标准、流程和演示，减少现场不确定性。","focus":"预演发现问题后的处置","difficulty":"应用","sourceSection":"六、测试验收与收尾","sourceEvidence":"验收推进技巧：提前沟通（提前确认验收标准、流程和演示内容）、主动汇报\n（定期汇报项目进展以建立信任基础）、验收预演（目的是问题前置，避免正式验\n收现场卡壳）。","sourcePages":[10],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N083"},{"id":"N084","chapter":4,"type":"single","stem":"系统演示流畅，但缺少合同中的两个功能点，版本也无法确认来源。按质量要求应如何判断？","options":["把演示录像归档即可替代代码和版本管理","只补一个功能，另一个可不经确认删除","仍不满足完整交付，需要补齐合同功能并恢复版本可控、代码可追溯","演示流畅即可抵消合同功能缺失"],"answers":[2],"explanation":"质量要求包括稳定、合同功能完整、迭代版本可控、代码可追溯。表面演示效果只覆盖局部表现，不能替代功能覆盖与工程管理证据。","focus":"演示表现与交付质量","difficulty":"进阶","sourceSection":"四、质量管理","sourceEvidence":"系统层面质量要求：系统稳定、功能完整覆盖合同所有功能点、迭代版本可控、\n代码管理可追溯，四项齐备。","sourcePages":[9],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N084"},{"id":"N085","chapter":4,"type":"single","stem":"同一客户环境两次上线后行为不同，团队找不到对应代码版本。哪项措施最直接补足资料中的质量短板？","options":["每次部署都改一个系统显示名称","建立可控版本和可追溯代码管理，再核对各版本合同功能覆盖","保留最近一次安装包并删除全部历史记录","只增加客户满意度问卷，不管理版本"],"answers":[1],"explanation":"资料要求迭代版本可控、代码管理可追溯。出现行为差异却无来源记录，会妨碍定位和验证；应补工程追溯，而不是只改界面名称。","focus":"发布来源追溯","difficulty":"应用","sourceSection":"四、质量管理","sourceEvidence":"系统层面质量要求：系统稳定、功能完整覆盖合同所有功能点、迭代版本可控、\n代码管理可追溯，四项齐备。","sourcePages":[9],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N085"},{"id":"N086","chapter":4,"type":"single","stem":"项目收尾包只有验收签字页，系统资产、运维手册和培训材料仍散落在个人电脑。最合理的收尾动作是什么？","options":["按交付成果归档项目文档、系统资产、运维手册与培训材料","等下一次故障发生再寻找培训和资产资料","有签字页就视为收尾完成，其余可删除","追加客户员工个人档案以增加材料厚度"],"answers":[0],"explanation":"收尾不只是取得验收签字，还需要让后续运营能接续使用交付成果。资料明确归档文档、资产、运维与培训材料，个人档案不属于项目成果。","focus":"验收后知识与资产移交","difficulty":"应用","sourceSection":"六、测试验收与收尾","sourceEvidence":"收尾归档范围：项目文档、系统资产、运维手册、培训材料均须归档；客户员\n工个人档案不属于交付成果。","sourcePages":[10],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N086"},{"id":"N087","chapter":4,"type":"single","stem":"业务经重启已恢复，故障单就写“已好”并关闭；相同问题一周内反复出现。哪项改进最符合闭环要求？","options":["停止监控，避免重复出现告警","只增加一条“客户已知悉”即可","补齐根因分析、处置与恢复验证，并形成闭环改进记录","把每次重启都认定为不同新问题，不做关联"],"answers":[2],"explanation":"资料要求定位根因、修复处置、消除异常恢复业务并完成闭环。恢复业务只是其中一环，缺少根因和改进会使重复故障难以消除。","focus":"恢复业务与根因闭环","difficulty":"应用","sourceSection":"七、运维管理","sourceEvidence":"故障处理完整闭环：定位故障根因→实施修复处置→消除系统异常恢复业务→\n完成问题闭环；只恢复业务不做根因分析不达标。","sourcePages":[10],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N087"},{"id":"N088","chapter":4,"type":"single","stem":"运维团队只统计客户报障后的处理次数，没有主动监控和定期巡检。若目标是风险前置防控，最应补什么？","options":["只要求客户更快拨打报障电话","建立常态化监控与定期巡检，并把发现的问题纳入处置闭环","把报障次数作为唯一质量目标，停止其他分析","每次故障后发送同一份模板回复"],"answers":[1],"explanation":"前置防控强调在客户报障前发现隐患。常态化监控和定期巡检需与处理闭环结合，单纯提高被动响应次数不能体现风险前移。","focus":"被动报障到主动防控","difficulty":"应用","sourceSection":"七、运维管理","sourceEvidence":"监控巡检定位：常态化监控与定期巡检实现的是运维风险的前置防控，不是等\n客户报障后的被动响应。","sourcePages":[10],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N088"},{"id":"N089","chapter":4,"type":"single","stem":"本月系统可用性良好，但用户反复反馈操作效率下降；团队认为“没有宕机就无须优化”。哪项判断符合资料？","options":["只要不新增功能，就不必管理服务质量","用户反馈只属于销售，不可进入运维管理","稳定运行意味着所有运维目标均已永久完成","运维还包含服务质量持续优化，应分析反馈并改进体验与流程"],"answers":[3],"explanation":"运维目标既包括系统稳定，也包括服务质量持续优化。用户体验和流程效率问题即使未导致宕机，仍可能需要分析改进。","focus":"稳定性之外的运维目标","difficulty":"应用","sourceSection":"七、运维管理","sourceEvidence":"运维目标：不仅是保障系统稳定运行，还包含服务质量的持续优化。","sourcePages":[10],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N089"},{"id":"N090","chapter":4,"type":"single","stem":"项目复盘材料只是逐字汇总会议纪要，没有总结有效方法和失误原因。怎样改写更有复用价值？","options":["提炼得失、根因与可复用方法，形成后续项目可执行的改进措施","只保留表扬，不记录问题","将复盘作为应付检查的材料，不再反馈实践","增加会议签到表数量即可"],"answers":[0],"explanation":"经验总结的价值在于沉淀可复用方法、推动组织能力迭代。会议材料可以作为依据，但原样汇总不等于完成经验提炼。","focus":"项目复盘的组织复用","difficulty":"应用","sourceSection":"七、运维管理","sourceEvidence":"经验总结价值：复盘得失、沉淀复用方法、实现组织能力迭代，不是应付检查。","sourcePages":[10],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N090"},{"id":"N091","chapter":4,"type":"single","stem":"初验前发现一项功能不能按期完成，但其他能力已具备。哪种客户沟通方案最符合资料？","options":["说明根因与影响，提出整改、替代或分期落地方案，并修订计划争取确认","只承诺“肯定没问题”，不给排期","删去该功能，不告知客户","把延期原因全部归咎客户，停止书面沟通"],"answers":[0],"explanation":"不能按期完成时，应透明同步风险并给出可讨论的纠偏安排。整改、替代和分期都需结合范围与计划确认，不能单方面删减合同要求。","focus":"部分功能延期的协商方案","difficulty":"应用","sourceSection":"二、进度与计划管理","sourceEvidence":"延期整改思路：对平台无法按期完成的功能项，可制定整改、替代或分期落地\n方案；初验延期后靠修订项目计划并争取客户确认完成初验。应对措施还包括：全\n面梳理问题根因与延期影响，及时向客户及内部做好风险同步，全程沟通书面留痕。","sourcePages":[8],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N091"},{"id":"N092","chapter":4,"type":"single","stem":"施工负责人已完成设备备货和现场网络电力，但到货后既未验收也未厂家调测，就直接提交平台试飞结果。缺失的关键环节是什么？","options":["只要有试飞结果，前序环节均可免做","缺少客户员工资料收集","仅缺验收回款，无需检查安装过程","到货验收和厂家现场安装调测，应补齐后再核验平台试飞"],"answers":[3],"explanation":"安装节点之间存在质量保证关系。平台试飞不能替代设备到货验收与厂家调测，缺失前序记录也使后续问题难以定位。","focus":"安装节点证据链","difficulty":"应用","sourceSection":"五、硬件与软件实施方案","sourceEvidence":"安装计划四节点：设备下单及备货（关键设备提前备货）→现场具备安装\n条件（电线网线基建等）→到货验收、厂家现场安装调测→接入平台测试飞行。","sourcePages":[9],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N092"},{"id":"N093","chapter":4,"type":"single","stem":"客户与交付方邮件已确认新增功能，但研发发现实际工作量远超原评估。最合理的处理是什么？","options":["以已有邮件为由忽略新增影响","直接扩大开发范围，不再记录工期或费用变化","研发自行删掉一半原合同功能抵消工作量","重新评估变化及其影响，并按变更控制与商务协调机制取得一致后调整执行"],"answers":[3],"explanation":"书面一致基于已评估的范围与影响；实际条件重大变化时，仍需让评估和决策跟上执行。不能把一次确认理解为无限扩张或单方删减的授权。","focus":"变更执行中的再评估","difficulty":"进阶","sourceSection":"一、需求管理与变更控制","sourceEvidence":"变更控制四步流程：申请→评估→决策→执行，顺序不可打乱；决策环节涉及\n商务介入、价格谈判、联合审批。","sourcePages":[8],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N093"},{"id":"N094","chapter":4,"type":"single","stem":"需求规格、设计和代码均齐备，但没有试运行报告、对接报告与用户使用资料。交付负责人认为“这些不是代码，无须交付”。审核应如何回应？","options":["这些均属资料列出的交付文档，应结合项目要求补齐，而非只交代码","只有源代码属于交付成果","任何报告都可以用销售合同替代","只补投资概算，其他报告可不提供"],"answers":[0],"explanation":"交付文档覆盖需求、设计、测试、操作、验收、试运行、系统对接和用户使用等阶段。软件交付不能被压缩成代码交接，否则影响验收与运营衔接。","focus":"非代码交付成果完整性","difficulty":"应用","sourceSection":"四、质量管理","sourceEvidence":"交付文档清单：需求规格、设计文档、概要设计、详细设计、测试报告、操作\n手册、验收报告、试运行报告、系统对接报告、完工报告、用户使用报告，均属要\n求的交付文档。","sourcePages":[9],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N094"},{"id":"N095","chapter":4,"type":"single","stem":"客户直到验收当天才知道演示顺序和通过标准，现场临时更换流程导致卡壳。最需要前置的管理动作是什么？","options":["提前确认验收标准、流程和演示内容，并完成预演","取消测试报告，把全部准备时间用于美化PPT","推迟所有沟通，避免客户提前提问题","只增加当天演示人员数量"],"answers":[0],"explanation":"验收风险往往来自认知和流程未对齐。资料强调提前沟通、主动汇报和预演，将标准及演示安排在正式验收前达成共识。","focus":"验收共识的前置形成","difficulty":"应用","sourceSection":"六、测试验收与收尾","sourceEvidence":"验收推进技巧：提前沟通（提前确认验收标准、流程和演示内容）、主动汇报\n（定期汇报项目进展以建立信任基础）、验收预演（目的是问题前置，避免正式验\n收现场卡壳）。","sourcePages":[10],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N095"},{"id":"N096","chapter":4,"type":"single","stem":"项目看板每天更新颜色，却没有列出关键里程碑，也无人处理站会暴露的阻塞。最合理的改造是什么？","options":["看板只记录会议次数，不需节点","用关键节点组织看板，并将阻塞问题转化为责任明确的纠偏与升级动作","保留颜色展示，删除所有时间信息","把站会改成每月一次即可消除阻塞"],"answers":[1],"explanation":"看板不是装饰，也不是会议记录。它应使关键节点可视化、提供预警；站会同步的阻塞则应进入实际推进和风险升级。","focus":"看板信息到执行动作","difficulty":"应用","sourceSection":"二、进度与计划管理","sourceEvidence":"里程碑看板：关键节点可视化，红黄绿灯预警；不是记录纪要或算成本的工具。","sourcePages":[9],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N096"},{"id":"N097","chapter":4,"type":"single","stem":"团队为缩短AI部署等待时间，提前确认算法种类并留出排期，却在周报中写“风险已通过外包完全转移”。最准确的复核结论是什么？","options":["算法种类与排期无关，不应提前确认","措施属于预测性提前安排，不属于外包转移，也不能据此声称风险完全消失","只要写入周报，就可认定外包已完成","任何提前行动都属于风险转移"],"answers":[1],"explanation":"风险分类依据措施机制而非周报标签。提前明确算法并留时间是预测，转移需要外包或保险等承担安排；采取措施也不代表风险完全不存在。","focus":"风险记录与实际措施一致性","difficulty":"应用","sourceSection":"三、风险管理四类应对","sourceEvidence":"风险预测：AI部署排期较长，提前协调客户确认算法种类并预留充足时间——\n这不属于风险转移。","sourcePages":[9],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N097"},{"id":"N098","chapter":4,"type":"single","stem":"资源已就绪且标准平台已部署，定制团队还在进行范围细化；项目经理拟将两条工作流混为一个“研发完成”节点。更好的计划方式是什么？","options":["标准平台部署完成即可跳过全部定制测试","定制需求未完成，所以已部署平台也必须记为完全未启动","两条工作流只保留一个口头完成状态即可","区分标准平台接机测试与定制需求、开发、整体测试依赖，分别管理后汇合验收"],"answers":[3],"explanation":"软件实施包含标准部署与定制开发，两者各有前后依赖。分别管理后汇合，有助于真实呈现已完成工作和仍阻塞的范围，避免一个模糊节点掩盖风险。","focus":"双软件工作流的计划组织","difficulty":"进阶","sourceSection":"五、硬件与软件实施方案","sourceEvidence":"软件实施两大块：标准平台部署＋定制化开发；硬件基座浇筑和验收回款不属\n于软件实施方案。","sourcePages":[10],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N098"},{"id":"N099","chapter":4,"type":"single","stem":"一次故障处置耗时主要花在“谁来处理、如何交接”的反复确认上。若要压缩业务中断时长，最直接的管理改进是什么？","options":["只增加故障总结篇幅","取消问题登记，让每个人自行处理","标准化故障响应并明确处置闭环，减少临时协调的不确定性","把所有处置留到客户上门后再决定"],"answers":[2],"explanation":"标准化响应的核心作用是压缩故障带来的业务中断时长。明确处理机制与闭环要求，可以减少临时判断和交接耗时；增加材料不等于提升响应效率。","focus":"响应标准化与中断时长","difficulty":"应用","sourceSection":"七、运维管理","sourceEvidence":"标准化故障响应：核心作用是压缩故障带来的业务中断时长。","sourcePages":[10],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N099"},{"id":"N100","chapter":4,"type":"single","stem":"客户认可需求，研发也完成开发，但测试按照另一份旧规格执行，最终缺少最新合同功能的验证记录。最应怎样纠偏？","options":["把最新合同功能改成可选项以适配旧测试","统一需求认知与规格基线，按合同功能补齐测试覆盖并保持版本追溯","删除旧测试报告，直接写全部通过","仅让客户在旧规格上签字，不再测试"],"answers":[1],"explanation":"需求评审和质量管理要贯通。各方对需求一致、合同功能完整覆盖、版本可控和代码可追溯，才能避免开发与测试基线分裂。","focus":"需求基线与测试覆盖衔接","difficulty":"进阶","sourceSection":"四、质量管理","sourceEvidence":"系统层面质量要求：系统稳定、功能完整覆盖合同所有功能点、迭代版本可控、\n代码管理可追溯，四项齐备。","sourcePages":[9],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N100"},{"id":"N101","chapter":4,"type":"single","stem":"验收后拟将平台交给独立运维团队，但交付包混入客户员工个人档案，缺少系统资产清单和操作培训材料。哪项收尾建议最合理？","options":["把系统资产和培训资料都删掉，只交验收签字页","无需归档任何材料，运维团队可临时找原交付人员口述","移交项目文档、系统资产、运维手册及培训材料，并剔除无关个人档案","只保留客户个人档案，以便日后联系"],"answers":[2],"explanation":"资料将项目文档、系统资产、运维手册、培训材料列为归档范围，客户员工个人档案不属于交付成果。收尾应保障接续运营所需资料可用，同时避免混入无关材料。","focus":"收尾包内容边界审核","difficulty":"应用","sourceSection":"六、测试验收与收尾","sourceEvidence":"收尾归档范围：项目文档、系统资产、运维手册、培训材料均须归档；客户员\n工个人档案不属于交付成果。","sourcePages":[10],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N101"},{"id":"N102","chapter":4,"type":"multi","stem":"项目边做边改，既没有初始书面范围，也没有变更记录。客户与研发对“必须交付”各有理解。哪些补救措施有依据？","options":["先形成并对齐书面需求边界","新增内容按申请、评估、决策、执行管理","组织技术、测试、交付及客户共同统一需求认知","继续完全依靠口头沟通，以免书面材料限制灵活性"],"answers":[0,1,2],"explanation":"没有范围基线会让变更、测试和验收都失去共同依据。应补书面边界、标准变更流程与跨角色评审；口头灵活不能替代明确一致的交付约定。","focus":"模糊范围的系统性补救","difficulty":"进阶","sourceSection":"一、需求管理与变更控制","sourceEvidence":"需求边界必须书面确认：初始需求边界模糊且未形成书面确认，实施中客户不\n断加需求、改方向，最终会导致项目取消——不是简单延期，是最严重后果。","sourcePages":[8,9],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N102"},{"id":"N103","chapter":4,"type":"multi","stem":"新增算法评估可能延长工期，经理拟在风险台账中写“自留”就直接开发；同时，已停产的设备仍按原型号下单。哪些纠偏合理？","options":["只要把两项都改写成风险转移，就无需采取实际措施","为保持原工期，可以不经确认删去其他合同功能","风险自留不能替代新增需求的评估、商务决策和双方确认","针对停产设备应发起替换申请，以方案调整规避该风险"],"answers":[2,3],"explanation":"风险应对与变更控制解决不同问题。接受某项风险后果，不等于获准新增开发；停产设备也不能只改台账标签，应通过替换方案处理。","focus":"风险台账不能替代变更授权","difficulty":"应用","sourceSection":"一、需求管理与变更控制","sourceEvidence":"变更控制四步流程：申请→评估→决策→执行，顺序不可打乱；决策环节涉及\n商务介入、价格谈判、联合审批。","sourcePages":[8,9],"sourceStatus":"课程43页全文核验","sourceEvidenceAdditional":[{"page":9,"text":"风险规避：发现某型号设备已停产，即刻发起设备替换申请更换为大疆对应设\n备。"}],"explanationStatus":"meaningful","displayId":"N103"},{"id":"N104","chapter":4,"type":"multi","stem":"客户缺少服务器，又提出合同内的定制统计页面；团队拟用一张前端演示页证明“标准平台和定制开发均已完成”。哪些核查应分别开展？","options":["把服务器申请归为验收回款事项，软件实施阶段无需关注","前端页面能打开，即可证明服务器资源与后台服务都已落实","按研发资源清单协调服务器，核实标准平台是否真正完成部署并具备接机测试条件","核对合同范围、需求规格与定制开发成果，不能仅凭演示页面判断整条工作流完成"],"answers":[2,3],"explanation":"软件实施包含标准部署与定制开发两条链：前者需要资源与平台就绪，后者需要范围细化、规格、开发和测试。一个页面展示不能同时证明后台部署及完整定制成果。","focus":"展示页面与真实实施状态核验","difficulty":"应用","sourceSection":"五、硬件与软件实施方案","sourceEvidence":"软件实施两大块：标准平台部署＋定制化开发；硬件基座浇筑和验收回款不属\n于软件实施方案。","sourcePages":[10],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N104"},{"id":"N105","chapter":4,"type":"multi","stem":"项目已发生可能影响初验的延期，客户尚未得知。哪些信息应进入纠偏沟通，而不是只写“进展正常”？","options":["延期根因与对后续节点的影响","相关风险同步与书面留痕","整改、替代或分期落地的方案及修订计划","将所有原节点统一标绿，等追平后再补报"],"answers":[0,1,2],"explanation":"资料强调梳理根因和影响、同步客户及内部、提供纠偏安排并书面留痕。诚实呈现问题有助于形成客户认可的修订计划，掩盖状态会扩大风险。","focus":"延期沟通内容完整性","difficulty":"应用","sourceSection":"二、进度与计划管理","sourceEvidence":"延期整改思路：对平台无法按期完成的功能项，可制定整改、替代或分期落地\n方案；初验延期后靠修订项目计划并争取客户确认完成初验。应对措施还包括：全\n面梳理问题根因与延期影响，及时向客户及内部做好风险同步，全程沟通书面留痕。","sourcePages":[8],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N105"},{"id":"N106","chapter":4,"type":"multi","stem":"同一项目同时遇到“设备停产”和“现场施工安全风险”。哪些应对组合符合资料？","options":["对停产设备发起替换申请，属于规避","施工外包后取消项目方全部安全管理","对设备停产继续沿用原型号不作措施，并称风险已经规避","对施工引入合作方外包，属于转移但仍保留项目方相应管理责任"],"answers":[0,3],"explanation":"规避通过改换方案绕开问题，转移通过外包等机制分配风险。停产不处理不叫规避，外包也不等于项目方责任清零。","focus":"两类风险的并行应对","difficulty":"应用","sourceSection":"三、风险管理四类应对","sourceEvidence":"风险规避：发现某型号设备已停产，即刻发起设备替换申请更换为大疆对应设\n备。","sourcePages":[9],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N106"},{"id":"N107","chapter":4,"type":"multi","stem":"质量检查发现功能覆盖、稳定性、版本及测试证据四方面问题。哪些整改能够直接支撑资料中的质量要求？","options":["补齐测试环境、用例、结果与遗留问题记录","补齐合同功能并核验系统稳定性","只提高演示动画流畅度，其他证据均可省略","让迭代版本可控、代码来源可追溯"],"answers":[0,1,3],"explanation":"系统质量包括合同完整、稳定、版本和代码管理；测试报告提供验证证据。演示表现可作为展示环节，但不能替代这些交付要求。","focus":"工程质量与验证证据","difficulty":"进阶","sourceSection":"四、质量管理","sourceEvidence":"系统层面质量要求：系统稳定、功能完整覆盖合同所有功能点、迭代版本可控、\n代码管理可追溯，四项齐备。","sourcePages":[9,10],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N107"},{"id":"N108","chapter":4,"type":"multi","stem":"测试报告里只有投资概算和一句“功能正常”，验收负责人要求补证。哪些补充内容属于资料列出的测试报告要素？","options":["客户员工个人档案和工资明细","项目宣传海报与营销口号","实际测试环境与用例清单","测试结果及遗留问题"],"answers":[2,3],"explanation":"测试报告围绕验证条件、方法和结果组织，包括环境、用例、结果与遗留问题。投资概算或个人档案既不能证明功能通过，也不属于这些要素。","focus":"测试报告缺项定位","difficulty":"应用","sourceSection":"六、测试验收与收尾","sourceEvidence":"测试报告四要素：测试环境、用例清单、测试结果与遗留问题；项目投资概算\n不属于测试报告内容。","sourcePages":[10],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N108"},{"id":"N109","chapter":4,"type":"multi","stem":"飞机到货尚需一周，但服务器资源协调和定制需求调研可独立开展，且资源互不冲突。哪些安排能在不跳过依赖的前提下利用等待期？","options":["平台未就绪时先开展接机测试，以测试结果替代部署","把所有软硬件工作都停住，直到飞机到货再开始需求调研","按合同标书开展现场需求调研并形成需求规格，控制范围溢出","提前按研发清单协调云资源或物理机，推进标准部署准备"],"answers":[2,3],"explanation":"不同工作流可在题设资源不冲突时并行准备，但各自依赖不能跳过。等待硬件时仍可落实标准部署资源、细化定制需求；接机测试则应在平台就绪后开展。","focus":"等待硬件期间的并行推进","difficulty":"应用","sourceSection":"五、硬件与软件实施方案","sourceEvidence":"标准平台部署三步：协调服务器资源（按研发资源清单申请云资源或采购物理\n机）→研发部署标准平台→平台就绪后接入飞机开展测试飞行。","sourcePages":[10],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N109"},{"id":"N110","chapter":4,"type":"multi","stem":"厂家已提交设备安装调测记录，但平台接入尚未测试；交付组拟据此删除系统对接报告并直接初验。哪些补强措施合理？","options":["将缺失的接入验证一律改称客户新增需求，不再核对原交付范围","只要设备到货验收通过，所有平台接入能力便自动成立","保留接入平台测试飞行的节点，厂家调测不能替代端到端接入验证","按项目要求补齐系统对接等交付文档，并让测试结果可追溯"],"answers":[2,3],"explanation":"硬件安装调测之后还有接入平台测试飞行；系统对接报告也是资料列出的交付文档。供应商完成单环节不能证明端到端链路和交付证据均完整。","focus":"供应商调测与端到端交付边界","difficulty":"应用","sourceSection":"五、硬件与软件实施方案","sourceEvidence":"安装计划四节点：设备下单及备货（关键设备提前备货）→现场具备安装\n条件（电线网线基建等）→到货验收、厂家现场安装调测→接入平台测试飞行。","sourcePages":[9,10],"sourceStatus":"课程43页全文核验","sourceEvidenceAdditional":[{"page":9,"text":"交付文档清单：需求规格、设计文档、概要设计、详细设计、测试报告、操作\n手册、验收报告、试运行报告、系统对接报告、完工报告、用户使用报告，均属要\n求的交付文档。"}],"explanationStatus":"meaningful","displayId":"N110"},{"id":"N111","chapter":4,"type":"multi","stem":"为降低正式验收当天卡壳的概率，哪些动作应安排在此前？","options":["定期主动汇报项目进展，建立一致认知","提前与客户确认验收标准、流程和演示内容","把所有遗留问题从测试报告中删除，营造无风险印象","开展验收预演，把问题前置暴露"],"answers":[0,1,3],"explanation":"提前沟通、主动汇报、验收预演是资料列出的推进技巧。问题前置需要真实记录和处理，删去问题会削弱可追溯性而不是降低风险。","focus":"正式验收前的准备组合","difficulty":"应用","sourceSection":"六、测试验收与收尾","sourceEvidence":"验收推进技巧：提前沟通（提前确认验收标准、流程和演示内容）、主动汇报\n（定期汇报项目进展以建立信任基础）、验收预演（目的是问题前置，避免正式验\n收现场卡壳）。","sourcePages":[10],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N111"},{"id":"N112","chapter":4,"type":"multi","stem":"各项目验收和资料归档都已完成，但新团队仍重复踩同样的坑，每次故障都临时商量处理方式。哪些改进更能把项目经验转化为组织能力？","options":["只增加归档文件数量，不分析问题和有效做法","标准化故障响应，减少临时协调导致的业务中断时长","从复盘中提炼得失与可复用方法，并反馈后续项目实践","把复盘限定为应付检查的签到与材料汇总"],"answers":[1,2],"explanation":"资料齐全只是可查阅的基础，复用还需要提炼方法并应用。资料指出经验总结应推动组织能力迭代，标准化故障响应则直接服务于压缩业务中断。","focus":"从已归档资料到组织方法复用","difficulty":"应用","sourceSection":"七、运维管理","sourceEvidence":"经验总结价值：复盘得失、沉淀复用方法、实现组织能力迭代，不是应付检查。","sourcePages":[10],"sourceStatus":"课程43页全文核验","sourceEvidenceAdditional":[{"page":10,"text":"标准化故障响应：核心作用是压缩故障带来的业务中断时长。"}],"explanationStatus":"meaningful","displayId":"N112"},{"id":"N113","chapter":4,"type":"multi","stem":"系统已发生业务中断，负责人仅将问题写入风险台账并安排下周巡检，称“前置防控工作已完成”。哪些纠偏意见成立？","options":["把故障发生日改成下周巡检日，即可视为问题尚未发生","常态化监控和定期巡检用于前置防控，不能替代本次已发生故障的处置","已发生的故障应进入标准化响应与根因、修复、恢复业务的处置闭环","只要台账记录为高风险，就不再需要恢复业务"],"answers":[1,2],"explanation":"前置防控和实际故障处置属于不同阶段。巡检用于发现潜在风险；业务已中断时，应落实故障响应及完整处理链，不能用计划中的巡检替代当前修复。","focus":"潜在风险防控与已发生故障处置","difficulty":"应用","sourceSection":"七、运维管理","sourceEvidence":"故障处理完整闭环：定位故障根因→实施修复处置→消除系统异常恢复业务→\n完成问题闭环；只恢复业务不做根因分析不达标。","sourcePages":[10],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N113"},{"id":"N114","chapter":4,"type":"multi","stem":"运维绩效希望同时体现“防故障”和“提升服务”，哪些工作方向与资料一致？","options":["常态化监控和定期巡检，推动风险前置","对故障完成根因与修复闭环","只统计客户投诉数量，其他运行信息均不看","根据运行与服务问题持续优化质量"],"answers":[0,1,3],"explanation":"运维不仅响应报障，还应主动防控风险、完成故障闭环并持续优化服务。仅看投诉既无法全面发现隐患，也不能支持持续改进。","focus":"防控与服务双目标","difficulty":"应用","sourceSection":"七、运维管理","sourceEvidence":"运维目标：不仅是保障系统稳定运行，还包含服务质量的持续优化。","sourcePages":[10],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N114"},{"id":"N115","chapter":4,"type":"multi","stem":"每日站会已发现硬件到货延迟，看板也出现初验风险。哪些后续动作有助于把发现转化为处置？","options":["把看板黄色改回绿色，以免触发沟通","落实供应商到货排期并评估后续节点影响","仅保留站会纪要，不调整任何项目计划","主动同步客户和内部，必要时按规定升级"],"answers":[1,3],"explanation":"发现问题只是起点，还需明确交期、影响与纠偏动作，并按照风险程度同步或升级。看板颜色和会议纪要应反映并推动实际处理。","focus":"从阻塞发现到延期处置","difficulty":"应用","sourceSection":"二、进度与计划管理","sourceEvidence":"硬件到货滞后：初验因硬件到货延期，对接供应商后的首要动作是明确硬件到\n货排期，而非换供应商或索赔。","sourcePages":[8,9],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N115"},{"id":"N116","chapter":4,"type":"multi","stem":"风险审查会上，团队把“接受一项可承受后果”和“购买保险分配风险”都写成风险已消失。哪些复核意见成立？","options":["接受后果属于自留，应如实记录，不能写成风险消失","只要风险台账改成绿色，未采取的措施也可视为已完成","两种措施都能自动消除所有项目方管理责任","保险属于转移机制，应区分承担安排与风险本身是否仍可能发生"],"answers":[0,3],"explanation":"资料区分自留与转移：前者接受后果，后者通过保险或外包分配风险。无论哪一种，都不等于风险事件不再可能发生，更不能用状态颜色替代实际措施。","focus":"风险承担机制与剩余风险","difficulty":"应用","sourceSection":"三、风险管理四类应对","sourceEvidence":"四类方式辨析：预测是提前布置留余量，规避是换方案绕开风险，转移是外包/\n保险，自留是接受后果。判断题常在“属于哪类”上设混淆点。","sourcePages":[9],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N116"},{"id":"N117","chapter":4,"type":"multi","stem":"一个项目中，硬件到货、服务器申请和定制需求细化同时推进。哪些依赖关系应写入计划？","options":["定制开发无需需求规格和范围控制，直接编码即可","标准平台部署前应按资源清单落实服务器资源","安装包就绪自动代表服务器、现场和定制需求均已就绪","现场条件、到货验收与安装调测完成后进入平台试飞"],"answers":[1,3],"explanation":"不同工作流可在组织上并行，但各自前置条件仍须满足。标准部署依赖资源，硬件试飞依赖现场和安装，定制开发依赖范围细化与规格。","focus":"并行工作流的依赖门槛","difficulty":"进阶","sourceSection":"五、硬件与软件实施方案","sourceEvidence":"标准平台部署三步：协调服务器资源（按研发资源清单申请云资源或采购物理\n机）→研发部署标准平台→平台就绪后接入飞机开展测试飞行。","sourcePages":[9,10],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N117"},{"id":"N118","chapter":4,"type":"multi","stem":"技术、测试和交付对同一需求有不同理解，客户又未参与评审。哪些行动能降低后续范围与验收争议？","options":["形成并共同确认清晰的需求边界","用最终演示替代前期需求对齐","组织包含客户的四方需求评审","只由技术团队修改需求，其他角色验收时再看"],"answers":[0,2],"explanation":"资料要求技术、测试、交付、客户共同评审，初始边界还应书面确认。将认知差异留到验收时，可能导致范围、测试和交付条件全面失配。","focus":"需求认知分歧的提前消除","difficulty":"应用","sourceSection":"四、质量管理","sourceEvidence":"需求评审参与方：技术团队、测试团队、交付团队、客户（对接对齐需求认\n知），客户必须参与。","sourcePages":[8,9],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N118"},{"id":"N119","chapter":4,"type":"multi","stem":"项目审计发现三份变更邮件：一封仅提出需求，一封仅内部估算，一封双方明确同意范围和实施安排。哪些判断符合资料？","options":["需求申请邮件本身不等于完成评估和决策","双方书面或邮件一致是新增内容落地的重要前提","只要存在任意一封邮件，就可忽略变更四步流程","内部工作量估算本身不等于双方一致"],"answers":[0,1,3],"explanation":"申请、评估、决策和执行各有作用，“有邮件”不等于流程齐全。资料要求双方达成一致后再推动实施，应核对邮件内容与参与方。","focus":"变更邮件证据效力辨析","difficulty":"应用","sourceSection":"一、需求管理与变更控制","sourceEvidence":"变更落地前提：所有新增内容须经双方书面或邮件确认达成一致后，方可组织\n推动落地实施。","sourcePages":[8],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N119"},{"id":"N120","chapter":4,"type":"multi","stem":"硬件晚到后，团队为保住初验日期，拟删去整体功能测试和验收预演，只保留现场演示。哪些方案更符合资料的进度与质量要求？","options":["每日站会开满15分钟即可替代全部功能测试","只要把原验收日期保留下来，就可认定进度风险已消除","保留必要的整体功能测试与验收预演，将问题前置而非压到正式验收","梳理延期影响，提出纠偏并修订计划，争取客户确认"],"answers":[2,3],"explanation":"追赶日期不能靠删去质量验证来掩盖风险。资料同时要求延期影响分析和客户确认、整体功能测试时间、验收预演，应在这些约束下讨论可执行的纠偏安排。","focus":"延期压力下的质量与进度平衡","difficulty":"应用","sourceSection":"二、进度与计划管理","sourceEvidence":"延期整改思路：对平台无法按期完成的功能项，可制定整改、替代或分期落地\n方案；初验延期后靠修订项目计划并争取客户确认完成初验。应对措施还包括：全\n面梳理问题根因与延期影响，及时向客户及内部做好风险同步，全程沟通书面留痕。","sourcePages":[8,10],"sourceStatus":"课程43页全文核验","sourceEvidenceAdditional":[{"page":10,"text":"定制化开发三步：现场需求调研（按合同标书范围细化需求功能点）→控制需\n求溢出，生成需求规格说明书→研发计划排期，按期开发并预留整体功能测试时间。"},{"page":10,"text":"验收推进技巧：提前沟通（提前确认验收标准、流程和演示内容）、主动汇报\n（定期汇报项目进展以建立信任基础）、验收预演（目的是问题前置，避免正式验\n收现场卡壳）。"}],"explanationStatus":"meaningful","displayId":"N120"},{"id":"N121","chapter":4,"type":"multi","stem":"甲问题是合同约定的告警功能无法触发；乙诉求是合同未列的定制统计看板。团队拟把两者都当收费新增需求。哪些分流意见合理？","options":["乙应按新增需求核实、评估和商务确认流程处理，双方一致后再推动","凡是客户验收前提出的内容都自动属于免费原范围","甲应先按原合同功能范围核对并处理，不能仅因要修改代码就认定为新增范围","凡是需要研发改代码的工作都自动属于收费新增需求"],"answers":[0,2],"explanation":"范围判断看合同与既有交付要求，不能看“是否要改代码”或“提出时间”。原有功能缺陷与真正新增诉求应分流：前者核查交付完整性，后者履行变更评估与决策。","focus":"合同内缺陷与新增需求分流","difficulty":"应用","sourceSection":"一、需求管理与变更控制","sourceEvidence":"新增需求第一步：客户以取消采购计划施压提出定制化需求时，第一步是逐项\n核实新增需求是否属于原有交付范围，不能直接拒绝，也不能立即组织开发。","sourcePages":[8,9],"sourceStatus":"课程43页全文核验","sourceEvidenceAdditional":[{"page":9,"text":"系统层面质量要求：系统稳定、功能完整覆盖合同所有功能点、迭代版本可控、\n代码管理可追溯，四项齐备。"}],"explanationStatus":"meaningful","displayId":"N121"},{"id":"N122","chapter":4,"type":"multi","stem":"测试报告记录环境A的V3版本通过，但正式现场已部署到环境B的V4版本；团队拟原样沿用报告直接验收。哪些核查必要？","options":["只要报告结论写通过，环境和版本变化都无需再看","保持部署版本与代码来源可追溯，并针对正式演示安排预演","把报告封面中的V3改成V4即可证明实际版本已经测试","核对报告中的环境、用例和结果是否能够支撑当前现场的实际版本，补齐差异验证"],"answers":[1,3],"explanation":"报告的环境和验证结果应与被交付系统相对应，版本变化需要可追溯管理。改封面不能创造验证证据，还应结合现场差异与预演确认正式交付表现。","focus":"测试证据与部署版本一致性","difficulty":"应用","sourceSection":"六、测试验收与收尾","sourceEvidence":"测试报告四要素：测试环境、用例清单、测试结果与遗留问题；项目投资概算\n不属于测试报告内容。","sourcePages":[9,10],"sourceStatus":"课程43页全文核验","sourceEvidenceAdditional":[{"page":9,"text":"系统层面质量要求：系统稳定、功能完整覆盖合同所有功能点、迭代版本可控、\n代码管理可追溯，四项齐备。"},{"page":10,"text":"验收推进技巧：提前沟通（提前确认验收标准、流程和演示内容）、主动汇报\n（定期汇报项目进展以建立信任基础）、验收预演（目的是问题前置，避免正式验\n收现场卡壳）。"}],"explanationStatus":"meaningful","displayId":"N122"},{"id":"N123","chapter":4,"type":"multi","stem":"某新增功能虽按时上线，却缺少范围评估、双方确认，且覆盖了原有代码版本。哪些风险控制措施需要补强？","options":["以已上线证明所有变更决策均自动合法有效","按变更控制澄清新增范围、影响与双方一致记录","删除原需求和原代码记录，避免发现范围差异","保持迭代版本可控、代码来源可追溯"],"answers":[1,3],"explanation":"按时上线不是流程和质量都合格的证明。范围评估、双方一致与版本追溯共同保障可验收、可维护的交付，删除历史记录会加剧风险。","focus":"变更控制与发布追溯协同","difficulty":"进阶","sourceSection":"一、需求管理与变更控制","sourceEvidence":"变更控制四步流程：申请→评估→决策→执行，顺序不可打乱；决策环节涉及\n商务介入、价格谈判、联合审批。","sourcePages":[8,9],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N123"},{"id":"N124","chapter":4,"type":"multi","stem":"复盘发现一类故障反复恢复又复发，另一类隐患只在客户报障后才发现。哪些改进能分别针对这两类问题？","options":["对反复故障完善根因、修复和闭环，而非只重复恢复","对潜在隐患加强常态化监控和定期巡检","取消巡检，集中等待客户提供问题线索","把所有故障直接关闭，减少重复统计"],"answers":[0,1],"explanation":"重复恢复提示闭环不足，发现滞后提示前置防控不足。根因闭环与主动监控巡检分别补足这两类短板，不能通过减少记录来改善实际质量。","focus":"重复故障与发现滞后的差异诊断","difficulty":"进阶","sourceSection":"七、运维管理","sourceEvidence":"监控巡检定位：常态化监控与定期巡检实现的是运维风险的前置防控，不是等\n客户报障后的被动响应。","sourcePages":[10],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N124"},{"id":"N125","chapter":4,"type":"multi","stem":"团队把验收用例、故障根因和会议签到全部堆进里程碑看板，又用口头站会替代正式记录，导致节点状态难以辨认。哪些信息组织方式更合理？","options":["看板聚焦关键节点和红黄绿预警，详细验证内容进入相应测试文档","看板应只显示投资概算，关键节点可全部删去","故障根因、修复和业务恢复保留完整闭环记录，不能用签到或口头汇报替代","每日站会控制在15分钟，就可以免除测试与故障处置证据"],"answers":[0,2],"explanation":"不同管理工具应保留各自用途：看板展示节点与预警，测试报告支撑验证，故障记录支撑闭环。站会的高效同步不能替代必要的工程和处置证据。","focus":"看板会议与工程证据的用途分工","difficulty":"应用","sourceSection":"二、进度与计划管理","sourceEvidence":"里程碑看板：关键节点可视化，红黄绿灯预警；不是记录纪要或算成本的工具。","sourcePages":[9,10],"sourceStatus":"课程43页全文核验","sourceEvidenceAdditional":[{"page":10,"text":"测试报告四要素：测试环境、用例清单、测试结果与遗留问题；项目投资概算\n不属于测试报告内容。"},{"page":10,"text":"故障处理完整闭环：定位故障根因→实施修复处置→消除系统异常恢复业务→\n完成问题闭环；只恢复业务不做根因分析不达标。"}],"explanationStatus":"meaningful","displayId":"N125"},{"id":"N126","chapter":5,"type":"single","stem":"一座城市已有合格的作业调度平台，现在另建气象站并需要维护设施台账、同时处置不明无人机。按资料，新增能力如何组织最合理？","options":["把所有需求交给星巡，不再设置设施运管能力","以星云扩展两个作业报表代替全部能力","新增星盾后停用既有作业平台","星瀚负责设施运管，星盾负责侦测反制，并与既有作业系统协同"],"answers":[3],"explanation":"设施运管和安全防护属于不同层面，分别对应星瀚与星盾；既有作业能力仍有价值。四平台可组合交付，不能因增加一层就替代另一层。","focus":"四平台分工衔接","difficulty":"应用","sourceSection":"一、总体产品体系","sourceEvidence":"四大平台定位：星云管作业（低空飞行作业与场景应用）、星巡管监管（低空监管与飞行服务）、星瀚管设施（低空基础设施运营管理）、星盾管安全（低空侦测反制）。四者不是替代关系，而是按“作业—监管—设施—安全”四个层面组合交付。","sourcePages":[11],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N126"},{"id":"N127","chapter":5,"type":"single","stem":"同一次飞行，一方负责巡检任务与成果，另一方负责飞行服务与监管。方案把两方职责都记在“巡检成果管理”模块下。按资料，评审应怎样纠正？","options":["保留成果管理即可，监管等同于图像查看","将作业成果交由星巡、监管交由星云","全部改为星瀚，因为飞行也使用基础设施","将作业侧归星云、监管服务侧归星巡，明确接口衔接"],"answers":[3],"explanation":"星云侧重作业与场景应用，星巡侧重监管和飞行服务。应保留两条职责链并协同，而不是用成果查看替代监管或倒置归属。","focus":"监管与作业隔离","difficulty":"应用","sourceSection":"一、总体产品体系","sourceEvidence":"四大平台定位：星云管作业（低空飞行作业与场景应用）、星巡管监管（低空监管与飞行服务）、星瀚管设施（低空基础设施运营管理）、星盾管安全（低空侦测反制）。四者不是替代关系，而是按“作业—监管—设施—安全”四个层面组合交付。","sourcePages":[11],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N127"},{"id":"N128","chapter":5,"type":"single","stem":"一份政府多委办局统筹方案已包含天翼低空卡和天驿方舱，却宣称“已自然具备多部门统一作业调度”。按资料，哪个补充最针对这一缺口？","options":["补充星瞰的一网统飞能力，连接和地面保障分别保留","继续增加低空卡数量","用天翼星网替代所有政务作业能力","增加方舱电池后无需平台"],"answers":[0],"explanation":"低空卡解决连接与身份，天驿提供起降和地面保障；多委办局作业统筹是星瞰定位。配套产品并不因同时采购就自动获得另一产品的业务能力。","focus":"产品配套缺口","difficulty":"应用","sourceSection":"一、总体产品体系","sourceEvidence":"配套产品谱系：星瞰一网统飞平台面向政府统筹多委办局作业；天翼低空卡与11700专用号段提供连接与身份；天枢为后装终端；天擎为前装5G-RedCap模组；天驿方舱为起降与地面保障设施；天翼星网平台承担低空连接管理。","sourcePages":[11],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N128"},{"id":"N129","chapter":5,"type":"single","stem":"客户希望供应商先做三网顶层规划、再建设设施、最终承担长期运营。下列投标边界哪项与资料中的通导监能力一致？","options":["只承担设备销售，运营留到故障后再谈","仅做可视化大屏即可覆盖三网规划建设运营","把工作仅限于软件安装验收","将规划、建设、运营列为衔接的交付阶段并配置相应能力"],"answers":[3],"explanation":"资料的差异化在于通信、导航、监视三张网的“规、建、运”全周期能力。软件安装或一次性销售只能覆盖其中局部，不能支撑客户的完整采购目标。","focus":"全生命周期交付","difficulty":"应用","sourceSection":"一、总体产品体系","sourceEvidence":"通导监一体能力：面向低空的通信、导航、监视三张网，提供“规、建、运”全生命周期能力，既可承接地方顶层规划，也可承担基础设施建设与长期运营，这是区别于纯软件厂商的核心差异。","sourcePages":[11],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N129"},{"id":"N130","chapter":5,"type":"single","stem":"某城市仅需基础态势展示，但明确要求全部业务数据本地留存；项目组因功能少，直接选全国统一SaaS且不再评估。按资料，最合理的评审意见是什么？","options":["只有四类专业需求同时出现才能考虑专业版","功能少就自动排除专业版","数据本地留存本身已是突出约束，应优先评估专业版独立部署","先保留SaaS，待数据外传后再整改"],"answers":[2],"explanation":"专业版四类诉求中任一项突出即可优先考虑，不要求同时满足。功能简单不能覆盖数据本地留存这一强约束，选型必须同时看业务和数据。","focus":"单项强约束选型","difficulty":"应用","sourceSection":"二、星巡的形态选择与部署方式","sourceEvidence":"专业版私有化或独立部署：适用于要求复杂业务流与业务联动、需要定制拓展、需要属地独立权限体系、要求精细三维模型与数据本地留存的常态化运行城市。四类诉求中任何一项突出，都应优先考虑专业版。","sourcePages":[11],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N130"},{"id":"N131","chapter":5,"type":"single","stem":"市级平台已有基础态势演示，准备进入多部门常态运行，但各部门要求属地独立权限和定制联动。下一阶段方案如何调整更合适？","options":["改用个人飞手激励代替权限建设","继续只按演示版功能多少评估，忽略权限","增加演示账号数即可替代复杂业务流","将独立权限与定制联动作为专业版部署评估的关键输入"],"answers":[3],"explanation":"演示与常态运营的约束不同。独立权限、定制扩展和复杂联动都是专业版的选型信号，增加演示账号无法补齐业务治理能力。","focus":"权限与部署关系","difficulty":"应用","sourceSection":"二、星巡的形态选择与部署方式","sourceEvidence":"专业版私有化或独立部署：适用于要求复杂业务流与业务联动、需要定制拓展、需要属地独立权限体系、要求精细三维模型与数据本地留存的常态化运行城市。四类诉求中任何一项突出，都应优先考虑专业版。","sourcePages":[11],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N131"},{"id":"N132","chapter":5,"type":"single","stem":"县域计划先在一个乡镇验证基础台账服务，预算有限；市区则明确提出精细三维模型和数据本地留存。按资料，两个项目如何分开选型？","options":["两者均只看账号订阅价格","乡镇走SaaS加标品试用路径，市区优先评估专业版","两者均直接建最大规模私有平台","乡镇用专业版，市区因用户更多反而只能用SaaS"],"answers":[1],"explanation":"乡镇简单需求适合“先试用后推广”，而市区的精细三维和数据要求属于专业版突出诉求。应按约束分别配置，不能用同一建设规模覆盖所有市场。","focus":"试点与常态切换","difficulty":"应用","sourceSection":"二、星巡的形态选择与部署方式","sourceEvidence":"全国统一SaaS版：适用于项目前期，需要快速向领导演示基础态势、告警、台账能力。特点是投入低、开通快，先解决“看得见”的问题。专业版私有化或独立部署：适用于要求复杂业务流与业务联动、需要定制拓展、需要属地独立权限体系、要求精细三维模型与数据本地留存的常态化运行城市。四类诉求中任何一项突出，都应优先考虑专业版。星鸢乡村标品：面向乡镇与长尾市场。资金有限、需求简单、希望长期运营时，采用“SaaS＋标品”先试用、后规模推广的路径，不宜直接建设大型私有化平台。","sourcePages":[11],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N132"},{"id":"N133","chapter":5,"type":"single","stem":"团队用SaaS迅速完成领导演示，便认定后续任何城市都无需独立部署。按资料，最关键的修正是？","options":["所有乡镇项目必须转为大型私有化","只要演示流畅，权限体系可以永久沿用","演示版越便宜，越应跳过数据要求调研","演示验证了基础呈现，仍需重新评估常态运行的业务与数据约束"],"answers":[3],"explanation":"SaaS在项目前期的价值是投入低、开通快；专业版是否需要取决于后续复杂业务、权限和数据等要求。一次演示成功不能证明所有运行形态都适用。","focus":"演示成功后的判断","difficulty":"应用","sourceSection":"二、星巡的形态选择与部署方式","sourceEvidence":"全国统一SaaS版：适用于项目前期，需要快速向领导演示基础态势、告警、台账能力。特点是投入低、开通快，先解决“看得见”的问题。专业版私有化或独立部署：适用于要求复杂业务流与业务联动、需要定制拓展、需要属地独立权限体系、要求精细三维模型与数据本地留存的常态化运行城市。四类诉求中任何一项突出，都应优先考虑专业版。星鸢乡村标品：面向乡镇与长尾市场。资金有限、需求简单、希望长期运营时，采用“SaaS＋标品”先试用、后规模推广的路径，不宜直接建设大型私有化平台。","sourcePages":[11],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N133"},{"id":"N134","chapter":5,"type":"single","stem":"采购会先讨论买断还是订阅，但尚未确认是否存在跨部门业务联动和涉密数据。按资料，下一步最有价值的动作是什么？","options":["先核实业务复杂度与数据要求，再比较投资方式","先确定本地运维人数，再推导涉密结论","先选最低年费，再由技术团队适配所有需求","直接以现有云资源空闲量决定平台形态"],"answers":[0],"explanation":"资料把业务复杂度和数据要求置于投资方式之前。价格或资源充裕不能代替对复杂联动、数据留存等前置条件的确认。","focus":"选型信息不足","difficulty":"应用","sourceSection":"二、星巡的形态选择与部署方式","sourceEvidence":"选型判断顺序：先看业务复杂度（是否多部门联动）→再看数据要求（是否本地留存、是否涉密）→再看投资方式（一次性建设还是年度订阅）→最后看本地运维力量。这一顺序与投标方案的技术路线选择直接相关。","sourcePages":[11],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N134"},{"id":"N135","chapter":5,"type":"single","stem":"一个已具备基础态势和台账的飞服中心，在中期预算中同时列入交通态势信息、空域风险评估和航空气象高阶服务。按资料，怎样调整分期最恰当？","options":["把交通态势留到最后，只先做航空气象","中期先叠加运行类信息服务，将空域风险评估和航空气象等高阶能力放到后续阶段","停止台账服务，全部预算改做大屏美化","中期必须三类高阶服务同时完成"],"answers":[1],"explanation":"中期是在既有能力上叠加运行类信息服务；空域风险评估、航空气象等属于更后段能力。分期应保持连续演进，不能因追求功能齐全而倒置成熟顺序。","focus":"飞服中心路线纠偏","difficulty":"应用","sourceSection":"三、低空飞行服务中心的定位","sourceEvidence":"不是普通用户：飞服中心不只是监管平台的使用方，而是本地低空基础设施建设与场景应用拓展的运营枢纽。把它当作普通用户，会直接丢失后续基础设施与场景项目的空间。能力分期配置：早期以基础态势与台账为主；中期在既有能力上叠加运行类信息服务（如交通态势信息服务）；后期向空域风险评估、航空气象服务、运行环境信息服务等高阶服务延伸。前两类高阶服务属更后段能力，不宜在中期配置中提前列入。","sourcePages":[11,12],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N135"},{"id":"N136","chapter":5,"type":"single","stem":"客户把飞服中心列为“只需发放平台账号的普通使用方”。若目标还包含本地场景拓展和后续设施运营，哪项合同沟通最能修正这一定位？","options":["停止提供平台，改由客户独立建设全部设施","仅增加账号数量与登录培训","把其职责缩减为每月查看一次飞行报表","围绕其运营枢纽职责讨论设施建设和场景拓展的协作边界"],"answers":[3],"explanation":"资料强调飞服中心是基础设施建设与场景拓展的运营枢纽。只发账号会遗漏后续合作空间，应围绕运营职责明确协作，而非把其降格为普通用户。","focus":"飞服中心合作范围","difficulty":"应用","sourceSection":"三、低空飞行服务中心的定位","sourceEvidence":"不是普通用户：飞服中心不只是监管平台的使用方，而是本地低空基础设施建设与场景应用拓展的运营枢纽。把它当作普通用户，会直接丢失后续基础设施与场景项目的空间。能力分期配置：早期以基础态势与台账为主；中期在既有能力上叠加运行类信息服务（如交通态势信息服务）；后期向空域风险评估、航空气象服务、运行环境信息服务等高阶服务延伸。前两类高阶服务属更后段能力，不宜在中期配置中提前列入。","sourcePages":[11,12],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N136"},{"id":"N137","chapter":5,"type":"single","stem":"某电磁敏感要地提出非合作目标发现率不低于95%。候选方案甲按一级目标配置低电磁干扰高精度设备；乙按三级配置并以加大干扰强度补偿。按资料，应如何比较？","options":["甲乙均可，因为防护等级与发现率无关","乙优先，干扰强度可替代发现率指标","甲更符合发现率目标与电磁环境的双重约束","两方案只需比较设备数量，无需看等级"],"answers":[2],"explanation":"按资料，95%发现率对应一级参考口径；电磁敏感环境还应优先低干扰高精度设备。不能以增加干扰强度代替侦测指标或忽略环境约束。","focus":"防护方案双约束","difficulty":"应用","sourceSection":"四、星盾防护等级与要地防护","sourceEvidence":"等级与指标挂钩：防护等级按非合作目标的发现率等指标划分一、二、三级。发现率要求不低于95%时，对应一级防护。最小阵地参考配置：半径2公里级的星盾最小阵地，参考配置约20台设备。该口径可直接作为方案报价与设备清单的基准测算依据。电磁敏感环境：机场等电磁环境敏感场景，应优先选用低电磁干扰型的高精度侦测反制设备，避免干扰航空器正常运行。","sourcePages":[12],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N137"},{"id":"N138","chapter":5,"type":"single","stem":"方案师把资料中“2公里级最小阵地约20台设备”直接写成所有机场的强制最低配置，同时省略电磁环境评估。哪项修改最合理？","options":["以设备越多越安全作为唯一选型原则","保留强制字样，只增加到40台","删除防护目标，仅保留设备数量","将20台作为该口径的参考测算基准，并另行匹配防护目标与低干扰选型"],"answers":[3],"explanation":"资料给的是特定半径最小阵地参考配置，并非所有场景的通用法定数量。设备清单还需对齐防护等级、环境敏感性等条件，不能把参考口径绝对化。","focus":"参考配置的使用边界","difficulty":"应用","sourceSection":"四、星盾防护等级与要地防护","sourceEvidence":"等级与指标挂钩：防护等级按非合作目标的发现率等指标划分一、二、三级。发现率要求不低于95%时，对应一级防护。最小阵地参考配置：半径2公里级的星盾最小阵地，参考配置约20台设备。该口径可直接作为方案报价与设备清单的基准测算依据。电磁敏感环境：机场等电磁环境敏感场景，应优先选用低电磁干扰型的高精度侦测反制设备，避免干扰航空器正常运行。","sourcePages":[12],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N138"},{"id":"N139","chapter":5,"type":"single","stem":"一场临时庆典临近开始，新增两架获准执行拍摄任务的无人机，并出现新的重点保护环节。按资料，现场调整应怎样组合？","options":["只增加固定铁塔，白名单沿用旧版本","把所有合法拍摄机列为非合作目标统一处置","关闭全部侦测设备以避免误判拍摄机","动态更新白名单，在关键环节补充移动反制并由平台统一调度"],"answers":[3],"explanation":"临时活动方案强调动态白名单、关键环节移动增配和统一调度，既保持快速部署，又处理现场变化。永久固定布防或停止侦测都不能替代动态协同。","focus":"临时活动动态变化","difficulty":"应用","sourceSection":"四、星盾防护等级与要地防护","sourceEvidence":"重大活动与庆典：核心打法是“便携设备全域布防＋动态录入白名单＋关键环节增配移动反制设备＋由星盾平台统一调度设备”，追求快速部署、快速撤场。固定式设备全域永久部署不是推荐方案。","sourcePages":[12],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N139"},{"id":"N140","chapter":5,"type":"single","stem":"航线图传经常中断，起降场同时出现排队冲突。方案组仅加装高精度定位服务。按资料，最应补齐哪组能力？","options":["仅增加地图缩放层级","只购买更多视频存储空间","仅增加厘米级定位精度","通信专网规划与智能起降设施、云端调度"],"answers":[3],"explanation":"通信不稳与起降调度难分别对应通信专网规划、智能起降设施和云端调度。高精定位面向定位不准，无法自动解决链路与调度两类问题。","focus":"双痛点解耦","difficulty":"应用","sourceSection":"五、行业案例的解法","sourceEvidence":"痛点—能力映射：通信不稳对应通信专网规划；定位不准对应高精度定位服务；监视盲区多对应多源感知组网；起降调度难对应智能起降设施与云端调度。四类痛点既可单独设问，也可组合成一道多选，应答时一一对应。","sourcePages":[12],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N140"},{"id":"N141","chapter":5,"type":"single","stem":"项目把“监视盲区减少”作为“厘米级定位已达成”的唯一证据。按资料，评审应怎样设置验收逻辑？","options":["只验收定位，不再考虑盲区","分别验证多源感知对盲区的改善与高精定位对定位问题的改善","只验收监视，因为定位属于同一指标","把两项合并为一个设备采购数量指标"],"answers":[1],"explanation":"多源感知组网与高精度定位服务分别解决监视、定位痛点。两类能力可组合，但一类改善不能充当另一类达成的证据，验收应对应具体问题。","focus":"监视与定位分项验收","difficulty":"应用","sourceSection":"五、行业案例的解法","sourceEvidence":"痛点—能力映射：通信不稳对应通信专网规划；定位不准对应高精度定位服务；监视盲区多对应多源感知组网；起降调度难对应智能起降设施与云端调度。四类痛点既可单独设问，也可组合成一道多选，应答时一一对应。","sourcePages":[12],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N141"},{"id":"N142","chapter":5,"type":"single","stem":"港口方案已统筹自有巡检作业和外来飞行监管，但未提供非合作目标侦测反制。评审时应补上哪一层，而不是重新替换整个方案？","options":["把星云数据库容量翻倍即可","用星瀚替换全部作业模块","只增加运营企业账号","增加星盾安全防护层并衔接既有作业、监管能力"],"answers":[3],"explanation":"港口案例组合同时覆盖调度、监管与安全。题设已具备前两层，缺的是安全侦测反制，补齐星盾更针对问题，无需推倒已有能力。","focus":"港口组合遗漏诊断","difficulty":"应用","sourceSection":"五、行业案例的解法","sourceEvidence":"港口（日照港）：已建多套飞控平台但数据不互通、外部无人机无法识别，采用“星云＋星巡＋星盾”组合，同时解决飞行调度、空域监管与低空安全防护，不是单选某一平台。面向港口类B端客户，软硬件组合还可包括低空无人机侦测反制平台、星云巡检平台、天枢终端与天擎模组、高倍变焦／红外／激光雷达等挂载，按场景搭配选用。","sourcePages":[12],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N142"},{"id":"N143","chapter":5,"type":"single","stem":"山区已有地面摄像头，但遮挡区域的火情仍发现较晚。新方案又只增加同类固定摄像头，且没有预警联动。按资料，哪个评审意见最完整？","options":["重点应是把已有与空天多源感知接入预警机制，检验遮挡与发现滞后是否改善","先恢复人工巡检即可取代一切感知建设","将所有摄像头拆除，只留一个大屏","摄像头数量增加就证明问题已解决"],"answers":[0],"explanation":"问题来自地形复杂和感知预警不足，资料提出空天地一体化多源机制。增加同类固定点位不等于消除遮挡和预警链断点，也不要求无理由拆除已有设备。","focus":"林草方案的单点偏差","difficulty":"应用","sourceSection":"五、行业案例的解法","sourceEvidence":"山区林草：地形复杂、火情发现滞后，对应解法是构建空天地一体化多源感知预警机制；单纯增加固定摄像头或恢复人工巡检班组都不解决问题。","sourcePages":[12],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N143"},{"id":"N144","chapter":5,"type":"single","stem":"汇报人把苏州案例的143家、263架、34万余架次和96.32%全部列在“设备接入数量”栏。按资料，最合理的整理方式是什么？","options":["只保留最大数字，其他均无运营意义","将143家改成143架，其余不变","依次归为企业服务、航空器接入、飞行监测量、服务满意度","四个数都改写为方舱数量"],"answers":[2],"explanation":"这四项分别是不同维度的运营成效，单位不同、含义不同。案例价值在多维服务与运行表现，不能把企业、架次和比例都混作设备存量。","focus":"案例指标分类","difficulty":"应用","sourceSection":"五、行业案例的解法","sourceEvidence":"苏州低空“一中心一平台”：2024年10月18日正式投入运行。公开运营成效包括：服务143家运营企业、接入263架航空器、年监测飞行超34万架次、企业服务满意度96.32%。","sourcePages":[13],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N144"},{"id":"N145","chapter":5,"type":"single","stem":"同一客户既有一批不愿淘汰的存量机，又有正在研发的新机型。若同时追求存量低成本接入和新机生产阶段网联，按资料应如何分流？","options":["存量评估外挂天枢，新机型评估生产阶段集成天擎与连接能力","两类都等交付后拆机重装","存量用前装路线，新机必须只用外挂路线","两类都只发低空卡，不考虑终端模组适配"],"answers":[0],"explanation":"天枢与天擎分别面向后装和前装阶段。混合机队应按产品生命周期分流，不能以统一采购之名忽视存量改造成本和新机集成窗口。","focus":"混合机队改造","difficulty":"应用","sourceSection":"六、机载产品与连接能力","sourceEvidence":"天擎前装模组：面向整机厂新机型，在生产阶段把5G-RedCap通信能力集成进去，契合“新机必须网联”的监管趋势。天枢后装终端：面向存量无人机，加装后获得5G传输、身份报送、远程控制与AI应用能力，实现低成本、快合规入网。两者差异：天枢面向后装、天擎面向前装集成，这是产品选型题最常见的分界点，不可混用。","sourcePages":[13],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N145"},{"id":"N146","chapter":5,"type":"single","stem":"一家整机厂希望在生产环节共同设计网联能力，方案却把主要工作安排为终端交付后外挂改造。按资料，哪项调整最贴合需求并避免阶段错位？","options":["先批量生产不联网整机，售出后再统一召回","放弃网联，只提供飞行日志模板","把联合设计移到生产阶段的天擎模组集成路径，并明确连接配套","增加后装支架数量即视为完成联合设计"],"answers":[2],"explanation":"生产阶段集成属于前装天擎路径，外挂改造服务于存量后装。客户要求共同设计网联能力，应在新机研发生产阶段对齐技术和供给安排。","focus":"前后装职责错位","difficulty":"应用","sourceSection":"六、机载产品与连接能力","sourceEvidence":"天擎前装模组：面向整机厂新机型，在生产阶段把5G-RedCap通信能力集成进去，契合“新机必须网联”的监管趋势。天枢后装终端：面向存量无人机，加装后获得5G传输、身份报送、远程控制与AI应用能力，实现低成本、快合规入网。两者差异：天枢面向后装、天擎面向前装集成，这是产品选型题最常见的分界点，不可混用。","sourcePages":[13],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N146"},{"id":"N147","chapter":5,"type":"single","stem":"某团队已部署5G-A感知站，发现仍无法满足厘米级定位需求，便准备继续堆叠感知站来“替代全部定位设施”。按资料，正确的纠偏是什么？","options":["监视与高精定位分工不同，应补充适配的地基增强高精定位服务","只要数量足够，任何感知站都自动变成地基增强站","用飞行企业数量作为定位精度替代指标","停止监视服务后精度就会改善"],"answers":[0],"explanation":"5G-A感知站是监视手段，资料中的厘米级定位依托六分地基增强能力。应补足定位基础设施与服务，不能从“可感知目标”直接推导“已具备高精定位”。","focus":"定位短板误诊","difficulty":"应用","sourceSection":"六、机载产品与连接能力","sourceEvidence":"高精度定位：依托六分3400座地基增强站提供厘米级定位，解决“定位不准”的核心痛点；5G-A感知站属于监视手段，不能替代定位基础设施。","sourcePages":[13],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N147"},{"id":"N148","chapter":5,"type":"single","stem":"一个通导监项目从报债审批转入建设招标。客户问“牵头项目建议书的人是否也应独自完成所有产品部署方案”。按资料，怎样组织更合适？","options":["报债期分工永久不变，不需增加技术支撑","无人科技只负责号段，方案由客户自行编写","属地电信继续主导本地投标商务，无人科技提供技术方案及软硬件部署支撑","属地电信在招标期完全退出，由专业公司独立签所有合同"],"answers":[2],"explanation":"阶段转换后要衔接商务与专业能力：属地电信主导投标、商务、合同和本地资源，无人科技提供技术方案及部署支撑。牵头不等于独自包办所有专业任务。","focus":"阶段责任交接","difficulty":"应用","sourceSection":"七、通导监项目的省专协同分工","sourceEvidence":"报债审批期：属地电信牵头组织项目建议书与可行性研究，协助推进审批流程，是这一阶段的第一责任主体。建设招标期：属地电信主导投标、商务谈判与合同签订，并统筹本地设计、实施与网络优化资源；无人科技输出高质量投标技术方案，提供定制化解决方案与软硬件部署支撑。项目全周期意识：前期准备、规划设计、报债审批、建设招标四个阶段中，越早介入越能影响技术路线，招标期只是最后的窗口。","sourcePages":[13],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N148"},{"id":"N149","chapter":5,"type":"single","stem":"团队等到招标公告发布才开始接触客户，发现技术路线已经确定。按资料，对下一项目最有价值的改进是什么？","options":["提前覆盖前期准备、规划设计与报债审批，形成连续跟进机制","把前期咨询全部取消，压缩为合同签订一天","只增加投标文件页数","继续只在招标期介入，技术路线天然可随时修改"],"answers":[0],"explanation":"资料强调越早介入越能影响技术路线，招标只是最后窗口。应把专业咨询与属地资源前移，而非把投标文件数量等同于前期影响力。","focus":"错过前期介入","difficulty":"应用","sourceSection":"七、通导监项目的省专协同分工","sourceEvidence":"报债审批期：属地电信牵头组织项目建议书与可行性研究，协助推进审批流程，是这一阶段的第一责任主体。建设招标期：属地电信主导投标、商务谈判与合同签订，并统筹本地设计、实施与网络优化资源；无人科技输出高质量投标技术方案，提供定制化解决方案与软硬件部署支撑。项目全周期意识：前期准备、规划设计、报债审批、建设招标四个阶段中，越早介入越能影响技术路线，招标期只是最后的窗口。","sourcePages":[13],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N149"},{"id":"N150","chapter":5,"type":"single","stem":"同城通信站、气象站和起降设施已分别接入，但字段含义、接口格式和协议不同，平台只能分屏查看。按资料，下一步最应先做什么？","options":["围绕数据、接口、通信、协议四类标准推进统一，再验证协同纳管","把气象与起降设施剔除以减少标准差异","仅统一设备名称字体","直接把三个页面拼成一张大屏就宣布一云统管"],"answers":[0],"explanation":"统一展示并不等于统一纳管。星瀚跨多类设施管理的前提是四类标准统一，应先消除数据与连接语义差异，而不是通过缩减范围回避需求。","focus":"设施统一纳管前置条件","difficulty":"应用","sourceSection":"八、星瀚与5G智能网联业务","sourceEvidence":"一云统管的标准前提：星瀚要实现多类设施统一纳管，必须先统一数据标准、接口标准、通信标准、协议标准四类标准。纳管范围：星瀚可纳管低空通信站、起降设施、气象设施、定位设施等多类设施，不能理解为只管通信站。","sourcePages":[13],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N150"},{"id":"N151","chapter":5,"type":"single","stem":"面向个人飞手的业务试点体验尚未验证，商业计划却同时承诺全国全量开放与一次性硬件回款后停止运营。按资料，哪项修订最协调？","options":["只做内容激励，取消通信服务","硬件售出即停止维护，以此保证低成本","试点先保障体验，配合内容激励，并设计年费或流量池等持续合作机制","全国立即全开，但不配置长期服务"],"answers":[2],"explanation":"资料把初期试点体验、优质内容激励与长期收费合作同时纳入业务策略。持续服务与收入应相匹配，不能以一次性售卖替代长期网联运营。","focus":"智能网联可持续运营","difficulty":"应用","sourceSection":"八、星瀚与5G智能网联业务","sourceEvidence":"面向个人飞手的策略：初期在试点区域优先保障用户体验，并对优质内容创作给予推广激励；不搞全国同时全量开放。长期合作机制：低空5G智能网联业务不能只做一次性设备销售，须建立年费、流量池等长期合作机制，形成可持续收入。","sourcePages":[14],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N151"},{"id":"N152","chapter":5,"type":"single","stem":"方案把深圳8000个通信站与500个通感站相加，便声称8500个站都能提供同等感知能力。按资料，评审应指出什么？","options":["只要名称含5G就具有完全相同能力","应把8000与500互换后结论才成立","通信站与通感站的规划口径和能力角色不同，不能用总数推导同等感知覆盖","两个数量相加错误，应相乘"],"answers":[2],"explanation":"资料明确区分通信基站与通感基站，并强调补齐通感硬件短板。数量可用于各自规模描述，却不能跨类别推断每站具备同等感知能力。","focus":"规划数字与能力边界","difficulty":"应用","sourceSection":"九、深圳样板与电信差异化策略","sourceEvidence":"深圳基础设施规划：深圳市低空经济基础设施规划：未来3年新增5G-A通信基站8000个、通感基站500个——通信站与感知站数量是8比5000量级对500量级，不要记反。电信差异化策略：中国电信在低空经济竞争中确立差异化领先地位的关键策略：建设自主可控的低空基础设施，补齐“通感一体”硬件短板，将“数据与平台优势”转化为“全域监管能力”；不是靠价格，也不是只做软件。","sourcePages":[14],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N152"},{"id":"N153","chapter":5,"type":"multi","stem":"一个园区已有星云，新需求是飞行监管和设施运管。按资料，以下哪些评审意见合理？","options":["按作业、监管、设施层面设计接口协同","补充星盾承担通信站、气象站等设施的日常运营管理","新增监管后星云作业功能必须废弃","补充星巡的监管与飞服能力"],"answers":[0,3],"explanation":"三个层面职责不同，新增能力应补齐并协同。四平台不是替代关系，因此增加星巡或星瀚并不要求废弃已适用的星云作业功能。 星盾负责侦测反制；题设设施运管应由星瀚补齐，不能将两者倒置。","focus":"平台替代误区审查","difficulty":"进阶","sourceSection":"一、总体产品体系","sourceEvidence":"四大平台定位：星云管作业（低空飞行作业与场景应用）、星巡管监管（低空监管与飞行服务）、星瀚管设施（低空基础设施运营管理）、星盾管安全（低空侦测反制）。四者不是替代关系，而是按“作业—监管—设施—安全”四个层面组合交付。","sourcePages":[11],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N153"},{"id":"N154","chapter":5,"type":"multi","stem":"一个交付清单同时包含低空卡、方舱和连接管理平台。为了避免误承诺，按资料应作出哪些区分？","options":["拥有方舱就可省略所有多部门业务统筹能力","方舱承担起降与地面保障，不等于监管流程","低空卡提供连接与身份，不自动等于完整作业平台","天翼星网侧重低空连接管理"],"answers":[1,2,3],"explanation":"产品谱系分别覆盖连接身份、地面保障和连接管理。它们可以配套，但不能由某件硬件推导出已经获得政府多部门业务统筹能力。","focus":"产品与交付层级","difficulty":"进阶","sourceSection":"一、总体产品体系","sourceEvidence":"配套产品谱系：星瞰一网统飞平台面向政府统筹多委办局作业；天翼低空卡与11700专用号段提供连接与身份；天枢为后装终端；天擎为前装5G-RedCap模组；天驿方舱为起降与地面保障设施；天翼星网平台承担低空连接管理。","sourcePages":[11],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N154"},{"id":"N155","chapter":5,"type":"multi","stem":"某地从演示走向常态运营，提出数据本地留存、跨部门业务联动，并要求保留现有有效功能。按资料，下列哪些判断成立？","options":["现有SaaS演示成功可替代对数据本地留存约束的评估","必须等四类专业诉求全部出现才可评估","演示成功不能代替对新运行约束的重新评估","应优先评估专业版私有化或独立部署"],"answers":[2,3],"explanation":"专业版四类诉求中任何一项突出就应优先考虑。业务阶段改变后需重新评估，既有SaaS演示成功并不能消除数据与复杂流程需求。 演示效果不消除数据约束；四类专业诉求也无需同时满足。","focus":"SaaS转型评估","difficulty":"进阶","sourceSection":"二、星巡的形态选择与部署方式","sourceEvidence":"专业版私有化或独立部署：适用于要求复杂业务流与业务联动、需要定制拓展、需要属地独立权限体系、要求精细三维模型与数据本地留存的常态化运行城市。四类诉求中任何一项突出，都应优先考虑专业版。","sourcePages":[11],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N155"},{"id":"N156","chapter":5,"type":"multi","stem":"评审表把“规、建、运”三个交付环节与“前期准备、规划设计、报债审批、建设招标”四个项目阶段强行逐项一一对应，并因数量不同而删除运营工作。按资料，哪些意见合理？","options":["两个划分关注角度不同，不能仅因一个三项、一个四项就强行一一对应","两套划分项数不同，说明通信、导航、监视三张网应删去其中一张","通导监能力包含长期运营，不能因前期四阶段列表未单列运营就删去运营职责","四个项目阶段中的建设招标等于长期运营的全部内容"],"answers":[0,2],"explanation":"“规、建、运”描述能力与交付全周期，四阶段描述项目推进中的前期到招标过程，属于不同观察角度。项数不同不构成冲突，也不能据此删除长期运营或某张网的能力。","focus":"两套阶段划分的比较","difficulty":"进阶","sourceSection":"一、总体产品体系；五、项目阶段与资金合规","sourceEvidence":"通导监一体能力：面向低空的通信、导航、监视三张网，提供“规、建、运”全生命周期能力，既可承接地方顶层规划，也可承担基础设施建设与长期运营，这是区别于纯软件厂商的核心差异。\n…\n四个阶段：前期准备期、规划设计期、报债审批期、建设招标期。运营商在不同阶段的介入深度不同，越靠前越能影响技术路线。","sourcePages":[11,16],"sourceSectionKind":"原课程小节","sourceVerified":true,"sourceEvidenceFragments":["通导监一体能力：面向低空的通信、导航、监视三张网，提供“规、建、运”全生命周期能力，既可承接地方顶层规划，也可承担基础设施建设与长期运营，这是区别于纯软件厂商的核心差异。","四个阶段：前期准备期、规划设计期、报债审批期、建设招标期。运营商在不同阶段的介入深度不同，越靠前越能影响技术路线。"],"explanationStatus":"meaningful","displayId":"N156"},{"id":"N157","chapter":5,"type":"multi","stem":"一个乡镇预算有限，需求仅为基础台账和态势，期望先验证再推广。按资料，方案评审应支持哪些安排？","options":["仅因希望长期运营就直接建设大型私有平台","把低投入、快开通用于早期能力验证","完成一次展示后直接全面推广，不再验证长期运营需求","以SaaS加标品方式先试用"],"answers":[1,3],"explanation":"简单长尾需求适合先试用后推广，SaaS便于低成本快速开通。长期运营目标不自动构成大型私有化理由，应以实际业务与数据约束决定形态。 先试用后推广还需验证实际需求，不能把展示当成长期服务验证。","focus":"乡镇试点边界","difficulty":"进阶","sourceSection":"二、星巡的形态选择与部署方式","sourceEvidence":"全国统一SaaS版：适用于项目前期，需要快速向领导演示基础态势、告警、台账能力。特点是投入低、开通快，先解决“看得见”的问题。专业版私有化或独立部署：适用于要求复杂业务流与业务联动、需要定制拓展、需要属地独立权限体系、要求精细三维模型与数据本地留存的常态化运行城市。四类诉求中任何一项突出，都应优先考虑专业版。星鸢乡村标品：面向乡镇与长尾市场。资金有限、需求简单、希望长期运营时，采用“SaaS＋标品”先试用、后规模推广的路径，不宜直接建设大型私有化平台。","sourcePages":[11],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N157"},{"id":"N158","chapter":5,"type":"multi","stem":"某区域已形成地理上的全域网络覆盖，汇报因此直接把飞服中心标成“高阶服务全部成熟”，跳过交通态势等运行信息服务验证。按资料，哪些判断正确？","options":["飞服中心的运行信息与高阶服务仍需按各自能力阶段验证","全域网络覆盖天然证明空域风险评估和航空气象服务全部具备","只要建设范围扩大，服务能力就可无需证据自动升级","最小单元、区域样板、全域覆盖描述建设推进尺度，不能自动等同飞服服务成熟度"],"answers":[0,3],"explanation":"地域覆盖与服务成熟度是两个维度。建设可从最小单元扩展到全域，而飞服服务还要从态势台账、运行类信息到高阶服务逐步核实；不能只凭地图覆盖范围为所有高阶能力背书。","focus":"覆盖规模与服务成熟度两轴","difficulty":"进阶","sourceSection":"二、建设推进顺序；三、低空飞行服务中心的定位","sourceEvidence":"三步走：最小单元→区域样板→全域覆盖。这一顺序决定了投资节奏与方案分期，先全域铺开的做法不符合规律。最小单元的意义：以一个可独立运行的最小场景闭环验证能力与商业模式，再复制为区域样板，最后才谈全域覆盖。\n…\n能力分期配置：早期以基础态势与台账为主；中期在既有能力上叠加运行类信息服务（如交通态势信息服务）；后期向空域风险评估、航空气象服务、运行环境信息服务等高阶服务延伸。前两类高阶服务属更后段能力，不宜在中期配置中提前列入。","sourcePages":[12,15,16],"sourceSectionKind":"原课程小节","sourceVerified":true,"sourceEvidenceFragments":["三步走：最小单元→区域样板→全域覆盖。这一顺序决定了投资节奏与方案分期，先全域铺开的做法不符合规律。最小单元的意义：以一个可独立运行的最小场景闭环验证能力与商业模式，再复制为区域样板，最后才谈全域覆盖。","能力分期配置：早期以基础态势与台账为主；中期在既有能力上叠加运行类信息服务（如交通态势信息服务）；后期向空域风险评估、航空气象服务、运行环境信息服务等高阶服务延伸。前两类高阶服务属更后段能力，不宜在中期配置中提前列入。"],"explanationStatus":"meaningful","displayId":"N158"},{"id":"N159","chapter":5,"type":"multi","stem":"与飞服中心访谈时，团队只询问登录人数。若按资料补充调研，哪些问题更有助于形成完整合作方案？","options":["本地基础设施建设和运营有哪些协同任务","只收集登录人数，不再了解当前基础能力建设阶段","是否愿意用增加账号数量代替全部运营职责","后续希望拓展哪些低空应用场景"],"answers":[0,3],"explanation":"飞服中心兼具运营枢纽职责，调研应覆盖设施、场景与能力成熟度。账号数只是使用规模信息，不能替代对运营责任和分期建设的理解。 账号规模不能替代能力阶段与运营职责调研。","focus":"运营枢纽需求调研","difficulty":"进阶","sourceSection":"三、低空飞行服务中心的定位","sourceEvidence":"不是普通用户：飞服中心不只是监管平台的使用方，而是本地低空基础设施建设与场景应用拓展的运营枢纽。把它当作普通用户，会直接丢失后续基础设施与场景项目的空间。能力分期配置：早期以基础态势与台账为主；中期在既有能力上叠加运行类信息服务（如交通态势信息服务）；后期向空域风险评估、航空气象服务、运行环境信息服务等高阶服务延伸。前两类高阶服务属更后段能力，不宜在中期配置中提前列入。","sourcePages":[11,12],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N159"},{"id":"N160","chapter":5,"type":"multi","stem":"按资料口径复核一个电磁敏感要地的预算草案，哪些意见正确？","options":["2公里级约20台是参考测算口径，不应扩写成所有要地的统一法定数量","只要满足参考台数，就无需再关心发现率或电磁影响","低电磁干扰型高精度设备应作为重要选型方向","发现率目标需与相应防护等级对齐"],"answers":[0,2,3],"explanation":"等级、环境和参考配置共同服务方案测算。台数只是特定口径的参考，不能替代目标指标或环境适配，更不能被写成普遍强制标准。","focus":"防护清单复核","difficulty":"进阶","sourceSection":"四、星盾防护等级与要地防护","sourceEvidence":"等级与指标挂钩：防护等级按非合作目标的发现率等指标划分一、二、三级。发现率要求不低于95%时，对应一级防护。最小阵地参考配置：半径2公里级的星盾最小阵地，参考配置约20台设备。该口径可直接作为方案报价与设备清单的基准测算依据。电磁敏感环境：机场等电磁环境敏感场景，应优先选用低电磁干扰型的高精度侦测反制设备，避免干扰航空器正常运行。","sourcePages":[12],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N160"},{"id":"N161","chapter":5,"type":"multi","stem":"庆典结束后，便携防护设备按计划撤收。审计人员只在次日统计现场固定设备数，因数量为零就判定活动期间没有完成防护，并要求永久布防。按资料，哪些审查合理？","options":["临时活动追求快速部署和撤场，应把评价时间与任务保障窗口对应","次日现场设备为零不能单独证明活动期间从未部署或调度","所有临时活动都应以永久固定设备数量作为唯一完成标准","应核查任务期间的部署、白名单及统一调度记录，而非只看事后固定资产存量"],"answers":[0,1,3],"explanation":"临时保障方案的评价窗口应对齐活动任务。资料强调便携机动与快速撤场，撤收后的存量不能倒推出活动期未执行；应以保障窗口内的部署和调度等记录核实，不能用永久固定化标准替代。","focus":"临时任务的评价时间边界","difficulty":"进阶","sourceSection":"四、星盾防护等级与要地防护","sourceEvidence":"重大活动与庆典：核心打法是“便携设备全域布防＋动态录入白名单＋关键环节增配移动反制设备＋由星盾平台统一调度设备”，追求快速部署、快速撤场。固定式设备全域永久部署不是推荐方案。","sourcePages":[12],"sourceSectionKind":"原课程小节","sourceVerified":true,"sourceEvidenceFragments":["重大活动与庆典：核心打法是“便携设备全域布防＋动态录入白名单＋关键环节增配移动反制设备＋由星盾平台统一调度设备”，追求快速部署、快速撤场。固定式设备全域永久部署不是推荐方案。"],"explanationStatus":"meaningful","displayId":"N161"},{"id":"N162","chapter":5,"type":"multi","stem":"一个项目同时有定位偏差、监视盲区与起降拥堵。按资料，哪些改进与问题正确对应？","options":["监视盲区只能靠增加通信资费解决","定位偏差对应高精度定位服务","监视盲区对应多源感知组网","起降拥堵对应智能起降设施与云端调度"],"answers":[1,2,3],"explanation":"应逐项建立痛点与能力的对应关系，不能用单一连接收费或硬件数量替代不同能力。高精定位、感知组网和起降调度分别处理三类问题。","focus":"痛点对应关系校验","difficulty":"进阶","sourceSection":"五、行业案例的解法","sourceEvidence":"痛点—能力映射：通信不稳对应通信专网规划；定位不准对应高精度定位服务；监视盲区多对应多源感知组网；起降调度难对应智能起降设施与云端调度。四类痛点既可单独设问，也可组合成一道多选，应答时一一对应。","sourcePages":[12],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N162"},{"id":"N163","chapter":5,"type":"multi","stem":"方案把通信专网的全部预算用于“消除定位偏差”，却没有说明通信链路、定位服务和监视手段如何分工。按资料，哪些审查意见成立？","options":["将定位不准首先归因为通信套餐资费不足","监视盲区可通过多源感知组网改善","通信专网规划应主要回应通信不稳的痛点","三类痛点本质相同，可共用一个未区分的达标结论"],"answers":[1,2],"explanation":"通信、定位、监视分工不同，方案应逐项说明能力与目标。组合建设可共用部分资源，但不能把未区分的一个结论当作三类问题同时解决的证明。 定位问题应匹配高精定位服务，不能用套餐资费代替能力分析。","focus":"双网误配诊断","difficulty":"进阶","sourceSection":"五、行业案例的解法","sourceEvidence":"痛点—能力映射：通信不稳对应通信专网规划；定位不准对应高精度定位服务；监视盲区多对应多源感知组网；起降调度难对应智能起降设施与云端调度。四类痛点既可单独设问，也可组合成一道多选，应答时一一对应。","sourcePages":[12],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N163"},{"id":"N164","chapter":5,"type":"multi","stem":"借鉴资料中的港口案例时，客户要求同时覆盖自有作业、外来飞行监管和安全防护。哪些设计思想可保留？","options":["仅选一个平台并宣称必然覆盖所有层面","挂载和机载终端按港口具体场景搭配","按飞行调度、监管、安全三个层面组织平台组合","保留既有有效飞控资源并考虑数据互通"],"answers":[1,2,3],"explanation":"港口案例强调多套飞控互通及星云、星巡、星盾协同，软硬件按场景组合。不能把某一平台当成所有能力的自动替代，也无需无理由废弃有效资源。","focus":"港口方案覆盖审查","difficulty":"进阶","sourceSection":"五、行业案例的解法","sourceEvidence":"港口（日照港）：已建多套飞控平台但数据不互通、外部无人机无法识别，采用“星云＋星巡＋星盾”组合，同时解决飞行调度、空域监管与低空安全防护，不是单选某一平台。面向港口类B端客户，软硬件组合还可包括低空无人机侦测反制平台、星云巡检平台、天枢终端与天擎模组、高倍变焦／红外／激光雷达等挂载，按场景搭配选用。","sourcePages":[12],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N164"},{"id":"N165","chapter":5,"type":"multi","stem":"一份采购需求把政府多委办局作业统筹、低空连接管理、应急无人设备调派都统称为“飞行监管”，并打算仅凭低空卡身份报送验收所有需求。按资料，哪些修正合理？","options":["政府多委办局作业统筹可评估星瞰一网统飞定位","低空卡具备身份与连接能力就证明上述所有业务流程已具备","低空连接管理可评估天翼星网定位","应急无人设备调派只需监管地图，无须无人设备管控"],"answers":[0,2],"explanation":"连接身份、连接管理和业务统筹处在不同层面，采购应按实际任务拆分。星瞰对应政府多委办局作业，星网对应连接管理；低空卡不自动交付全部业务流程，应急平台也不能用地图替代无人设备管控。","focus":"连接管理与业务统筹边界","difficulty":"进阶","sourceSection":"一、总体产品体系；一、核心定位与平台能力","sourceEvidence":"配套产品谱系：星瞰一网统飞平台面向政府统筹多委办局作业；天翼低空卡与11700专用号段提供连接与身份；天枢为后装终端；天擎为前装5G-RedCap模组；天驿方舱为起降与地面保障设施；天翼星网平台承担低空连接管理。\n…\n平台核心引擎：低空应急指挥调度平台构建“感知—决策—指挥—行动”一体化体系，核心引擎是无人设备管控，而非单纯的5G通信或GIS。","sourcePages":[11,18],"sourceSectionKind":"原课程小节","sourceVerified":true,"sourceEvidenceFragments":["配套产品谱系：星瞰一网统飞平台面向政府统筹多委办局作业；天翼低空卡与11700专用号段提供连接与身份；天枢为后装终端；天擎为前装5G-RedCap模组；天驿方舱为起降与地面保障设施；天翼星网平台承担低空连接管理。","平台核心引擎：低空应急指挥调度平台构建“感知—决策—指挥—行动”一体化体系，核心引擎是无人设备管控，而非单纯的5G通信或GIS。"],"explanationStatus":"meaningful","displayId":"N165"},{"id":"N166","chapter":5,"type":"multi","stem":"项目同时建设感知网与厘米级定位能力。按资料，验收时哪些论证能够成立？","options":["应针对定位痛点核查相应高精度定位服务","地基增强能力与监视能力可以协同但职责应区分","5G-A感知站数量增加就必然可以取消全部定位基础设施","感知站发现目标的结果不能单独证明厘米级定位达标"],"answers":[0,1,3],"explanation":"资料明确5G-A感知站不能替代定位基础设施，高精度定位依托六分地基增强能力。协同建设应保留分别验证的指标，避免用监视成果替代定位成果。","focus":"高精定位验收误区","difficulty":"进阶","sourceSection":"六、机载产品与连接能力","sourceEvidence":"高精度定位：依托六分3400座地基增强站提供厘米级定位，解决“定位不准”的核心痛点；5G-A感知站属于监视手段，不能替代定位基础设施。","sourcePages":[13],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N166"},{"id":"N167","chapter":7,"type":"multi","stem":"责任表看到“模组厂联合产品定义”和“无人科技承担产品方案”都出现“产品”，便认定两方职责完全重复，准备只留一家并让其自行决定集团资费。按资料，哪些校正合理？","options":["模组供货商可以仅凭供货协议接替全部集团资费政策职责","模组厂的联合产品定义与前装供货，应与无人科技的咨询产品方案支撑分别明确边界","出现相同产品二字就证明两方承担完全相同的所有工作","统一号段与资费政策仍应协调集团，不能由删除合作方来替代统筹"],"answers":[1,3],"explanation":"同一术语不代表同一责任层级。资料分别给出模组联合定义和供货、专业咨询产品方案，以及集团号段资费统筹，正确做法是明确接口与分工，而非以文字重复为由删除必要角色。","focus":"相同产品术语的职责拆分","difficulty":"进阶","sourceSection":"三、前装与后装两大市场路径；四、省专协同与生态","sourceEvidence":"前装两大合作模式：一是与模组厂联合产品定义、集采降本；二是与整机厂分层签约、挂图作战。模组厂主要承担联合产品定义与前装供货。\n…\n属地电信：承担客情、商机、投资，是区域市场的主体。无人科技：承担咨询、产品、方案，输出专业能力与交付支撑。集团侧：统筹号段资源与资费政策。生态伙伴：咨询规划方向的代表单位为苏交科，气象方向为南信大气象科技研究院等，共同构成“规划—产品—实施”的合作链。","sourcePages":[16],"sourceSectionKind":"原课程小节","sourceVerified":true,"sourceEvidenceFragments":["前装两大合作模式：一是与模组厂联合产品定义、集采降本；二是与整机厂分层签约、挂图作战。模组厂主要承担联合产品定义与前装供货。","属地电信：承担客情、商机、投资，是区域市场的主体。无人科技：承担咨询、产品、方案，输出专业能力与交付支撑。集团侧：统筹号段资源与资费政策。生态伙伴：咨询规划方向的代表单位为苏交科，气象方向为南信大气象科技研究院等，共同构成“规划—产品—实施”的合作链。"],"explanationStatus":"meaningful","displayId":"N167"},{"id":"N168","chapter":7,"type":"multi","stem":"某全域建设方案无法论证合规现金流覆盖本息，客户改为预算有限、需求简单的乡镇试点。团队却仍准备任意抬高收益，按原规模开工。按资料，哪些调整合理？","options":["预算发生变化后，原全域规模与收益假设均不必重新检查","先形成可独立运行的最小场景，验证能力与商业模式再复制","围绕简单乡镇需求评估SaaS加标品的试用路径","不为使原融资测算表平衡而任意设定收益"],"answers":[1,2,3],"explanation":"融资前提未成立、采购约束又改变，应重新审视建设路径。资料要求收益有依据、合规现金流覆盖本息；简单乡镇可先试用SaaS加标品，并通过最小场景验证后递进扩展，不能沿用失效假设强行全域开工。","focus":"融资路径调整后的试点决策","difficulty":"进阶","sourceSection":"五、项目阶段与资金合规；二、星巡的形态选择与部署方式；二、建设推进顺序","sourceEvidence":"专项债硬性要求：项目收益与融资自求平衡，构建的合规现金流须覆盖债券本息，不得随意设定收益水平。这是专项债项目的“一票否决”条件。\n…\n星鸢乡村标品：面向乡镇与长尾市场。资金有限、需求简单、希望长期运营时，采用“SaaS＋标品”先试用、后规模推广的路径，不宜直接建设大型私有化平台。\n…\n最小单元的意义：以一个可独立运行的最小场景闭环验证能力与商业模式，再复制为区域样板，最后才谈全域覆盖。","sourcePages":[11,16],"sourceSectionKind":"原课程小节","sourceVerified":true,"sourceEvidenceFragments":["专项债硬性要求：项目收益与融资自求平衡，构建的合规现金流须覆盖债券本息，不得随意设定收益水平。这是专项债项目的“一票否决”条件。","星鸢乡村标品：面向乡镇与长尾市场。资金有限、需求简单、希望长期运营时，采用“SaaS＋标品”先试用、后规模推广的路径，不宜直接建设大型私有化平台。","最小单元的意义：以一个可独立运行的最小场景闭环验证能力与商业模式，再复制为区域样板，最后才谈全域覆盖。"],"explanationStatus":"meaningful","displayId":"N168"},{"id":"N169","chapter":5,"type":"multi","stem":"星瀚已纳管通信站、气象设施和起降设施，汇报据此认定飞服中心已自动具备空域风险评估与航空气象高阶服务，并建议取消中期运行信息服务建设。按资料，哪些审查正确？","options":["飞服中心仍应按基础态势台账、运行类信息服务、高阶服务递进核实能力","设施纳管范围不能单独证明飞服中心的高阶服务已经实现","只要纳管气象设施，航空气象服务的全部业务能力就必然齐备","设备协议统一可以替代所有飞服业务与服务能力验证"],"answers":[0,1],"explanation":"星瀚管理设施，飞服中心建设的是面向运行的服务能力，两者协同但不是同一达标证据。纳管气象设施不自动证明航空气象高阶服务已实现，飞服能力仍应按阶段验证，不能跳过中期服务。","focus":"设施纳管与飞服成熟度","difficulty":"进阶","sourceSection":"八、星瀚与5G智能网联业务；三、低空飞行服务中心的定位","sourceEvidence":"一云统管的标准前提：星瀚要实现多类设施统一纳管，必须先统一数据标准、接口标准、通信标准、协议标准四类标准。纳管范围：星瀚可纳管低空通信站、起降设施、气象设施、定位设施等多类设施，不能理解为只管通信站。\n…\n能力分期配置：早期以基础态势与台账为主；中期在既有能力上叠加运行类信息服务（如交通态势信息服务）；后期向空域风险评估、航空气象服务、运行环境信息服务等高阶服务延伸。前两类高阶服务属更后段能力，不宜在中期配置中提前列入。","sourcePages":[12,13],"sourceSectionKind":"原课程小节","sourceVerified":true,"sourceEvidenceFragments":["一云统管的标准前提：星瀚要实现多类设施统一纳管，必须先统一数据标准、接口标准、通信标准、协议标准四类标准。纳管范围：星瀚可纳管低空通信站、起降设施、气象设施、定位设施等多类设施，不能理解为只管通信站。","能力分期配置：早期以基础态势与台账为主；中期在既有能力上叠加运行类信息服务（如交通态势信息服务）；后期向空域风险评估、航空气象服务、运行环境信息服务等高阶服务延伸。前两类高阶服务属更后段能力，不宜在中期配置中提前列入。"],"explanationStatus":"meaningful","displayId":"N169"},{"id":"N170","chapter":9,"type":"multi","stem":"应急方案已售出运输无人机和卫星便携站，后续仍需协调运力与卫星带宽。财务却把硬件一次回款当成全部长期运营收入和服务保障已经完成。按资料，哪些调整合理？","options":["硬件完成买卖就等于运营商资源保障自动永久完成","长期收入可脱离服务内容任意填写，只要最终金额足够大","把运力与卫星带宽动态匹配作为持续运营能力进行落实","区分硬件一次交付与持续网联服务，评估年费或流量池等合作机制"],"answers":[2,3],"explanation":"一次设备销售与长期资源服务的时间跨度和责任不同。资料要求网联业务建立持续合作机制，应急方案还涉及运力与卫星带宽动态匹配；回款不能代替后续资源保障与运营安排。","focus":"持续资源服务与一次交付","difficulty":"进阶","sourceSection":"八、星瀚与5G智能网联业务；二、三断场景与通信恢复","sourceEvidence":"长期合作机制：低空5G智能网联业务不能只做一次性设备销售，须建立年费、流量池等长期合作机制，形成可持续收入。\n…\n四大核心竞争力：全时全域通信底座（运输无人机搭载自研卫星便携站，空投后自动对星组网）；精准运力网络化（首创“一机双投”，实现人机协同救援闭环）；运营商级服务赋能（基于电信云原生架构构建运力与卫星带宽资源动态匹配算法）；量子加密传输＋北斗三号短报文双保险。","sourcePages":[14,18],"sourceSectionKind":"原课程小节","sourceVerified":true,"sourceEvidenceFragments":["长期合作机制：低空5G智能网联业务不能只做一次性设备销售，须建立年费、流量池等长期合作机制，形成可持续收入。","四大核心竞争力：全时全域通信底座（运输无人机搭载自研卫星便携站，空投后自动对星组网）；精准运力网络化（首创“一机双投”，实现人机协同救援闭环）；运营商级服务赋能（基于电信云原生架构构建运力与卫星带宽资源动态匹配算法）；量子加密传输＋北斗三号短报文双保险。"],"explanationStatus":"meaningful","displayId":"N170"},{"id":"N171","chapter":5,"type":"multi","stem":"评审人要求方案说明如何把数据与平台优势转化为全域监管能力。按资料，哪些内容可构成合理支撑？","options":["把通信基站和通感基站当作完全同类能力并直接合并验收","只建设平台软件，不再考虑通感硬件短板","建设自主可控的低空基础设施","将平台数据能力与基础设施建设协同设计"],"answers":[2,3],"explanation":"资料的差异化路径涉及基础设施、通感硬件和平台数据协同，不是只做软件或价格战。通信和通感有各自口径，不能用混算站数代替真实感知能力。 资料强调补齐通感硬件短板，仅有平台软件不足以支撑该差异化路径。","focus":"差异化方案证据","difficulty":"进阶","sourceSection":"九、深圳样板与电信差异化策略","sourceEvidence":"深圳基础设施规划：深圳市低空经济基础设施规划：未来3年新增5G-A通信基站8000个、通感基站500个——通信站与感知站数量是8比5000量级对500量级，不要记反。电信差异化策略：中国电信在低空经济竞争中确立差异化领先地位的关键策略：建设自主可控的低空基础设施，补齐“通感一体”硬件短板，将“数据与平台优势”转化为“全域监管能力”；不是靠价格，也不是只做软件。","sourcePages":[14],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N171"},{"id":"N172","chapter":6,"type":"single","stem":"监控端没有收到某目标的主动身份广播，值班员因此直接判定空域没有无人机。按资料，这一推断的主要问题是什么？","options":["应把所有未广播目标自动当作合法飞行","RID只负责非合作目标识别","没有广播就能证明目标不存在","把合作目标的信息来源误当成全部目标存在性的唯一证据，应结合非合作感知"],"answers":[3],"explanation":"RID用于主动广播身份的合作目标；未收到广播不能排除非合作目标存在，还需光电、雷达、5G-A等不依赖目标配合的手段补充感知。","focus":"合作目标识别边界","difficulty":"应用","sourceSection":"一、感知手段分类","sourceEvidence":"合作类目标：主动广播身份信息的合作类无人机，通过RID即可获取其详细信息（含身份、位置等），是区分“合作／非合作”的第一判断点。非合作目标：依靠光电、雷达、5G-A通感等技术手段发现与跟踪，不依赖目标配合。","sourcePages":[14],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N172"},{"id":"N173","chapter":6,"type":"single","stem":"同一区域既有主动广播身份的配送机，也发现不配合身份广播的目标。按资料，哪种建设思路最能兼顾两者？","options":["停用RID，所有合作目标也只能人工目视","只增加RID接收机，所有目标都必然广播身份","把是否收到广播改为设备总数指标","保留RID识别合作目标，并以雷达、光电等手段补足非合作感知"],"answers":[3],"explanation":"不同目标的信息获取条件不同，应让合作识别和非合作感知互补。只用RID会遗漏不配合的目标，停用RID又浪费可获得的身份位置数据。","focus":"跨源感知配置","difficulty":"应用","sourceSection":"一、感知手段分类","sourceEvidence":"合作类目标：主动广播身份信息的合作类无人机，通过RID即可获取其详细信息（含身份、位置等），是区分“合作／非合作”的第一判断点。非合作目标：依靠光电、雷达、5G-A通感等技术手段发现与跟踪，不依赖目标配合。","sourcePages":[14],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N173"},{"id":"N174","chapter":6,"type":"single","stem":"供应商计划用2台主流AOA设备直接交付全方向经纬度定位，同时用3台TDOA设备满足组网最低要求。按资料，哪项评审结论准确？","options":["两组都不满足资料所列组网口径，应分别补足并验证","两组都已满足资料要求","TDOA满足，AOA仅需软件改名","AOA满足，TDOA不满足"],"answers":[0],"explanation":"资料中的TDOA至少4台，主流AOA需4台实现各方向定位，2台不能直接输出经纬度。应分别核查组网条件，不能用两种技术的设备数相互抵扣。","focus":"组网验收口径","difficulty":"应用","sourceSection":"一、感知手段分类","sourceEvidence":"组网定位：TDOA频谱侦测至少4台组网；AOA主流款需4台才能实现各方向定位，2台不能直接输出经纬度；星盾多源融合接入5G-A通感、RemoteID、AOA、低空雷达四类数据。","sourcePages":[14],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N174"},{"id":"N175","chapter":6,"type":"single","stem":"星盾接入清单已列5G-A通感、Remote ID和低空雷达，却把AOA删除，理由是“已有三类数据，等于资料的四类融合”。按资料，正确的审查意见是？","options":["三类数量已足够，名称不重要","把Remote ID重复写两次即可","将雷达拆成两个界面便可算四类","应明确AOA这一数据来源是否纳入，不能用三类冒充资料列举的四类"],"answers":[3],"explanation":"资料列举四类不同来源，AOA具有其自身观测角色。数据源种类不能按页面数或重复名称凑数；如方案确实删减，应诚实说明与参考能力范围的差异。","focus":"融合接入缺项","difficulty":"应用","sourceSection":"一、感知手段分类","sourceEvidence":"组网定位：TDOA频谱侦测至少4台组网；AOA主流款需4台才能实现各方向定位，2台不能直接输出经纬度；星盾多源融合接入5G-A通感、RemoteID、AOA、低空雷达四类数据。","sourcePages":[14],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N175"},{"id":"N176","chapter":6,"type":"single","stem":"某地只展示了铁塔加装设施在约30至80米范围的监测结果，便宣布500米航路感知已全覆盖。按资料，怎样评价这项结论？","options":["将500改成600，结论就符合资料","存在证据外推，有限高度监测不能直接证明500米覆盖，应另做对应高度验证","只要500米高于80米，就自然更容易监测","通信可接通即可证明所有高度都能感知"],"answers":[1],"explanation":"资料明确该类尝试覆盖高度有限。监测能力必须与验证高度对应，不能将低高度的结果外推到500米；通信覆盖与感知覆盖也不能直接互代。","focus":"有限高度证据","difficulty":"应用","sourceSection":"一、感知手段分类","sourceEvidence":"对空感知现状：在现有铁塔或信息基础设施上加装5G或5G-A设施，可实现对空约30米至80米左右空间的监测，覆盖高度有限。","sourcePages":[14],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N176"},{"id":"N177","chapter":6,"type":"single","stem":"开发者收到激光测得的“相对测站距离与角度”，便直接把距离字段填入经度栏。按资料，最合理的接口评审结论是什么？","options":["应保留相对观测含义，不能未经坐标处理就当作经纬度","用AOA单站的方向值替代纬度即可","所有感知数据都天然是绝对坐标","距离字段改名经度就能使用"],"answers":[0],"explanation":"激光给出相对测站的距离与角度，和绝对经纬度不是同一种量。接口必须尊重观测语义，不能靠字段改名完成空间坐标关系处理。","focus":"相对观测转绝对坐标","difficulty":"应用","sourceSection":"二、定位能力","sourceEvidence":"精度指标：低空载人场景的定位精度要求优于10厘米。定位能力边界：ADS-B、5G-A、报文可给出绝对坐标；AOA单站仅测向、多站交叉才可定位；激光提供相对测站的距离与角度。","sourcePages":[15],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N177"},{"id":"N178","chapter":6,"type":"single","stem":"某载人场景方案能输出绝对坐标，但实测定位误差为12厘米。按资料，怎样判断“能输出绝对坐标，所以定位已达标”的说法？","options":["错误，绝对坐标是表达类型，12厘米仍不满足优于10厘米的资料要求","正确，坐标类型决定精度一定达标","只有相对坐标才需要精度验收","正确，12厘米优于10厘米"],"answers":[0],"explanation":"坐标表达和精度是两个维度。资料要求低空载人场景优于10厘米，能输出绝对坐标并不能豁免精度验证，12厘米不满足这一口径。","focus":"定位精度与坐标类型","difficulty":"应用","sourceSection":"二、定位能力","sourceEvidence":"精度指标：低空载人场景的定位精度要求优于10厘米。定位能力边界：ADS-B、5G-A、报文可给出绝对坐标；AOA单站仅测向、多站交叉才可定位；激光提供相对测站的距离与角度。","sourcePages":[15],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N178"},{"id":"N179","chapter":6,"type":"single","stem":"平台接到某单站AOA的方向信息，同时从报文获得另一目标的绝对坐标。按资料，哪个数据处理策略正确？","options":["删除方向数据，因为它毫无价值","将单站方向角直接用作目标纬度","把两者都标记为已直接取得经纬度","区分测向与绝对坐标，AOA若要定位需满足多站交叉等条件"],"answers":[3],"explanation":"AOA单站测向仍有观测价值，但不能当作已直接定位。报文可提供绝对坐标，两类数据的能力边界应在接口与展示中如实区分。","focus":"单站观测解释","difficulty":"应用","sourceSection":"二、定位能力","sourceEvidence":"精度指标：低空载人场景的定位精度要求优于10厘米。定位能力边界：ADS-B、5G-A、报文可给出绝对坐标；AOA单站仅测向、多站交叉才可定位；激光提供相对测站的距离与角度。","sourcePages":[15],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N179"},{"id":"N180","chapter":6,"type":"single","stem":"同一城市计划建设80米配送线和220米巡检线。按资料，哪个方案更符合分层思路？","options":["80米优先复用现网，220米针对航线与热点增强覆盖","两者都直接使用300至600米专用站方案，不评估现网","两者都只验收地面手机信号，不评估航线","80米只用卫星，220米只保留地面有线"],"answers":[0],"explanation":"80米处于城市120米以下复用层，220米处于120至300米增强层。方案应按航线高度和热点分层设计，不能用地面终端体验替代对空航线验证。","focus":"跨高度通信设计","difficulty":"应用","sourceSection":"三、通信基础认知","sourceEvidence":"分层覆盖：120米以下城市区域复用现网基站；120至300米沿航线与热点区域增强；300至600米采用独立对空专用站；300米以上与偏远地区以卫星与地面多网融合覆盖。","sourcePages":[15],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N180"},{"id":"N181","chapter":6,"type":"single","stem":"一条450米航线延伸至偏远地区。按资料，哪项理解能够同时容纳高度与地域条件，而不是把策略绝对化？","options":["低于600米一律只复用城市现网","按300至600米层评估独立对空站，同时考虑偏远及300米以上多网融合保障","只要有独立对空站就保证所有偏远区全覆盖","只要超过300米就禁止使用地面通信"],"answers":[1],"explanation":"资料既给出300至600米独立对空站策略，也提出300米以上及偏远地区卫星与地面多网融合。两者应按条件协同，而非互斥地解释为单一技术保证全部覆盖。","focus":"高空与偏远条件叠加","difficulty":"应用","sourceSection":"三、通信基础认知","sourceEvidence":"分层覆盖：120米以下城市区域复用现网基站；120至300米沿航线与热点区域增强；300至600米采用独立对空专用站；300米以上与偏远地区以卫星与地面多网融合覆盖。","sourcePages":[15],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N181"},{"id":"N182","chapter":6,"type":"single","stem":"方案将100米城市常规航线全部按独立对空专用站新建，而把400米航线直接认定为现网复用即可。按资料，首要问题是什么？","options":["高度层与技术策略倒置，应分别评估低层复用和高层专用覆盖","两条航线只要都叫低空即可不分高度","只有100米航线需要考虑通信，400米无需通信","400米低于600米，必然不需要任何对空规划"],"answers":[0],"explanation":"资料以高度和地域划分策略，城市120米以下优先复用，300至600米采用独立对空专用站。方案应按层核实，而非把低高两层措施反向套用。","focus":"分层覆盖错配","difficulty":"应用","sourceSection":"三、通信基础认知","sourceEvidence":"分层覆盖：120米以下城市区域复用现网基站；120至300米沿航线与热点区域增强；300至600米采用独立对空专用站；300米以上与偏远地区以卫星与地面多网融合覆盖。","sourcePages":[15],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N182"},{"id":"N183","chapter":6,"type":"single","stem":"视频巡检试点中下行命令传输顺畅，上行图传却频繁拥塞。团队仍按地面业务思路优先扩下行。按资料，怎样调整分析方向？","options":["先按大上行、小下行的业务特征检查上行保障，再验证图传改善","上行拥塞只能靠增加地图样式解决","无人机上下行都没有差异，无需分析","停止图传即可宣告通信建设完成"],"answers":[0],"explanation":"无人机典型业务与传统地面业务相反，重点是大上行。题设的现象与上行短板相符，应围绕业务流向分析容量与保障，不能继续仅优化已顺畅的下行。","focus":"通信容量偏置","difficulty":"应用","sourceSection":"三、通信基础认知","sourceEvidence":"流量特征：无人机典型流量特征是大上行、小下行，与地面传统业务正好相反。建设顺序：最小单元→区域样板→全域覆盖，反对“先全域铺开”。","sourcePages":[15],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N183"},{"id":"N184","chapter":6,"type":"single","stem":"最小单元试点跑通后，团队尚未验证区域协同就申请全域铺开。按资料，哪项进度建议最稳妥？","options":["试点只要有一次成功，就无需区域样板","先形成区域样板验证可复制性，再推进全域覆盖","终止已成功的最小单元，重新从设备采购开始","直接全域开工，商业模式以后再验证"],"answers":[1],"explanation":"建设顺序是最小单元、区域样板、全域覆盖。最小单元成功提供起点，区域样板仍承担复制与协同验证，不能把一次试点等同于全域成熟。","focus":"试点成功的复制条件","difficulty":"应用","sourceSection":"三、通信基础认知","sourceEvidence":"流量特征：无人机典型流量特征是大上行、小下行，与地面传统业务正好相反。建设顺序：最小单元→区域样板→全域覆盖，反对“先全域铺开”。","sourcePages":[15],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N184"},{"id":"N185","chapter":9,"type":"multi","stem":"应急方案已配置量子加密和北斗三号短报文，供应商因此建议删除机载基站经卫星、信关站到核心网的主回传验证，也不再做运力带宽协调。按资料，哪些评审意见合理？","options":["量子加密开启后，机载基站无须任何回传就自动接入核心网","主链路仍应按机载基站、高通量卫星、地面信关站、核心网逐段核对","运力与卫星带宽仍需动态匹配，安全配置不替代资源协同","双保险设计不等于可以省略主通信回传链路核验"],"answers":[1,2,3],"explanation":"安全可靠性配置、端到端通信链路和资源匹配各有作用。资料同时列出卫星回传、动态匹配和双保险，并未把任何一项设为其余两项的替代条件；应分别核验后形成协同。","focus":"安全双保险与主回传关系","difficulty":"进阶","sourceSection":"二、三断场景与通信恢复","sourceEvidence":"通信链路设计：采用“机载基站—高通量卫星—地面信关站—运营商核心网”链路，核心设计逻辑是以高通量卫星为中继，解决机载基站在三断场景下无法通过地面链路回传核心网的问题。四大核心竞争力：全时全域通信底座（运输无人机搭载自研卫星便携站，空投后自动对星组网）；精准运力网络化（首创“一机双投”，实现人机协同救援闭环）；运营商级服务赋能（基于电信云原生架构构建运力与卫星带宽资源动态匹配算法）；量子加密传输＋北斗三号短报文双保险。","sourcePages":[18],"sourceSectionKind":"原课程小节","sourceVerified":true,"sourceEvidenceFragments":["通信链路设计：采用“机载基站—高通量卫星—地面信关站—运营商核心网”链路，核心设计逻辑是以高通量卫星为中继，解决机载基站在三断场景下无法通过地面链路回传核心网的问题。四大核心竞争力：全时全域通信底座（运输无人机搭载自研卫星便携站，空投后自动对星组网）；精准运力网络化（首创“一机双投”，实现人机协同救援闭环）；运营商级服务赋能（基于电信云原生架构构建运力与卫星带宽资源动态匹配算法）；量子加密传输＋北斗三号短报文双保险。"],"explanationStatus":"meaningful","displayId":"N185"},{"id":"N186","chapter":6,"type":"multi","stem":"试点已接入5G-A通感、RID、AOA和低空雷达四类来源，验收报告便用“数据源齐全”证明图传上行容量足够，并申请跳过区域样板直接全域建设。按资料，哪些评审意见合理？","options":["四类感知来源可以代替通信保障，无须分析图传上行","感知来源齐全不能单独替代大上行业务的传输性能验证","来源类别齐全后，建设顺序即可倒置为先全域再做最小单元","应保留从最小单元到区域样板再到全域覆盖的递进验证"],"answers":[1,3],"explanation":"感知来源范围、通信业务性能和扩建成熟度属于不同证据维度。四类来源接入不直接证明图传上行容量充足；无人机典型流量是大上行、小下行，仍应验证业务性能。扩建也应遵循最小单元、区域样板、全域覆盖的递进顺序。","focus":"感知接入与扩建证据","difficulty":"进阶","sourceSection":"一、感知手段分类；三、通信基础认知","sourceEvidence":"组网定位：TDOA频谱侦测至少4台组网；AOA主流款需4台才能实现各方向定位，2台不能直接输出经纬度；星盾多源融合接入5G-A通感、RemoteID、AOA、低空雷达四类数据。对空感知现状：在现有铁塔或信息基础设施上加装5G或5G-A设施，可实现对空约30米至80米左右空间的监测，覆盖高度有限。二、定位能力高精度定位基础设施：依托六分3400座地基增强站提供厘米级定位，解决“定位不准”的核心痛点。精度指标：低空载人场景的定位精度要求优于10厘米。定位能力边界：ADS-B、5G-A、报文可给出绝对坐标；AOA单站仅测向、多站交叉才可定位；激光提供相对测站的距离与角度。三、通信基础认知分层覆盖：120米以下城市区域复用现网基站；120至300米沿航线与热点区域增强；300至600米采用独立对空专用站；300米以上与偏远地区以卫星与地面多网融合覆盖。流量特征：无人机典型流量特征是大上行、小下行，与地面传统业务正好相反。建设顺序：最小单元→区域样板→全域覆盖，反对“先全域铺开”。","sourcePages":[14,15],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N186"},{"id":"N187","chapter":6,"type":"multi","stem":"平台准备把不同来源的空间数据统一入库。按资料，哪些设计原则合理？","options":["区分激光的相对距离角度与绝对坐标","将能否给出坐标与定位精度分别核验","对单站AOA保留“测向”语义，不伪称已直接定位","所有角度数据直接复制为经纬度即可"],"answers":[0,1,2],"explanation":"统一入库需要保留观测含义，不能把相对量或方向角直接伪装成绝对坐标。坐标可得性与精度也是独立维度，应分别验证。","focus":"空间数据语义审查","difficulty":"进阶","sourceSection":"二、定位能力","sourceEvidence":"精度指标：低空载人场景的定位精度要求优于10厘米。定位能力边界：ADS-B、5G-A、报文可给出绝对坐标；AOA单站仅测向、多站交叉才可定位；激光提供相对测站的距离与角度。","sourcePages":[15],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N187"},{"id":"N188","chapter":9,"type":"multi","stem":"林草夜间低温作业中，任务尚未完成电量便不足，返场后补能又过慢。团队准备只增加烟火识别模型来解决这些问题。按资料，哪些补充更针对暴露的约束？","options":["核实耐低温和长续航的极端环境适应能力","已有AI预警就可省略能源与环境适应验证","核实极速快充对应的任务周转响应能力","烟火模型数量增加能自动提高电池充电功率"],"answers":[0,2],"explanation":"烟火识别属于智能预警，低温续航和补能周转则对应极端环境适应、极速快充等不同能力。增加模型不能自动解决电量与充电约束，应按暴露问题匹配验证项目。","focus":"林草能源约束与模型边界","difficulty":"进阶","sourceSection":"三、行业场景化配置","sourceEvidence":"林草巡护四项功能：全时域监测（可穿透烟雾、夜间作业）；AI智能预警（深度学习烟火特征并结合气象数据预判火势）；极端环境适应（耐低温、续航时间长）；分秒级响应（支持极速快充）。","sourcePages":[19],"sourceSectionKind":"原课程小节","sourceVerified":true,"sourceEvidenceFragments":["林草巡护四项功能：全时域监测（可穿透烟雾、夜间作业）；AI智能预警（深度学习烟火特征并结合气象数据预判火势）；极端环境适应（耐低温、续航时间长）；分秒级响应（支持极速快充）。"],"explanationStatus":"meaningful","displayId":"N188"},{"id":"N189","chapter":6,"type":"multi","stem":"拟建设90米城市航线、200米热点航线和450米航线。按资料，哪些规划考虑与各层相符？","options":["200米针对航线与热点增强覆盖","因三条航线都属于低空，必须完全采用同一覆盖方式","90米城市区域优先考虑复用现网","450米评估独立对空专用站并结合多网融合条件"],"answers":[0,2,3],"explanation":"资料按高度和地域给出分层策略，不能把“低空”当作单一网络层。450米同时涉及独立站和300米以上多网融合条件，应结合实际统筹。","focus":"跨层策略审查","difficulty":"进阶","sourceSection":"三、通信基础认知","sourceEvidence":"分层覆盖：120米以下城市区域复用现网基站；120至300米沿航线与热点区域增强；300至600米采用独立对空专用站；300米以上与偏远地区以卫星与地面多网融合覆盖。","sourcePages":[15],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N189"},{"id":"N190","chapter":9,"type":"multi","stem":"方案已明确灾区内通信、道路、电力中断，但计划经卫星回传到灾区外正常工作的地面信关站。有人因链路含“地面”二字，认定它必然依赖灾区断裂的地面回传，应删除信关站。按资料，哪些判断正确？","options":["资料中的卫星回传链路本身包含地面信关站与运营商核心网，不应因词面误解删除必要环节","只要灾区道路中断，所有异地信关站和核心网都必然同时失效","三断约束指向受灾区域，不能仅凭地面二字断定灾区外信关站不可用","有卫星中继后，机载基站无需再连接信关站或核心网"],"answers":[0,2],"explanation":"题设已说明信关站在灾区外正常工作。资料的设计正是利用卫星跨越受灾区地面回传障碍，再经地面信关站接入核心网；不能把“灾区地面链路不可用”扩大成“所有地面节点均不可用”。","focus":"三断与灾区外信关站","difficulty":"进阶","sourceSection":"二、三断场景与通信恢复","sourceEvidence":"三断场景的特殊性：通信、道路、电力均中断时，道路严重毁坏、人和车辆无法进入灾区，必须采用无人机空投基站等无人化方式恢复通信；不能等道路抢通后部署应急通信车，也不能靠铺野战光缆或仅恢复电力。通信链路设计：采用“机载基站—高通量卫星—地面信关站—运营商核心网”链路，核心设计逻辑是以高通量卫星为中继，解决机载基站在三断场景下无法通过地面链路回传核心网的问题。","sourcePages":[18],"sourceSectionKind":"原课程小节","sourceVerified":true,"sourceEvidenceFragments":["三断场景的特殊性：通信、道路、电力均中断时，道路严重毁坏、人和车辆无法进入灾区，必须采用无人机空投基站等无人化方式恢复通信；不能等道路抢通后部署应急通信车，也不能靠铺野战光缆或仅恢复电力。通信链路设计：采用“机载基站—高通量卫星—地面信关站—运营商核心网”链路，核心设计逻辑是以高通量卫星为中继，解决机载基站在三断场景下无法通过地面链路回传核心网的问题。"],"explanationStatus":"meaningful","displayId":"N190"},{"id":"N191","chapter":5,"type":"multi","stem":"机场附近临时庆典要求快速布防撤收，并避免影响正常航空器。供应商以“移动反制越强越好”为由取消低干扰评估，还拟采用全域永久固定布防。按资料，哪些修订合理？","options":["临时庆典可以豁免电磁敏感环境约束，反制强度越大越好","保留低电磁干扰型高精度设备的选型要求","用便携布防、关键环节移动增配和平台统一调度兼顾机动需求","保留动态白名单，匹配现场合法保障机队的变化"],"answers":[1,2,3],"explanation":"临时活动的快速部署撤场要求，不会消除机场附近的电磁敏感约束。应同时采用低干扰选型、便携机动部署、动态白名单与统一调度；永久固定化或只追求强干扰都不能覆盖这些条件。","focus":"临时活动与电磁环境双约束","difficulty":"进阶","sourceSection":"四、星盾防护等级与要地防护","sourceEvidence":"电磁敏感环境：机场等电磁环境敏感场景，应优先选用低电磁干扰型的高精度侦测反制设备，避免干扰航空器正常运行。重大活动与庆典：核心打法是“便携设备全域布防＋动态录入白名单＋关键环节增配移动反制设备＋由星盾平台统一调度设备”，追求快速部署、快速撤场。固定式设备全域永久部署不是推荐方案。","sourcePages":[12],"sourceSectionKind":"原课程小节","sourceVerified":true,"sourceEvidenceFragments":["电磁敏感环境：机场等电磁环境敏感场景，应优先选用低电磁干扰型的高精度侦测反制设备，避免干扰航空器正常运行。重大活动与庆典：核心打法是“便携设备全域布防＋动态录入白名单＋关键环节增配移动反制设备＋由星盾平台统一调度设备”，追求快速部署、快速撤场。固定式设备全域永久部署不是推荐方案。"],"explanationStatus":"meaningful","displayId":"N191"},{"id":"N192","chapter":6,"type":"multi","stem":"预算审批要求证明“可运行再复制”。按资料，哪些材料比一份全域站点采购总表更有支持力？","options":["最小单元业务闭环的运行结果","区域样板复制与协同验证结果","重点只验证下行页面刷新，不再关注上行图传性能","未经验证的“采购越多就必然可用”承诺"],"answers":[0,1],"explanation":"资料强调先最小单元再区域样板，业务特征又要求关注上行。运行与复制证据能支撑投资节奏，单纯采购规模不能证明能力或模式已验证。 无人机典型大上行，性能证据不能只看下行页面。","focus":"投资节奏与性能证据","difficulty":"进阶","sourceSection":"三、通信基础认知","sourceEvidence":"流量特征：无人机典型流量特征是大上行、小下行，与地面传统业务正好相反。建设顺序：最小单元→区域样板→全域覆盖，反对“先全域铺开”。","sourcePages":[15],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N192"},{"id":"N193","chapter":7,"type":"single","stem":"项目已与模组厂完成联合产品定义和集采安排，却发现整机厂新机型没有形成集成推进计划。按资料，下一步最应补齐什么？","options":["面向整机厂开展分层签约与挂图推进，衔接前装落地","取消模组合作，所有整机售出后再改造","将整机厂职责全部交给气象伙伴","继续只在模组厂增加采购数量"],"answers":[0],"explanation":"前装合作包含模组厂与整机厂两条配合路径。联合定义和供货不等于整机集成已落地，需补齐整机厂的分层推进安排，而非只扩大采购。","focus":"前装合作链断点","difficulty":"应用","sourceSection":"三、前装与后装两大市场路径","sourceEvidence":"前装两大合作模式：一是与模组厂联合产品定义、集采降本；二是与整机厂分层签约、挂图作战。模组厂主要承担联合产品定义与前装供货。后装双路径：存量换新与外挂加装。存量客户追求“低成本、快合规”入网，首选外挂天枢终端；新增整机厂要满足“新机必须网联”的监管要求，首选前装预装天擎模组＋低空卡。低空卡三大主线：前装抢入口、后装扩存量、行业树标杆。","sourcePages":[16],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N193"},{"id":"N194","chapter":7,"type":"single","stem":"某前装项目只签了整机厂推广协议，却尚未定义模组产品和前装供货安排。按资料，怎样补齐前装供给链最合适？","options":["要求存量飞手自行开发模组","增加活动宣传，不再做产品定义","把推广协议当作产品规格书即可","与模组厂开展联合产品定义及供货协同，并利用集采降本"],"answers":[3],"explanation":"整机厂合作与模组厂合作相互配合。推广协议不能替代产品定义和供货，资料明确模组厂承担联合定义及前装供货，需把技术供给和市场推进衔接。","focus":"前装产品与渠道错位","difficulty":"应用","sourceSection":"三、前装与后装两大市场路径","sourceEvidence":"前装两大合作模式：一是与模组厂联合产品定义、集采降本；二是与整机厂分层签约、挂图作战。模组厂主要承担联合产品定义与前装供货。后装双路径：存量换新与外挂加装。存量客户追求“低成本、快合规”入网，首选外挂天枢终端；新增整机厂要满足“新机必须网联”的监管要求，首选前装预装天擎模组＋低空卡。低空卡三大主线：前装抢入口、后装扩存量、行业树标杆。","sourcePages":[16],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N194"},{"id":"N195","chapter":7,"type":"single","stem":"年度计划列出新整机厂集成、存量机改造、行业示范运营三类任务，经理却只用“卖出多少张卡”一个动作覆盖全部。按资料，如何改进任务拆分？","options":["全部任务都改成整机售后换卡","行业示范只能做宣传，不能纳入业务主线","按前装入口、后装存量和行业标杆分别设置合作与推进任务","只保留新机厂，存量与行业无需经营"],"answers":[2],"explanation":"三大主线对应不同客户阶段和市场目标。卡片销量是结果之一，不能替代新机集成、存量改造和行业示范各自所需的合作工作。","focus":"三条市场主线","difficulty":"应用","sourceSection":"三、前装与后装两大市场路径","sourceEvidence":"前装两大合作模式：一是与模组厂联合产品定义、集采降本；二是与整机厂分层签约、挂图作战。模组厂主要承担联合产品定义与前装供货。后装双路径：存量换新与外挂加装。存量客户追求“低成本、快合规”入网，首选外挂天枢终端；新增整机厂要满足“新机必须网联”的监管要求，首选前装预装天擎模组＋低空卡。低空卡三大主线：前装抢入口、后装扩存量、行业树标杆。","sourcePages":[16],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N195"},{"id":"N196","chapter":7,"type":"single","stem":"同一存量客户中，一批机型适合保留继续使用，另一批已计划更新整机。按资料，哪种后装推进方式更合理？","options":["分别评估外挂加装与存量换新，让路径对应设备更新计划","两批都只能外挂，不能出现换新","后装只允许换卡，不涉及终端或整机","两批必须统一报废，才算后装市场"],"answers":[0],"explanation":"后装有存量换新和外挂加装双路径。既有更新计划与保留使用需求可分别匹配，不应将一种路径绝对化，更不能把所有后装都缩减为换卡。","focus":"后装替换边界","difficulty":"应用","sourceSection":"三、前装与后装两大市场路径","sourceEvidence":"前装两大合作模式：一是与模组厂联合产品定义、集采降本；二是与整机厂分层签约、挂图作战。模组厂主要承担联合产品定义与前装供货。后装双路径：存量换新与外挂加装。存量客户追求“低成本、快合规”入网，首选外挂天枢终端；新增整机厂要满足“新机必须网联”的监管要求，首选前装预装天擎模组＋低空卡。低空卡三大主线：前装抢入口、后装扩存量、行业树标杆。","sourcePages":[16],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N196"},{"id":"N197","chapter":7,"type":"single","stem":"区域客户已有明确商机，但需要统一资费政策和定制产品方案。属地团队准备自行承诺全部资费并独立研发所有产品。按资料，最合理的组织方式是什么？","options":["只要商机明确，就无需专业产品支持","把所有事务交给气象伙伴","由集团代替属地团队维护每个本地客情","属地团队负责客情商机，协调集团资费号段和无人科技产品方案能力"],"answers":[3],"explanation":"省专协同需让属地、集团和无人科技按所长协作。客情商机不意味着属地可独自决定统一资费或包办产品咨询，应调动相应责任方。","focus":"多方协同升级","difficulty":"应用","sourceSection":"四、省专协同与生态","sourceEvidence":"属地电信：承担客情、商机、投资，是区域市场的主体。无人科技：承担咨询、产品、方案，输出专业能力与交付支撑。集团侧：统筹号段资源与资费政策。生态伙伴：咨询规划方向的代表单位为苏交科，气象方向为南信大气象科技研究院等，共同构成“规划—产品—实施”的合作链。","sourcePages":[16],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N197"},{"id":"N198","chapter":7,"type":"single","stem":"内部责任表把区域投资决策、客户关系、专业咨询和产品方案全部写到无人科技一栏。按资料，应如何纠偏？","options":["属地承担客情、商机和投资主体职责，无人科技提供咨询产品方案支撑","全部由集团只按号段数量自动决策","客户关系归模组厂，投资归气象伙伴","无人科技继续独自承担，属地无需参与"],"answers":[0],"explanation":"资料区分属地市场投资主体与专业能力输出方。专业咨询和产品方案应由无人科技支撑，但区域客情商机投资不能因此从属地责任表中消失。","focus":"专业能力与投资区分","difficulty":"应用","sourceSection":"四、省专协同与生态","sourceEvidence":"属地电信：承担客情、商机、投资，是区域市场的主体。无人科技：承担咨询、产品、方案，输出专业能力与交付支撑。集团侧：统筹号段资源与资费政策。生态伙伴：咨询规划方向的代表单位为苏交科，气象方向为南信大气象科技研究院等，共同构成“规划—产品—实施”的合作链。","sourcePages":[16],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N198"},{"id":"N199","chapter":7,"type":"single","stem":"项目同时需要低空规划咨询与气象专业能力，清单却只列出通信设备供应商。按资料，应怎样补齐生态链？","options":["引入规划与气象相应专业伙伴，并衔接规划、产品、实施工作","任意增加一家硬件经销商即可替代全部专业研究","取消规划和气象内容，避免跨专业合作","仅购买更多通信设备，规划气象自然具备"],"answers":[0],"explanation":"资料列出苏交科等规划伙伴和南信大相关气象伙伴，生态链覆盖规划、产品、实施。单一设备供给不能自动替代专业咨询与气象能力。","focus":"生态伙伴双需求","difficulty":"应用","sourceSection":"四、省专协同与生态","sourceEvidence":"属地电信：承担客情、商机、投资，是区域市场的主体。无人科技：承担咨询、产品、方案，输出专业能力与交付支撑。集团侧：统筹号段资源与资费政策。生态伙伴：咨询规划方向的代表单位为苏交科，气象方向为南信大气象科技研究院等，共同构成“规划—产品—实施”的合作链。","sourcePages":[16],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N199"},{"id":"N200","chapter":7,"type":"single","stem":"客户同一天提出号段资源申请与场景定制方案需求。为避免把两项都推给本地商务，按资料怎样分流最合适？","options":["号段与产品方案属于同一审批项，无需区分责任","全部改为客户自研，本地团队不再参与","两项都只由气象伙伴处理","号段资源协调集团侧，场景方案协调无人科技，属地做好客户与商机衔接"],"answers":[3],"explanation":"集团侧统筹号段资费，无人科技输出咨询产品方案，属地是区域市场主体。把需求按责任分流并保持属地衔接，才能避免跨专业事项无人承接。","focus":"号段与方案诉求分流","difficulty":"应用","sourceSection":"四、省专协同与生态","sourceEvidence":"属地电信：承担客情、商机、投资，是区域市场的主体。无人科技：承担咨询、产品、方案，输出专业能力与交付支撑。集团侧：统筹号段资源与资费政策。生态伙伴：咨询规划方向的代表单位为苏交科，气象方向为南信大气象科技研究院等，共同构成“规划—产品—实施”的合作链。","sourcePages":[16],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N200"},{"id":"N201","chapter":7,"type":"single","stem":"按资料的专项债学习口径，项目测算只证明现金流覆盖本金，却未计入利息；可研便写“已实现自求平衡”。评审首先应要求什么？","options":["本金能覆盖就足够，不再计算利息","把覆盖对象补为债券本息，并复核合规现金流依据","直接将所有收入提高一个固定比例","把收入表字体改小即可"],"answers":[1],"explanation":"资料要求合规现金流覆盖债券本息，利息不能遗漏。收益水平还须有依据，不能靠任意提高收入来补齐表面平衡。","focus":"现金流覆盖缺项","difficulty":"应用","sourceSection":"五、项目阶段与资金合规","sourceEvidence":"四个阶段：前期准备期、规划设计期、报债审批期、建设招标期。运营商在不同阶段的介入深度不同，越靠前越能影响技术路线。专项债硬性要求：项目收益与融资自求平衡，构建的合规现金流须覆盖债券本息，不得随意设定收益水平。这是专项债项目的“一票否决”条件。","sourcePages":[16],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N201"},{"id":"N202","chapter":7,"type":"single","stem":"项目本息合计1200万元，已论证合规现金流1000万元。团队把未经验证的“未来可能收入”直接补为200万元。按资料，哪项评审意见最准确？","options":["1200等于1200，已自动满足合规条件","需要核实补充收入的合规性与可实现依据，不能为平衡任意设收益","只要本金小于1000万元就不再看利息","差额不大，可不讨论来源"],"answers":[1],"explanation":"自求平衡不仅是数字相等，还要求现金流合规且收益不是随意设定。未经验证的收入不能因刚好补差就视为已成立，应补齐依据后再判断覆盖。","focus":"收益表面平衡","difficulty":"应用","sourceSection":"五、项目阶段与资金合规","sourceEvidence":"四个阶段：前期准备期、规划设计期、报债审批期、建设招标
