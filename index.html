Nacos 中 `auto-table` 配置项控制；搭建 Web 服务用 Nginx。","sourcePages":[41],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N473"},{"id":"N474","chapter":20,"type":"single","stem":"按本章手册，一段原始密钥仅16字符，编码成Base64后变长，工程师认为已满足Nacos鉴权要求。应如何评价？","options":["只要变量名包含TOKEN，内容无需检查","仍不满足原始长度要求，应同时核对编码和原始不少于32字符","编码后长度变长，就能忽略原始长度约束","只检查流媒体端口即可判断密钥是否合规"],"answers":[1],"explanation":"本章同时要求Base64编码和原始长度不少于32字符。编码后字符数变多不等于原始密钥长度增加，两个条件须分别满足。","focus":"鉴权密钥编码与长度","difficulty":"应用","sourceSection":"一、星云平台架构与依赖","sourceEvidence":"Nacos鉴权：token密钥需Base64编码且原始长度不低于32个字符；环境变量\n含Nacos_AUTH_ENABLE、Nacos_AUTH_TOKEN、Nacos_AUTH_IDENTITY_KEY、\nNacos_AUTH_IDENTITY_VALUE。","sourcePages":[41],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N474"},{"id":"N475","chapter":20,"type":"single","stem":"按本章手册，运维能登录EMQX控制台，但设备连接认证失败。哪项判断最恰当？","options":["控制台账号与MQTT用户必须同一明文密码，不能分开","能登录控制台就已证明所有MQTT设备账号有效","只要控制台可用，就应立即清空设备认证数据库","控制台与MQTT账号是两套体系，应核对MQTT用户与权限数据"],"answers":[3],"explanation":"本章指出两套账号体系不同；MQTT用户及权限分别有数据表。控制台登录成功只能证明控制台访问，不足以证明设备连接认证正确。","focus":"控制台与MQTT账号分离","difficulty":"应用","sourceSection":"四、状态排查与常见故障","sourceEvidence":"设备连接排查：无人机/机库连接平台失败，在 EMQX 组件排查设备连接情况；EMQX 控制台用户与 MQTT 用户是两套账号体系——控制台用户只登录控制台，mqtt 用户用于 mqtt 连接。\nMQTT 认证数据：认证用户存 `cloud.mqtt_user` 表，权限存 `cloud.mqtt_acl` 表；`password` 字段为明文密码加 salt 的 sha256 加密值。","sourcePages":[41,42],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N475"},{"id":"N476","chapter":20,"type":"single","stem":"按本章部署手册，模型状态不更新但流媒体Web控制台可访问。哪种排查方向更针对问题？","options":["核对建模服务的MQTT依赖与模型状态topic，而非只看流媒体页面","先把所有模型文件删掉，再看控制台是否能登录","只检查摄像头镜头是否干净，不看建模消息链路","流媒体控制台可访问就证明模型MQTT状态链路无误"],"answers":[0],"explanation":"建模服务依赖MQTT，模型管理推送有指定状态topic；流媒体Web控制台可访问不等于该消息链路正常。组件可访问与业务消息到达需分别验证。","focus":"模型状态与视频链路","difficulty":"应用","sourceSection":"一、星云平台架构与依赖","sourceEvidence":"中间件依赖：SnailJob 依赖 PostgreSQL；Seata 依赖 Nacos 和 PostgreSQL；流媒体依赖 MySQL 和 Redis；需要 MQTT 消息队列的是后端服务与建模服务（模型管理、二维建模、模型重建等）。\n流媒体与模型：流媒体 web 管理界面登录端口 48080；模型管理服务推送的 MQTT topic 是 `system/+/+/model/state`；流媒体控制台可修改 SIP 端口、外网 IP、国标域、国标编码、认证密码。","sourcePages":[41],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N476"},{"id":"N477","chapter":20,"type":"single","stem":"按本章手册，后端部署完成后DEFAULT_GROUP只见6个服务。为恢复业务并保留诊断证据，应采用哪种处理？","options":["只更换录像存储目录，不查缺失服务日志","对照预期8个定位缺失服务，留存相关服务与崩溃日志后再按需恢复","6个服务可见说明全部部署完成，不需检查","直接清空数据库，注册服务数会自动补齐"],"answers":[1],"explanation":"本章预期DEFAULT_GROUP为8个服务；异常时应查看对应日志、结合崩溃记录分析，生产环境可先留存日志再重启恢复，不能直接清库。","focus":"服务注册与证据保全","difficulty":"应用","sourceSection":"一、星云平台架构与依赖","sourceEvidence":"服务列表：后端服务全部部署完成后，Nacos服务列表DEFAULT_GROUP应看\n到8个服务（含nebula-sum、nebula-gateway、nebula-auth、nebula-business等）。\n服务异常处理：Nacos 注册中心服务数异常——到对应服务目录查看服务日志、结合崩溃日志分析，生产环境可先留存日志再重启服务恢复；不能直接清空数据库。docker 部署异常用 `docker ps`、`docker stats` 查看容器状态；服务器有其他容器服务与 docker 冲突时可卸载其他容器服务。","sourcePages":[41,42,43],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N477"},{"id":"N478","chapter":19,"type":"single","stem":"按本章手册，星瀚项目要更换Logo背景并使新的本地化地图生效。哪种安排准确？","options":["只在租户端个人中心改手机号，即可完成两项需求","直接新建K8S节点，Logo和地图就必定同步替换","在IP:18888/admin的平台管理→文件更换资源，地图配置修改后重启dk-dist","只修改sys_config_open，星瀚地图服务无需生效步骤"],"answers":[2],"explanation":"界面资源有专门管理入口，地图本地化则需要修改dk-dist-config并重启dk-dist。资源文件管理与服务配置生效应分别完成。","focus":"星瀚界面修改入口","difficulty":"应用","sourceSection":"三、平台初始化（星瀚）","sourceEvidence":"LOGO与背景更换：访问nginx服务IP:18888/admin，进入平台管理→文件菜单操作。\n本地化地图生效：修改dk-dist-config配置后，需重启dk-dist服务使配置生效。","sourcePages":[40],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N478"},{"id":"N479","chapter":19,"type":"single","stem":"交付培训稿把“短信或邮箱双因子登录”列为星瀚地图生效步骤，把“重启dk-dist”列为星云租户认证步骤。按本章，哪项归类准确？","options":["短信或邮箱双因子属于星云用户登录；修改dk-dist-config后重启dk-dist属于星瀚本地化地图生效","只要管理页能打开，双因子认证与地图生效都无需配置","两项都归星巡大屏MQTT配置，无需区分平台","两项都属于星云登录认证，星瀚没有本地化地图生效要求"],"answers":[0],"explanation":"原文把短信或邮箱双因子认证列在星云用户管理；星瀚本地化地图修改dk-dist-config后，需要重启dk-dist。应按平台与功能归类，不能将不同产品的初始化步骤交叉替代。","focus":"跨平台配置职责辨析","difficulty":"应用","sourceSection":"一、租户与用户管理（星云）","sourceEvidence":"双因子认证：用户登录通过短信或邮箱实现双因子认证。\n本地化地图生效：修改dk-dist-config配置后，需重启dk-dist服务使配置生效。","sourcePages":[40],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N479"},{"id":"N480","chapter":20,"type":"single","stem":"按本章SaaS部署手册，团队只开放网页HTTPS，却把Nacos对公网开放并遗漏MQTT、推流和RTC入口。评审应怎样修正？","options":["按业务补齐MQTT、RTMP、RTC入口，保持Nacos不对外，并核对SSL配套","网页能打开就代表设备消息与视频链路都已可用","把所有数据库和Nacos端口开放公网即可替代业务端口规划","只保留Nacos公网入口，其他业务端口全部可删除"],"answers":[0],"explanation":"SaaS网页入口不能替代设备连接、推流与RTC入口；本章要求Nacos不对外，同时配置SSL时需核对前端调用组件的相应SSL配置。","focus":"SaaS入口与后台隔离","difficulty":"应用","sourceSection":"三、SSL 与端口安全","sourceEvidence":"SaaS 暴露端口：作为 SaaS 平台对互联网暴露时，需开放 mqtt 连接端口、流媒体 rtmp 推流端口、流媒体 rtc 端口；Nacos 端口不对外。\nSSL 配置原则：配置 SSL 访问后，前端调用的各组件均需配置 SSL；EMQX 的 wss 配置是必须的，其他可选；流媒体 zlm 目录下需将 key 和 pem 合并为 `default.pem`；无人机视频播放（wvp-pro 及流媒体节点）也需相应配置域名和 https 端口。","sourcePages":[42],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N480"},{"id":"N481","chapter":20,"type":"single","stem":"按本章手册，网页已用HTTPS，但设备视频播放未配域名及HTTPS端口，流媒体证书也未按要求合并。哪种补充更完整？","options":["只给网页标题加SSL字样，不改视频节点","将Nacos改成公网入口即可自动生成所有视频证书","只改数据库Schema即可替代视频链路SSL配置","补视频节点域名和HTTPS端口，并按要求合并key与pem为default.pem"],"answers":[3],"explanation":"网页HTTPS不是全部链路HTTPS。资料要求视频相关节点配套域名和HTTPS端口，流媒体zlm目录按要求将key、pem合为default.pem。","focus":"HTTPS视频联调","difficulty":"应用","sourceSection":"三、SSL 与端口安全","sourceEvidence":"SSL 配置原则：配置 SSL 访问后，前端调用的各组件均需配置 SSL；EMQX 的 wss 配置是必须的，其他可选；流媒体 zlm 目录下需将 key 和 pem 合并为 `default.pem`；无人机视频播放（wvp-pro 及流媒体节点）也需相应配置域名和 https 端口。","sourcePages":[42],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N481"},{"id":"N482","chapter":20,"type":"single","stem":"按本章手册，流媒体未授权且录像下载未鉴权，团队只准备改成绝对存储目录就验收。应怎样评价？","options":["为方便访问，应同时关闭所有录像下载鉴权","绝对目录本身即可替代软件授权与访问控制","目录调整只是部分要求，还需有效授权并建议开启下载鉴权","只要下载可访问，就不必关注流媒体授权状态"],"answers":[2],"explanation":"授权影响正常推流，下载鉴权影响录像访问安全，绝对目录影响存储路径。三项相互独立，改目录不能补齐授权和访问控制。","focus":"授权与录像安全","difficulty":"应用","sourceSection":"三、SSL 与端口安全","sourceEvidence":"流媒体授权与录像：流媒体软件未授权时不能正常推流使用；录像下载鉴权功能建议开启；录像存储路径建议使用服务器绝对目录。","sourcePages":[42],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N482"},{"id":"N483","chapter":19,"type":"single","stem":"按本章手册，配置单将redis host指向应用服务器IP，又把wrkj-gateway.jar认作运营方网关。评审应怎样纠正？","options":["Redis指向数据库服务器，且不能将该后端包认作运营方网关","两项都符合本章手册，不需修改","只要文件名带gateway，就必定是运营方网关服务","只更换Logo即可改变缓存目标和服务角色"],"answers":[0],"explanation":"原文对两处均有辨析：Redis host应指向数据库服务器，wrkj-gateway.jar不是运营方网关。不能按名称字面猜角色，也不能忽略部署目标。","focus":"缓存地址与服务名称辨析","difficulty":"应用","sourceSection":"二、界面本地化（星巡）","sourceEvidence":"端口辨析：Nginx大屏前端端口不是18889；后端包wrkj-gateway.jar不是运营方网关服务；application-dev.yml中redis的host不应配置为应用服务器IP（应指向数据库服务器）。","sourcePages":[40],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N483"},{"id":"N484","chapter":20,"type":"single","stem":"按本章排查口径，设备MQTT连接已确认成功，但前端仍显示不在线。下一步哪种检查组合更合理？","options":["反复修改摄像头焦距以恢复在线状态","核查SnailJob定时任务与前端ws订阅链路","立即认定只有流媒体授权问题，不查任务和订阅","既然MQTT已连上，就必须删除所有状态记录"],"answers":[1],"explanation":"本章指出连接成功仍可能因SnailJob任务失败或前端ws未订阅而显示不在线。连接链路与状态刷新链路不同，不能仅凭连接成功结案。","focus":"连接成功但不在线诊断","difficulty":"应用","sourceSection":"四、状态排查与常见故障","sourceEvidence":"设备不在线三因：设备 mqtt 连接失败、snailjob 定时任务执行失败、前端 ws 连接失败未能订阅到消息；流媒体 media 服务故障不属于不在线原因。\n定时任务：平台通过 SnailJob 执行定时任务；设备连接成功但不在线，可能与 snail-job 定时任务执行失败有关。","sourcePages":[42,43],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N484"},{"id":"N485","chapter":20,"type":"single","stem":"按本章给定排查口径，设备在线状态正常但画面始终为空，已确认摄像头供电正常。首轮应怎样继续区分链路？","options":["在线正常即可证明摄像头和视频传输全部正常","只反复查SnailJob，完全不看视频网络与流媒体","只重建用户角色，就可替代视频服务排查","核查设备到流媒体的网络和流媒体服务，并继续确认摄像头本体状态"],"answers":[3],"explanation":"本章将在线状态链与无视频链分列，无视频重点包括设备到流媒体网络、摄像头与流媒体服务。摄像头供电正常也不等于本体与传输全部正常。","focus":"在线状态与视频故障分流","difficulty":"应用","sourceSection":"四、状态排查与常见故障","sourceEvidence":"设备不在线三因：设备 mqtt 连接失败、snailjob 定时任务执行失败、前端 ws 连接失败未能订阅到消息；流媒体 media 服务故障不属于不在线原因。\n无视频三因：设备连接流媒体网络故障、摄像头故障、流媒体服务故障；mqtt 连接失败不属于无视频原因。","sourcePages":[42],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N485"},{"id":"N486","chapter":20,"type":"single","stem":"按本章排查口径，现场上行速率低，办公室电脑又跨运营商访问且偶有丢包。哪种结论最稳妥？","options":["只要设备在线，任何卡顿都只可能来自摄像头硬件","办公室能打开主页即可证明所有传输链路稳定","设备侧上行与观看侧、跨运营商链路均可能贡献卡顿，需分别核验","跨运营商链路不会影响视频，忽略电脑侧网络"],"answers":[2],"explanation":"本章把设备上行、设备时延、个人电脑网络与跨运营商时延丢包均列为卡顿原因。应分端取证，不能由在线或主页可达排除传输问题。","focus":"卡顿的多端网络证据","difficulty":"应用","sourceSection":"四、状态排查与常见故障","sourceEvidence":"视频卡顿四因：设备网络上行带宽低、设备网络时延高、登录平台的个人电脑网络不好、跨运营商场景时延高丢包率高。","sourcePages":[42],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N486"},{"id":"N487","chapter":20,"type":"single","stem":"按本章手册，Docker业务异常且怀疑主机资源压力，哪组观测能同时覆盖容器状态和磁盘、IO情况？","options":["直接清空业务数据库，省去资源观测","用docker ps、docker stats看容器，结合df -h与iostat看主机磁盘和IO","只用free -g判断磁盘容量和全部容器状态","只看Nginx首页是否存在，就断定容器及主机全部正常"],"answers":[1],"explanation":"容器状态与资源用量可用docker ps、docker stats；主机磁盘与IO分别由df -h、iostat观察。分层证据能避免将资源问题误作业务数据问题。","focus":"容器与主机分层观测","difficulty":"应用","sourceSection":"四、状态排查与常见故障","sourceEvidence":"服务异常处理：Nacos 注册中心服务数异常——到对应服务目录查看服务日志、结合崩溃日志分析，生产环境可先留存日志再重启服务恢复；不能直接清空数据库。docker 部署异常用 `docker ps`、`docker stats` 查看容器状态；服务器有其他容器服务与 docker 冲突时可卸载其他容器服务。\n主机资源命令：`top` 看 CPU、`free -g` 看内存、`df -h` 看磁盘、`iostat` 看 IO，均为常用检查命令。","sourcePages":[42,43],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N487"},{"id":"N488","chapter":19,"type":"single","stem":"按本章手册，项目Logo全部换新，但地图未居中且实时轨迹不更新。哪种验收意见最完整？","options":["界面资源只完成一部分；继续验证目标城市中心点并检查大屏MQTT配置","将所有问题归为租户手机号不一致，无需看地图和消息配置","只要再换一次标题图片，中心点和MQTT一定自动恢复","Logo已换新即可认定所有地图与实时数据需求完成"],"answers":[0],"explanation":"UI资源、本地化地图与实时消息是不同配置对象。原文分别给出地图业务验证和MQTT排查方法，Logo成功不能作为其余两项完成的证据。","focus":"多项本地化验收证据","difficulty":"应用","sourceSection":"二、界面本地化（星巡）","sourceEvidence":"UI资源替换：初始化配置包含大屏标题图片更换、监管平台Logo更换、运营平台Logo更换三类。\n大屏MQTT：修改sys_config表中config_key为*.mqtt.*的配置项；大屏无法接收无人机实时轨迹时，优先检查该MQTT配置。\n验证方法：地图中心点配置完成后，在监管/运营平台新建空域、航路航线、起降点，验证地图是否居中于目标城市。","sourcePages":[40],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N488"},{"id":"N489","chapter":20,"type":"multi","stem":"按本章部署手册，审查一份“所有服务只依赖MySQL”的资源清单，哪些纠正有依据？","options":["SnailJob与Seata均涉及PostgreSQL依赖","流媒体依赖MySQL和Redis，不能代表全部组件相同","只要MySQL正常，就可跳过所有PostgreSQL相关核验","后端使用PostgreSQL并有JDK21及pgcrypto相关要求"],"answers":[0,1,3],"explanation":"资料给出差异化依赖矩阵：后端、任务与事务组件均涉及PostgreSQL，流媒体则依赖MySQL和Redis。不能用一种组件概括全平台。","focus":"依赖矩阵评审","difficulty":"应用","sourceSection":"一、星云平台架构与依赖","sourceEvidence":"数据库：后端服务使用 PostgreSQL，默认库名 `nebula`；`nebula.cloud` 库依赖 pgcrypto 加解密扩展；nebula 后端依赖 jdk21。\n中间件依赖：SnailJob 依赖 PostgreSQL；Seata 依赖 Nacos 和 PostgreSQL；流媒体依赖 MySQL 和 Redis；需要 MQTT 消息队列的是后端服务与建模服务（模型管理、二维建模、模型重建等）。","sourcePages":[41],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N489"},{"id":"N490","chapter":20,"type":"multi","stem":"按本章手册分派配置排查任务，哪些归口正确？","options":["把docker-compose.yml直接当作MQTT认证用户数据库","MQTT用户核对cloud.mqtt_acl，权限核对cloud.mqtt_user","数据库自动初始化核对Nacos的auto-table","Docker持久化目录核对daemon.json"],"answers":[2,3],"explanation":"Docker持久化目录与数据库自动初始化分别核对daemon.json和Nacos的auto-table。MQTT用户在cloud.mqtt_user、权限在cloud.mqtt_acl，不能互换；docker-compose.yml负责容器编排，不是认证用户数据表。","focus":"配置文件职责核对","difficulty":"应用","sourceSection":"一、星云平台架构与依赖","sourceEvidence":"关键配置文件：修改 docker 存储目录编辑 `/etc/docker/daemon.json`；中间件容器统一编排用 `docker-compose.yml`；数据库自动初始化由 Nacos 中 `auto-table` 配置项控制；搭建 Web 服务用 Nginx。\nMQTT 认证数据：认证用户存 `cloud.mqtt_user` 表，权限存 `cloud.mqtt_acl` 表；`password` 字段为明文密码加 salt 的 sha256 加密值。","sourcePages":[41],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N490"},{"id":"N491","chapter":19,"type":"multi","stem":"按本章跨平台用户手册，哪些入口选择合理？","options":["星瀚Logo背景更换进入平台管理的文件菜单","星云正常创建租户使用管理端Web","所有平台所有修改都应直接写数据库，以统一操作方式","星云手机号异常修改可将数据库途径理解为逃生通道"],"answers":[0,1,3],"explanation":"原文对不同管理对象分别定义入口；手机号的异常通道不能推导出所有平台都应写库。交付操作要按对象和正常/异常场景分流。","focus":"异常处理与入口选择","difficulty":"应用","sourceSection":"一、租户与用户管理（星云）","sourceEvidence":"手机号修改：租户端个人中心可改、管理端用户管理可改，异常情况下还可以用数据库修改作为逃生通道——三种途径都支持。\n租户创建：登录管理端web创建租户；租户端和数据库方式都不是正规入口。\nLOGO与背景更换：访问nginx服务IP:18888/admin，进入平台管理→文件菜单操作。","sourcePages":[40],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N491"},{"id":"N492","chapter":20,"type":"multi","stem":"按本章手册审查国产化私有部署方案，哪些意见有依据？","options":["不能把已适配部分国产资源扩大成建模服务可全部用鲲鹏ARM","私有化部署并不强制使用天翼云托管组件","选择天翼云PostgreSQL时按手册准备cloud、job、seata Schema","只要操作系统相同，就可跳过所有组件架构适配核验"],"answers":[0,1,2],"explanation":"私有部署自由度、云数据库初始化与CPU架构适配是不同层次。已有适配清单并不意味着任意组件和架构组合均可用。","focus":"云资源与国产化边界","difficulty":"应用","sourceSection":"二、部署形态与国产化适配","sourceEvidence":"部署自由度：私有化部署不强制使用天翼云的 teledb、Redis、RCC 等云服务。\n适配清单：已适配海光 C86 服务器、银河麒麟操作系统、天翼云 CTyunOS 操作系统、天翼云 TeleDB 数据库、金仓 KingbaseES V8；建模服务不能全部使用鲲鹏 ARM 服务器部署。\n天翼云部署：支持teledb  for  MySQL、teledb  for  PostgreSQL、Redis、RCC；\nteledb  for  PostgreSQL创建后需在nebula库下建cloud、job、seata三个Schema；依赖\nPostgreSQL的组件为nebula后端、snailjob、seata。","sourcePages":[41,42],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N492"},{"id":"N493","chapter":20,"type":"multi","stem":"按本章SaaS手册，公网接入方案应兼顾哪些事项？","options":["为省配置工作将Nacos管理端口直接作为设备视频入口","网页启用SSL后核对EMQX的wss等组件配套","保持Nacos端口不对外","为设备消息与流媒体推流、RTC安排所需入口"],"answers":[1,2,3],"explanation":"公网业务入口与内部管理端口应区分；网页SSL还牵涉组件侧配套。Nacos是注册配置相关组件，不能拿其端口替代消息和视频入口。","focus":"公网业务与内部管理分离","difficulty":"应用","sourceSection":"三、SSL 与端口安全","sourceEvidence":"SaaS 暴露端口：作为 SaaS 平台对互联网暴露时，需开放 mqtt 连接端口、流媒体 rtmp 推流端口、流媒体 rtc 端口；Nacos 端口不对外。\nSSL 配置原则：配置 SSL 访问后，前端调用的各组件均需配置 SSL；EMQX 的 wss 配置是必须的，其他可选；流媒体 zlm 目录下需将 key 和 pem 合并为 `default.pem`；无人机视频播放（wvp-pro 及流媒体节点）也需相应配置域名和 https 端口。","sourcePages":[42],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N493"},{"id":"N494","chapter":20,"type":"multi","stem":"按本章手册完成视频链路验收，哪些检查有依据？","options":["核对流媒体授权及建议开启的录像下载鉴权","核对视频相关节点域名和HTTPS端口配置","网页HTTPS可用即可跳过流媒体授权与录像鉴权","核对流媒体证书合并方式与录像绝对存储路径"],"answers":[0,1,3],"explanation":"网页安全入口、视频节点SSL、软件授权和录像访问是独立检查项。首页HTTPS正常不能证明其余业务链路和访问控制已完成。","focus":"视频SSL与录像交付","difficulty":"应用","sourceSection":"三、SSL 与端口安全","sourceEvidence":"SSL 配置原则：配置 SSL 访问后，前端调用的各组件均需配置 SSL；EMQX 的 wss 配置是必须的，其他可选；流媒体 zlm 目录下需将 key 和 pem 合并为 `default.pem`；无人机视频播放（wvp-pro 及流媒体节点）也需相应配置域名和 https 端口。\n流媒体授权与录像：流媒体软件未授权时不能正常推流使用；录像下载鉴权功能建议开启；录像存储路径建议使用服务器绝对目录。","sourcePages":[42],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N494"},{"id":"N495","chapter":19,"type":"multi","stem":"按本章星巡手册，哪些排查意见有依据？","options":["可直接把18889认定为本章Nginx大屏前端端口","实时轨迹接收异常时应优先核对大屏MQTT配置","不能只因wrkj-gateway.jar带gateway字样就认定它是运营方网关","Redis host不能按草案指向应用服务器，应核对数据库服务器目标"],"answers":[1,2,3],"explanation":"Redis目标服务器、后端包的服务角色及实时轨迹MQTT配置，都应按原文分别核对。原文特别指出Nginx大屏前端端口不是18889，不能据此自行认定该数字就是正确前端端口。","focus":"部署依赖辨析","difficulty":"应用","sourceSection":"二、界面本地化（星巡）","sourceEvidence":"端口辨析：Nginx大屏前端端口不是18889；后端包wrkj-gateway.jar不是运营方网关服务；application-dev.yml中redis的host不应配置为应用服务器IP（应指向数据库服务器）。\n大屏MQTT：修改sys_config表中config_key为*.mqtt.*的配置项；大屏无法接收无人机实时轨迹时，优先检查该MQTT配置。","sourcePages":[40],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N495"},{"id":"N496","chapter":20,"type":"multi","stem":"按本章给定排查口径，哪些分流办法合理？","options":["完全无视频时核查摄像头、设备到流媒体网络及流媒体服务","卡顿时也考虑观看电脑和跨运营商丢包时延","所有无视频或卡顿都只由SnailJob任务失败引起","卡顿时同时考虑设备上行带宽与网络时延"],"answers":[0,1,3],"explanation":"本章将无视频与卡顿列为不同故障集合。前者关注摄像头及视频链路，后者要跨设备与观看端网络分析，不能归为单一任务组件。","focus":"无视频与卡顿分流","difficulty":"应用","sourceSection":"四、状态排查与常见故障","sourceEvidence":"无视频三因：设备连接流媒体网络故障、摄像头故障、流媒体服务故障；mqtt 连接失败不属于无视频原因。\n视频卡顿四因：设备网络上行带宽低、设备网络时延高、登录平台的个人电脑网络不好、跨运营商场景时延高丢包率高。","sourcePages":[42],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N496"},{"id":"N497","chapter":20,"type":"multi","stem":"按本章手册发现注册服务缺失且业务容器异常，哪些处置有依据？","options":["查看对应服务及崩溃日志并在恢复前留存证据","对照DEFAULT_GROUP预期服务清单找缺口","直接清空数据库是本章推荐的首选恢复手段","用docker ps、docker stats观察容器状态与资源"],"answers":[0,1,3],"explanation":"清单核对、日志分析和容器观测分别提供不同证据；本章明确不能直接清空数据库，恢复应保留诊断线索。","focus":"异常注册与容器证据","difficulty":"应用","sourceSection":"一、星云平台架构与依赖","sourceEvidence":"服务列表：后端服务全部部署完成后，Nacos服务列表DEFAULT_GROUP应看\n到8个服务（含nebula-sum、nebula-gateway、nebula-auth、nebula-business等）。\n服务异常处理：Nacos 注册中心服务数异常——到对应服务目录查看服务日志、结合崩溃日志分析，生产环境可先留存日志再重启服务恢复；不能直接清空数据库。docker 部署异常用 `docker ps`、`docker stats` 查看容器状态；服务器有其他容器服务与 docker 冲突时可卸载其他容器服务。","sourcePages":[41,42,43],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N497"},{"id":"N498","chapter":20,"type":"multi","stem":"按本章手册验收多台自有服务器，哪些要求或检查合理？","options":["确认私有化部署不被无依据限制为只能用托管云组件","要求所有CPU与硬盘完全一致，否则时钟同步无效","用free -g核对磁盘容量、用df -h核对内存使用率","核对各服务器时钟一致"],"answers":[0,3],"explanation":"多机时钟应一致，私有化也不强制使用托管云组件。free -g看内存、df -h看磁盘，不能互换；CPU和磁盘同型不是时钟同步成立的前提。","focus":"多机部署验收维度","difficulty":"应用","sourceSection":"四、状态排查与常见故障","sourceEvidence":"时钟同步：多台服务器部署时，各服务器时钟必须保持一致；不需要操作系统版本、硬盘、CPU 一致。\n主机资源命令：`top` 看 CPU、`free -g` 看内存、`df -h` 看磁盘、`iostat` 看 IO，均为常用检查命令。\n部署自由度：私有化部署不强制使用天翼云的 teledb、Redis、RCC 等云服务。","sourcePages":[42,43],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N498"},{"id":"N499","chapter":20,"type":"multi","stem":"按本章手册同时验收建模和后端能力，哪些证据需要分别核查？","options":["后端JDK与PostgreSQL加解密扩展等前置条件","流媒体Web能登录就已证明建模状态和后端依赖全正常","建模服务所依赖的MQTT消息链路","模型状态topic的消息流转"],"answers":[0,2,3],"explanation":"模型消息、后端运行环境与流媒体控制台属于不同验证对象。一个控制台可访问不足以推出其他组件和业务链路正常。","focus":"模型消息与数据库前置","difficulty":"应用","sourceSection":"一、星云平台架构与依赖","sourceEvidence":"中间件依赖：SnailJob 依赖 PostgreSQL；Seata 依赖 Nacos 和 PostgreSQL；流媒体依赖 MySQL 和 Redis；需要 MQTT 消息队列的是后端服务与建模服务（模型管理、二维建模、模型重建等）。\n流媒体与模型：流媒体 web 管理界面登录端口 48080；模型管理服务推送的 MQTT topic 是 `system/+/+/model/state`；流媒体控制台可修改 SIP 端口、外网 IP、国标域、国标编码、认证密码。\n数据库：后端服务使用 PostgreSQL，默认库名 `nebula`；`nebula.cloud` 库依赖 pgcrypto 加解密扩展；nebula 后端依赖 jdk21。","sourcePages":[41],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N499"},{"id":"N500","chapter":19,"type":"multi","stem":"按本章手册，跨平台初始化验收报告应分别保留哪些证据？","options":["星瀚设备推送配置后的测试连接结果","只保留一张Logo截图即可证明所有初始化功能都已完成","星巡大屏标题及监管、运营Logo等资源替换结果","星巡地图在目标城市正确居中的业务验证结果"],"answers":[0,2,3],"explanation":"原文分别规定资源替换、地图验证及设备链路测试。每项需对应证据，单张界面图片无法证明地图中心和设备数据连通均正确。","focus":"初始化分项验收","difficulty":"应用","sourceSection":"二、界面本地化（星巡）","sourceEvidence":"UI资源替换：初始化配置包含大屏标题图片更换、监管平台Logo更换、运营平台Logo更换三类。\n验证方法：地图中心点配置完成后，在监管/运营平台新建空域、航路航线、起降点，验证地图是否居中于目标城市。\n设备链路验证：设备厂商配置好推送数据后，点击测试连接检查数据链路是否打通。","sourcePages":[40,41],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N500"}]},{"id":"original","name":"基础回顾 · 原500题","shortName":"基础回顾","description":"原500道单选 · 保留原题号与结构，明显错误显式勘误","note":"原500题保留可追溯；Q046及Q065解析已勘误，5道待核对题默认不纳入练习。","questions":[{"id":"O001","displayId":"Q001","chapter":1,"type":"single","stem":"《低空经济及其核心产业统计分类（试行）》的正式文号是什么？","options":["发改低空〔2025〕1676号","发改低空〔2026〕123号","国令第761号","国令第371号"],"answers":[0],"explanation":"统计分类文件文号为发改低空〔2025〕1676号，由国家发展改革委发布。发改低空〔2026〕123号是低空保险实施意见文号，761号和371号是两部行政法规的令号。","focus":"最新公开政策深度解读","difficulty":"基础","sourceSection":"原500题题库 · 保留原题结构","sourceEvidence":"原题答案与解析为原工具内容；争议题另行标注。","explanationStatus":"meaningful"},{"id":"O002","displayId":"Q002","chapter":1,"type":"single","stem":"《低空经济及其核心产业统计分类（试行）》是由哪个部门发布的？","options":["工业和信息化部","中国民用航空局","国家发展改革委","国家统计局"],"answers":[2],"explanation":null,"focus":"最新公开政策深度解读","difficulty":"基础","sourceSection":"原500题题库 · 保留原题结构","sourceEvidence":"原题答案与解析为原工具内容；争议题另行标注。","explanationStatus":"none"},{"id":"O003","displayId":"Q003","chapter":1,"type":"single","stem":"低空经济统计分类的总体架构是：4个大类、23个中类、65个小类，其中属于低空经济核心产业的小类有多少 const TOKEN_SESSION='l3-sync-key-session',TOKEN_REMEMBER='l3-sync-key-remember';

function forgetToken(){memoryToken='';try{sessionStorage.removeItem(TOKEN_SESSION);localStorage.removeItem(TOKEN_REMEMBER);}catch{}const input=$('#cloud-key');if(input)input.value='';toast('已忘记本机钥匙，云端记录保留。');}

 if(!token)return status.textContent='先按上面的步骤创建访问钥匙，并粘贴到这里。';
 keepToken(token,remember);S.sync={...S.sync,...cfg,mode:'manual'};save();

 $('#sheet [data-action="sync-run"]').disabled=true;status.classList.remove('error');

 try{
  const answer=await C.manualSync({state:snapshot,banks:D.banks,settings:cfg,token,signal:controller.signal,onStep:text=>{if($('#sync-status'))$('#sync-status').textContent=text+'…';}});
  const changed=S.updatedAt>start,now=Date.now();S=M.merge(S,answer.state,D.banks,now);S.sync={...S.sync,...cfg,verified:true,mode:'manual',lastSuccessAt:now,lastSyncedAt:changed?start:now};rebuild();save();
  if($('#sync-status')){$('#sync-status').textContent=changed?'本次合并已成功。同步期间又有本机新记录，需要时再点一次即可。':'同步成功，两端进度已合并保存。另一台设备也点“同步一次”即可获取。';$('#sync-status').classList.add('success');}
  render();toast('手动同步成功，进度已合并。');
 }catch(e){if($('#sync-status')){$('#sync-status').textContent=e.message;$('#sync-status').classList.add('error');}else toast(e.message);}
 finally{clearTimeout(timeout);if(syncController===controller)syncController=null;const b=$('#sheet [data-action="sync-run"]');if(b)b.disabled=false;}
}

async function prepareBackup(file){try{const b=await readFile(file);if(b?.kind!=='low-altitude-study-backup'||![4,5].includes(b.version)||!b.state)throw Error('这不是本工具支持的学习备份。');M.validateState(b.state,D.banks);const state=M.migrate(b.state,D.banks);pending={kind:'backup',state};sheet('恢复学习备份',`<p>备份时间：${esc(b.exportedAt||'未知')}<br>已看 ${Object.keys(state.reading).length} 题，${Object.keys(state.records).length} 道有答题记录，${state.customBanks.length} 套自定义题库。</p><div class="callout mt16">${icon('info')}<span>推荐合并恢复，保留两份数据。旧版随机自测只保留历史，不会充入新的整轮覆盖。</span></div><div class="sheet-footer">${button('合并到本机','backup-merge')}${button('替换当前记录','backup-replace-prompt','','outline')}</div>`);}catch(e){toast(e.message);}}
