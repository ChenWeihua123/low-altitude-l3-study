  <script>window.STUDY_DATA={"version":"1.0 · 2026-10-31","sourceNote":"已读取知识中心原课程43/43页文本层，按完整20章核实补全，勘误与课程原文分别标注。","chapters":[{"number":1,"title":"第一章 低空经济最新公开政策深度解读","short":"最新公开政策深度解读","hint":"产业统计分类四大类与文号、中央空管办监管服务平台、低空保险、空域分类与飞行规则、实施意见两大量化指标。","status":"完整","note":"依据原课程43页文本层核对。","sections":[{"title":"一、统计分类：把产业边界画清楚","text":"文件与文号：《低空经济及其核心产业统计分类（试行）》文号为发改低空〔2025〕1676号，由国家发展改革委发布。文号中的年份与发文机关是高频考点。\n总体架构：共 4 个大类、23 个中类、65 个小类；65 个小类中属于低空经济核心产业的为 10 个。\n四大类：低空制造业、低空运营业、低空基建与信息服务业、低空配套业。\n低空制造业：5 个中类、25 个小类。其中属于核心产业的是整机制造、器材及零部件制造、专用设施设备制造三类；材料制造不属于核心产业。\n低空运营业：5 个中类、12 个小类，即生产作业、公共服务、运输、消费及其他低空运营服务；5 个中类全部属于核心产业；低空经济的主要产值与经济价值主要来源于运营业；美团、顺丰在深圳开展的无人机物流属于低空运输。\n低空基建与信息服务业：含基础设施建设、基础设施配套建设、信息技术服务、飞行辅助活动四个中类；属于核心产业的是基础设施建设与飞行辅助活动；飞行辅助活动指航空器的起降、停放、空中交通服务等。\n低空配套业：8 个中类、13 个小类，全部不属于核心产业。中类包括低空科学研究和技术服务、低空装备检测服务、低空人才教育培训、低空金融服务等；飞行辅助活动不在配套业之列。\n易错边界：低空航空器及相关装备维修不属于低空运营业，而归入配套服务范畴；低空保险服务属于配套业的中类。\n编制目的：及时明确低空经济及其核心产业的概念和范畴、明晰产业边界，精准识别产业链上下游关联，为统计调查和研究分析提供依据，为把握运行态势、制定政策提供参考。\n为何要出台：回答\"全国一年到底生产多少架无人机\"时，工信部只能掌握备案厂家产量、海关只能掌握合法进出口数量、统计局没有完整口径、民航局 UOM 系统只有实名登记数量——这正是出台统一统计分类的直接动因。"},{"title":"二、信息通信业支撑低空基础设施的实施意见","text":"文件定位：五部门联合印发的《关于加强信息通信业能力建设支撑低空基础设施发展的实施意见》，是基础电信企业参与低空基础设施建设最直接的政策依据。\n2027 年两大量化指标：全国低空公共航路地面移动通信网络覆盖率不低于 90%；研制不少于 10 项信息类基础设施标准。两项指标须成对记忆。\n通信部署要求：面向 300 米以下低空航线沿线和低空应用热点区域部署 5G 移动网络；300 米以上空域和偏远地区通过卫星通信与地面移动通信多网融合提供覆盖，并非仅依靠卫星；探索低空专网提升覆盖与保障能力；利用现有铁塔、站址资源共享集约建设。\n信息类基础设施范围：包括低空通信、低空导航、低空监视、低空智能网联系统四类。\n智能网联系统的信息平台属性：低空智能网联系统作为信息平台，涉及的基础设施供给包括物联网、人工智能、算力；航空发动机属于航空器制造范畴，不在其列。\n具体举措：组织开展试验验证、提升产业供给能力、推动集约协同与标准化建设、优化频率供给。\n强化统筹联动：加强部门协同和部省联动，统筹网络部署、技术能力提升、应用场景培育、生态体系完善、安全保障强化等重点工作；各地通信管理局、工信主管部门、网信部门加强与地方行业主管部门沟通协调；指导基础电信企业有序开展设施建设、标准制定与信息服务。\n职责边界：行业管理部门（工信部、民航局）主要负责提出量化指标和标准，具体投资建设在发改条线。把两者混为一谈，是政策类题目的常见误判点。"},{"title":"三、低空飞行综合监管服务平台","text":"文件性质：国家级和省、市级低空飞行综合监管服务平台相关文件（1.0 版）由中央空管办发布；文件本身为密件，2025 年 11 月通过新华社消息对外披露摘要。\n名称之变：平台名由\"低空飞行一体化监管服务平台\"改为\"低空飞行综合监管服务平台\"，体现推动军用与民用航空器融合统一管理的意图。此前民航局 UOM 系统、《无人驾驶航空器飞行管理暂行条例》及民航局相关规章中多用\"一体化\"表述。\n四大特点：严控风险、全国一体、数据共享、科技赋能。\n数据共享的纵向与横向：纵向贯通国家、省、市三级平台；横向连接网信、发展改革、工信、公安、自然资源、应急管理、市场监管、气象、民航等部门有关系统。公开表述中未列入军航，这是需要留意的一处留白；讲解推测未写入的原因，可能是空管办认为自身代表部队，也可能是接入部队信息难以通过。\n科技赋能：增强基于大数据、大模型的空域规划、航迹预测、冲突预警、计划审批、飞行调配能力。\n三级构想溯源：\"国家—地区（省）—市\"三级体系并非中央空管办首次提出，2018 年民航局低空飞行服务保障体系建设中即已提出三级构想。"},{"title":"四、低空保险","text":"文号与强制要求：《关于推动低空保险高质量发展的实施意见》文号为发改低空〔2026〕123 号。依据《无人驾驶航空器飞行管理暂行条例》，从事经营性飞行活动的民用无人驾驶航空器\"应当\"依法投保责任保险，属强制而非鼓励。\n保险机制举措：鼓励低空企业将购买保险作为完善内部安全管理体系的重要组成部分；推动产业链链主企业通过保险协同上下游、降低产业链风险成本；支持中小企业运用保险增强创新发展的风险防御能力；鼓励使用微型、轻型无人驾驶航空器从事非经营性飞行活动的主体投保责任保险。\n数据基础建设：加快建设低空保险信息平台，探索与低空智能网联系统对接，鼓励保险行业与低空航空器制造、运营企业开展数据应用，为精准承保理赔、飞行监管、风险管理与事故处理提供数据支撑。"},{"title":"五、空域、飞行规则与监管体制","text":"空域审批主体：现行空域管理体制下，使用空域、申请航线由军队（空军）相关部门审批。地方发改部门、民航局空管系统、地方低空管理机构均不是审批主体。\n空域分类与飞行规则：按《国家空域基础分类方法》实行分类管理，其中 G 类、W 类为非管制空域；空域分类管理落地后，非管制空域可选用目视飞行规则（VFR）。飞行规则首先要匹配空域规则。我国目前尚未发布全国统一推广的目视飞行规则规范。\n经营与非经营的分类依据：经营类与非经营类飞行活动的明确分类依据是民航局 CCAR-92 部相关规章，不是统计分类或地方条例。\n风险分级分类管理：按应用场景运行风险实行分级分类管理的模式，最早由民航局于 2019 年提出，后逐渐被其他管理部门接纳；无人机超视距运营（如城市无人机物流）须按民航局特定运行场景体系开展风险评估。\n运行识别强制国标：2026 年 5 月 1 日起实施的国家强制性标准《民用无人驾驶航空器运行识别规范》，将运行识别分为广播式运行识别与网络式运行识别两类。\n数据融通的现实瓶颈：地方上没有任何一个委办局有权限统筹所有相关部门；地方拿不到部队的空域数据；地方难以获取民航的运营数据；空管体制机制改革节奏较慢、权责尚未理顺。\n因地制宜与硬性门槛：2024 年底以来低空经济发展的根本原则是因地制宜；相关基础设施文件对地方提出经济总量（GDP）和飞行量等硬性门槛要求，未达标项目难以获得核准。\n资金通道尚未明确：低空基础设施建设的资金细则（采用超长期国债还是地方专项债等）目前尚未明确，这是项目策划阶段必须留出的弹性空间。\n对空感知的现状：多地尝试在现有铁塔或信息基础设施上加装 5G 或 5G-A 设施，可实现对空约 30 米至 80 米左右空间的监测，覆盖高度有限。\n\"国家航空器\"概念：我国现行文件中尚未对\"国家航空器\"作出明确定义。历史上曾用以指代用于军事、海关和警察部门的航空器，但不能据此认为已有明确界定。"}]},{"number":2,"title":"第二章 我国低空经济标准化工作现状","short":"低空经济标准化工作现状","hint":"GB42590 与 GB46860 适用范围、GB46750 实施日与存量加装日、识别码结构与 21 项报送内容。","status":"完整","note":"依据原课程43页文本层核对。","sections":[{"title":"一、标准体系总体情况","text":"标准周期：强制性国家标准一般需 1 至 2 年（正常约 2 年），行业标准一般也需 1 至 2 年；不存在半年内完成或由企业自行决定周期的情况。\n现行强制性国标总量：低空经济领域现行强制性国家标准共 8 项，其中与无人机或低空经济密切相关的有 4 项，2026 年还将出台 3 项。\n行业标准分布：现行行业标准中，工业和信息化部 39 项、中国民航局 35 项、国家能源局 11 项、生态环境部 2 项。\n强制性国标的合法性前提：一项标准要成为强制性国家标准，必须有法律、法规或行政条例作为上位法支撑。这是理解\"为什么这几项能强制\"的关键。"},{"title":"二、四项核心强制性国家标准","text":"GB42590-2023《民用无人机系统安全要求》：2023 年发布，给予 1 年缓冲期，2024 年 6 月 1 日正式实施。是我国严格意义上第一部与无人机系统安全相关的强制性国家标准。适用范围为除航模以外的微型、轻型、小型民用无人机〔官方勘误：课程第5页原文漏“轻型”〕；中型、大型无人机的上市准入走民航局适航许可，不走该标准。标准包含 17 项细化安全要求，如电子围栏、远程识别、感知避障、数据链保护。\nGB46860-2025《民用无人机唯一产品识别码》：适用于微型、轻型、小型、中型、大型民用无人机整机产品的全生命周期管理。产品识别码结构为：制造商名称码（4 位）+ 产品型号 + 序列号（12 位）。上位法为《暂行条例》第九条。\nGB46750-2025《民用无人机系统运行识别规范》：2026 年 5 月 1 日正式实施。发送端须报送 21 项内容（含唯一产品识别码、位置、姿态、时间状态等）；坐标系类型以预留编码表示，WGS84 记为 1、大地 2000 记为 0，并预留 2 至 6；网络式运行识别至少使用蜂窝网络、地面有线网络或卫星网络之一；广播式须通过蓝牙 5.0 及以上版本或 WiFi 发送。上位法为《暂行条例》第二十四条。\nGB46761-2025《民用无人机实名登记和激活》：规定两套实名登记与激活流程：一套通过生产者系统（大疆、极飞等大厂须自建中间系统），另一套为 UOM 平台直联。"},{"title":"三、过渡安排与加装时限","text":"存量设备过渡：已具备广播式或网络式运行识别发送功能、但不满足《运行识别规范》指定条款内容的存量无人驾驶航空器系统，允许继续实施运行。\n加装时限（课程原文，公告条文待核）：课程称依据民航局 2026 年第 5 号公告，2026 年 11 月 1 日起，适用范围内的所有无人驾驶航空器系统需完成运行识别发送模块加装，确保同时具备广播式和网络式运行识别功能。\n实施日期勘误：官方发布说明明确，GB46750—2025与GB46761—2025两项标准均于 2026年5月1日正式实施。不能因为题干使用“正式施行”就改答11月。\n课程原文冲突留档：课程第6页原写“问实施/生效答5月1日，问正式施行/执行节点答2026年11月”。这是一条容易误导的答题技巧，修订稿不沿用；11月若涉及过渡安排，必须另核具体公告与适用范围。"}]},{"number":3,"title":"第三章 低空经济法律法规介绍","short":"低空经济法律法规介绍","hint":"国令 371 号、无人机执照与处罚金额、管制空域申请时限、事故报告时限、空域管理条例征求意见稿。","status":"完整","note":"依据原课程43页文本层核对。","sections":[{"title":"一、两部基础行政法规","text":"《通用航空飞行管制条例》：国令第 371 号，2003 年 5 月 1 日施行，是通用航空飞行管制的基础行政法规。注意令号与施行日期成对记忆，不要与无人机的 761 号混淆。\n《无人驾驶航空器飞行管理暂行条例》：国令第 761 号，2024 年 1 月 1 日施行，是无人机管理的基本行政法规，也是多项强制性国家标准的上位法依据。"},{"title":"二、登记与识别要求","text":"国籍标志：根据 CCAR-92，中华人民共和国民用无人驾驶航空器的国籍标志为罗马体大写字母 B。\n唯一产品识别码罚则：生产者未按规定设置唯一产品识别码的，处 3 万元至 30 万元罚款。这一额度区间在多处政策文件中与\"低空经济\"绑定出现，需与统计分类的文号区分。"},{"title":"三、违规与处罚","text":"外国无人机违规测绘：处罚包括：责令停止违法行为、没收违法所得和无人机、处 10 万元至 50 万元罚款；情节严重的，限期出境或驱逐出境。四项措施构成完整处罚链。\n飞行安全问题报告：导致飞行安全问题的，操控者应当在降落后 24 小时内向空中交通管理机构报告。"},{"title":"四、临时管制空域的公告时限","text":"重大活动：为保障国家重大活动划设的临时管制空域，应当在生效 24 小时前发布公告。\n紧急任务：为保障执行紧急任务划设的临时管制空域，应当在生效前 30 分钟发布公告。\n记忆方法：重大活动按\"小时\"计（24 小时），紧急任务按\"分钟\"计（30 分钟），两者相差两个数量级，是最容易被设计的干扰点。"},{"title":"五、空域基础分类与机场空域","text":"七类空域：《国家空域基础分类方法》将空域划分为 A、B、C、D、E、G、W 七类，其中 G 类、W 类为非管制空域。\n民用机场 B 类空域：按跑道构型划设：单跑道为半径 12 千米单环；双跑道为半径 15/30 千米双环；三跑道为半径 20/40/60 千米三环。\n法规层级主线：法律（民用航空法）—行政法规（暂行条例、通航管制条例）—部门规章（CCAR-92 等）—强制性国家标准，是判断\"某要求出自哪一层级\"的基本框架。"},{"title":"六、空域管理与城空中交通新规","text":"空域管理条例（征求意见稿）：2023 年 11 月国家空管委发布《中华人民共和国空域管理条例（征求意见稿）》，核心要点是明确提出空域用户定义，并提出空域用户的权利、义务规范。\n城空中交通导航标准：中央空管委《城市空中交通管理基础设施保障能力标准（试行）》（征求意见稿）：导航服务连续性应达到大于 97%。"}]},{"number":4,"title":"第四章 低空经济项目全生命周期管理","short":"项目全生命周期管理","hint":"需求边界书面确认与变更四步流程、风险四类应对、里程碑看板与延期升级、验收前测试报告四要素与验收技巧、故障处理完整闭环。","status":"完整","note":"依据原课程43页文本层核对。","sections":[{"title":"一、需求管理与变更控制","text":"需求边界必须书面确认：初始需求边界模糊且未形成书面确认，实施中客户不断加需求、改方向，最终会导致项目取消——不是简单延期，是最严重后果。\n新增需求第一步：客户以取消采购计划施压提出定制化需求时，第一步是逐项核实新增需求是否属于原有交付范围，不能直接拒绝，也不能立即组织开发。\n核实之后：完成范围核实与工作量评估后，接下来应协调商务团队介入开展商务谈判，而不是自行决定免费开发或直接排期。\n变更落地前提：所有新增内容须经双方书面或邮件确认达成一致后，方可组织推动落地实施。\n变更控制四步流程：申请—评估—决策—执行，顺序不可打乱；决策环节涉及商务介入、价格谈判、联合审批。"},{"title":"二、进度与计划管理","text":"硬件到货滞后：初验因硬件到货延期，对接供应商后的首要动作是明确硬件到货排期，而非换供应商或索赔。\n延期整改思路：对平台无法按期完成的功能项，可制定整改、替代或分期落地方案；初验延期后靠修订项目计划并争取客户确认完成初验。应对措施还包括：全面梳理问题根因与延期影响，及时向客户及内部做好风险同步，全程沟通书面留痕。\n站会规范：每日 15 分钟站会，同步阻塞问题；不是每周大会或月度评审。\n里程碑看板：关键节点可视化，红黄绿灯预警；不是记录纪要或算成本的工具。\n延期处理三原则：延期超规定天数需升级处理；主动告知客户并提供纠偏方案；杜绝隐瞒不报。先内部消化、追回进度再说的做法是错误的。"},{"title":"三、风险管理四类应对","text":"风险预测：AI 部署排期较长，提前协调客户确认算法种类并预留充足时间——这不属于风险转移。\n风险规避：发现某型号设备已停产，即刻发起设备替换申请更换为大疆对应设备。\n风险转移：方舱基建、网络、电力等施工安全风险通过外包转移给合作方；但外包转移后项目方并非不再承担任何安全管理责任。\n四类方式辨析：预测是提前布置留余量，规避是换方案绕开风险，转移是外包/保险，自留是接受后果。判断题常在\"属于哪类\"上设混淆点。"},{"title":"四、质量管理","text":"交付文档清单：需求规格、设计文档、概要设计、详细设计、测试报告、操作手册、验收报告、试运行报告、系统对接报告、完工报告、用户使用报告，均属要求的交付文档。\n系统层面质量要求：系统稳定、功能完整覆盖合同所有功能点、迭代版本可控、代码管理可追溯，四项齐备。\n需求评审参与方：技术团队、测试团队、交付团队、客户（对接对齐需求认知），客户必须参与。"},{"title":"五、硬件与软件实施方案","text":"硬件现场条件准备：浇筑安装基座，提前拉通网线电线；设备到货验收、协调备货。\n安装计划四节点：设备下单及备货（关键设备提前备货）→ 现场具备安装条件（电线网线基建等）→ 到货验收、厂家现场安装调测 → 接入平台测试飞行。\n软件实施两大块：标准平台部署 + 定制化开发；硬件基座浇筑和验收回款不属于软件实施方案（原文另有\"发货属于其他环节\"一句，疑为排版错位，暂录备查）。\n标准平台部署三步：协调服务器资源（按研发资源清单申请云资源或采购物理机）→ 研发部署标准平台 → 平台就绪后接入飞机开展测试飞行。\n定制化开发三步：现场需求调研（按合同标书范围细化需求功能点）→ 控制需求溢出，生成需求规格说明书 → 研发计划排期，按期开发并预留整体功能测试时间。"},{"title":"六、测试验收与收尾","text":"测试报告四要素：测试环境、用例清单、测试结果与遗留问题；项目投资概算不属于测试报告内容。\n验收推进技巧：提前沟通（提前确认验收标准、流程和演示内容）、主动汇报（定期汇报项目进展以建立信任基础）、验收预演（目的是问题前置，避免正式验收现场卡壳）。\n收尾归档范围：项目文档、系统资产、运维手册、培训材料均须归档；客户员工个人档案不属于交付成果。"},{"title":"七、运维管理","text":"经验总结价值：复盘得失、沉淀复用方法、实现组织能力迭代，不是应付检查。\n标准化故障响应：核心作用是压缩故障带来的业务中断时长。\n故障处理完整闭环：定位故障根因 → 实施修复处置 → 消除系统异常恢复业务 → 完成问题闭环；只恢复业务不做根因分析不达标。\n监控巡检定位：常态化监控与定期巡检实现的是运维风险的前置防控，不是等客户报障后的被动响应。\n运维目标：不仅是保障系统稳定运行，还包含服务质量的持续优化。"}]},{"number":5,"title":"第五章 中国电信低空经济体系全景介绍","short":"低空经济体系全景介绍","hint":"四大平台与配套产品谱系、星巡形态选择与飞服中心、通导监省专协同、机载前装后装、行业案例解法、电信差异化策略。","status":"完整","note":"依据原课程43页文本层核对。","sections":[{"title":"一、总体产品体系","text":"四大平台定位：星云管作业（低空飞行作业与场景应用）、星巡管监管（低空监管与飞行服务）、星瀚管设施（低空基础设施运营管理）、星盾管安全（低空侦测反制）。四者不是替代关系，而是按\"作业—监管—设施—安全\"四个层面组合交付。\n配套产品谱系：\n- 星瞰一网统飞平台——面向政府统筹多委办局作业\n- 天翼低空卡与 11700 专用号段——提供连接与身份\n- 天枢——后装终端\n- 天擎——前装 5G-RedCap 模组\n- 天驿方舱——起降与地面保障设施\n- 天翼星网平台——承担低空连接管理\n通导监一体能力：面向低空的通信、导航、监视三张网，提供\"规、建、运\"全生命周期能力，既可承接地方顶层规划，也可承担基础设施建设与长期运营，这是区别于纯软件厂商的核心差异。"},{"title":"二、星巡的形态选择与部署方式","text":"全国统一 SaaS 版：适用于项目前期，需要快速向领导演示基础态势、告警、台账能力。特点是投入低、开通快，先解决\"看得见\"的问题。\n专业版私有化或独立部署：适用于要求复杂业务流与业务联动、需要定制拓展、需要属地独立权限体系、要求精细三维模型与数据本地留存的常态化运行城市。四类诉求中任何一项突出，都应优先考虑专业版。\n星鸢乡村标品：面向乡镇与长尾市场。资金有限、需求简单、希望长期运营时，采用\"SaaS+标品\"先试用、后规模推广的路径，不宜直接建设大型私有化平台。\n选型判断顺序：先看业务复杂度（是否多部门联动）→ 再看数据要求（是否本地留存、是否涉密）→ 再看投资方式（一次性建设还是年度订阅）→ 最后看本地运维力量。这一顺序与投标方案的技术路线选择直接相关。"},{"title":"三、低空飞行服务中心的定位","text":"不是普通用户：飞服中心不只是监管平台的使用方，而是本地低空基础设施建设与场景应用拓展的运营枢纽。把它当作普通用户，会直接丢失后续基础设施与场景项目的空间。\n能力分期配置：早期以基础态势与台账为主；中期在既有能力上叠加运行类信息服务（如交通态势信息服务）；后期向空域风险评估、航空气象服务、运行环境信息服务等高阶服务延伸。前两类高阶服务属更后段能力，不宜在中期配置中提前列入。"},{"title":"四、星盾防护等级与要地防护","text":"等级与指标挂钩：防护等级按非合作目标的发现率等指标划分一、二、三级。发现率要求不低于 95% 时，对应一级防护。\n最小阵地参考配置：半径 2 公里级的星盾最小阵地，参考配置约 20 台设备。该口径可直接作为方案报价与设备清单的基准测算依据。\n电磁敏感环境：机场等电磁环境敏感场景，应优先选用低电磁干扰型的高精度侦测反制设备，避免干扰航空器正常运行。\n重大活动与庆典：核心打法是\"便携设备全域布防 + 动态录入白名单 + 关键环节增配移动反制设备 + 由星盾平台统一调度设备\"，追求快速部署、快速撤场。固定式设备全域永久部署不是推荐方案。"},{"title":"五、行业案例的解法","text":"山区林草：地形复杂、火情发现滞后，对应解法是构建空天地一体化多源感知预警机制；单纯增加固定摄像头或恢复人工巡检班组都不解决问题。\n港口（日照港）：已建多套飞控平台但数据不互通、外部无人机无法识别，采用\"星云+星巡+星盾\"组合，同时解决飞行调度、空域监管与低空安全防护，不是单选某一平台。面向港口类 B 端客户，软硬件组合还可包括低空无人机侦测反制平台、星云巡检平台、天枢终端与天擎模组、高倍变焦/红外/激光雷达等挂载，按场景搭配选用。\n痛点—能力映射：通信不稳→通信专网规划；定位不准→高精度定位服务；监视盲区多→多源感知组网；起降调度难→智能起降设施与云端调度。四类痛点既可单独设问，也可组合成一道多选，应答时一一对应。\n苏州低空\"一中心一平台\"：2024 年 10 月 18 日正式投入运行。公开运营成效包括：服务 143 家运营企业、接入 263 架航空器、年监测飞行超 34 万架次、企业服务满意度 96.32%。\n乡镇长尾市场：推广路径是\"SaaS+标品\"先试用后推广，与星鸢标品的定位一致。"},{"title":"六、机载产品与连接能力","text":"天擎前装模组：面向整机厂新机型，在生产阶段把 5G-RedCap 通信能力集成进去，契合\"新机必须网联\"的监管趋势。\n天枢后装终端：面向存量无人机，加装后获得 5G 传输、身份报送、远程控制与 AI 应用能力，实现低成本、快合规入网。\n两者差异：天枢面向后装、天擎面向前装集成，这是产品选型题最常见的分界点，不可混用。\n高精度定位：依托六分 3400 座地基增强站提供厘米级定位，解决\"定位不准\"的核心痛点；5G-A 感知站属于监视手段，不能替代定位基础设施。"},{"title":"七、通导监项目的省专协同分工","text":"报债审批期：属地电信牵头组织项目建议书与可行性研究，协助推进审批流程，是这一阶段的第一责任主体。\n建设招标期：属地电信主导投标、商务谈判与合同签订，并统筹本地设计、实施与网络优化资源；无人科技输出高质量投标技术方案，提供定制化解决方案与软硬件部署支撑。\n项目全周期意识：前期准备、规划设计、报债审批、建设招标四个阶段中，越早介入越能影响技术路线，招标期只是最后的窗口。"},{"title":"八、星瀚与5G智能网联业务","text":"一云统管的标准前提：星瀚要实现多类设施统一纳管，必须先统一数据标准、接口标准、通信标准、协议标准四类标准。\n纳管范围：星瀚可纳管低空通信站、起降设施、气象设施、定位设施等多类设施，不能理解为只管通信站。\n面向个人飞手的策略：初期在试点区域优先保障用户体验，并对优质内容创作给予推广激励；不搞全国同时全量开放。\n长期合作机制：低空 5G 智能网联业务不能只做一次性设备销售，须建立年费、流量池等长期合作机制，形成可持续收入。"},{"title":"九、深圳样板与电信差异化策略","text":"深圳基础设施规划：深圳市低空经济基础设施规划：未来 3 年新增 5G-A 通信基站 8000 个、通感基站 500 个——通信站与感知站数量是 8000 量级对 500 量级，不要记反。\n电信差异化策略：中国电信在低空经济竞争中确立差异化领先地位的关键策略：建设自主可控的低空基础设施，补齐\"通感一体\"硬件短板，将\"数据与平台优势\"转化为\"全域监管能力\"；不是靠价格，也不是只做软件。"}]},{"number":6,"title":"第六章 低空感知及低空通信","short":"低空感知及低空通信","hint":"感知手段分类、组网定位台数、高精度定位基础设施、分层覆盖与流量特征。","status":"完整","note":"依据原课程43页文本层核对。","sections":[{"title":"一、感知手段分类","text":"合作类目标：主动广播身份信息的合作类无人机，通过 RID 即可获取其详细信息（含身份、位置等），是区分\"合作/非合作\"的第一判断点。\n非合作目标：依靠光电、雷达、5G-A 通感等技术手段发现与跟踪，不依赖目标配合。\n组网定位：TDOA 频谱侦测至少 4 台组网；AOA 主流款需 4 台才能实现各方向定位，2 台不能直接输出经纬度；星盾多源融合接入 5G-A 通感、Remote ID、AOA、低空雷达四类数据。\n对空感知现状：在现有铁塔或信息基础设施上加装 5G 或 5G-A 设施，可实现对空约 30 米至 80 米左右空间的监测，覆盖高度有限。"},{"title":"二、定位能力","text":"高精度定位基础设施：依托六分 3400 座地基增强站提供厘米级定位，解决\"定位不准\"的核心痛点。\n精度指标：低空载人场景的定位精度要求优于 10 厘米。\n定位能力边界：ADS-B、5G-A、报文可给出绝对坐标；AOA 单站仅测向、多站交叉才可定位；激光提供相对测站的距离与角度。"},{"title":"三、通信基础认知","text":"分层覆盖：120 米以下城市区域复用现网基站；120 至 300 米沿航线与热点区域增强；300 至 600 米采用独立对空专用站；300 米以上与偏远地区以卫星与地面多网融合覆盖。\n流量特征：无人机典型流量特征是大上行、小下行，与地面传统业务正好相反。\n建设顺序：最小单元 → 区域样板 → 全域覆盖，反对\"先全域铺开\"。"}]},{"number":7,"title":"第七章 低空智能网联能力体系介绍","short":"低空智能网联能力体系介绍","hint":"合作与非合作目标感知手段、建设推进顺序、前装与后装两大市场路径、省专协同分工。","status":"完整","note":"依据原课程43页文本层核对。","sections":[{"title":"一、感知能力与场景指标","text":"合作类目标：主动广播身份信息的合作类无人机，通过 RID 即可获取其详细信息（含身份、位置等）。这是区分\"合作/非合作\"的第一判断点。\n非合作目标：依靠光电、雷达、5G-A 通感等技术手段发现与跟踪，不依赖目标配合。\n典型精度指标：低空载人场景的定位精度要求优于 10 厘米；城市区域 120 米以下低空通信优先复用现网基站，而非单独建专网。"},{"title":"二、建设推进顺序","text":"三步走：最小单元 → 区域样板 → 全域覆盖。这一顺序决定了投资节奏与方案分期，先全域铺开的做法不符合规律。\n最小单元的意义：以一个可独立运行的最小场景闭环验证能力与商业模式，再复制为区域样板，最后才谈全域覆盖。"},{"title":"三、前装与后装两大市场路径","text":"前装两大合作模式：一是与模组厂联合产品定义、集采降本；二是与整机厂分层签约、挂图作战。模组厂主要承担联合产品定义与前装供货。\n后装双路径：存量换新与外挂加装。存量客户追求\"低成本、快合规\"入网，首选外挂天枢终端；新增整机厂要满足\"新机必须网联\"的监管要求，首选前装预装天擎模组 + 低空卡。\n低空卡三大主线：前装抢入口、后装扩存量、行业树标杆。"},{"title":"四、省专协同与生态","text":"属地电信：承担客情、商机、投资，是区域市场的主体。\n无人科技：承担咨询、产品、方案，输出专业能力与交付支撑。\n集团侧：统筹号段资源与资费政策。\n生态伙伴：咨询规划方向的代表单位为苏交科，气象方向为南信大气象科技研究院等，共同构成\"规划—产品—实施\"的合作链。"},{"title":"五、项目阶段与资金合规","text":"四个阶段：前期准备期、规划设计期、报债审批期、建设招标期。运营商在不同阶段的介入深度不同，越靠前越能影响技术路线。\n专项债硬性要求：项目收益与融资自求平衡，构建的合规现金流须覆盖债券本息，不得随意设定收益水平。这是专项债项目的\"一票否决\"条件。"}]},{"number":8,"title":"第八章 低空+公安行业解决方案","short":"低空+公安行业解决方案","hint":"南京 1+1+22+N 架构、温州网格化布建成效、池州机舱点位、甘肃 5G 操控效能、连云港三网三平台。","status":"完整","note":"依据原课程43页文本层核对。","sections":[{"title":"一、标杆项目与架构","text":"南京公安：\"1+1+22+N\"架构中，\"22\"代表 22 套方舱，不是 22 个区县分局；该平台是市级公安多机型无人机统一管控平台，\"全国首个省级\"的表述不成立。\n南京平台六字诀：看、说、判、管、战、飞，六项构成低空网络指挥调度的核心能力闭环。\n连云港公安：低空警务融合作战平台是公安行业首个三网三平台架构的低空警务融合作战平台。\n池州交警：在 G50 沪渝高速池州段建设 5 个机舱点位，实现高速公路巡查自动化；\"7 个点位\"为错误口径。\n温州交管：网格化布建 10 套无人机机场。"},{"title":"二、量化成效","text":"甘肃：警用无人机实战管理平台依托 5G 超低延迟传输，将无人机操控效能提升 200%。\n温州成效：累计警告、处罚各类交通违法 4200 余起；劝离违停车辆 3600 余辆；巡查覆盖扩大 90%；指挥效率提升 70%；人力巡逻成本降低 60%。五项数据常被成组考查。\n温州 AI 空警：\"AI 空警\"模型在 2026 年全省公安交管大数据建模比武中获得\"城市交通精细治理\"赛道一等奖。"},{"title":"三、方案价值主线","text":"四条主线：多机型统一管控 + 网格化机场布建 + AI 模型赋能 + 指挥调度闭环，是警务方案区别于通用监管方案的四个支点。"}]},{"number":9,"title":"第九章 低空+应急行业低空解决方案","short":"低空+应急行业低空解决方案","hint":"精准投送即建网、三断场景空投基站、机载基站卫星回传链路、综合防灾应急仓、林草巡护功能。","status":"完整","note":"依据原课程43页文本层核对。","sections":[{"title":"一、核心定位与平台能力","text":"独有竞争力：\"精准投送即建网\"的本质是首创\"运输+通信\"双能力融合的无人机应急体系，实现\"物资投到哪，网络铺到哪\"。这不是靠基站密度或卫星电话免费发放能替代的。\n平台核心引擎：低空应急指挥调度平台构建\"感知—决策—指挥—行动\"一体化体系，核心引擎是无人设备管控，而非单纯的 5G 通信或 GIS。\n痛点归因：\"应急响应效率偏低\"主要源于指令流转层级多、跨部门协同链路长，任务与资源智能匹配及动态调派能力偏弱。\n自动接警：平台支持自动接警响应，不只支持人工接警后手动调派无人机。"},{"title":"二、三断场景与通信恢复","text":"三断场景的特殊性：通信、道路、电力均中断时，道路严重毁坏、人和车辆无法进入灾区，必须采用无人机空投基站等无人化方式恢复通信；不能等道路抢通后部署应急通信车，也不能靠铺野战光缆或仅恢复电力。\n通信链路设计：采用\"机载基站—高通量卫星—地面信关站—运营商核心网\"链路，核心设计逻辑是以高通量卫星为中继，解决机载基站在三断场景下无法通过地面链路回传核心网的问题。\n四大核心竞争力：全时全域通信底座（运输无人机搭载自研卫星便携站，空投后自动对星组网）；精准运力网络化（首创\"一机双投\"，实现人机协同救援闭环）；运营商级服务赋能（基于电信云原生架构构建运力与卫星带宽资源动态匹配算法）；量子加密传输 + 北斗三号短报文双保险。\n综合防灾应急仓：被称为\"全球首款\"，核心在于集合应急能源、通信及低空经济等功能于一体的智能综合防灾应急仓，不是单纯的集装箱仓库或无人机机库。"},{"title":"三、行业场景化配置","text":"城市消防航线：依据城市建模数据自动规划初始航线，到达火情附近后自动生成精细化航线进行火情侦查，全程非手动遥控、也非起飞前一次性固定航线。\n消防配置清单：软硬件配置包含多类机型，不只有复合翼无人机系统。\n水利与林草组合部署：重点区域部署多旋翼无人机实现 24 小时目标点位巡查，长距离大范围巡检接入复合翼无人机。\n林草巡护四项功能：全时域监测（可穿透烟雾、夜间作业）；AI 智能预警（深度学习烟火特征并结合气象数据预判火势）；极端环境适应（耐低温、续航时间长）；分秒级响应（支持极速快充）。"}]},{"number":10,"title":"第十章 低空+民生物流行业解决方案","short":"低空+民生物流行业解决方案","hint":"规划顺序（机型遴选→起降场→运力测算）、SaaS+起降场套装、飞行安全响应、梯次利用、生态渠道赋能。","status":"完整","note":"依据原课程43页文本层核对。","sections":[{"title":"一、概念与规划","text":"低空物流的定义：以无人驾驶航空器为运输载体、主要面向低空空域开展的物流配送活动。\n规划的顺序：项目规划最应先落实的是：结合业务载重与航程遴选机型、规范规划起降场、开展运力测算与航线验证；先买最大载重机型或先铺接驳柜都属于次序错误。\n快速上线的组合：3 个月内上线、初期预算有限、无自建服务器机房时，合理组合是\"开通 SaaS 账号 + 起降场套装\"，而非自研平台加自建机房或私有化部署。"},{"title":"二、平台化运营能力","text":"安全保障：飞行故障告警时自动推荐就近安全迫降点并支持动态改航，主要依赖平台数据支撑下的响应，不是事后日志复盘或地勤目视判断。\n集中管理：多机型、多场站集中管理且报表可用于专项补贴申报，最契合的方式是依托平台标准化运营数据集中上报，避免各场站单建系统或 Excel 手工统计。\n电池梯次利用：对退役电池开展梯次利用（如用于储能），主要价值是评估电池价值、降低整体运营成本，不是提升飞行速度或摄像头清晰度。\n盈利模式：借助现有政企渠道快速拓展工业与医药客户、打包输出一体化方案，属于生态渠道赋能型盈利增长模式。"},{"title":"三、政策支撑与运营闭环","text":"政策法规支撑：中央层面已相继出台近 200 项相关文件；\"低空经济\"先后被写入国家规划、中央经济工作会议部署和政府工作报告；新修订的《中华人民共和国民用航空法》以法律形式明确相关制度和标准；地方出台发展方向、专项资金等政策响应。\n运营闭环四要素：全流程数字化与实时监控、空域常态化合规运营、机队电池与场站的主动式运维、以数据驱动的复盘迭代机制。\n空域常态化：系统可实时同步民航管制通告，智能识别空域冲突风险并自动触发任务拦截或改航指令，减少人工监控疏漏。\n数据的双重价值：飞行日志与业务数据不仅用于满足监管合规要求，更是运营优化的重要依据。\n运营节奏：\"日监控、周复盘、月迭代\"的最终目标是推动业务从\"经验驱动\"向\"数据驱动\"转变。"}]},{"number":11,"title":"第十一章 低空+政务行业解决方案","short":"低空+政务行业解决方案","hint":"业务闭环与工单流转、统建分用、建设模式与收费方式、全栈自研与生态适配、首年预算归类。","status":"完整","note":"依据原课程43页文本层核对。","sections":[{"title":"一、四种建设模式","text":"政府统建：政府全额投资、统一建设运营，适合财政实力强、治理需求集中的地区。\n统建分用：平台统一建设、设备分置、任务分执。既统一平台与数据，又保留部门专业设备与任务执行职责；数据统管不等于设备必须归同一部门持有。\n政府+企业合作分成：适合产业基础好、市场化程度高、企业愿意投入技术与资金的城市。\n政警民融合：适合应急响应频繁、社会治理需求突出、由公安牵头多部门联动的区域。\n模式可组合：可结合地方财政实力与治理需求，将不同建设模式组合使用，不必拘泥单一模式。"},{"title":"二、需求统筹与业务闭环","text":"演示好、上线少的原因：上线后很少进入日常业务，最应优先检查是否嵌入委办局业务流程并落实长效运营，而不是扩充算法目录或增加演示飞行次数。\n一次飞行多部门成果：完整做法是统筹需求、加载场景 AI、共享成果并流转工单；不能只统一设备品牌后各自保存成果，也不能只开联合会议不调整任务。\n优先级与应急调度：已有常规排班时遇到紧急任务，应评估优先级、统筹资源，必要时启动应急调度，不能简单排队或直接用历史成果替代。\n合规前置：执行前须开展空域与航线合规校验，这是政务项目的合规底线。\n单次巡检服务多部门的支撑能力：多场景 AI 加载与切换、跨部门工单流转、统一汇聚数据并形成共享数据源，三项是直接支撑能力；仅增加同款备件数量不产生支撑作用。\n成果可追溯：需保留历史飞行记录、二三维模型、报告归档与全流程素材；只保存最终报告会丧失追溯与复盘能力。\n告警转化为治理成效：识别结果要与取证素材、坐标关联，派发责任部门工单并衔接处置，再用沉淀数据优化模型；只堆告警数量无法形成治理成效。"},{"title":"三、算法与平台能力","text":"算法可用性：算法库数量增加并不等于服务能力提升，必须打通\"算法上架—服务部署—业务使用\"三个环节。\n能力组合匹配：客户已有多个品牌设备、又要求定制化业务与政务数据安全时，应匹配\"多厂家兼容+自主研发+定制化部署\"的能力组合，不能强制替换品牌或回避数据要求。"},{"title":"四、四种计费方式","text":"按飞行时长收费：任务较分散、各次作业持续时间差异明显时，按飞行时长计费最能与实际飞行投入匹配。\n按飞行次数收费：内容相对固定的定期巡检、希望按完成的任务数量结算时适用。\n按服务套餐收费：客户希望把周期性巡检与数据分析作为一项完整服务统一采购时适用；套餐可以包含数据分析，不受\"只能含飞行作业\"的限制。\n按数据使用量收费：客户主要使用影像数据、不直接采购飞行作业、各期需求波动较大时适用。\n方式可组合：交通巡查、违建巡查、数据服务可以按任务特点采用不同收费方式，不必全项目统一。"},{"title":"五、收入路径与运营模式","text":"稳定收入路径：标准化服务供给并通过政府采购结算，是获得稳定政务巡检运营收入的适宜路径；只靠算法展示数量或设备一次性销售都不成立。\n数据要素运营：以合规数据空间为基础，提供查询、智能研判、定制模型等增值服务，采用单次计费或年度订阅。\"数据可用不可见\"绝不意味着可无条件公开原始政务数据。\n撮合交易运营：核心是规范交易与履约机制、按成交额收取服务费；配套需要供需智能匹配、交易流程与履约监管、资质核验、资金结算机制。\n成本摊薄：运营方成本上升而多部门仍在重复巡飞时，改进方向是共享巡检服务、优化统筹排班，而不是按部门拆单增加架次。"},{"title":"六、预算、验收与职责分工","text":"一次性建设口径：平台首次开发与 AI 集成、平台部署联调属于一次性建设投入。\n年度运营口径：设备维护与技术支持、日常巡查场景服务、应急保障属于年度运营成本。应急保障不能因已采购备用设备就省略。\n按效付费的验收指标：验收只看无人机架数与飞行总时长不符合按效付费，应增加数据质量、事件发现率等成果指标。\n政企分工：政府负责制定标准与考核细则、汇总需求并验收成果；企业负责保运行、交数据并优化方案。运营企业自行确定考核细则并自行验收，属于职责越界。\n全栈自研与生态适配：两者都包含一网统飞平台核心能力。全栈方案由无人科技负责集成、平台、设备及配套，属地负责专线或物联网卡；生态适配方案由属地采购生态设备并负责集成，无人科技提供平台服务。\n后向采购归属：生态设备的后向采购不由无人科技统一承担，这是两种方案在商务结构上的关键差异。\n运维责任：运维原则与交付分工绑定，\"谁签订政府合同谁承担所有运维\"的说法不成立。"},{"title":"七、方案组织与行业场景","text":"方案组织方式：市级客户需要统一管理、航线排期、场景算法与现有平台联动时，应围绕业务需求形成\"平台+算法+对接服务\"的组合，而不是按设备品牌组织目录。\n建设成效评估：评估共享飞行服务平台，最应关注资源共享、作业效率与业务协同水平是否提升，而不是平台数量或展示页面数量。\n违建处置链条：疑似违建需人工确认、历史影像比对、工单派发，形成完整证据链；只扩在线无人机数量或增加告警频次无效。\n环保场景：采用气体传感器进行移动采样，可用于污染源定位和扩散趋势分析。\n消防联动：城市消防的联动设计既包含现场侦查，也包含周边信息推送与多部门协同。"}]},{"number":12,"title":"第十二章 低空+农业农村低空解决方案","short":"低空+农业农村低空解决方案","hint":"投入产出比 1 比 5、七大差异化优势、三道防线、SLA 承诺、七天落地八步、客户高频五问。","status":"完整","note":"依据原课程43页文本层核对。","sections":[{"title":"一、商业模式与测算口径","text":"投入产出比：监管型低空方案的年订阅费约为被替代人力成本的五分之一，投入产出比 1 比 5 以上，这是向乡镇客户讲价值最有效的一句话。\n人力成本基准：按江苏公开数据，专职网格员人均年综合成本约 6 万至 12 万元，可作为测算基准。\n收入结构三块：平台订阅费、算法模块加购、一次性硬件销售。其中平台订阅费的续费属性最刚性，是长期收入的压舱石。\n硬件价格口径：大疆机场 3 套装（含 Matrice 4D）公开渠道参考价约 11.8 万元起；大疆司空 2 采用按量计费，直播 1 万分钟约 1599 元。两类价格是竞品比价时最常被引用的锚点。"},{"title":"二、差异化优势与交付能力","text":"七大优势关键词：信任、网络、算法、硬件、渠道、模式、闭环，七个词构成完整的能力拼图。\n收口一句话：功能可抄，体系难抄——这是应对\"第三方平台也能飞\"的最终话术。\n运维三道防线：第一道平台远程运维（解决大部分常见故障）；第二道属地化驻点服务（中通服及本地服务商上门）；第三道厂商原厂支持（深度维修与备件兜底）。题目常考\"第二道是什么\"。\n服务 SLA 承诺：7×24 小时线上技术支撑；设备故障 1 小时响应；重大故障 4 小时现场处置；运维成本打包进订阅费。不承诺整机终身免费换新。\n七天快速落地：八步流程，第一步是需求对接；其中专网开通与机巢安装调试可以并行安排以压缩工期。\n轻量化运营：乡镇侧运营不需要配备专职飞手，也不需要 3 名以上技术员，依靠平台与属地服务即可支撑。"},{"title":"三、政策降本与客户异议","text":"政策申报四条路径：机巢建设补贴（部分省份 30% 至 50%）、无人机整机纳入农机购置补贴目录、低空经济试点奖补、乡村振兴衔接资金。四条路径可叠加设计，降低地方实际支出。\n客户高频五问：「大疆飞机更便宜」「镇里没钱」「数据安全吗、拍到隐私怎么办」「飞机掉下来砸到人谁负责」「第三方平台也能飞」。五问分别对应价格、资金、安全、责任、替代五类异议，应答话术应成套准备。"}]},{"number":13,"title":"第十三章 低空+安防解决方案","short":"低空+安防解决方案","hint":"防护等级与最小阵地配置、虚警率漏警率口径、各类手段定位能力边界、融合引擎、反制手段局限。","status":"完整","note":"依据原课程43页文本层核对。","sections":[{"title":"一、指标与验收口径","text":"虚警率：行业主流的侦测虚警率验收口径为不大于1%，前提是探测次数不少于1000次且处于电磁净空条件。\n漏警率：厂商宣称漏警率不大于0.1%，其适用前提是仅针对已有数据库机型，不是对所有飞行器成立。\n项目级指标差异：军队采购文件对侦测成功率的典型要求为97%至99%；服务型项目的感知探测成功率要求通常低于设备级采购（如不低于90%）。口径差异直接决定验收能否通过。"},{"title":"二、定位能力边界","text":"可给出绝对坐标的手段：ADS-B、5G-A、报文解析可提供绝对坐标。\nAOA：单站仅能测向，多站交叉才可定位，单站不能直接输出绝对经纬度。\n激光：提供相对测站的距离与角度，属于相对定位。"},{"title":"三、融合引擎与航迹处理","text":"四类工程化手段：置信分数与权重打分、半范数门限筛选、卡尔曼滤波、匈牙利算法全局最优分配。\n航迹点关联：置信分数高于阈值的量测送入既有卡尔曼滤波通道；低于阈值的量测判定为新建目标。\n多目标匹配：多目标场景下量测与目标的全局最优匹配通常采用匈牙利算法。\n重复字段融合：同一目标的重复字段按“时间最近且置信度最高”的原则融合为单一目标档案，不是随机保留或全部并列。"},{"title":"四、反制手段的局限","text":"频谱压制的边界：对采用跳频开源协议链路（如ELRS）的穿越机，频谱压制难以奏效。\n报文诱导的边界：报文诱导（协议层反制）不能保证对市面所有机型成功迫降。\nRID与链路报文的差别：RID属于广播报文解析，与链路报文解析的关键差别在于是否依赖目标配合。\nSN 字段的可得性（课程第26页）：消费级与穿越机普遍不主动广播机身 SN，SN 不是各类设备都能直接获取的通用字段。"},{"title":"五、智能化演进与工程实现","text":"当前阶段：星盾产品当前处于\"全域覆盖·核心智能\"阶段。\n2029 年目标：\"跨域协同·生态引领\"，方向包括感知能力开放、身份标准输出、无人化自主研判。与当前阶段不重叠。\n孪生与智能体的分工：数字孪生解决\"看得懂\"，智能体解决\"干得快\"，两者功能不重叠。\n视频链路选型：网页端低延迟播放设备视频流，推荐链路为\"设备 → 流媒体平台 → WebRTC → 浏览器\"，避免浏览器直连设备或 RTSP 直连浏览器。\n处置闭环：反制设备毫秒联动、多手段协同调度、警力移动端打通、处置效果评估归档，四段构成完整处置链。"}]},{"number":14,"title":"第十四章 星巡低空监管平台卡位培训（含安装部署）","short":"星巡低空监管平台卡位培训","hint":"部署资源与网络端口、Nacos 配置与命名空间、巡检阈值与频次、发布策略与日志保留、安全端口管控与故障分级。","status":"完整","note":"依据原课程43页文本层核对。","sections":[{"title":"一、部署资源与网络","text":"服务器规划：数据库服务器最低配置 16C/32G/1T；平台需提供 2 个公网 IP，分别分配给应用服务器和图形渲染服务器。\n端口开通：数据库服务器远程端口开放通常为 22 端口；内网需开通 3306、8848、6379；应用侧还需 9001、8888 等。\n数据库服务器中间件：MySQL、Nacos、Redis；MinIO 不属于数据库服务器所需中间件。\n图形渲染资源：仅无法准备图形渲染物理服务器时，才开通云侧图形渲染服务器；客户要用 3D 精模做大屏展示，须另外准备一台物理 GPU 服务器。\nGPU 服务器信息：大屏地图资源配置需获取 GPU 服务器对外固定 IP 地址、工程 ID、实例 ID，不需要数据库密码。"},{"title":"二、Nacos 与核心配置","text":"Nacos 键配置：MQTT 默认用户名为 ctuav；MinIO 的 endpoint 默认端口是 9002；新建命名空间时命名空间 ID 最好与命名空间名保持一致。\nMQTT 配置生效：MQTT 配置修改后，需重启 system 服务，保证 Redis 缓存中数据更新。"},{"title":"三、巡检与阈值","text":"注册一致性：Nacos 注册服务数量必须与预期一致，不一致即为异常。\n巡检频次：每日晨检建议在业务低峰期 8:00 至 9:00 执行；深度巡检每周 1 次。\n资源阈值：CPU 使用率 ≤ 80%、内存使用率 ≤ 85%、磁盘使用率 ≤ 80%，三项配套记忆。\n巡检内容：服务器层检查 CPU、内存、磁盘使用率；Nginx 巡检四项：进程状态、端口监听、错误日志、访问 5xx 错误率；Nacos 巡检四项：服务状态、端口监听、注册服务数量、日志错误。\n巡检命令：非 docker 安装的 Nginx 检查进程状态用 systemctl status nginx；配置检查命令为 nginx -t。"},{"title":"四、发布与日志管理","text":"日志告警：系统日志检查发现新增 ERROR 必须关注排查，不属于正常现象。\n发布策略：滚动更新适用于常规版本迭代；蓝绿部署、灰度发布用于特定场景。\n重启脚本：restart.sh 中 java 命令设置时区参数 -Duser.timezone=Asia/Shanghai；执行时先 kill 进程再启动。\n日志级别：生产环境启用 ERROR、WARN、INFO，DEBUG 必须关闭。\n日志保留：Nginx 日志默认保留 90 天，Nacos 日志默认保留 30 天。\n服务启停规范：确认操作窗口、备份关键数据、通知相关方、停止上游调用方；业务应用重启执行 restart.sh 先 kill 再启。"},{"title":"五、安全管控","text":"禁公网暴露：MySQL 3306、PostgreSQL 5432 建议禁止公网暴露；Nacos 8848 建议访问来源仅内网；Nginx 80/443 是公网入口，需 WAF 防护，不能只做内网。\n高危漏洞响应：24 小时内评估、3 天内修复。"},{"title":"六、故障处理与易错口径","text":"故障分级：P0：系统完全不可用、核心业务中断、数据丢失；P2：局部功能异常、少数用户受影响、响应时间 30 分钟、解决时限 24 小时。（注：P1 级原文未提供）\n故障流程最后一步：定级 → 应急恢复 → 根因分析 → 改进措施，最后一步是改进措施。\n数据恢复：数据恢复操作会覆盖现有数据，不能直接执行，须先确认备份。\n数据库故障：MySQL 连接数满时应先检查连接池配置，不能直接重启数据库。\n大屏故障：大屏地图黑屏首先检查 GPU 服务器上实例是否被占用；飞渡服务地址打不开需检查对外映射的 TCP 和 UDP 端口是否通畅。\nNginx 故障：Nginx 502 Bad Gateway 不能简单归因于后端响应超时，需结合后端服务实际状态排查；静态资源 404 可能原因是文件路径配置错误；无法访问可能是进程未运行或端口冲突。"}]},{"number":15,"title":"第十五章 【星瀚】低空基础设施运管平台介绍与安装部署","short":"【星瀚】低空基础设施运管平台介绍与安装部署","hint":"平台定位与一云统管、两套部署方案与组件清单、docker与Harbor镜像仓库、K8S集群初始化、TiDB与PostgreSQL、Kuboard与Nacos端口、平台初始化与重启检查。","status":"完整","note":"依据原课程43页文本层核对。","sections":[{"title":"一、平台定位与核心能力","text":"系统定位：以全国测试场实战数据为基，锚定关键指标、孵化生态产品。星瀚不是单纯的运维工具，而是标准与生态的孵化载体。\n规建维优全生命周期：围绕公共航线管理形成规划、建设、运营、维护四个环节，各环节配置对应管理智能体；“怎么飞”对应的是建设环节与建设管理智能体。\nAI 运营管理智能体：具备多维数据建模与风险自主研判、仿真推演评估、策略自动生成与指令下发执行三项能力；不涉及用户密码管理类事务。\n权限配置要素：新增权限配置时必须填写权限代码、权限说明并选择所属域；三项均为必填。"},{"title":"二、端到端低空 IOT 与配套建设","text":"端到端方案环节：需求调研 → 系统建设 → 设备部署与运营实施，覆盖从需求到运营的完整链路。\n配套建设涵盖范围：需求调研与系统建设、测试场建设与设备性能验证、空域申请与设备安装调试、运营管理与使用反馈跟进。\n与基础设施的关系：低空基础设施建设重点不仅是基站建设，须与星瀚平台深度绑定；把二者割裂理解，是方案设计中的典型偏差。"},{"title":"三、政策与规划依据","text":"空域管理条例（征求意见稿）：2023 年 11 月国家空管委发布，核心要点是明确提出空域用户定义，并提出空域用户的权利、义务规范。\n城市空中交通基础设施保障能力标准：中央空管委《城市空中交通管理基础设施保障能力标准（试行）》（征求意见稿）要求导航服务连续性大于 97%。\n深圳规划指标：深圳市低空经济基础设施规划提出，未来 3 年新增建设 5G-A 通信基站 8000 个、通感基站 500 个。两者数量差一个量级，切忌互换。\n差异化战略：中国电信确立差异化领先地位的关键策略是：建设自主可控的低空基础设施，补齐\"通感一体\"硬件短板，把\"数据与平台优势\"转化为\"全域监管能力\"，而不是依靠价格战或只做软件。\n试点先行：可依托地方试点政策红利，在试点城市先行先试低空基础设施标准建设，并设计创新商业模式。"},{"title":"四、部署方案与组件","text":"两套硬件方案：3 台 K8S 高可用 + TiDB 单机 + GPU 渲染服务器，或 5 台 K8S 高可用 + TiDB 集群 + GPU 渲染服务器。\n组件清单：Ansible 自动化运维、Zookeeper 分布式协调、Redis 分布式缓存、Kafka 消息队列；MongoDB 不属于平台组件。\n灵活调度组件：nacos、minio、emqx、harbor 可灵活调度部署在 K8S 集群内任意节点。\n环境检查：部署前检查执行 cat /etc/os-release、uname -m、free -g；iptables -L -n 不属于环境检查命令。"},{"title":"五、前置准备与批量初始化","text":"数据盘挂载：业务数据盘建议挂载至 /app 目录；若挂载其他目录，后续部署命令需自行对应调整。\n主机清单：hostlist.txt 用于批量将主机指纹添加到本地 known_hosts；hosts 清单需填主机名称、ssh 密码、用户，MAC 地址不用填；非 22 端口在 ansible_ssh_port 字段指定。\ninit 脚本能力：批量安装 JDK 1.8、批量关闭 selinux 和防火墙；不能自动完成 K8S 集群初始化。\nCTyunOS 注意：该操作系统部署 zookeeper 集群前，需卸载原有 ansible 重装适配版本。"},{"title":"六、Docker 与镜像仓库","text":"daemon.json 三项：data-root 指定 docker 数据持久化存储目录（必须设在挂载目录下，放系统盘有占满导致崩溃的风险）；insecure-registries 配置 Harbor 地址（Harbor IP:11001，配错将无法拉取推送镜像）；exec-opts 指定 cgroup 驱动为 systemd。\n修改后必须 daemon-reload：编辑 daemon.json 后执行 systemctl daemon-reload 再重启 docker，直接启动不生效。\n其他要点：docker 与 docker-compose 可用 yum 直接安装；启动 docker 前在 /etc/sysconfig/docker 删除 --default-ulimit nofile=1024:1024；mariadb 用于执行 TiDB 数据库初始化脚本。\nrepo 源：先安装 createrepo 工具（非系统内置）；baseurl 配置 file:///opt/basecommon/；先用 mkdir bak && mv ./* bak 备份原有 repo 源避免冲突；repo 源配置错误会导致无法安装 docker 等组件。\nNginx 模块：安装 nginx 时还需安装 nginx-mod-stream 模块。"},{"title":"七、Harbor 镜像仓库","text":"部署要点：修改 harbor.yml 的 hostname 为本机 IP；http 部署需注释 https 配置段；修改 harbor_admin_password；配置 data_volume 数据持久化路径。\n镜像前准备：须先 docker login Harbor IP:11001 登录，打标签格式为 Harbor IP:11001/library/镜像名:latest。\n访问与重启：默认登录账号 admin；安装后浏览器访问 <http://IP:11001> 验证；ss -tunlp | grep 11001 确认是否启动；未启动则 cd /app/harbor && docker-compose up -d。"},{"title":"八、K8S 集群初始化","text":"所有节点必做：开 ip_forward（echo 1 > /proc/sys/net/ipv4/ip_forward）；swapoff -a 关闭 swap 并注释 /etc/fstab（swap 开启会直接影响 kubeadm 初始化）；导入 k8s-images.zip 镜像包（for 循环逐个 docker load）。\n版本：手册部署的 Kubernetes 组件版本为 v1.23.3。\nmaster 初始化后：mkdir -p $HOME/.kube 并复制 /etc/kubernetes/admin.conf 到 kube 配置目录、修改属主；用 kubectl -n kube-system edit cm kubeadm-config 修改 kubeadm-config；部署 kube-flannel.yaml 网络插件后，用 kubectl taint nodes --all node-role.kubernetes.io/master- 去除 master 污点。\n多 master 高可用：新增 master 前先把主节点 pki 证书同步过去，拷贝后删除 apiserver*、front-proxy-client*、etcd 目录下 peer*、server* 等无用证书（ca 根证书保留）；加入集群需携带 certificate-key 证书密钥参数。\n镜像版本：Kuboard 导入 yaml 创建服务时镜像版本号不匹配，容器启动失败，日志提示 ImagePullBackOff。"},{"title":"九、Kuboard 与中间件集群","text":"Kuboard：导入 kuboard.tar 镜像 docker run 启动；Web 访问端口 11007；初始账号 admin/Kuboard123；添加集群用 kubeconfig 方式，上传 master 节点 admin.conf 配置内容；KUBOARD_ENDPOINT 配置 <http://Kuboard> 所在服务器 IP:11007。\nTiDB：分集群部署和单机部署两种模式，inventory 填写方式不同；单机部署时 tiup 和 tidb_node01 填单机 IP，tidb_node02、tidb_node03 留空；默认端口 4000；初始密码为空，部署完成后必须修改；br restore 还原命令前用 tidb 用户操作；初始化前先建 lightdata_db 与 nacos 两个数据库。\nPostgreSQL：使用 postgis 镜像，先 docker load 导入（可 docker 直接运行，不必在 K8S pod 内）；初始化新增数据库名为 iot，加入 postgis 扩展；启动密码配置在 postgres-ubuntu-final.sh 脚本内。\nzookeeper/kafka/redis：部署集群时需修改 inventory 填写各集群节点规划 IP；重启后检查端口：zookeeper 对应 12181、13181，kafka 对应 5879，redis 对应 8520、8521。\nnacos：默认命名空间名称建议设为 iot；访问地址默认端口 30848（经 K8S NodePort 映射）。"},{"title":"十、Nginx 与平台接入","text":"控制台配置：nginx 配置 console.conf 中 /screeniot/home 地址调整为 Ansible 服务器的公网 IP；平台控制台默认账号 admin/1q1w3e4r#。\n设备接入：设备厂商配置好推送数据后，点击测试连接检查数据链路是否打通。\nFAQ 高频故障：主机名修改问题导致容器无法启动、kafka 消息堆积导致硬盘 100%、repo 源配置有误无法安装组件、镜像包名称版本不匹配导致容器无法启动。"}]},{"number":16,"title":"第十六章 基于天翼低空卡打造\"飞联网\"产品体系","short":"天翼低空卡打造\"飞联网\"产品体系","hint":"分层覆盖、11700 号段与商用节奏、切片与 QoS、五码合一、天翼星网平台三端。","status":"完整","note":"依据原课程43页文本层核对。","sections":[{"title":"一、覆盖策略与技术方案","text":"分层覆盖：120 米以下城市区域复用现网基站；120 至 300 米沿航线与热点区域增强覆盖；300 至 600 米采用独立对空专用站；300 米以上与偏远地区以卫星与地面多网融合覆盖。四层各自对应不同技术手段，不可跨层套用。\n3.5G 单载波地空异频：选出的对空基站仅开通第二载波，且该第二载波同时覆盖低空区域与地面区域。\n3.5G 双载波地空异频：在原有 AAU 上开通第二载波；采用 4+3 的 SSB 波束模式；地面用户优先驻留第一载波，实现地空分层承载。\n独立对空专用站：主要面向 300 至 600 米空域；可通过 5 至 30 度的天线机械角调整提升覆盖高度，机械下倾是关键参数。\n800 兆低空试点：采用与 2.1G 类似的双翼幅频天线，单站覆盖更远，但带宽低于 3.5G。\n5G-A 通感为何未全面纳入：26GHz 毫米波频段尚未发放、通信能力尚未放开，因此当前未在整体通信方案中全面介绍。无人科技已建设 5G-A 数据中台（AF 平台），并在多个省份试点承接感知数据。"},{"title":"二、号段、卡片与商用节奏","text":"11700 号段：13 位号段，总承载号卡规模 1 亿张；工信部明确同步向三家运营商发放。\n试点安排：各运营商选择 1 至 2 个不大于地市级的测试局点，常态化验证周期预计 3 个月。\n商用节奏：试点验证通过后，工信部着手电信侧 2000 万低空号码正式发行，天翼低空卡正式商用上线。\n存量纳管：中国电信存量无人机物联网卡（14109 号段）规模约 150 万张以上；通过在 1410950 至 1410954 物联网卡号段打\"智能远控\"标签实现纳管；三家运营商的存量迁移方案整体已报送工信部。\n迁移原则：必须保证无人机飞行和业务不中断、客户基本无感知，这是迁移方案设计的第一约束。\n迁移难点：多卡品迁移难题、新旧号段并存、业务不能停。部分旧版本 eSIM 不支持远程升级；贴片卡焊在硬件设备上无法换号；插拔卡可鼓励换新，但换新前需统一纳管。"},{"title":"三、网络保障、切片与计费","text":"切片号：低空专用切片为 1-040006，物联网全局切片为 1-080000，两个编号容易被互换设置。\n接入优先级：天翼低空卡暂按 5QI7 接入，相比普通物联网业务的 5QI9，接入优先级更高。\n核心网保障策略：5G 切片、多通道通信、虚拟专用网络、最低带宽保障。\n低空卡支持的能力：多 DNN 通道、VPDN 专用通道、高 QoS 等级、低空专用切片。\n专项验证维度：接入可靠性、切换流畅性、资源调度与 QoS 保障、数据传输性能。\n计费模式：采用独立的 B2B2C 实时计费，B2B 与 B2B2C 分离账单、可查明细，避免合并出账无明细的做法。\n高精定位增值服务：客户订购后平台为该号卡生成专属 RTK 账号，同步下发 AK、SK 及服务接入点信息；合作模式是把 RTK 服务耦合进通信资费，实现资费一体化出账，而不是让客户分别采购。\n量子安全加密：提供双重防护：应用层端到端加密（信源加密）+ 网络层 VPN 认证（信道加密）。"},{"title":"四、天翼星网平台与网联监管","text":"平台定位：天翼星网平台是对标天翼物联 5GCMP 的低空垂类连接管理平台。\n三端能力：客户侧（门户网站、卡管中心、资费管理、客服中心）、渠道商侧（B2B2C 平台）、政府侧（网联监管）。\n数据来源：集团 CRM 的订单受理与资料同步、物联核心网的卡资料数据、省 CRM 合账号码创建后的统一计费关联。集团正面向车联网、卫星、低空等高价值垂类推进数据分离，低空数据由星网平台集约化管理。\n五码合一：IMSI、卡号码（MSISDN）、模组IMEI、无人机SN码及工业互联网标识。\n三次核验：在初次入网、飞行前、飞行中三个关键场景自动推送并校验五码信息；与信通院低空联网无人机监管平台的对接同样围绕这三个场景。\n非专用号段监管：取数来源主要是核心网DPI数据与CDR话单；手段包括敏感区域限制、停机管控、切片准入拦截。\n研判模型流程：发现→识别→粗定位→处置。无人机场景的典型流量特征是大上行、小下行，与地面传统业务正好相反。\n终端适配：天枢终端已适配5个以上主流品牌、20款以上机型；天枢、天擎终端目前尚未支持卫星通信与地面通信一体融合。\n法规联动：新修订的治安管理处罚法（公安部起草）首次将无人机“黑飞”明确列为妨害公共安全的行为并给予处罚，为网联监管提供了处罚依据。"}]},{"number":17,"title":"第十七章 天翼星云平台介绍","short":"天翼星云平台介绍","hint":"五种航线与计划方式、成果库历史库驾驶舱归口、AI 作业闭环、流程中心审批、模型格式。","status":"完整","note":"依据原课程43页文本层核对。","sections":[{"title":"一、航线类型与适用场景","text":"五种航线：航点航线、面状航线、带状航线、斜面航线、巡逻航线。数量与名称要能准确说出。\n航点航线：可在航点上挂载动作，如自动开启 AI 算法、喊话器、拍照，适合\"边飞边执行动作\"的任务。\n面状航线：按预设范围自动完成覆盖式飞行，适合面积较大的施工区域、园区等周期性巡查。\n带状航线：沿河道、道路、管线等线性目标布设，解决长条区域的连续覆盖。\n巡逻航线：适合区域常态化巡逻，强调重复经过与动态发现。\n指点飞行：临时让无人机飞往地图指定位置查看，不需要提前创建完整航线，是\"应急看一眼\"的首选功能。"},{"title":"二、计划与飞行控制","text":"计划方式：单次定时、多次重复定时、不定时。每天固定时间对固定区域巡查应采用多次重复定时。\n驾驶舱飞行前设置：飞行前需完成飞行设置（含失联动作、返航高度、限高等），这是飞行安全的入口环节。\n云台控制：需要俯视地面目标时调整云台向下；此外还有变焦、锁定机头、云台回中三类常用动作。\n计划挂起：发现已配置的飞行计划不合理、需要紧急阻止下一次飞行，应使用\"挂起\"而不是删除，保留后续恢复的可能。\n飞行安全能力：失联动作设置、低电量预警、返航模式设置、飞行高度限制，四项构成平台侧的安全兜底。"},{"title":"三、功能模块归口","text":"成果库：统一查看某次飞行产生的照片、视频等作业数据；支持用历史图片进行二三维模型重建；支持在地图中加载成果、标注显隐、对比。\n目标点标注：AI 识别完成后，首先通过目标点标注确认识别出的目标位置；地图测距、视频截图、航线复制都不是确认目标位置的手段。\n历史库：下载 AI 飞行报告、回看上次飞行的全程历史视频。\n驾驶舱：除实时操控外，还承担实时建模功能。\n资产管理：新到设备在此完成注册。\n用户管理—移交：用户被注销时，通过\"移交\"功能统一完成设备、飞行计划的所属人变更。\n角色管理：控制不同角色的操作权限，例如普通人员可执行任务但不能分配账号权限。\n消息通知：系统发版通知、安全提醒、用户到期提醒。\n个人中心：查看平台套餐是否到期。\n作业中心：支持按周固定时间产出周报，是周期性报表的归口。\n流程中心：按科室配置不同审批流程，支持多级审批。\n工单中心：承接 AI 识别结果的派单与处置流转，是\"识别—处置\"闭环的落点。\n报告中心：管理报告模板与输出，与作业中心的周期报表区分。"},{"title":"四、算法、模型与流程组件","text":"模型格式：当前支持 osgb、b3dm 两种三维模型格式导入。\n算法并发：平台当前支持同时开启 3 个算法，不是 5 个也不是不限制。\n流程触发组件：事件触发、API 触发、手动触发。需要\"识别到火点后由管理员审核并自动执行\"时，用事件触发 + API 触发 + 手动触发组合，没有定时触发这一组。\n航线编辑：移动航点、修改航点位置、新增航点、删除航点，四种操作均可调整既有航线。\nAI 作业闭环：对目标进行识别 → 保存识别结果 → 生成 AI 识别报告 → 对识别成果进行汇总，四个环节缺一不可。\n全流程闭环：航线库（规划航线）→ 计划库（执行飞行）→ 成果库（查看成果）→ 历史库（复盘任务），这是理解星云模块分工的主线。"}]},{"number":18,"title":"第十八章 天枢产品硬件交付安装与运维","short":"天枢产品硬件交付安装与运维","hint":"S3 规格与适配清单、安装工序与 SIM 卡、注册流程与账号配置、平台拉取与下载日志的区别、指示灯分层排障。","status":"完整","note":"依据原课程43页文本层核对。","sections":[{"title":"一、产品规格与适配","text":"S3 核心规格：机载 NPU 算力 6 TOPS，支持不少于 10 种 AI 算法；六大核心功能亮点包含 5G 全网通通信、量子加密、边缘计算智能，不包含自动返航充电。\n适配清单：官方适配大疆、联合飞机、纵横等品牌；派诺特（Parrot）不在适配清单内。\n平台开放性：天枢 S3 并非只能对接天翼星云平台；其价值是突破传统无人机视距与通信距离的限制。\n支架不是万能：支持 PSDK/OSDK/USB/串口/网口/E-Port 的机型，并不能都用同一套快拆支架直接兼容。"},{"title":"二、安装工序","text":"安装位置：不同机型安装位置可能不同，需参考无人机说明书确认，不能默认全部底部或顶部安装。\nMavic 3E/3T：通过 E-Port 接口接入天枢 S3。\nM350 与 Mavic3 差异：最显著差异在接口类型与挂载方式（快拆支架对 E-Port）、安装位置不同；与 SIM 卡、开机通电无关。\n正确工序：先将挂载板安装于无人机上，再将天枢安装于挂载板上；不能跳过挂载板直接把快拆板贴在机身；用 M3 螺丝代替 M1.6 属于安装工序错误。\n螺丝与间距：M1.6 螺丝未拧紧会导致挂载板松动，飞行中可能脱落；使用时需保持距建筑物 4 米以上，避免无人机受周边障碍物影响。\nSIM 卡安装：插入后听到轻微的卡扣锁定声即判定已正确锁定；卡扣声并非装饰音效。"},{"title":"三、注册与账号配置","text":"账号来源：平台点击\"发送注册信息\"后，账号密码由运维人员配置，不是系统自动生成或无人机厂商发放。\n应规避的诱因：收到账号后未联系运维配置到天枢设备，是注册过程中应主动规避的故障诱因。\nSIM 卡未激活的后果：SIM 卡未激活或未开通数据业务时，设备上电后 5G 指示灯熄灭、平台无法注册设备、数据链路不可用；设备本身仍可启动。未激活状态下不可能完成平台注册。\n注册成功解锁：在资产管理-负载管理列表可见、日志可从平台侧拉取、可接收远程飞行控制指令；不会强制升级所有固件。"},{"title":"四、日志管理","text":"两个入口：平台拉取日志——资产管理→负载管理→天枢页面→【日志】按钮；下载日志——资产管理→日志管理→【下载】。日志入口不止一个。\n两者区别：平台拉取是通知天枢上传日志；下载日志是下载已上传完成的文件。功能不同，不是同一种操作。\n离线限制：天枢设备离线（未入网）时拉不到实时日志，长期无响应最可能是设备离线。\n日志价值边界：通过日志可初步判断网络注册失败原因、识别应用层错误与硬件异常链路；离线状态拉不到最新日志；日志不能替代现场硬件检测。\n日志页面可见信息：终端日志上传进度、已上传日志列表、下载按钮；看不到日志内容本身。"},{"title":"五、故障排查（分层判定）","text":"排查顺序：现场故障排查从 电源→SIM→网络→平台→业务负载 由下而上分层判定，不先拆机、不先换硬件。\n指示灯口径：WORK 灯熄灭 = 供电异常；WORK 常亮 + 5G 灯熄灭 + SIM 卡槽为空 = SIM 卡未插入；WORK 常亮 + 5G 常亮但平台负载管理查不到 = 账号配置错误；WORK、5G 全灭 = 无法开机，先检查连接线、电源接口、无人机端供电。\n供电正常网络异常：WORK 常亮 + 5G 熄灭，或 WORK 常亮 + 5G 常亮但平台查不到，指向网络侧异常。\n飞行中断网：5G 突然断网、实时图传中断，初判方向是 SIM 卡松动或信号覆盖不足。\n视频流异常：花屏且重启无法恢复，下一步是拉取 AI 日志与系统日志；信号薄弱区卡顿不能直接更换终端；也不是任何视频流异常都先重启设备和重登账号。\n远程协助时机：现场已用尽 Q\\&A 排查链仍无法定位、怀疑固件层或账号/平台侧深层问题、发现器件明显物理损坏，三种情境触发远程协助；SIM 未激活、接线松动这类现场可处理的不必上报。\n上报原则：并非任何现场无法处理的故障都立即上报；也并非所有故障都先拉日志再处理，应先按分层思路现场排查。\n日常养护：雨天飞行作业后应及时擦干设备。"}]},{"number":19,"title":"第十九章 平台用户手册（星云·星巡·星瀚合并）","short":"平台用户手册","hint":"租户与用户管理、平台初始化与界面本地化、大屏地图与MQTT配置、配置验证方法。","status":"完整","note":"依据原课程43页文本层核对。","sections":[{"title":"一、租户与用户管理（星云）","text":"租户创建：登录管理端web创建租户；租户端和数据库方式都不是正规入口。\n双因子认证：用户登录通过短信或邮箱实现双因子认证。\n手机号修改：租户端个人中心可改、管理端用户管理可改，异常情况下还可以用数据库修改作为逃生通道——三种途径都支持。"},{"title":"二、界面本地化（星巡）","text":"UI资源替换：初始化配置包含大屏标题图片更换、监管平台Logo更换、运营平台Logo更换三类。\n两类配置表：地图中心点配置在sys_config表；监管/运营平台登录页平台名称修改在sys_config_open表。\n大屏登录页名称：编辑../cim/dist/config/prod.js文件。\n大屏地图视角：浏览器控制台用__g._camera.get()获取当前视角配置；修改后还需同步修改sys_config表中config_key为bigscreen.*.location.page的配置项。\n大屏MQTT：修改sys_config表中config_key为*.mqtt.*的配置项；大屏无法接收无人机实时轨迹时，优先检查该MQTT配置。\n验证方法：地图中心点配置完成后，在监管/运营平台新建空域、航路航线、起降点，验证地图是否居中于目标城市。\n端口辨析：Nginx大屏前端端口不是18889；后端包wrkj-gateway.jar不是运营方网关服务；application-dev.yml中redis的host不应配置为应用服务器IP（应指向数据库服务器）。"},{"title":"三、平台初始化（星瀚）","text":"初始化功能范围：支持更换登录背景图片及LOGO、大屏配置本地化地图、设备接入管理配置；不支持自动扩容K8S集群节点。\nLOGO与背景更换：访问nginx服务IP:18888/admin，进入平台管理→文件菜单操作。\n本地化地图生效：修改dk-dist-config配置后，需重启dk-dist服务使配置生效。\n设备链路验证：设备厂商配置好推送数据后，点击测试连接检查数据链路是否打通。"}]},{"number":20,"title":"第二十章 平台运维手册（星云·星巡·星瀚合并）","short":"平台运维手册","hint":"星云平台架构与中间件依赖、部署形态与国产化适配、SSL 与端口安全、设备在线与视频问题排查。","status":"完整","note":"依据原课程43页文本层核对。","sections":[{"title":"一、星云平台架构与依赖","text":"数据库：后端服务使用 PostgreSQL，默认库名 nebula；nebula.cloud 库依赖 pgcrypto 加解密扩展；nebula 后端依赖 jdk21。\n中间件依赖：SnailJob 依赖 PostgreSQL；Seata 依赖 Nacos 和 PostgreSQL；流媒体依赖 MySQL 和 Redis；需要 MQTT 消息队列的是后端服务与建模服务（模型管理、二维建模、模型重建等）。\n关键配置文件：修改 docker 存储目录编辑 /etc/docker/daemon.json；中间件容器统一编排用 docker-compose.yml；数据库自动初始化由 Nacos 中 auto-table 配置项控制；搭建 Web 服务用 Nginx。\nNacos 鉴权：token 密钥需 Base64 编码且原始长度不低于 32 个字符；相关环境变量为 Nacos_AUTH_ENABLE、Nacos_AUTH_TOKEN、Nacos_AUTH_IDENTITY_KEY、Nacos_AUTH_IDENTITY_VALUE。\nMQTT 认证数据：认证用户存 cloud.mqtt_user 表，权限存 cloud.mqtt_acl 表；password 字段为明文密码加 salt 的 sha256 加密值。\n流媒体与模型：流媒体 web 管理界面登录端口 48080；模型管理服务推送的 MQTT topic 是 system/+/+/model/state；流媒体控制台可修改 SIP 端口、外网 IP、国标域、国标编码、认证密码。\n服务列表：后端服务全部部署完成后，Nacos 服务列表 DEFAULT_GROUP 应看到 8 个服务（nebula-sum、nebula-gateway、nebula-auth、nebula-business 等）。\n天翼云部署：支持 teledb for MySQL、teledb for PostgreSQL、Redis、RCC；teledb for PostgreSQL 创建后在 nebula 下建 cloud、job、seata 三个 Schema；依赖 PostgreSQL 的组件为 nebula 后端、snailjob、seata。"},{"title":"二、部署形态与国产化适配","text":"部署自由度：私有化部署不强制使用天翼云的 teledb、Redis、RCC 等云服务。\n适配清单：已适配海光 C86 服务器、银河麒麟操作系统、天翼云 CTyunOS 操作系统、天翼云 TeleDB 数据库、金仓 KingbaseES V8；建模服务不能全部使用鲲鹏 ARM 服务器部署。"},{"title":"三、SSL 与端口安全","text":"SaaS 暴露端口：作为 SaaS 平台对互联网暴露时，需开放 mqtt 连接端口、流媒体 rtmp 推流端口、流媒体 rtc 端口；Nacos 端口不对外。\nSSL 配置原则：配置 SSL 访问后，前端调用的各组件均需配置 SSL；EMQX 的 wss 配置是必须的，其他可选；流媒体 zlm 目录下需将 key 和 pem 合并为 default.pem；无人机视频播放（wvp-pro 及流媒体节点）也需相应配置域名和 https 端口。\n流媒体授权与录像：流媒体软件未授权时不能正常推流使用；录像下载鉴权功能建议开启；录像存储路径建议使用服务器绝对目录。"},{"title":"四、状态排查与常见故障","text":"时钟同步：多台服务器部署时，各服务器时钟必须保持一致；不需要操作系统版本、硬盘、CPU 一致。\n设备连接排查：无人机/机库连接平台失败，在 EMQX 组件排查设备连接情况；EMQX 控制台用户与 MQTT 用户是两套账号体系——控制台用户只登录控制台，mqtt 用户用于 mqtt 连接。\n设备不在线三因：设备 mqtt 连接失败、snailjob 定时任务执行失败、前端 ws 连接失败未能订阅到消息；流媒体 media 服务故障不属于不在线原因。\n无视频三因：设备连接流媒体网络故障、摄像头故障、流媒体服务故障；mqtt 连接失败不属于无视频原因。\n视频卡顿四因：设备网络上行带宽低、设备网络时延高、登录平台的个人电脑网络不好、跨运营商场景时延高丢包率高。\n服务异常处理：Nacos 注册中心服务数异常——到对应服务目录查看服务日志、结合崩溃日志分析，生产环境可先留存日志再重启服务恢复；不能直接清空数据库。docker 部署异常用 docker ps、docker stats 查看容器状态；服务器有其他容器服务与 docker 冲突时可卸载其他容器服务。\n主机资源命令：top 看 CPU、free -g 看内存、df -h 看磁盘、iostat 看 IO，均为常用检查命令。\n定时任务：平台通过 SnailJob 执行定时任务；设备连接成功但不在线，可能与 snail-job 定时任务执行失败有关。"}]}],"issues":[{"text":"GB42590适用范围包含微型、轻型、小型，旧提取文档漏列轻型；原题Q046及Q065解析已作显式勘误。","url":"https://jxw.shenyang.gov.cn/xyxx/202306/t20230606_4476204.html"},{"text":"GB46750、GB46761均2026年5月1日正式实施，不能按“实施/施行”措辞选择不同月份。原题Q059–Q061默认不入练习。","url":"https://www.shanghai.gov.cn/nw17239/20251211/a0652e9c4ab64e22a439d586a5b3826c.html"},{"text":"原题Q034概括性审批主体与Q226架构N解释存在依据边界，保留展示，默认不纳入练习。"},{"text":"课程中的商用阶段、产品参数、案例成效、价格与部署版本仅在课程语境下成立，不作为实时产品或生产环境操作依据。"}],"banks":[{"id":"advanced","name":"进阶应用 · 新500题","shortName":"进阶应用","description":"新增300单选 + 200多选 · 场景判断与综合应用","questions":[{"id":"N001","chapter":1,"type":"single","stem":"按学习指引，园区把“无人机维修收入”和“航线运输收入”全部计入运营业。复核报表时应采用哪种调整方案？","options":["保留维修收入在运营业，将运输收入调整到配套业","保留运输收入在运营业，将维修收入调整到配套服务范畴","两项都留在运营业，只修改备注","两项均调整为制造业"],"answers":[1],"explanation":"分类应按活动性质而非企业名称判断。运输是运营活动，航空器维修属于配套服务；同一家企业的收入也不能因此全部归为运营。","focus":"复合业务统计边界","difficulty":"应用","sourceSection":"一、统计分类：把产业边界画清楚","sourceEvidence":"易错边界：低空航空器及相关装备维修不属于低空运营业，而归入配套服务范\n畴；低空保险服务属于配套业的中类。","sourcePages":[1],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N001"},{"id":"N002","chapter":1,"type":"single","stem":"按学习指引，产业链清单同时列出“整机制造、材料制造、保险服务”。若只筛选其中的核心产业活动，应如何处理？","options":["纳入保险服务，其他两项均剔除","三项都与无人机有关，因此均纳入核心","只纳入材料制造，整机制造属配套","纳入整机制造，材料制造与保险服务不纳入核心筛选"],"answers":[3],"explanation":"与低空经济相关不等于属于核心产业。资料将整机制造列为制造业核心，而材料制造及配套业中的保险不属于核心。","focus":"相关产业与核心产业","difficulty":"应用","sourceSection":"一、统计分类：把产业边界画清楚","sourceEvidence":"低空制造业：5个中类、25个小类。其中属于核心产业的是整机制造、器材及\n零部件制造、专用设施设备制造三类；材料制造不属于核心产业。","sourcePages":[1],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N002"},{"id":"N003","chapter":1,"type":"single","stem":"按学习指引，地方用 UOM 实名登记数直接替代“本年无人机生产量”，再与海关进出口数相加，主要问题是什么？","options":["只需去掉海关数据，登记数即可准确代表产量","少加了一次登记数，补加即可","应把全部数据都改名为生产量","混用了登记存量、生产量与进出口量，应先统一统计口径和产业边界"],"answers":[3],"explanation":"登记、生产与进出口各自回答不同问题，不能简单相加。统一分类的意义是明确概念与边界，为调查分析建立一致口径。","focus":"统计口径校验","difficulty":"应用","sourceSection":"一、统计分类：把产业边界画清楚","sourceEvidence":"为何要出台：回答“全国一年到底生产多少架无人机”时，工信部只能掌握备案\n厂家产量、海关只能掌握合法进出口数量、统计局没有完整口径、民航局UOM系统\n只有实名登记数量——这正是出台统一统计分类的直接动因。","sourcePages":[2],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N003"},{"id":"N004","chapter":1,"type":"single","stem":"按学习指引，某方案把起降停放服务与飞手培训一并列为“低空配套业”。最合理的审核意见是什么？","options":["保留原分类，两项均属人才服务","两项全部调整为制造业","拆分：起降停放属于飞行辅助活动，培训属于配套业","仅将培训调整为运输业"],"answers":[2],"explanation":"起降、停放属于基建与信息服务业下的飞行辅助活动；人才教育培训属于配套业。两项均为服务，但其统计归口不同。","focus":"服务活动归口","difficulty":"应用","sourceSection":"一、统计分类：把产业边界画清楚","sourceEvidence":"低空基建与信息服务业：含基础设施建设、基础设施配套建设、信息技术服务、\n飞行辅助活动四个中类；属于核心产业的是基础设施建设与飞行辅助活动；飞行辅\n助活动指航空器的起降、停放、空中交通服务等。","sourcePages":[1],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N004"},{"id":"N005","chapter":1,"type":"single","stem":"按学习指引，研究报告写道：“运营业并非制造实体，因此不能作为低空经济核心产业。”哪项修订最符合资料？","options":["改成只有运输运营属于核心，其余运营均为配套","把全部运营收入并入材料制造后再判断核心属性","删除该结论，运营业五个中类均为核心，且是主要经济价值来源","保留该结论，仅把制造实体改称航空器"],"answers":[2],"explanation":"核心属性不能由“是否生产实物”判断。资料强调运营业五个中类全部属于核心，低空经济的主要产值和经济价值主要来源于运营。","focus":"产业价值与核心属性","difficulty":"应用","sourceSection":"一、统计分类：把产业边界画清楚","sourceEvidence":"低空运营业：5个中类、12个小类，即生产作业、公共服务、运输、消费及其\n他低空运营服务；5个中类全部属于核心产业；低空经济的主要产值与经济价值主要\n来源于运营业；美团、顺丰在深圳开展的无人机物流属于低空运输。","sourcePages":[1],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N005"},{"id":"N006","chapter":1,"type":"single","stem":"按学习指引，培训课件将发改低空〔2025〕1676号用于说明责任保险要求，又用发改低空〔2026〕123号说明统计分类。应如何校正？","options":["两个文号均改成国令第761号","合并为同一文件，两个文号互为简称","交换两份文号的对应主题，并分别核对分类与保险内容","只交换年份，保留两份文号的主题"],"answers":[2],"explanation":null,"focus":"文号与文件用途","difficulty":"应用","sourceSection":"一、统计分类：把产业边界画清楚","sourceEvidence":"文件与文号：《低空经济及其核心产业统计分类（试行）》文号为发改低空\n〔2025〕1676号，由国家发展改革委发布。文号中的年份与发文机关是高频考点。","sourcePages":[1,3],"sourceStatus":"课程43页全文核验","explanationStatus":"none","displayId":"N006"},{"id":"N007","chapter":1,"type":"single","stem":"按学习指引，项目以“2027年覆盖率92%、信息类标准8项”宣称两项量化目标均完成，审核结论应是什么？","options":["两项均完成，因为平均完成率足够","标准数量达标，覆盖率未达标","两项均未完成，因为必须达到100%覆盖","覆盖率达到资料目标，标准数量仍低于目标"],"answers":[3],"explanation":"两项指标分别考核，不能相互抵消。92%达到不低于90%的覆盖目标，8项仍少于不少于10项的标准目标。","focus":"双指标独立验收","difficulty":"应用","sourceSection":"二、信息通信业支撑低空基础设施的实施意见","sourceEvidence":"2027年两大量化指标：全国低空公共航路地面移动通信网络覆盖率不低于90%；\n研制不少于10项信息类基础设施标准。两项指标须成对记忆。","sourcePages":[2],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N007"},{"id":"N008","chapter":1,"type":"single","stem":"按学习指引，规划团队为城区低空热点与偏远高空航段设计同一种“仅卫星”方案。应优先怎样改进？","options":["只增加航空发动机采购量","所有航段都改成仅地面网络，不考虑偏远覆盖","按高度和区域分层，热点部署地面移动网络，偏远高空采用天地多网融合","维持仅卫星方案，删除热点区域需求"],"answers":[2],"explanation":"资料要求300米以下航线和热点部署5G移动网络，300米以上及偏远地区采用卫星与地面多网融合；不能用单一网络包办全部场景。","focus":"分层通信规划","difficulty":"应用","sourceSection":"二、信息通信业支撑低空基础设施的实施意见","sourceEvidence":"通信部署要求：面向300米以下低空航线沿线和低空应用热点区域部署5G移动\n网络；300米以上空域和偏远地区通过卫星通信与地面移动通信多网融合提供覆盖，\n并非仅依靠卫星；探索低空专网提升覆盖与保障能力；利用现有铁塔、站址资源共\n享集约建设。","sourcePages":[2],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N008"},{"id":"N009","chapter":1,"type":"single","stem":"按学习指引，一张预算表把物联网、算力、航空发动机都算成智能网联信息平台投入，并漏掉监视类设施。哪项组合调整最符合资料？","options":["只删除物联网，保留发动机并忽略监视","把算力改称发动机后，所有条目仍留在信息平台预算","将发动机移到航空器制造相关预算，并补核低空监视需求","只增加发动机数量即可补齐四类信息设施"],"answers":[2],"explanation":"发动机属于航空器制造，物联网和算力属于信息平台相关供给；同时完整信息基础设施包含通信、导航、监视和智能网联四类。修预算既要纠正归属，也要核对能力缺项。","focus":"采购归属与能力缺项联审","difficulty":"应用","sourceSection":"二、信息通信业支撑低空基础设施的实施意见","sourceEvidence":"智能网联系统的信息平台属性：低空智能网联系统作为信息平台，涉及的基础\n设施供给包括物联网、人工智能、算力；航空发动机属于航空器制造范畴，不在其\n列。","sourcePages":[2],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N009"},{"id":"N010","chapter":1,"type":"single","stem":"按学习指引，新建低空通信设施时，团队提出沿线全部另建铁塔、停止利用既有站址。哪种改进更符合资料的建设导向？","options":["先核对既有铁塔和站址可共享能力，再结合试验验证安排补建","只采购软件，不核对设施承载条件","取消标准化工作，以减少协同环节","只要是新业务就必须新建全部铁塔"],"answers":[0],"explanation":"集约建设强调利用现有铁塔和站址资源，共享并不等于完全不补建。还需结合试验验证和标准化，判断新增设施是否必要。","focus":"共享集约与验证","difficulty":"应用","sourceSection":"二、信息通信业支撑低空基础设施的实施意见","sourceEvidence":"通信部署要求：面向300米以下低空航线沿线和低空应用热点区域部署5G移动\n网络；300米以上空域和偏远地区通过卫星通信与地面移动通信多网融合提供覆盖，\n并非仅依靠卫星；探索低空专网提升覆盖与保障能力；利用现有铁塔、站址资源共\n享集约建设。","sourcePages":[2],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N010"},{"id":"N011","chapter":1,"type":"single","stem":"按学习指引，项目只部署通信接入和导航服务便宣称完整覆盖资料中的四类信息基础设施。最关键的缺项是什么？","options":["只缺低空通信，无其他缺项","航空发动机与整机装配线","低空监视与低空智能网联系统","保险理赔与飞手住宿"],"answers":[2],"explanation":null,"focus":"四类设施完整性","difficulty":"应用","sourceSection":"二、信息通信业支撑低空基础设施的实施意见","sourceEvidence":"信息类基础设施范围：包括低空通信、低空导航、低空监视、低空智能网联系\n统四类。","sourcePages":[2],"sourceStatus":"课程43页全文核验","explanationStatus":"none","displayId":"N011"},{"id":"N012","chapter":1,"type":"single","stem":"按学习指引，某地网络建设技术指标、应用场景、安全保障分别由不同团队推进，长期互不对齐。哪种纠偏方式符合资料？","options":["建立部门协同和部省联动，统筹网络、能力、场景、生态与安全重点工作","只要求一家设备商自行决定所有部门计划","仅检查网络设备数量，不再管理应用和生态","先取消安全保障要求以减少协同难度"],"answers":[0],"explanation":"资料的统筹联动覆盖网络部署、技术能力、场景培育、生态与安全。只优化单点设备采购，不能解决跨条线实施脱节。","focus":"跨部门统筹落地","difficulty":"应用","sourceSection":"二、信息通信业支撑低空基础设施的实施意见","sourceEvidence":"强化统筹联动：加强部门协同和部省联动，统筹网络部署、技术能力提升、应\n用场景培育、生态体系完善、安全保障强化等重点工作；各地通信管理局、工信主\n管部门、网信部门加强与地方行业主管部门沟通协调；指导基础电信企业有序开展\n设施建设、标准制定与信息服务。","sourcePages":[2],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N012"},{"id":"N013","chapter":1,"type":"single","stem":"按学习指引，市级平台只连接本市两个部门便称已实现“纵向贯通”。审核时应如何区分？","options":["只要有两个接口就是纵向贯通","应把部门接口全部删除后再谈数据共享","市级平台没有任何横向共享需求","这属于横向部门连接；纵向贯通还涉及国家、省、市三级"],"answers":[3],"explanation":"纵向按行政层级衔接，横向按部门系统连接。市内连接部门系统不能替代国家、省、市三级间的数据贯通。","focus":"纵横数据共享辨析","difficulty":"应用","sourceSection":"三、低空飞行综合监管服务平台","sourceEvidence":"数据共享的纵向与横向：纵向贯通国家、省、市三级平台；横向连接网信、发\n展改革、工信、公安、自然资源、应急管理、市场监管、气象、民航等部门有关系\n统。","sourcePages":[3],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N013"},{"id":"N014","chapter":1,"type":"single","stem":"按学习指引，平台已建数据汇聚看板，但尚无航迹预测和冲突预警。若下一阶段目标是体现“科技赋能”，应优先补哪项？","options":["利用大数据、大模型提升航迹预测、冲突预警等运行能力","只增加企业宣传介绍页","删去全部历史数据，仅保留人工电话登记","把看板背景换成三维动画即可"],"answers":[0],"explanation":"数据汇聚不自动等于科技赋能。资料强调将数据与模型用于空域规划、航迹预测、冲突预警、计划审批及飞行调配等能力提升。","focus":"数据到运行能力","difficulty":"应用","sourceSection":"三、低空飞行综合监管服务平台","sourceEvidence":"科技赋能：增强基于大数据、大模型的空域规划、航迹预测、冲突预警、计划\n审批、飞行调配能力。","sourcePages":[3],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N014"},{"id":"N015","chapter":1,"type":"single","stem":"按学习指引，运营商准备收费开展无人机配送，认为已购财产险便可不考虑责任保险。按资料，正确的审核处理是什么？","options":["只要购买任意险种，就可视为责任保险要求已满足","全部保险均属自愿，不必核查","只需为地面办公室投保","要求核对并依法落实经营性飞行的责任保险，不能用其他险种名称替代"],"answers":[3],"explanation":"资料对经营性民用无人驾驶航空器采用“应当依法投保责任保险”的要求。财产险与责任险的保障对象不同，不能仅凭已投保就认定满足。","focus":"经营活动保险核对","difficulty":"应用","sourceSection":"四、低空保险","sourceEvidence":"文号与强制要求：《关于推动低空保险高质量发展的实施意见》文号为发改低\n空〔2026〕123号。依据《无人驾驶航空器飞行管理暂行条例》，从事经营性飞行活\n动的民用无人驾驶航空器“应当”依法投保责任保险，属强制而非鼓励。","sourcePages":[3],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N015"},{"id":"N016","chapter":1,"type":"single","stem":"按学习指引，链主企业希望降低上下游创新与运营风险，仅要求每家企业分别保管纸质保单。更符合资料的改进方向是什么？","options":["把责任保险作为替代内部安全管理的唯一手段","让各企业只交换广告材料，不涉及风险数据","通过保险协同产业链，并推动保险数据与制造、运营数据应用对接","取消中小企业保险需求，仅保障链主自身"],"answers":[2],"explanation":"保险可纳入内部安全管理，并通过链主协同降低产业链风险成本；数据应用还能支持承保理赔、监管与事故处理，不能止于收集纸质保单。","focus":"产业链保险协同","difficulty":"应用","sourceSection":"四、低空保险","sourceEvidence":"保险机制举措：鼓励低空企业将购买保险作为完善内部安全管理体系的重要组\n成部分；推动产业链链主企业通过保险协同上下游、降低产业链风险成本；支持中\n小企业运用保险增强创新发展的风险防御能力；鼓励使用微型、轻型无人驾驶航空\n器从事非经营性飞行活动的主体投保责任保险。","sourcePages":[3],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N016"},{"id":"N017","chapter":1,"type":"single","stem":"按学习指引，城市配送方案把“属于运输统计类别”作为超视距运行风险评估的替代证明。最合理的审核结论是什么？","options":["只要统计为运输，就自动免除风险评估","产业统计分类与运行风险管理用途不同，仍应按特定运行场景开展风险评估","只要投保，就无需评估运行风险","改写为制造业后即可直接开展超视距配送"],"answers":[1],"explanation":"统计类别描述产业活动边界，不能替代飞行运行安全评估。资料明确城市无人机物流等超视距运营应按特定运行场景体系评估风险。","focus":"产业分类与运行合规","difficulty":"进阶","sourceSection":"五、空域、飞行规则与监管体制","sourceEvidence":"风险分级分类管理：按应用场景运行风险实行分级分类管理的模式，最早由中\n国民航局于2019年提出，后逐渐被其他管理部门接纳；无人机超视距运营（如城市\n无人机物流）须按民航局特定运行场景体系开展风险评估。","sourcePages":[4],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N017"},{"id":"N018","chapter":1,"type":"single","stem":"按学习指引，地方项目书承诺“建成平台后自然取得全部部门数据，资金渠道也已确定”。评审时最需要改成哪种表述？","options":["列明跨部门数据权限和接入约束，并对尚未明确的资金细则保留弹性","保留承诺，只删除平台建设时间","用统计分类文件替代资金和数据授权文件","所有数据直接向设备厂商购买即可"],"answers":[0],"explanation":"资料同时指出数据融通存在权限、军民航数据获取等瓶颈，建设资金细则尚未明确。项目策划应写清依赖条件，不能把平台技术能力当作数据授权。","focus":"项目依赖与策划弹性","difficulty":"进阶","sourceSection":"五、空域、飞行规则与监管体制","sourceEvidence":"数据融通的现实瓶颈：地方上没有任何一个委办局有权限统筹所有相关部门；\n地方拿不到部队的空域数据；地方难以获取民航的运营数据；空管体制机制改革节\n奏较慢、权责尚未理顺。","sourcePages":[4],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N018"},{"id":"N019","chapter":1,"type":"single","stem":"按学习指引，某区域拟沿用邻市投资规模，但本地飞行需求和经济条件明显不同。按资料，哪种下一步最稳妥？","options":["先评估本地经济与飞行量等条件，再因地制宜论证建设规模","只要邻市已建，就照搬设备数量","把飞行量估算删除，避免影响立项","先全量建设，再寻找需求证明"],"answers":[0],"explanation":"因地制宜要求建设方案与地方条件匹配。资料还提示相关文件存在经济总量、飞行量门槛，不能仅凭同类城市案例照搬规模。","focus":"因地制宜的立项判断","difficulty":"应用","sourceSection":"五、空域、飞行规则与监管体制","sourceEvidence":"因地制宜与硬性门槛：2024年底以来低空经济发展的根本原则是因地制宜；相\n关基础设施文件对地方提出经济总量（GDP）和飞行量等硬性门槛要求，未达标项\n目难以获得核准。","sourcePages":[4],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N019"},{"id":"N020","chapter":1,"type":"multi","stem":"按学习指引，产业分类复核发现若干项目“类别正确、核心属性错误”。以下哪些修订同时符合资料？","options":["把低空人才培训保留在配套业，不标为核心产业","把材料制造保留在制造业，但不标为核心产业","把航空器维修留在运营业，并标为核心产业","把低空运输保留在运营业，并标为核心产业"],"answers":[0,1,3],"explanation":"类别与核心属性应分别核对。材料制造和配套业培训不属于核心，运输属于核心运营活动；维修被划入配套服务，不能归为运营。","focus":"分类与核心双重核验","difficulty":"应用","sourceSection":"一、统计分类：把产业边界画清楚","sourceEvidence":"低空制造业：5个中类、25个小类。其中属于核心产业的是整机制造、器材及\n零部件制造、专用设施设备制造三类；材料制造不属于核心产业。","sourcePages":[1],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N020"},{"id":"N021","chapter":1,"type":"multi","stem":"按学习指引，编制“无人机制造与服务”统计表时，哪些做法有助于避免资料指出的口径混淆？","options":["区分飞行辅助服务与装备维修服务的分类","为制造产量与实名登记数量分别设定字段和定义","将海关进出口数直接命名为全国制造总量","以统一产业分类作为调查与分析的边界依据"],"answers":[0,1,3],"explanation":"统一分类解决概念和边界问题，不是把不同部门已有数字直接相加。登记、生产、进出口代表不同对象，维修与飞行辅助活动也有不同归口。","focus":"统计表结构设计","difficulty":"应用","sourceSection":"一、统计分类：把产业边界画清楚","sourceEvidence":"编制目的：及时明确低空经济及其核心产业的概念和范畴、明晰产业边界，精\n准识别产业链上下游关联，为统计调查和研究分析提供依据，为把握运行态势、制\n定政策提供参考。","sourcePages":[2],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N021"},{"id":"N022","chapter":1,"type":"multi","stem":"按学习指引，某方案拟以“覆盖率89%、标准12项”结题，并全部新建站址。哪些审核意见与资料相符？","options":["应评估复用既有铁塔和站址的可能性","标准数量超额，可以抵消覆盖率不足","覆盖率尚未达到不低于90%的目标","标准数量达到不少于10项的目标"],"answers":[0,2,3],"explanation":"两大量化指标独立判断，标准超额不能抵消覆盖率不足。共享集约建设还要求考虑利用现有铁塔、站址资源。","focus":"政策指标与建设路径","difficulty":"应用","sourceSection":"二、信息通信业支撑低空基础设施的实施意见","sourceEvidence":"2027年两大量化指标：全国低空公共航路地面移动通信网络覆盖率不低于90%；\n研制不少于10项信息类基础设施标准。两项指标须成对记忆。","sourcePages":[2],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N022"},{"id":"N023","chapter":1,"type":"multi","stem":"按学习指引，为避免只交付一批设备而忽视能力建设，实施计划应包含哪些资料明确提出的工作？","options":["试验验证和产业供给能力提升","把所有信息基础设施都归为航空器材料制造","集约协同与标准化建设","频率供给优化及跨部门协同"],"answers":[0,2,3],"explanation":"资料从验证、供给、协同、标准、频率与统筹多方面推进建设；把设施归为材料制造既不能提供这些能力，也混淆了产业边界。","focus":"实施举措组合","difficulty":"应用","sourceSection":"二、信息通信业支撑低空基础设施的实施意见","sourceEvidence":"具体举措：组织开展试验验证、提升产业供给能力、推动集约协同与标准化建\n设、优化频率供给。","sourcePages":[2],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N023"},{"id":"N024","chapter":1,"type":"multi","stem":"按学习指引，评估低空飞行综合监管服务平台的数据与智能能力时，哪些验收方向符合资料公开摘要的表述？","options":["验证航迹预测和冲突预警能力","以适航审定替代全部平台运行功能","验证国家、省、市之间的数据贯通","验证与公安、气象等部门系统的横向连接"],"answers":[0,2,3],"explanation":"公开摘要强调三级纵向、部门横向和大数据大模型赋能。适航审定不是资料列出的平台科技赋能功能，不能替代运行能力验收。","focus":"平台公开能力验收","difficulty":"应用","sourceSection":"三、低空飞行综合监管服务平台","sourceEvidence":"数据共享的纵向与横向：纵向贯通国家、省、市三级平台；横向连接网信、发\n展改革、工信、公安、自然资源、应急管理、市场监管、气象、民航等部门有关系\n统。","sourcePages":[3],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N024"},{"id":"N025","chapter":1,"type":"multi","stem":"按学习指引，培训讲义把“地方数据共享”简化为“建一个接口就能取得全部数据”。哪些修订能体现资料的边界意识？","options":["说明跨部门和军民航数据获取仍存在现实瓶颈","承诺任何市级平台均可无条件调取所有军航数据","区分技术接入能力与部门数据权限","把纵向层级贯通与横向系统连接分别说明"],"answers":[0,2,3],"explanation":"数据共享方向不等于数据权限已经打通。资料提示地方难以统筹全部部门，部分空域和运营数据也难以获取，应据实说明约束。","focus":"共享目标与现实约束","difficulty":"应用","sourceSection":"三、低空飞行综合监管服务平台","sourceEvidence":"数据共享的纵向与横向：纵向贯通国家、省、市三级平台；横向连接网信、发\n展改革、工信、公安、自然资源、应急管理、市场监管、气象、民航等部门有关系\n统。","sourcePages":[3,4],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N025"},{"id":"N026","chapter":1,"type":"multi","stem":"按学习指引，某企业既开展收费航拍，又组织微型、轻型无人机非经营性体验。按资料，保险方案应怎样区分？","options":["收费经营性飞行应依法落实责任保险","微型、轻型非经营性飞行的责任保险属于鼓励投保事项","所有活动都只需写“自愿购买”，无需区分性质","可将保险纳入企业内部安全管理体系"],"answers":[0,1,3],"explanation":"资料明确区分经营性飞行的“应当”与微型、轻型非经营活动的“鼓励”。同时，保险应与企业安全管理协同，而不是用一个自愿条款覆盖全部活动。","focus":"混合业务保险边界","difficulty":"应用","sourceSection":"四、低空保险","sourceEvidence":"保险机制举措：鼓励低空企业将购买保险作为完善内部安全管理体系的重要组\n成部分；推动产业链链主企业通过保险协同上下游、降低产业链风险成本；支持中\n小企业运用保险增强创新发展的风险防御能力；鼓励使用微型、轻型无人驾驶航空\n器从事非经营性飞行活动的主体投保责任保险。","sourcePages":[3],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N026"},{"id":"N027","chapter":1,"type":"multi","stem":"按学习指引，建设低空保险数据平台时，哪些需求能直接支撑资料提出的数据应用目标？","options":["用平台建设证明替代经营性责任保险投保","探索与低空智能网联系统对接","为事故处理和风险管理提供数据支撑","对接制造和运营数据，支持精准承保理赔"],"answers":[1,2,3],"explanation":"数据平台支撑承保、理赔、监管、风险与事故处理；对接技术系统不会自动替代应依法履行的责任保险义务。","focus":"保险数据应用闭环","difficulty":"应用","sourceSection":"四、低空保险","sourceEvidence":"数据基础建设：加快建设低空保险信息平台，探索与低空智能网联系统对接，\n鼓励保险行业与低空航空器制造、运营企业开展数据应用，为精准承保理赔、飞行\n监管、风险管理与事故处理提供数据支撑。","sourcePages":[3],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N027"},{"id":"N028","chapter":1,"type":"multi","stem":"按学习指引，某方案认为“非管制空域无需考虑飞行规则，也无需区分经营性质”。哪些审核意见符合学习指引？","options":["经营性与非经营性分类应查阅CCAR-92相关规章","只要标注低空运输统计类别，就等于完成运行合规判断","G、W的非管制属性不能替代具体运行条件判断","飞行规则首先应与空域规则匹配"],"answers":[0,2,3],"explanation":"空域属性、飞行规则、经营性质和产业分类是不同维度。非管制并不意味着不存在规则，统计分类也不能作为运行合规的替代材料。","focus":"多维运行规则辨析","difficulty":"应用","sourceSection":"五、空域、飞行规则与监管体制","sourceEvidence":"空域分类与飞行规则：按《国家空域基础分类方法》实行分类管理，其中G类、\nW类为非管制空域；空域分类管理落地后，非管制空域可选用目视飞行规则\n（VFR）。飞行规则首先要匹配空域规则。我国目前尚未发布全国统一推广的目视\n飞行规则规范。","sourcePages":[4],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N028"},{"id":"N029","chapter":1,"type":"multi","stem":"按学习指引，超视距物流项目前期评审，应保留哪些资料所强调的论证工作？","options":["结合地方条件论证经济总量、飞行量及建设必要性","按特定运行场景进行风险评估","仅凭“采用大模型”即可免除风险和条件论证","说明跨部门数据接入的权限与依赖条件"],"answers":[0,1,3],"explanation":"技术能力不能替代运行风险评估，也不能消除数据与立项约束。资料要求风险分级分类、因地制宜，并提示现实数据瓶颈。","focus":"项目评审约束组合","difficulty":"进阶","sourceSection":"五、空域、飞行规则与监管体制","sourceEvidence":"风险分级分类管理：按应用场景运行风险实行分级分类管理的模式，最早由中\n国民航局于2019年提出，后逐渐被其他管理部门接纳；无人机超视距运营（如城市\n无人机物流）须按民航局特定运行场景体系开展风险评估。","sourcePages":[4],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N029"},{"id":"N030","chapter":1,"type":"multi","stem":"按学习指引，拟采购“通信、导航、监视、智能网联”四类能力，哪些配置归属关系可以通过资料审核？","options":["将物联网和算力列入智能网联信息平台供给","通信覆盖方案结合高度、热点与偏远区域分层设计","将航空发动机从信息平台供给中剔除","用一项航空器材料采购替代四类信息基础设施"],"answers":[0,1,2],"explanation":"四类信息基础设施与航空器制造不同。平台侧可涉及物联网、AI、算力；通信方案还应遵循300米以下重点部署与偏远高空多网融合要求。","focus":"采购需求归属审核","difficulty":"进阶","sourceSection":"二、信息通信业支撑低空基础设施的实施意见","sourceEvidence":"智能网联系统的信息平台属性：低空智能网联系统作为信息平台，涉及的基础\n设施供给包括物联网、人工智能、算力；航空发动机属于航空器制造范畴，不在其\n列。","sourcePages":[2],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N030"},{"id":"N031","chapter":1,"type":"multi","stem":"按学习指引，按资料进行项目风险登记时，哪些事项应作为外部依赖或不确定条件显式管理？","options":["尚未明确的基础设施建设资金细则","地方难以获取的军民航空域和运营数据","认定一旦建成平台，所有外部条件都会自动满足","本地经济与飞行量能否满足相关门槛"],"answers":[0,1,3],"explanation":"资金、数据权限、地方条件都影响项目可行性，不能被一份建设合同消除。应逐项写明依赖与弹性，而不是作无依据的确定承诺。","focus":"外部依赖登记","difficulty":"应用","sourceSection":"五、空域、飞行规则与监管体制","sourceEvidence":"资金通道尚未明确：低空基础设施建设的资金细则（采用超长期国债还是地方\n专项债等）目前尚未明确，这是项目策划阶段必须留出的弹性空间。","sourcePages":[4],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N031"},{"id":"N032","chapter":2,"type":"single","stem":"按学习指引，设备编码表仅保存“4位制造商名称码+12位序列号”，并称已完整实现产品识别码结构。应补哪项？","options":["产品型号字段，并保留制造商名称码和序列号","将序列号改成用户手机号即可","再重复一次制造商名称码即可","删除制造商名称码，只保留型号"],"answers":[0],"explanation":"唯一产品识别码由制造商名称码、产品型号和序列号组成，三个部分作用不同。只满足两个长度要求仍不代表结构完整。","focus":"产品编码结构验收","difficulty":"应用","sourceSection":"二、四项核心强制性国家标准","sourceEvidence":"GB  46860—2025《民用无人机唯一产品识别码》：适用于微型、轻型、小型、\n中型、大型民用无人机整机产品的全生命周期管理。产品识别码结构为：制造商名\n称码（4位）＋产品型号＋序列号（12位）。上位法为《暂行条例》第九条。","sourcePages":[5],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N032"},{"id":"N033","chapter":2,"type":"single","stem":"按学习指引，销售团队称“整机卖出后，唯一产品识别码不再需要用于管理”。哪项交付要求最能纠正这一误解？","options":["每次维修后都删除原识别码","把识别码作为整机全生命周期标识保留，不能仅视为出厂销售编号","仅为中大型设备保留识别码，其他整机不管理","交付时由每位用户随机重写制造商名称码"],"answers":[1],"explanation":"资料明确唯一产品识别码面向各类民用无人机整机的全生命周期管理。交付后仍有登记、运行、维护等环节，不能在售出时丢弃标识。","focus":"标识的生命周期","difficulty":"应用","sourceSection":"二、四项核心强制性国家标准","sourceEvidence":"GB  46860—2025《民用无人机唯一产品识别码》：适用于微型、轻型、小型、\n中型、大型民用无人机整机产品的全生命周期管理。产品识别码结构为：制造商名\n称码（4位）＋产品型号＋序列号（12位）。上位法为《暂行条例》第九条。","sourcePages":[5],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N033"},{"id":"N034","chapter":2,"type":"single","stem":"按学习指引，测试记录将WGS84标为0、大地2000标为1，且只检查位置数值未核对坐标系类型。应怎样整改？","options":["只把所有坐标数值乘以10","保留错误映射，只更改报告标题","纠正坐标系类型映射，并把类型与位置一起核验","两个坐标系都写成未指定编码即可"],"answers":[2],"explanation":"资料规定WGS84类型编码为1、大地2000为0。位置与坐标系类型必须对应，单看坐标数值不能判断报文语义是否正确。","focus":"坐标语义联调","difficulty":"应用","sourceSection":"二、四项核心强制性国家标准","sourceEvidence":"GB  46750—2025《民用无人机系统运行识别规范》：2026年5月1日正式实施。\n发送端须报送21项内容（含唯一产品识别码、位置、姿态、时间状态等）；坐标系\n类型以预留编码表示，WGS84记为1、大地2000记为0，并预留2至6；网络式运\n行识别至少使用蜂窝网络、地面有线网络或卫星网络之一；广播式须通过蓝牙5.0及\n以上版本或WiFi发送。上位法为《暂行条例》第二十四条。","sourcePages":[5],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N034"},{"id":"N035","chapter":2,"type":"single","stem":"按学习指引，某网络式识别方案使用卫星网络，但评审意见认为“必须另有蜂窝网络，否则均不合格”。按资料应如何复核？","options":["网络式必须同时使用蜂窝、有线和卫星三种网络","卫星网络仅能作为蓝牙广播方式","网络式至少采用所列网络之一，不能仅因未用蜂窝网络就否定卫星方案","网络式只能使用蜂窝网络"],"answers":[2],"explanation":"资料对网络式采用“至少使用蜂窝、地面有线或卫星网络之一”的表述。可选网络不能误读为全选，也不能把某一选项写成唯一技术路径。","focus":"识别网络选择约束","difficulty":"应用","sourceSection":"二、四项核心强制性国家标准","sourceEvidence":"GB  46750—2025《民用无人机系统运行识别规范》：2026年5月1日正式实施。\n发送端须报送21项内容（含唯一产品识别码、位置、姿态、时间状态等）；坐标系\n类型以预留编码表示，WGS84记为1、大地2000记为0，并预留2至6；网络式运\n行识别至少使用蜂窝网络、地面有线网络或卫星网络之一；广播式须通过蓝牙5.0及\n以上版本或WiFi发送。上位法为《暂行条例》第二十四条。","sourcePages":[5],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N035"},{"id":"N036","chapter":2,"type":"single","stem":"按学习指引，厂商提交“蓝牙4.2广播+蜂窝网报送”的识别设计。就资料明确列出的广播传输要求，最应改哪一项？","options":["仅增加报文数量，保留广播传输版本","把产品型号字段删除，减少广播数据量","把广播链路升级为蓝牙5.0及以上，或采用WiFi","删除蜂窝报送，把蓝牙4.2改名为网络式"],"answers":[2],"explanation":"广播式通过蓝牙5.0及以上或WiFi发送。网络式链路存在并不能自动补足广播链路的版本要求，应分别核验两类技术定义。","focus":"广播链路技术复核","difficulty":"应用","sourceSection":"二、四项核心强制性国家标准","sourceEvidence":"GB  46750—2025《民用无人机系统运行识别规范》：2026年5月1日正式实施。\n发送端须报送21项内容（含唯一产品识别码、位置、姿态、时间状态等）；坐标系\n类型以预留编码表示，WGS84记为1、大地2000记为0，并预留2至6；网络式运\n行识别至少使用蜂窝网络、地面有线网络或卫星网络之一；广播式须通过蓝牙5.0及\n以上版本或WiFi发送。上位法为《暂行条例》第二十四条。","sourcePages":[5],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N036"},{"id":"N037","chapter":2,"type":"single","stem":"按学习指引，采购验收只检查每台设备的唯一产品识别码，就签署“安全要求、运行识别、实名登记全部合格”。审核应指出什么？","options":["有编码就不再需要运行识别报文","实名登记与激活等同于检查编码长度","四项标准对应不同对象，编码核对不能替代安全、动态报送及登记激活的验证","编码合格必然代表17项安全要求均已实现"],"answers":[2],"explanation":"安全要求、唯一产品识别码、运行识别、实名登记与激活各有独立内容。一个静态标识检查不能代替其余环节的功能与流程验证。","focus":"四项标准的验证分工","difficulty":"进阶","sourceSection":"二、四项核心强制性国家标准","sourceEvidence":"GB  46761—2025《民用无人机实名登记和激活》：规定两套实名登记与激活流\n程：一套通过生产者系统（大疆、极飞等大厂须自建中间系统），另一套为UOM平\n台直联。","sourcePages":[5,6],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N037"},{"id":"N038","chapter":2,"type":"single","stem":"按学习指引，一家生产者选择通过自建系统办理实名登记和激活，验收方却要求所有设备必须绕过生产者系统直连UOM。按资料，最合理的处理是什么？","options":["用飞手培训记录替代两套登记流程","立即否定生产者系统路径，因为标准只允许直联","按两套流程分别核验，不能把UOM直联误作唯一允许路径","只检查销售合同，不再验证登记激活"],"answers":[2],"explanation":"资料规定生产者系统与UOM直联两套流程。验收应确认所选路径的流程完整性，不能自行把双路径要求缩减为一种。","focus":"登记激活路径验收","difficulty":"应用","sourceSection":"二、四项核心强制性国家标准","sourceEvidence":"GB  46761—2025《民用无人机实名登记和激活》：规定两套实名登记与激活流\n程：一套通过生产者系统（大疆、极飞等大厂须自建中间系统），另一套为UOM平\n台直联。","sourcePages":[6],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N038"},{"id":"N039","chapter":2,"type":"single","stem":"按学习指引，合规矩阵把产品识别码要求挂到《暂行条例》第二十四条，把运行识别要求挂到第九条。应如何整改？","options":["两项都挂到国籍标志B的要求","法条可任意选择，不影响合规追溯","将两项上位法条映射对调，并保持各自标准对应内容","只改标准名称，不改法条对应"],"answers":[2],"explanation":"按资料，第九条对应唯一产品识别码，第二十四条对应运行识别。要求、标准、法条之间应准确映射，不能只附一份法规名称就视为完成追溯。","focus":"标准法条追溯矩阵","difficulty":"进阶","sourceSection":"二、四项核心强制性国家标准","sourceEvidence":"GB  46860—2025《民用无人机唯一产品识别码》：适用于微型、轻型、小型、\n中型、大型民用无人机整机产品的全生命周期管理。产品识别码结构为：制造商名\n称码（4位）＋产品型号＋序列号（12位）。上位法为《暂行条例》第九条。","sourcePages":[5],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N039"},{"id":"N040","chapter":2,"type":"single","stem":"按学习指引，投标承诺“企业自行决定六个月内形成强制性国标，且无需上位法依据”。哪个修订最合理？","options":["保留企业自行决定国标效力的表述","区分企业实施计划与标准制定程序，并核对上位法支撑及一般制定周期","把企业内部规范直接命名为强制性国家标准","只把六个月改成五个月以突出效率"],"answers":[1],"explanation":"资料说明强制性国标通常需1至2年，并有法律法规等上位法支撑。企业可制定内部交付计划，但不能自行决定国家标准的制定程序和强制效力。","focus":"标准立项承诺审核","difficulty":"应用","sourceSection":"一、标准体系总体情况","sourceEvidence":"标准周期：强制性国家标准一般需1至2年（正常约2年），行业标准一般也\n需1至2年；不存在半年内完成或由企业自行决定周期的情况。","sourcePages":[5],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N040"},{"id":"N041","chapter":2,"type":"single","stem":"按学习指引，审校资料表中四部门行业标准数量分别为39、35、11、2项。哪项分析结果计算正确？","options":["四部门合计87项，能源局比生态环境部多13项","四部门合计87项，工信部比民航局多4项","四部门合计85项，民航局比工信部多4项","四部门合计65项，工信部与民航局数量相同"],"answers":[1],"explanation":"按资料数字计算，39+35+11+2=87，39−35=4。题目要求检查汇总和比较，不能把某部门数量或其他分类的总数直接当作合计。","focus":"标准数量汇总校验","difficulty":"应用","sourceSection":"一、标准体系总体情况","sourceEvidence":"行业标准分布：现行行业标准中，工业和信息化部39项、中国民航局35项、\n国家能源局11项、生态环境部2项。","sourcePages":[5],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N041"},{"id":"N042","chapter":2,"type":"single","stem":"按学习指引，报文测试报告写“已发送唯一产品识别码，所以已覆盖21项运行识别内容”。应怎样补测？","options":["把实名登记申请次数增加到21次","按内容清单逐项核对位置、姿态、时间状态等字段，不以一个字段替代全清单","仅统计报文总字节数，不核对语义","把识别码重复发送21次即可"],"answers":[1],"explanation":"21项指发送内容要求，并非报文次数或字段重复次数。唯一产品识别码只是其中一项，位置、姿态、时间状态等仍应核对。","focus":"运行识别内容完整性","difficulty":"应用","sourceSection":"二、四项核心强制性国家标准","sourceEvidence":"GB  46750—2025《民用无人机系统运行识别规范》：2026年5月1日正式实施。\n发送端须报送21项内容（含唯一产品识别码、位置、姿态、时间状态等）；坐标系\n类型以预留编码表示，WGS84记为1、大地2000记为0，并预留2至6；网络式运\n行识别至少使用蜂窝网络、地面有线网络或卫星网络之一；广播式须通过蓝牙5.0及\n以上版本或WiFi发送。上位法为《暂行条例》第二十四条。","sourcePages":[5],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N042"},{"id":"N043","chapter":2,"type":"single","stem":"按学习指引，安全设计评审中，方案只描述数据链加密，却声称电子围栏和感知避障均可因此免测。最合理的意见是什么？","options":["只要有唯一产品识别码就无需任何安全验证","删除感知避障需求以使报告自洽","分别验证数据链保护、电子围栏、感知避障等要求，不得以单项安全能力替代其他项","加密可以替代全部飞行安全功能"],"answers":[2],"explanation":"资料列出17项细化安全要求，并举例电子围栏、远程识别、感知避障、数据链保护。安全要求存在多个维度，单项加密不能证明其他能力成立。","focus":"多维安全验证","difficulty":"应用","sourceSection":"二、四项核心强制性国家标准","sourceEvidence":"标准包含17项细化安全要求，如电子\n围栏、远程识别、感知避障、数据链保护。","sourcePages":[5],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N043"},{"id":"N044","chapter":2,"type":"multi","stem":"按学习指引，售后系统准备按“制造商名称码+序列号”关联维修记录，并在整机售出一年后清空编码。哪些设计调整需要纳入整改？","options":["识别码应服务整机全生命周期，不能只按销售满一年清空","补充产品型号，保持识别码结构完整","客户更换电话号码时，由客户手机号重写制造商名称码","删除制造商名称码，所有整机只按用户姓名关联"],"answers":[0,1],"explanation":"产品识别码结构含制造商名称码、产品型号和序列号，并用于整机全生命周期。结构缺项和售出后任意清空都会破坏持续身份关联；手机号和姓名不能替代产品编码。","focus":"售后身份关联的持续性","difficulty":"应用","sourceSection":"二、四项核心强制性国家标准","sourceEvidence":"GB  46860—2025《民用无人机唯一产品识别码》：适用于微型、轻型、小型、\n中型、大型民用无人机整机产品的全生命周期管理。产品识别码结构为：制造商名\n称码（4位）＋产品型号＋序列号（12位）。上位法为《暂行条例》第九条。","sourcePages":[5],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N044"},{"id":"N045","chapter":2,"type":"multi","stem":"按学习指引，某供应商把静态编码、实时运行报文和登记激活统称为“设备编号”，导致验收范围不清。应如何拆解？","options":["只保留其中任一项，其他均属重复验收","把登记激活流程验证单列","把唯一产品识别码的结构核验单列","把位置、姿态、时间状态等运行识别内容核验单列"],"answers":[1,2,3],"explanation":"三类事项分别回答设备身份、运行状态以及登记激活流程问题。名称相近不代表验收目标相同，应建立分项清单，避免漏项。","focus":"静态身份与动态状态","difficulty":"应用","sourceSection":"二、四项核心强制性国家标准","sourceEvidence":"GB  46750—2025《民用无人机系统运行识别规范》：2026年5月1日正式实施。\n发送端须报送21项内容（含唯一产品识别码、位置、姿态、时间状态等）；坐标系\n类型以预留编码表示，WGS84记为1、大地2000记为0，并预留2至6；网络式运\n行识别至少使用蜂窝网络、地面有线网络或卫星网络之一；广播式须通过蓝牙5.0及\n以上版本或WiFi发送。上位法为《暂行条例》第二十四条。","sourcePages":[5,6],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N045"},{"id":"N046","chapter":2,"type":"multi","stem":"按学习指引，对运行识别联调方案进行审核，哪些意见与资料要求一致？","options":["核对坐标系类型与位置字段语义是否一致","坐标系编码只是界面样式，不影响报文内容核验","WGS84和大地2000应分别使用资料规定的不同类型编码","识别内容应覆盖规定清单，不能只发送产品识别码"],"answers":[0,2,3],"explanation":"类型编码用于说明坐标采用的参考系，与位置语义直接相关。内容完整性也应逐项检查，而非仅确认某个字段或界面存在。","focus":"识别报文语义质量","difficulty":"应用","sourceSection":"二、四项核心强制性国家标准","sourceEvidence":"GB  46750—2025《民用无人机系统运行识别规范》：2026年5月1日正式实施。\n发送端须报送21项内容（含唯一产品识别码、位置、姿态、时间状态等）；坐标系\n类型以预留编码表示，WGS84记为1、大地2000记为0，并预留2至6；网络式运\n行识别至少使用蜂窝网络、地面有线网络或卫星网络之一；广播式须通过蓝牙5.0及\n以上版本或WiFi发送。上位法为《暂行条例》第二十四条。","sourcePages":[5],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N046"},{"id":"N047","chapter":2,"type":"multi","stem":"按学习指引，方案评审把“网络式”与“广播式”混为一谈。哪些更正可以成立？","options":["蜂窝、地面有线或卫星网络属于资料列出的网络式网络选择","网络式必须同时采用三种网络，少一种均不符合","有了WiFi广播即可把任何登记激活流程全部删掉","蓝牙5.0及以上或WiFi是资料列出的广播发送方式"],"answers":[0,3],"explanation":"广播与网络式按技术路径区分。资料对网络式使用“至少一种”，而登记激活另有标准要求，不能由传输链路选择推导出免除。","focus":"识别技术路径辨析","difficulty":"应用","sourceSection":"二、四项核心强制性国家标准","sourceEvidence":"GB  46750—2025《民用无人机系统运行识别规范》：2026年5月1日正式实施。\n发送端须报送21项内容（含唯一产品识别码、位置、姿态、时间状态等）；坐标系\n类型以预留编码表示，WGS84记为1、大地2000记为0，并预留2至6；网络式运\n行识别至少使用蜂窝网络、地面有线网络或卫星网络之一；广播式须通过蓝牙5.0及\n以上版本或WiFi发送。上位法为《暂行条例》第二十四条。","sourcePages":[5],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N047"},{"id":"N048","chapter":2,"type":"multi","stem":"按学习指引，规划登记激活交付流程时，哪些决定符合资料？","options":["只要生产者已有销售系统，即可不核对其登记激活功能","可按生产者系统流程组织验证","把唯一产品识别码印在包装上就等于已完成激活","也可按UOM直联流程组织验证"],"answers":[1,3],"explanation":"资料允许生产者系统与UOM直联两套流程，但“存在一个系统”不等于其功能已满足。编码标识、销售记录和激活结果不能混为一项。","focus":"激活流程证据审核","difficulty":"应用","sourceSection":"二、四项核心强制性国家标准","sourceEvidence":"GB  46761—2025《民用无人机实名登记和激活》：规定两套实名登记与激活流\n程：一套通过生产者系统（大疆、极飞等大厂须自建中间系统），另一套为UOM平\n台直联。","sourcePages":[6],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N048"},{"id":"N049","chapter":2,"type":"multi","stem":"按学习指引，某行业研究表引用资料中的39、35、11、2项标准数量，哪些计算或核验方式正确？","options":["把行业标准合计87项直接改称87项强制性国家标准","四部门数量相加得到87项，但不能据此认定为强制性国标总数","工信部与民航局两部门合计74项","能源局与生态环境部两部门合计13项"],"answers":[1,2,3],"explanation":"行业标准数量与强制性国家标准数量的统计对象不同。加总、比较前须统一口径，不能用四部门行业标准合计替代强制性国标总量。","focus":"标准统计口径与计算","difficulty":"应用","sourceSection":"一、标准体系总体情况","sourceEvidence":"行业标准分布：现行行业标准中，工业和信息化部39项、中国民航局35项、\n国家能源局11项、生态环境部2项。","sourcePages":[5],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N049"},{"id":"N050","chapter":2,"type":"multi","stem":"按学习指引，合规审查要求建立“要求—标准—上位法”证据链，哪些映射符合资料？","options":["唯一产品识别码标准可追溯至《暂行条例》第九条","标准有相近名称就能相互替代验证内容","实名登记激活与运行识别可直接认定为同一流程","运行识别规范可追溯至《暂行条例》第二十四条"],"answers":[0,3],"explanation":"证据链应准确到要求及其上位法依据，不能仅凭名称相近互相替代。产品静态标识、运行报送和登记激活对应的验证任务不同。","focus":"合规依据映射审核","difficulty":"进阶","sourceSection":"二、四项核心强制性国家标准","sourceEvidence":"GB  46860—2025《民用无人机唯一产品识别码》：适用于微型、轻型、小型、\n中型、大型民用无人机整机产品的全生命周期管理。产品识别码结构为：制造商名\n称码（4位）＋产品型号＋序列号（12位）。上位法为《暂行条例》第九条。","sourcePages":[5],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N050"},{"id":"N051","chapter":2,"type":"multi","stem":"按学习指引，构建采购验收清单时，哪些安排有助于覆盖资料中的多项标准而避免“一项合格即全部合格”？","options":["分别检查安全功能和唯一产品识别码结构","分别验证运行报文内容与登记激活流程","把识别码重复21次当作运行识别21项内容合格","把数据链保护通过作为所有安全功能自动通过的依据"],"answers":[0,1],"explanation":"四项核心标准应分解到相应验收对象。安全功能间、静态编码与动态报文间均不能相互替代，“重复次数”也不等于内容完整。","focus":"多标准验收覆盖","difficulty":"进阶","sourceSection":"二、四项核心强制性国家标准","sourceEvidence":"标准包含17项细化安全要求，如电子\n围栏、远程识别、感知避障、数据链保护。","sourcePages":[5,6],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N051"},{"id":"N052","chapter":3,"type":"single","stem":"按学习指引，合规文档把“2003年5月1日施行、国令371号”写到《无人驾驶航空器飞行管理暂行条例》名下。应怎样修订这条记录？","options":["两部条例可共用同一个令号及施行日期","只把日期改成2024年1月1日，保留371号","只把371号改成761号，保留2003年施行日期","该令号和日期应对应《通用航空飞行管制条例》，无人机暂行条例另列761号和2024年1月1日"],"answers":[3],"explanation":null,"focus":"法规元数据一致性","difficulty":"应用","sourceSection":"一、两部基础行政法规","sourceEvidence":"通用航空飞行管制条例》：国令第371号，2003年5月1日施行，是通用航\n空飞行管制的基础行政法规。注意令号与施行日期成对记忆，不要与无人机的761\n号混淆。\n《","sourcePages":[6],"sourceStatus":"课程43页全文核验","explanationStatus":"none","displayId":"N052"},{"id":"N053","chapter":3,"type":"single","stem":"按学习指引，一次应报告的飞行安全问题发生后，操控者在降落20小时后已向空中交通管理机构报告，项目组据此取消根因复盘并关单。哪项复核结论最合理？","options":["应先等故障完全复盘完毕，再决定是否按时向规定机构报告","报告未超过资料的24小时窗口，但报告完成不等于故障已闭环，仍应核实根因、修复与业务恢复","只要报告完成，就可认定所有系统异常均已消除","报告窗口应从项目组关单时重新起算，降落时点无关"],"answers":[1],"explanation":"安全问题报告与项目故障闭环是不同要求。降落20小时后报告未超资料规定窗口；但报告本身不证明修复、异常消除及业务恢复，不能替代根因与闭环工作。","focus":"安全报告与故障闭环的边界","difficulty":"应用","sourceSection":"三、违规与处罚","sourceEvidence":"飞行安全问题报告：导致飞行安全问题的，操控者应当在降落后24小时内向空\n中交通管理机构报告。","sourcePages":[7,10],"sourceStatus":"课程43页全文核验","sourceEvidenceAdditional":[{"page":10,"text":"故障处理完整闭环：定位故障根因→实施修复处置→消除系统异常恢复业务→\n完成问题闭环；只恢复业务不做根因分析不达标。"}],"explanationStatus":"meaningful","displayId":"N053"},{"id":"N054","chapter":3,"type":"single","stem":"按学习指引，周三10:00生效的重大活动临时管制空域与同日10:00生效的紧急任务临时管制空域，公告最迟时间应如何配对？","options":["重大活动周二10:00；紧急任务周三09:30","重大活动周三09:30；紧急任务周二10:00","两者均为周二10:00","两者均为周三09:30"],"answers":[0],"explanation":"重大活动按生效前24小时公告，紧急任务按生效前30分钟公告。将同一生效时点代入，可以检查是否把小时与分钟口径互换。","focus":"两类公告倒排计算","difficulty":"应用","sourceSection":"四、临时管制空域的公告时限","sourceEvidence":"重大活动：为保障国家重大活动划设的临时管制空域，应当在生效24小时前发\n布公告。","sourcePages":[7],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N054"},{"id":"N055","chapter":3,"type":"single","stem":"按学习指引，某机场从双跑道增至三跑道，培训图仍沿用15/30千米双环。按资料中的构型示例，图示应如何调整？","options":["改成半径12千米单环","改为20/40/60千米三环，而非只在旧双环外随意加一圈","保留15/30千米双环，只改机场名称","三跑道只需保留最大60千米单环"],"answers":[1],"explanation":"资料将跑道构型与环数、半径成组对应。三跑道对应20/40/60千米三环，不能只调整名称或保留最大半径而丢失构型信息。","focus":"机场构型变化校核","difficulty":"应用","sourceSection":"五、空域基础分类与机场空域","sourceEvidence":"民用机场B类空域：按跑道构型划设：单跑道为半径12千米单环；双跑道为半\n径15/30千米双环；三跑道为半径20/40/60千米三环。","sourcePages":[7],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N055"},{"id":"N056","chapter":3,"type":"single","stem":"按学习指引，审核目录同时把《民用航空法》、CCAR-92、GB标准列为“同一层级的企业制度”。最合理的整理方式是什么？","options":["删除文件来源，只保留内部制度名称","把GB标准放在法律之上，因为编号更长","分别归入法律、部门规章和强制性国家标准，并保留行政法规的独立层级","全部改称部门规章，方便统一目录"],"answers":[2],"explanation":"资料的框架区分法律、行政法规、部门规章、强制性国家标准。目录需保留来源层级，不能用同一个企业制度标签抹平其法律属性。","focus":"混合合规文件归档","difficulty":"进阶","sourceSection":"五、空域基础分类与机场空域","sourceEvidence":"法规层级主线：法律（民用航空法）—行政法规（暂行条例、通航管制条例）\n—部门规章（CCAR-92等）—强制性国家标准，是判断“某要求出自哪一层级”的基\n本框架。","sourcePages":[7],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N056"},{"id":"N057","chapter":3,"type":"single","stem":"按学习指引，验收表用企业商标代替国籍标志，并认为“已有产品唯一识别码就无需国籍标志”。正确的审核意见是什么？","options":["只要商标醒目，就可代替国籍标志","将识别码的首位统一改成B，即视为全部标识完成","国籍标志由每个客户自选字体和字母","国籍标志与企业商标、产品识别码不同，应按资料核对罗马体大写B及相应标识事项"],"answers":[3],"explanation":"国籍标志、商标与唯一产品识别码承担不同标识用途。资料对国籍标志采用罗马体大写B的表述，不能用企业品牌或另一种标识替代。","focus":"不同标识用途区分","difficulty":"应用","sourceSection":"二、登记与识别要求","sourceEvidence":"国籍标志：根据CCAR-92，中华人民共和国民用无人驾驶航空器的国籍标志为\n罗马体大写字母B。","sourcePages":[5,6],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N057"},{"id":"N058","chapter":3,"type":"single","stem":"按学习指引，执法培训表将“生产者未设置唯一产品识别码”对应罚款10万至50万元，将“外国无人机违规测绘”对应3万至30万元。按资料应如何处理？","options":["对调两项罚款区间，并按各自违法情形保留其他处置要求","只比较金额高低，不再记录违法情形","将两项金额相加作为每种行为的固定罚款","两项统一为3万至50万元，避免分歧"],"answers":[0],"explanation":null,"focus":"违法行为与罚则对应","difficulty":"应用","sourceSection":"二、登记与识别要求","sourceEvidence":"唯一产品识别码罚则：生产者未按规定设置唯一产品识别码的，处3万元至30\n万元罚款。这一额度区间在多处政策文件中与“低空经济”绑定出现，需与统计分类\n的文号区分。","sourcePages":[7],"sourceStatus":"课程43页全文核验","explanationStatus":"none","displayId":"N058"},{"id":"N059","chapter":3,"type":"single","stem":"按学习指引，导航方案实测连续性为97.0%，报告写“满足大于97%的资料指标”。审核结论应是什么？","options":["可以达标，因为大于与大于等于没有区别","不能据此判为达标，等于97%不满足严格大于97%","只要设备数量足够，连续性数值无需比较","必须降低至96.9%才符合指标"],"answers":[1],"explanation":"资料采用“大于97%”，属于严格不等式，97.0%恰好等于阈值并不满足。该指标出自资料所述征求意见稿，引用时也应标明文件状态。","focus":"连续性阈值判定","difficulty":"应用","sourceSection":"六、空域管理与城空中交通新规","sourceEvidence":"城空中交通导航标准：中央空管委《城市空中交通管理基础设施保障能力标准\n（试行）》（征求意见稿）：导航服务连续性应达到大于97%。","sourcePages":[8],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N059"},{"id":"N060","chapter":3,"type":"single","stem":"按学习指引，投标书把《空域管理条例（征求意见稿）》中的用户权利义务直接标注为“已正式生效的现行条例条款”。最应怎样修订？","options":["只删除“征求意见稿”四字，保持其余表述","标明征求意见稿状态，将拟议内容与现行正式文件要求分别列示","把文件改称企业内部规定即可证明已生效","既然涉及用户权利，就不必核实文件状态"],"answers":[1],"explanation":"资料明确所述文件为征求意见稿。引用拟议规范可以辅助理解方向，但不能把征求意见状态直接写成已经正式生效的行政法规。","focus":"征求意见稿引用边界","difficulty":"应用","sourceSection":"六、空域管理与城空中交通新规","sourceEvidence":"空域管理条例（征求意见稿）：2023年11月国家空管委发布《中华人民共和国\n空域管理条例（征求意见稿）》，核心要点是明确提出空域用户定义，并提出空域\n用户的权利、义务规范。","sourcePages":[8],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N060"},{"id":"N061","chapter":3,"type":"single","stem":"按学习指引，设计空域知识卡时，作者把“B类空域”解释为“国籍标志B对应的专用空域”，并删去G、W两类。应如何纠错？","options":["保留解释，只把国籍标志改成小写b","区分空域字母与国籍标志；按A、B、C、D、E、G、W保留七类","将七类空域全部改称B类","G、W仅表示产品型号，不是空域类别"],"answers":[1],"explanation":"相同字母在不同体系中含义不同。B类空域属于空域分类，国籍标志B属于航空器标志；资料所列七类还包括G和W，不能删去。","focus":"同形字母的体系辨析","difficulty":"进阶","sourceSection":"五、空域基础分类与机场空域","sourceEvidence":"七类空域：《国家空域基础分类方法》将空域划分为A、B、C、D、E、G、W\n七类，其中G类、W类为非管制空域。","sourcePages":[6,7],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N061"},{"id":"N062","chapter":3,"type":"multi","stem":"按学习指引，采购合同写道“只要客户验收签字，生产者即可免设置唯一产品识别码，操控者也无需报告后续飞行安全问题”。哪些审核意见成立？","options":["只要客户愿意签字，合同就可把全部监管要求改为自愿事项","工程验收与飞行安全问题报告是不同事项，应按规定对象和时限办理报告","将安全问题写入内部项目总结，即可无条件替代向空中交通管理机构报告","客户验收条款不能替代资料明确的产品识别码合规要求，应单独核查生产者职责"],"answers":[1,3],"explanation":"客户验收确认工程交付，并不能把不同主体承担的合规事项一并免除。生产者识别码要求与操控者安全报告要求应分别核查；内部总结不能替代资料要求的报告对象和时限。","focus":"工程验收与监管义务的适用边界","difficulty":"应用","sourceSection":"二、登记与识别要求","sourceEvidence":"唯一产品识别码罚则：生产者未按规定设置唯一产品识别码的，处3万元至30\n万元罚款。这一额度区间在多处政策文件中与“低空经济”绑定出现，需与统计分类\n的文号区分。","sourcePages":[7],"sourceStatus":"课程43页全文核验","sourceEvidenceAdditional":[{"page":7,"text":"飞行安全问题报告：导致飞行安全问题的，操控者应当在降落后24小时内向空\n中交通管理机构报告。"}],"explanationStatus":"meaningful","displayId":"N062"},{"id":"N063","chapter":3,"type":"multi","stem":"按学习指引，一份外国无人机违规测绘案例记录为“已罚款，因此允许继续测绘；任何情节都直接驱逐出境”。哪些纠偏意见成立？","options":["限期出境或驱逐出境应结合资料所述“情节严重”条件","罚款不能替代责令停止违法行为和资料列明的没收措施","缴纳罚款本身就取得继续原违法测绘的资格","把所有处置统一缩减为警告即可"],"answers":[0,1],"explanation":"资料列的是包含停止违法行为、没收、罚款的处罚链，严重情形另有出境措施。既不能把罚款误作继续违法的许可，也不应省略严重情形的适用条件。","focus":"处罚措施与适用条件复核","difficulty":"应用","sourceSection":"三、违规与处罚","sourceEvidence":"外国无人机违规测绘：处罚包括：责令停止违法行为、没收违法所得和无人机、\n处10万元至50万元罚款；情节严重的，限期出境或驱逐出境。四项措施构成完整\n处罚链。","sourcePages":[7],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N063"},{"id":"N064","chapter":3,"type":"multi","stem":"按学习指引，整理合规培训资料时，哪些分类和引用方式与学习指引一致？","options":["将征求意见稿与现行行政法规不加区分地统一写为已生效","引用空域管理条例征求意见内容时标明其草案状态","将《民用航空法》列入法律层级","将CCAR-92相关规章列入部门规章层级"],"answers":[1,2,3],"explanation":"法律层级与文件状态都需要准确表达。正式部门规章与征求意见稿不是同一种状态，不能仅凭名称中有“条例”就当作已生效法规。","focus":"层级与效力状态双核验","difficulty":"应用","sourceSection":"五、空域基础分类与机场空域","sourceEvidence":"法规层级主线：法律（民用航空法）—行政法规（暂行条例、通航管制条例）\n—部门规章（CCAR-92等）—强制性国家标准，是判断“某要求出自哪一层级”的基\n本框架。","sourcePages":[7,8],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N064"},{"id":"N065","chapter":3,"type":"multi","stem":"按学习指引，GIS脚本将双跑道机场B类空域的内外环半径填成15米、30米，且只生成一个环。哪些修正成立？","options":["将半径单位换算为15000米和30000米","输出双环，不能因同属B类就合并为单环","把15、30解释为直径并继续保留米单位","将其直接改成12千米单环，双跑道与单跑道无区别"],"answers":[0,1],"explanation":"资料给出双跑道对应15/30千米双环。需要同时修正单位和环数：15千米是15000米，30千米是30000米，且所述数值是半径而非直径。","focus":"机场图层单位与构型联审","difficulty":"应用","sourceSection":"五、空域基础分类与机场空域","sourceEvidence":"民用机场B类空域：按跑道构型划设：单跑道为半径12千米单环；双跑道为半\n径15/30千米双环；三跑道为半径20/40/60千米三环。","sourcePages":[7],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N065"},{"id":"N066","chapter":3,"type":"multi","stem":"按学习指引，一份标识说明将“国籍标志B、B类空域、唯一产品识别码”混作同一编码。哪些更正合理？","options":["国籍标志B用于航空器国籍标识，不是空域类别名称","三者都有字母或数字，所以任选一种即可满足全部要求","唯一产品识别码要求应单独核验，不能由国籍标志替代","B类空域属于空域分类体系，不是制造商编码字段"],"answers":[0,2,3],"explanation":"不同体系的标识不能互相替代。国籍标志、空域类别和产品身份分别回答不同问题，审查时应保留各自依据与核验对象。","focus":"三类标识的交叉辨析","difficulty":"进阶","sourceSection":"二、登记与识别要求","sourceEvidence":"唯一产品识别码罚则：生产者未按规定设置唯一产品识别码的，处3万元至30\n万元罚款。这一额度区间在多处政策文件中与“低空经济”绑定出现，需与统计分类\n的文号区分。","sourcePages":[5,6,7],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N066"},{"id":"N067","chapter":3,"type":"multi","stem":"按学习指引，一次应报告的飞行安全问题发生后，设备已安全落地，团队拟先修复并等周报统一汇总。按资料，应怎样安排？","options":["向空中交通管理机构报告，不能仅用内部周报替代","以降落时点起算24小时报告窗口","等待全部维修和项目验收结束后再起算时限","把报告对象改成设备销售商，就可视为完成全部报告要求"],"answers":[0,1],"explanation":"资料明确报告时点与对象：降落后24小时内向空中交通管理机构报告。内部复盘和供应商维修可另行开展，但不能替代对规定对象的时限要求。","focus":"报告对象与内部流程","difficulty":"应用","sourceSection":"三、违规与处罚","sourceEvidence":"飞行安全问题报告：导致飞行安全问题的，操控者应当在降落后24小时内向空\n中交通管理机构报告。","sourcePages":[7],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N067"},{"id":"N068","chapter":4,"type":"single","stem":"变更台账已完成范围核实和工作量评估，客户口头同意追加功能，研发准备立即上线。此时哪种安排最符合交付控制要求？","options":["只通知测试团队，不再协调商务","先免费上线，验收后再补谈范围与费用","以客户口头同意替代全部决策留痕，直接上线","协调商务形成双方书面或邮件一致意见，再组织实施"],"answers":[3],"explanation":"评估完成不等于变更已获双方确认。还需商务介入决策，并通过书面或邮件形成一致意见，才能进入执行；先做后补容易造成范围和费用争议。","focus":"评估完成后的执行门槛","difficulty":"应用","sourceSection":"一、需求管理与变更控制","sourceEvidence":"变更落地前提：所有新增内容须经双方书面或邮件确认达成一致后，方可组织\n推动落地实施。","sourcePages":[8],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N068"},{"id":"N069","chapter":4,"type":"single","stem":"为追赶进度，团队把尚未确认的新需求混入既有合同功能列表，导致测试无法区分验收范围。最有效的纠偏措施是什么？","options":["停止全部测试，只以演示效果验收","删除原合同功能，保留客户最新口头要求","恢复原范围与变更范围的清晰边界，按申请、评估、决策、执行留痕管理","把所有新功能都改称缺陷修复，继续开发"],"answers":[2],"explanation":"新增功能与原交付范围混杂会破坏需求、排期和验收基线。应先澄清边界，再按变更流程处理，并保留双方确认记录，不能通过改名绕开控制。","focus":"范围基线与验收边界","difficulty":"进阶","sourceSection":"一、需求管理与变更控制","sourceEvidence":"变更控制四步流程：申请→评估→决策→执行，顺序不可打乱；决策环节涉及\n商务介入、价格谈判、联合审批。","sourcePages":[8,9],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N069"},{"id":"N070","chapter":4,"type":"single","stem":"定制开发排期表已覆盖需求调研和编码，但最后一个编码任务结束日就是正式验收日。最明显的计划缺陷是什么？","options":["未为整体功能测试预留时间，应在研发计划中补齐测试窗口","需求调研不应进入计划，应全部删除","编码完成后即可认为所有合同功能已验证","只需把验收日改称演示日，无需测试"],"answers":[0],"explanation":"定制化开发不仅要调研、控制溢出和开发排期，还应预留整体功能测试时间。代码完成并不等于功能验证与验收准备完成。","focus":"定制开发排期完整性","difficulty":"应用","sourceSection":"五、硬件与软件实施方案","sourceEvidence":"定制化开发三步：现场需求调研（按合同标书范围细化需求功能点）→控制需\n求溢出，生成需求规格说明书→研发计划排期，按期开发并预留整体功能测试时间。","sourcePages":[10],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N070"},{"id":"N071","chapter":4,"type":"single","stem":"研发已经准备好标准平台安装包，但云资源尚未按清单申请，项目计划却把“接入飞机测试飞行”排在第二天。应怎样调整？","options":["先做验收回款，资源需求留到运维期处理","只把安装包发给客户即可认定平台已部署","先落实服务器资源，再部署标准平台，平台就绪后接入飞机测试","直接进行测试飞行，用结果反推服务器需求"],"answers":[2],"explanation":"标准部署有资源、部署、接机测试的前后依赖。安装包就绪不等于运行环境就绪；跳过资源协调会使部署和联调计划失去基础。","focus":"标准部署依赖关系","difficulty":"应用","sourceSection":"五、硬件与软件实施方案","sourceEvidence":"标准平台部署三步：协调服务器资源（按研发资源清单申请云资源或采购物理\n机）→研发部署标准平台→平台就绪后接入飞机开展测试飞行。","sourcePages":[10],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N071"},{"id":"N072","chapter":4,"type":"single","stem":"设备已到货，但现场基座、电源与网络尚未具备条件。项目经理拟让厂家先装机，再在试飞时补施工。哪种调整更合理？","options":["先补齐现场安装条件并做好到货验收，再安装调测和接入平台试飞","现场条件不属于安装计划，无需纳入排期","把接入平台试飞提到施工前，先完成最后节点","跳过到货验收，直接申请初验"],"answers":[0],"explanation":"安装计划应依次落实备货、现场条件、到货验收和厂家调测、接入平台试飞。设备已到并不能替代基建、电力、网络等前置条件。","focus":"现场条件与安装门禁","difficulty":"应用","sourceSection":"五、硬件与软件实施方案","sourceEvidence":"安装计划四节点：设备下单及备货（关键设备提前备货）→现场具备安装\n条件（电线网线基建等）→到货验收、厂家现场安装调测→接入平台测试飞行。","sourcePages":[9],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N072"},{"id":"N073","chapter":4,"type":"single","stem":"WBS把“基座浇筑、标准平台部署、定制开发”全部归入软件实施，造成软件团队承担土建任务。最合理的重组方式是什么？","options":["把所有任务都移到验收回款阶段","把硬件准备删掉，因为软件团队不负责","将基座及网线电线准备归入硬件现场条件，软件分为标准部署与定制开发","仅保留定制开发，标准平台部署不算实施"],"answers":[2],"explanation":"软件实施的两块是标准平台部署与定制化开发；硬件基座、网络和电力准备仍是必要工作，应归到对应任务，而不是因归属错误就删掉。","focus":"软硬件实施工作分解","difficulty":"应用","sourceSection":"五、硬件与软件实施方案","sourceEvidence":"软件实施两大块：标准平台部署＋定制化开发；硬件基座浇筑和验收回款不属\n于软件实施方案。","sourcePages":[9,10],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N073"},{"id":"N074","chapter":4,"type":"single","stem":"风险台账列有三项措施：提前确认算法留排期、替换已停产设备、外包基建施工。最准确的分类组合是什么？","options":["风险规避、风险转移、风险自留","风险预测、风险规避、风险转移","风险转移、风险自留、风险预测","三项均为风险转移，因为都改变了原计划"],"answers":[1],"explanation":"应按风险处理机理分类。提前留余量是预测，更换停产设备是绕开风险的规避，外包施工是转移；不能因都涉及计划调整就归为同一类。","focus":"风险组合策略辨析","difficulty":"进阶","sourceSection":"三、风险管理四类应对","sourceEvidence":"四类方式辨析：预测是提前布置留余量，规避是换方案绕开风险，转移是外包/\n保险，自留是接受后果。判断题常在“属于哪类”上设混淆点。","sourcePages":[9],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N074"},{"id":"N075","chapter":4,"type":"single","stem":"施工已外包，交付团队据此取消安全协调和过程监督；同时要求承包方对所有风险独立负责。最关键的纠偏点是什么？","options":["外包意味着所有管理责任自动消失","将施工费用改成设备费即可免除安全协调","只要在合同中写外包，就无需关注施工条件","明确外包转移部分风险后，项目方仍承担相应安全管理责任"],"answers":[3],"explanation":"风险转移不等于责任清零。资料明确指出施工安全风险可通过合作方转移，但项目方并非不再承担任何安全管理责任，仍需做好相应管理。","focus":"外包后的管理责任","difficulty":"应用","sourceSection":"三、风险管理四类应对","sourceEvidence":"风险转移：方舱基建、网络、电力等施工安全风险通过外包转移给合作方；但\n外包转移后项目方并非不再承担任何安全管理责任。","sourcePages":[9],"sourceStatus":"课程43页全文核验","explanationStatus":"meaningful","displayId":"N075"},{"id":"N076","chapter":4,"type":"single","stem":"某低影响风险已被明确接受，项目未换方案、未外包，也未新增保险。若把这条记录写成“风险转移已完成”，应如何更正？","options":["应记录为风险规避，因为风险名称被修改","应记录为风险预测，因为没有发生事故","继续写风险转移，只需补一份内部通知","应记录为风险自留，不能把接受后果写成向外转移"],"answers":[3],"explanation":"资料用自留表示接受后果，转移则通过外包或保险等机制承担分配。没有外部承担安排且接受风险后果时，不应误报为转移已完成。","focus":"风险接受与转移边界","difficulty":"应用","sourceSection":"三、风险管理四类应对","sourceEvidence":"四类方式辨析：预测是提前布置留余量，规避是换方案绕开风险，转移是外包/\n保险，自留是接受后果。判断题常
