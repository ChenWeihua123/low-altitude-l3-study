"先恢复旧库后再核查连接池，以缩短排查步骤","无条件回退全部数据，再判断连接数是否由应用连接池引起","先查连接池配置并定位原因；若确需恢复，先确认备份及覆盖影响"],"answers":[3],"explanation":"连接数满先查连接池，不应直接用数据库重启替代分析；数据恢复又会覆盖现有数据，必须单独确认备份及影响。不同处置不能无条件叠加。","focus":"连接故障与恢复边界","difficulty":"应用","sourceSection":"六、故障处理与易错口径","sourceEvidence":"MySQL 连接数满时应先检查连接池配置，不能直接重启数据库。","sourcePages":[28],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N342"},{"id":"N343","chapter":14,"type":"single","stem":"课程环境中的Nginx为非容器安装，拟发布前先确认服务状态和配置合法性。哪组检查与目标匹配？","options":["只确认MinIO端口9002","systemctl status nginx 与 nginx -t","只看CPU使用率","只检查Nacos命名空间名"],"answers":[1],"explanation":"非Docker Nginx进程状态可用systemctl status nginx，配置检查用nginx -t。服务状态与配置语法是不同核查目标，应同时覆盖。","focus":"服务状态与配置验证","difficulty":"应用","sourceSection":"三、巡检与阈值","sourceEvidence":"配置检查命令为 nginx -t。","sourcePages":[27],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N343"},{"id":"N344","chapter":14,"type":"single","stem":"一次常规版本迭代计划采用滚动更新，却把DEBUG长期留在生产，并将Nginx与Nacos日志统一改为“默认30天”。按本章应怎样审阅？","options":["滚动更新不适合常规版本，其余全部正确","滚动更新期间无需关注新增ERROR，只在更新结束看页面","保留常规滚动更新思路，关闭生产DEBUG，并纠正两类日志默认保留口径","为减少日志量只保留ERROR，关闭WARN与INFO"],"answers":[2],"explanation":"滚动更新适合常规迭代；生产启用ERROR/WARN/INFO并关闭DEBUG。Nginx默认90天，Nacos30天，不能混写为同一期限。","focus":"发布与生产日志联合审查","difficulty":"应用","sourceSection":"四、发布与日志管理","sourceEvidence":"滚动更新适用于常规版本迭代","sourcePages":[27],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N344"},{"id":"N345","chapter":14,"type":"multi","stem":"按本章巡检口径，以下哪些观察需要关注或排查？","options":["Nacos注册服务数量与预期不一致","生产INFO日志随正常请求新增，未出现错误或异常5xx","CPU80%、内存85%、磁盘80%正好等于阈值","Nginx出现异常5xx趋势，需要结合进程、监听和日志检查"],"answers":[0,3],"explanation":"资源值恰好等于允许上限不属于越界，正常INFO随请求新增也不能据此认定异常。Nacos注册数量偏离预期及异常5xx趋势则需按组件状态和日志继续排查。","focus":"多维巡检异常识别","difficulty":"进阶","sourceSection":"三、巡检与阈值","sourceEvidence":"Nacos 注册服务数量必须与预期一致，不一致即为异常。","sourcePages":[27],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N345"},{"id":"N346","chapter":14,"type":"multi","stem":"团队把巡检清单缩减为“只看端口”，哪些补充符合本章？","options":["只要端口在监听就能证明业务完全正常","Nginx补查进程、错误日志与访问5xx错误率","服务器补查CPU、内存与磁盘使用率","Nacos补查服务状态、注册数量与日志错误"],"answers":[1,2,3],"explanation":"端口是一个维度，还需进程、注册、日志和资源等多维观察。端口监听不能单独证明组件和业务全部正常。","focus":"巡检清单完整性","difficulty":"应用","sourceSection":"三、巡检与阈值","sourceEvidence":"Nginx 巡检四项：进程状态、端口监听、错误日志、访问 5xx 错误率","sourcePages":[27],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N346"},{"id":"N347","chapter":14,"type":"multi","stem":"部署安全整改需同时保证业务入口和组件隔离，哪些做法符合本章？","options":["MySQL3306与PostgreSQL5432避免公网暴露","Nginx80/443作为公网入口并配置WAF防护","把数据库密码写到大屏地图配置表供所有人查看","Nacos8848沿用Nginx入口的任意公网来源策略"],"answers":[0,1],"explanation":"数据库应避免公网暴露，Nginx公网入口应有WAF。Nacos应限制内网来源，不能照搬公网入口策略；GPU地图配置也不需要传播数据库密码。","focus":"组件隔离与入口防护","difficulty":"应用","sourceSection":"五、安全管控","sourceEvidence":"Nacos 8848 建议访问来源仅内网","sourcePages":[28],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N347"},{"id":"N348","chapter":14,"type":"multi","stem":"发布窗口开始前，哪些准备与后续操作约束应保留？","options":["停止上游调用方，避免操作期间继续请求","备份关键数据并通知相关方","按手册业务重启脚本执行先停再启","因已有窗口，就无条件恢复历史库覆盖当前数据"],"answers":[0,1,2],"explanation":"窗口、备份、通知与上游控制均是启停规范。恢复覆盖现有数据，不能只凭窗口批准就省略备份确认与影响判断。","focus":"窗口操作完整准备","difficulty":"应用","sourceSection":"四、发布与日志管理","sourceEvidence":"业务应用重启执行 restart.sh 先 kill 再启","sourcePages":[27],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N348"},{"id":"N349","chapter":14,"type":"multi","stem":"出现Nginx502、静态404和无法访问三类报告时，哪些排查推理符合课程口径？","options":["502结合后端服务实际状态，不能只凭状态码认定超时","静态资源404可据此认定数据库连接池已满，先调连接池而不核对文件路径","三种情况都证明GPU实例被占用","无法访问可检查进程与端口冲突"],"answers":[0,3],"explanation":"502需结合后端实际状态，无法访问可查进程与端口冲突。静态资源404应考虑文件路径，不能从该状态码直接认定连接池满；GPU占用也不能统一解释三类Web症状。","focus":"Web故障差异化诊断","difficulty":"应用","sourceSection":"六、故障处理与易错口径","sourceEvidence":"静态资源 404 可能原因是文件路径配置错误","sourcePages":[28],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N349"},{"id":"N350","chapter":14,"type":"multi","stem":"对一次发布后的日志与时区异常，哪些核查与本章一致？","options":["认为Nginx和Nacos默认都只保留90天","生产日志保留ERROR、WARN、INFO，关闭DEBUG","关注新增ERROR并安排排查","检查Java时区参数是否为Asia/Shanghai"],"answers":[1,2,3],"explanation":"时区、日志级别及新增错误都需核查。Nginx默认90天，Nacos30天，保留期不能混淆。","focus":"发布后运行口径","difficulty":"应用","sourceSection":"四、发布与日志管理","sourceEvidence":"生产环境启用 ERROR、WARN、INFO，DEBUG 必须关闭。","sourcePages":[27],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N350"},{"id":"N351","chapter":14,"type":"multi","stem":"核心业务中断应急恢复后，哪些后续工作仍不可省略？","options":["开展根因分析","为缩短时间先覆盖恢复历史库，业务恢复后再补查备份及覆盖影响","只要页面恢复就无需再做问题闭环","形成改进措施"],"answers":[0,3],"explanation":"应急恢复后仍要根因分析与形成改进措施。数据恢复会覆盖现有数据，备份确认不能延至覆盖后；页面恢复也不能替代完整问题闭环。","focus":"应急恢复后的闭环","difficulty":"应用","sourceSection":"六、故障处理与易错口径","sourceEvidence":"数据恢复操作会覆盖现有数据，不能直接执行，须先确认备份。","sourcePages":[28],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N351"},{"id":"N352","chapter":14,"type":"multi","stem":"3D大屏部署联调前，哪些材料和检查与本章匹配？","options":["按应用与渲染角色核对公网IP规划","把数据库密码列为大屏地图资源配置必需项","GPU固定对外IP、工程ID和实例ID","飞渡服务不可达时核查对外映射TCP和UDP端口"],"answers":[0,2,3],"explanation":"GPU标识和地址、网络角色与服务映射都关系到大屏链路。资料明确地图配置不需要数据库密码，不应扩大凭据使用范围。","focus":"渲染资源联调清单","difficulty":"应用","sourceSection":"六、故障处理与易错口径","sourceEvidence":"检查对外映射的 TCP 和 UDP 端口是否通畅。","sourcePages":[26,28],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","sourceSections":["一、部署资源与网络","六、故障处理与易错口径"],"explanationStatus":"meaningful","displayId":"N352"},{"id":"N353","chapter":14,"type":"multi","stem":"按本章高危漏洞“24小时评估、3天修复”的要求，哪些计划或记录需要整改？","options":["以限制Nacos内网来源作为安全整改措施之一","因Nginx是公网入口就完全不部署WAF","发现4天后才完成修复","发现30小时后才首次评估"],"answers":[1,2,3],"explanation":"30小时超过评估要求，4天超过修复要求，公网Nginx也应WAF防护。限制Nacos内网来源符合本章安全建议。","focus":"漏洞时限与访问整改","difficulty":"进阶","sourceSection":"五、安全管控","sourceEvidence":"24 小时内评估、3 天内修复。","sourcePages":[28],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N353"},{"id":"N354","chapter":15,"type":"single","stem":"按本章星瀚介绍，团队要让AI智能体自动生成运维策略，并新增一个设施域权限。方案却让智能体负责用户密码，权限只填名称。应怎样修改？","options":["权限只写说明而不选域，智能体只负责用户账号事务","把代码和所属域都视为选填，依靠权限名称区分即可","把智能体设为密码找回工具，仿真推演作为权限配置功能","智能体围绕建模研判、仿真与策略执行；权限补齐代码、说明与所属域"],"answers":[3],"explanation":"AI运营管理智能体的三项能力不含用户密码管理；权限配置则需要代码、说明和所属域。两类功能不能混为一项。","focus":"智能体与权限职责","difficulty":"应用","sourceSection":"一、平台定位与核心能力","sourceEvidence":"权限代码、权限说明并选择所属域；三项均为必填。","sourcePages":[28,29],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N354"},{"id":"N355","chapter":15,"type":"single","stem":"按补全后的星瀚课程内容，客户把星瀚仅当设备告警运维工具，不愿纳入测试场数据和生态产品验证。哪项说明最符合平台定位？","options":["星瀚仅是用户密码管理系统","星瀚只做告警，不涉及测试场","星瀚以全国测试场实战数据为基础，锚定指标并孵化生态产品，不能只按单纯运维工具定义","生态孵化意味着无需验证设备性能"],"answers":[2],"explanation":"原文将星瀚定位为标准与生态的孵化载体，依据全国测试场实战数据锚定指标、孵化产品。设备运维是具体能力，不能代替整个定位。","focus":"标准生态孵化定位","difficulty":"应用","sourceSection":"一、平台定位与核心能力","sourceEvidence":"星瀚不是单纯的运维工具，而是标准与生态的孵化载体。","sourcePages":[28,29],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N355"},{"id":"N356","chapter":15,"type":"single","stem":"按本章给出的两套星瀚硬件组合，评审者把“3台K8S+TiDB集群”与“5台K8S+TiDB单机”写成手册原方案。哪项修正准确？","options":["把TiDB全部改为MongoDB即与手册一致","手册两种方案都不需要GPU","只保留1台K8S即可","交换两者数据库配套：3台K8S配TiDB单机，5台配TiDB集群，均有GPU渲染资源"],"answers":[3],"explanation":null,"focus":"两套部署组合校核","difficulty":"应用","sourceSection":"四、部署方案与组件","sourceEvidence":"3 台 K8S 高可用 + TiDB 单机 + GPU 渲染服务器","sourcePages":[29,30],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"none","displayId":"N356"},{"id":"N357","chapter":15,"type":"single","stem":"按本章部署手册，某主机SSH使用2222端口，团队只在hostlist.txt写入IP，未在hosts填写用户及端口字段。哪项修正最合理？","options":["hostlist完成后无需hosts","删除所有主机名称以避免冲突","主机指纹清单与连接清单分别维护，在hosts填用户等信息并用ansible_ssh_port指定非22端口","改填MAC地址即可"],"answers":[2],"explanation":"hostlist用于批量添加主机指纹，hosts用于主机及SSH连接信息；非22端口由ansible_ssh_port指定。两个清单作用不同，不能相互替代。","focus":"主机清单与连接参数","difficulty":"应用","sourceSection":"五、前置准备与批量初始化","sourceEvidence":"非 22 端口在 ansible_ssh_port 字段指定。","sourcePages":[30],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N357"},{"id":"N358","chapter":15,"type":"single","stem":"按本章手册，客户实际将数据盘挂载到/data而非/app，Docker data-root仍指向未挂载的系统盘目录。部署审查应怎样调整？","options":["将业务和镜像数据都迁回系统盘，以保证命令无需改动","后续命令按实际挂载路径对应调整，并将Docker持久化目录放到挂载盘下","只调整数据库路径，其他部署命令无需对应挂载目录","仅在文档写明/data，部署命令与data-root仍沿用原路径"],"answers":[1],"explanation":"手册允许使用其他挂载目录但须同步调整后续命令；Docker data-root必须位于挂载目录下，以降低系统盘被业务数据占满的风险。","focus":"数据盘路径一致性","difficulty":"应用","sourceSection":"五、前置准备与批量初始化","sourceEvidence":"若挂载其他目录，后续部署命令需自行对应调整。","sourcePages":[30],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N358"},{"id":"N359","chapter":15,"type":"single","stem":"按本章部署流程，工程师修改daemon.json的仓库地址后只点击应用页面刷新，镜像仍无法拉取。哪项检查更贴合手册？","options":["只重新登录Harbor，不检查daemon.json及服务生效流程","只修改新拉镜像的标签，沿用未生效的仓库配置","只刷新平台页面，以为网页缓存控制主机Docker配置","检查仓库地址和持久化配置，并按手册完成daemon-reload及Docker重启"],"answers":[3],"explanation":"Docker配置修改属于主机服务配置，不会因浏览器刷新而生效。应核对Harbor地址等配置，并完成手册规定的服务重载与重启流程。","focus":"Docker配置生效链","difficulty":"应用","sourceSection":"六、Docker 与镜像仓库","sourceEvidence":"编辑 daemon.json 后执行 systemctl daemon-reload 再重启 docker","sourcePages":[30,31],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N359"},{"id":"N360","chapter":15,"type":"single","stem":"按本章Harbor部署手册，仓库采用HTTP，配置仍保留HTTPS段且hostname为旧主机；随后推送镜像时也未登录。应怎样修正？","options":["仅完成docker login，认为它会自动修正服务端hostname与HTTPS段","保留旧hostname，只改客户端标签而不处理服务端HTTP配置","校正hostname和HTTP配置，完成仓库登录后按仓库地址规范打标签再推送","只校正服务端，不登录且继续用未带仓库地址的标签推送"],"answers":[2],"explanation":"仓库服务配置和客户端推送准备都要一致：HTTP部署处理HTTPS配置段、设置本机hostname；推送前还需登录并使用规范仓库标签。","focus":"仓库服务到推送准备","difficulty":"应用","sourceSection":"七、Harbor 镜像仓库","sourceEvidence":"http 部署需注释 https 配置段","sourcePages":[31],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N360"},{"id":"N361","chapter":15,"type":"single","stem":"按本章K8S初始化手册，一台新节点仍启用swap且未导入离线镜像，团队却急于执行master加入。哪项处理更符合顺序？","options":["只安装Kuboard便自动完成节点准备","先完成所有节点的转发、swap与镜像准备，再按master加入要求处理证书和密钥","把swap当作必须开启的前提","直接反复执行加入即可"],"answers":[1],"explanation":"所有节点的转发、关闭swap和镜像导入是基础准备；多master加入另有证书同步与密钥要求。不能用反复加入替代前置条件检查。","focus":"节点准备与加入依赖","difficulty":"应用","sourceSection":"八、K8S 集群初始化","sourceEvidence":"swapoff -a 关闭 swap 并注释 /etc/fstab","sourcePages":[31],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N361"},{"id":"N362","chapter":15,"type":"single","stem":"按本章多master流程，新增节点已同步必要证书，但加入参数缺少certificate-key。有人建议删除全部根证书重试。最合理的判断是？","options":["禁用所有网络插件即可加入","删除全部ca根证书是手册要求","只修改网页端口即可","补齐加入所需证书密钥参数，并保留ca根证书，按手册处理节点专用证书"],"answers":[3],"explanation":"本章要求加入携带certificate-key，并说明清理部分无用证书时保留ca根证书。缺少参数不能通过删除全部信任根来解决。","focus":"多master证书边界","difficulty":"应用","sourceSection":"八、K8S 集群初始化","sourceEvidence":"加入集群需携带 certificate-key 证书密钥参数。","sourcePages":[31],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N362"},{"id":"N363","chapter":15,"type":"single","stem":"按本章Kuboard手册，界面已启动但未管理目标K8S集群，工程师只填数据库密码并将ENDPOINT指向TiDB。应怎样校正？","options":["将ENDPOINT指向Redis即可","只导入PostGIS扩展即可","继续填TiDB连接信息就能纳管集群","使用kubeconfig方式提供master的admin.conf，并将ENDPOINT指向Kuboard所在服务器及11007端口"],"answers":[3],"explanation":"Kuboard纳管集群使用kubeconfig和master的admin.conf；KUBOARD_ENDPOINT为Kuboard服务器地址，不能与TiDB等数据库端点混用。","focus":"管理端与集群接入","difficulty":"应用","sourceSection":"九、Kuboard 与中间件集群","sourceEvidence":"添加集群用 kubeconfig 方式，上传 master 节点 admin.conf 配置内容","sourcePages":[32],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N363"},{"id":"N364","chapter":15,"type":"single","stem":"按本章TiDB单机部署手册，inventory把node02和node03也填成同一个单机IP，初始化前又没创建业务库。哪项修正符合本章？","options":["三处都写同一IP是唯一单机方案","只修改Kafka端口","把业务库改名为MongoDB","tiup和node01填单机IP，node02/03留空，并先建lightdata_db与nacos"],"answers":[3],"explanation":"单机inventory与集群填法不同，node02、node03应留空。初始化前还需准备lightdata_db和nacos数据库，不能跳过库准备。","focus":"TiDB单机准备一致性","difficulty":"应用","sourceSection":"九、Kuboard 与中间件集群","sourceEvidence":"单机部署时 tiup 和 tidb_node01 填单机 IP","sourcePages":[32],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N364"},{"id":"N365","chapter":15,"type":"single","stem":"按本章PostgreSQL部署口径，容器已启动但空间数据功能不可用，数据库仍未建iot且未加扩展。哪项动作最符合手册？","options":["采用postgis镜像，按流程新增iot数据库并加入postgis扩展","换用普通MySQL并忽略空间扩展","只把Kuboard端口改为4000","只修改Harbor标签"],"answers":[0],"explanation":"本章PostgreSQL使用postgis镜像，新增iot库并加入postgis扩展。容器启动只说明进程运行，不代表目标业务库和空间扩展都就绪。","focus":"数据库启动到能力就绪","difficulty":"应用","sourceSection":"九、Kuboard 与中间件集群","sourceEvidence":"初始化新增数据库名为 iot，加入 postgis 扩展","sourcePages":[32],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N365"},{"id":"N366","chapter":15,"type":"single","stem":"按本章星瀚接入流程，控制台已能显示，设备厂商也声称已推送数据，但平台仍无数据。团队直接宣布完成接入。正确的验收补强是什么？","options":["在厂商配置推送后执行测试连接，验证数据链路，不以控制台可见替代设备接入验证","只查看设备采购记录，把厂商口头说明视为接入已完成","只验证平台管理员账号，不测试厂商设备数据连接","控制台能登录即可作为所有设备链路验收证据"],"answers":[0],"explanation":"控制台配置与设备数据链路是不同环节。本章要求厂商推送配置完成后点击测试连接，以实际链路验证支撑设备接入结论。","focus":"控制台可见与数据可达","difficulty":"应用","sourceSection":"十、Nginx 与平台接入","sourceEvidence":"点击测试连接检查数据链路是否打通。","sourcePages":[32],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N366"},{"id":"N367","chapter":15,"type":"multi","stem":"按本章组件说明，哪些“角色—组件”配对可用于检查方案是否错配？","options":["自动化运维—Ansible","将MongoDB列为本章标准平台组件","分布式缓存—Zookeeper","消息队列—Kafka"],"answers":[0,3],"explanation":"Ansible对应自动化运维，Kafka对应消息队列。分布式缓存对应Redis，Zookeeper承担分布式协调；MongoDB不在本章平台组件清单中。","focus":"平台组件角色核对","difficulty":"应用","sourceSection":"四、部署方案与组件","sourceEvidence":"Ansible 自动化运维、Zookeeper 分布式协调、Redis 分布式缓存、Kafka 消息队列","sourcePages":[29,30],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N367"},{"id":"N368","chapter":15,"type":"multi","stem":"按本章手册，批量初始化前发现OS架构未知、SSH端口不同、数据盘路径非默认。哪些核查合理？","options":["按实际挂载目录同步调整后续部署路径","以MAC地址替代hosts中用户和SSH信息","非22端口在ansible_ssh_port指定","通过系统信息、架构及内存检查确认环境"],"answers":[0,2,3],"explanation":"环境、连接和路径都属于前置一致性检查；MAC地址不是本章hosts必填项，也不能替代用户与SSH端口。","focus":"前置条件一致性检查","difficulty":"应用","sourceSection":"五、前置准备与批量初始化","sourceEvidence":"cat /etc/os-release、uname -m、free -g","sourcePages":[30],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N368"},{"id":"N369","chapter":15,"type":"multi","stem":"按本章init脚本与K8S步骤的边界，哪些交付检查合理？","options":["init脚本完成即可省略所有master初始化流程","K8S各节点仍需按手册完成swap、转发和镜像准备","将init脚本安装JDK21作为本章批量初始化验收项","不能因init已运行就声称K8S集群已自动初始化"],"answers":[1,3],"explanation":"本章init脚本口径是批量安装JDK1.8，不能把其他平台的JDK版本套入。init也不会自动完成K8S初始化，节点环境、镜像和master流程仍需独立核查。","focus":"基础初始化与集群初始化","difficulty":"应用","sourceSection":"五、前置准备与批量初始化","sourceEvidence":"批量安装 JDK 1.8","sourcePages":[30,31],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N369"},{"id":"N370","chapter":15,"type":"multi","stem":"按本章Docker与镜像仓库配置，哪些事项应一起检查？","options":["exec-opts按手册指定systemd，并在修改后完成重载与重启","将镜像数据默认堆在系统盘，无需关注容量风险","insecure-registries指向对应Harbor地址","data-root放在已挂载的数据目录下"],"answers":[0,2,3],"explanation":"持久化位置、仓库地址和cgroup驱动共同决定运行配置，修改后还须按手册生效。系统盘被镜像和数据占满有崩溃风险。","focus":"Docker配置完整性","difficulty":"应用","sourceSection":"六、Docker 与镜像仓库","sourceEvidence":"data-root 指定 docker 数据持久化存储目录","sourcePages":[30,31],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N370"},{"id":"N371","chapter":15,"type":"multi","stem":"按本章Harbor部署及镜像推送流程，哪些记录可用于判断前后配置一致？","options":["只要网页能打开就无需仓库登录和标签规范","harbor.yml中hostname与本机地址相符","只修改hostname并保留默认管理员密码，将data_volume误当作客户端推送参数","推送前完成docker login并使用Harbor地址/library/镜像名:latest标签"],"answers":[1,3],"explanation":"hostname要与本机一致，推送前要登录并使用正确仓库标签。管理员密码需修改，data_volume属于服务端持久化路径；网页可访问不能替代认证、标签和配置一致性。","focus":"镜像仓库前后链路","difficulty":"应用","sourceSection":"七、Harbor 镜像仓库","sourceEvidence":"修改 harbor_admin_password；配置 data_volume 数据持久化路径。","sourcePages":[31],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N371"},{"id":"N372","chapter":15,"type":"multi","stem":"按本章手册检查新K8S节点与多master加入计划，哪些约束正确？","options":["以已安装Kuboard为由省略节点和证书准备","新增master前同步必要证书并保留ca根证书","各节点按要求打开ip_forward、关闭swap并导入镜像","加入时携带certificate-key参数"],"answers":[1,2,3],"explanation":"节点环境、证书和加入参数各有职责，Kuboard是管理工具，不能替代集群初始化前置工作。","focus":"集群加入前置组合","difficulty":"应用","sourceSection":"八、K8S 集群初始化","sourceEvidence":"ca 根证书保留","sourcePages":[31],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N372"},{"id":"N373","chapter":15,"type":"multi","stem":"按本章中间件部署口径，哪些“组件—目标配置”配对准确？","options":["将Kuboard管理端口写成TiDB默认4000并认为两者等价","TiDB初始化前创建lightdata_db与nacos库","PostgreSQL新增nacos库，用TiDB初始化脚本替代postgis扩展","Nacos默认命名空间建议为iot，经NodePort使用30848"],"answers":[1,3],"explanation":"TiDB需准备lightdata_db和nacos；Nacos命名空间与NodePort应按对应配置核对。PostgreSQL则新增iot并加postgis扩展，不能套TiDB初始化；Kuboard与TiDB端口也不等价。","focus":"中间件配置域隔离","difficulty":"应用","sourceSection":"九、Kuboard 与中间件集群","sourceEvidence":"初始化新增数据库名为 iot，加入 postgis 扩展","sourcePages":[32],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N373"},{"id":"N374","chapter":15,"type":"multi","stem":"按本章FAQ与接入流程，哪些问题定位或验收意见合理？","options":["只要控制台登录成功，任何设备都可认定接入完成","设备厂商完成推送配置后，通过测试连接验证数据链路","Kafka堆积伴随磁盘100%时，检查消息积压与存储影响","镜像名或版本不匹配时，核查容器拉取及启动问题"],"answers":[1,2,3],"explanation":"平台登录、容器运行和设备数据接入是不同层次。FAQ提示消息、镜像等故障线索，设备接入仍需实际链路测试。","focus":"部署运行接入分层验收","difficulty":"应用","sourceSection":"十、Nginx 与平台接入","sourceEvidence":"kafka 消息堆积导致硬盘 100%","sourcePages":[32],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N374"},{"id":"N375","chapter":15,"type":"multi","stem":"按补全后的星瀚生命周期与端到端方案，哪些交付评审意见合理？","options":["把“怎么飞”归为用户密码管理，并据此取消建设管理智能体","围绕公共航线贯通规划、建设、运营、维护四环节","将“怎么飞”归于建设环节及建设管理智能体","需求调研后直接交付设备，将系统建设和运营反馈排除在端到端交付链条外"],"answers":[1,2],"explanation":"公共航线包含规划、建设、运营和维护，“怎么飞”归建设及建设智能体。端到端交付不能省略系统建设和运营反馈，也不能把建设业务归为用户密码管理。","focus":"生命周期与端到端衔接","difficulty":"应用","sourceSection":"一、平台定位与核心能力","sourceEvidence":"需求调研 → 系统建设 → 设备部署与运营实施","sourcePages":[28,29],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N375"},{"id":"N376","chapter":16,"type":"single","stem":"按本章方案，一条航线同时经过城市80米空域和450米空域。哪份建设建议兼顾两个区段？","options":["按120至300米热点增强方案包办全线","低段部署卫星，高段取消地面站","两个区段均只按城市地面现网处理","低段复用现网，较高区段评估独立对空专用站"],"answers":[3],"explanation":"80米城市区优先复用现网，450米处在300至600米独立对空专用站范围，不能把同一层方案套用全线。","focus":"跨高度覆盖组合","difficulty":"应用","sourceSection":"一、覆盖策略与技术方案","sourceEvidence":"分层覆盖：120 米以下城市区域复用现网基站；120 至 300 米沿航线与热点区域增强覆盖；300 至 600 米采用独立对空专用站；300 米以上与偏远地区以卫星与地面多网融合覆盖。四层各自对应不同技术手段，不可跨层套用。","sourcePages":[33],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N376"},{"id":"N377","chapter":16,"type":"single","stem":"按本章监管方案，设备提交了卡号码、IMSI、IMEI和无人机SN，工程师便称五码信息已齐且只需初次入网核验。应如何纠正？","options":["把SIM卡扣声作为第五码并替代飞行中核验","补工业互联网标识，并覆盖初次入网、飞行前和飞行中核验","已有四码即可称五码合一，无需补充或后续核验","只补飞行照片，核验仍只做初次入网即可"],"answers":[1],"explanation":"五码还包括工业互联网标识；三次核验分布在初次入网、飞行前和飞行中。信息完整性与核验时点是两个都要满足的条件。","focus":"五码身份关联","difficulty":"应用","sourceSection":"四、天翼星网平台与网联监管","sourceEvidence":"五码合一：IMSI、卡号码（MSISDN）、模组IMEI、无人机SN码及工业互联网标识。\n三次核验：在初次入网、飞行前、飞行中三个关键场景自动推送并校验五码信息；与信通院低空联网无人机监管平台的对接同样围绕这三个场景。","sourcePages":[35],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N377"},{"id":"N378","chapter":16,"type":"single","stem":"验收材料写“单载波方案第二载波仅覆盖天空；双载波方案地面用户优先第二载波”。按本章，两处应怎样修订？","options":["只把第二处改为地面优先第一载波","单载波第二载波覆盖地空，双载波地面优先第一载波","两处描述都符合本章方案","只把第一处改为第二载波覆盖地空"],"answers":[1],"explanation":"本章单载波方案的第二载波同时覆盖低空和地面；双载波方案通过地面用户优先第一载波实现地空分层。两处均需修改。","focus":"载波承载核查","difficulty":"应用","sourceSection":"一、覆盖策略与技术方案","sourceEvidence":"3.5G 单载波地空异频：选出的对空基站仅开通第二载波，且该第二载波同时覆盖低空区域与地面区域。\n3.5G 双载波地空异频：在原有 AAU 上开通第二载波；采用 4+3 的 SSB 波束模式；地面用户优先驻留第一载波，实现地空分层承载。","sourcePages":[33],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N378"},{"id":"N379","chapter":16,"type":"single","stem":"按资料评审500米空域方案：团队既要优化覆盖高度，又准备把800兆试点描述为比3.5G带宽更高。哪项修订完整？","options":["检查对空站机械角，并纠正800兆带宽更高的表述","保留带宽表述，仅把站点全部改为地面覆盖","只增加800兆站数量即可无需调整对空站参数","把500米空域改按城市120米以下策略设计"],"answers":[0],"explanation":"500米属于独立对空站面向的空域，机械角是覆盖高度相关参数；资料称800兆覆盖更远但带宽低于3.5G，不能同时承诺更高带宽。","focus":"对空站调参与频段取舍","difficulty":"应用","sourceSection":"一、覆盖策略与技术方案","sourceEvidence":"独立对空专用站：主要面向 300 至 600 米空域；可通过 5 至 30 度的天线机械角调整提升覆盖高度，机械下倾是关键参数。\n800 兆低空试点：采用与 2.1G 类似的双翼幅频天线，单站覆盖更远，但带宽低于 3.5G。","sourcePages":[33],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N379"},{"id":"N380","chapter":16,"type":"single","stem":"按本章网联监管方案，平台只在发卡时校验一次五码，飞行前与飞行中不再校验。哪种改进最符合原文？","options":["保留一次校验，只把校验页面名称改成三次核验","只在任务结束后下载照片，替代飞行过程核验","只查模组IMEI，替代全部身份字段和时点","在初次入网、飞行前、飞行中自动推送并校验完整五码"],"answers":[3],"explanation":"原文三次核验围绕三个关键场景，且推送校验对象为五码信息。增加页面标签或事后照片不能替代运行前和运行中的身份核验。","focus":"核验贯穿运行","difficulty":"应用","sourceSection":"四、天翼星网平台与网联监管","sourceEvidence":"三次核验：在初次入网、飞行前、飞行中三个关键场景自动推送并校验五码信息；与信通院低空联网无人机监管平台的对接同样围绕这三个场景。\n五码合一：IMSI、卡号码（MSISDN）、模组IMEI、无人机SN码及工业互联网标识。","sourcePages":[35],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N380"},{"id":"N381","chapter":16,"type":"single","stem":"按资料所述阶段，计划在一个省内所有地市同时试验并在验证前发行电信侧2000万号码。哪项调整同时纠正范围与先后关系？","options":["先选1至2个不大于地市级局点常态验证，通过后推进正式发行","保持全省同时测试，并以号码发行代替验证","先全省发行号码，再缩成1至2个局点验证","测试局点数不变，只把验证周期改为一天"],"answers":[0],"explanation":"资料给出1至2个不大于地市级测试局点和预计3个月常态验证；正式发行在试点验证通过之后，不能倒置。","focus":"试点节奏与号码发行","difficulty":"应用","sourceSection":"二、号段、卡片与商用节奏","sourceEvidence":"试点安排：各运营商选择 1 至 2 个不大于地市级的测试局点，常态化验证周期预计 3 个月。\n商用节奏：试点验证通过后，工信部着手电信侧 2000 万低空号码正式发行，天翼低空卡正式商用上线。","sourcePages":[33],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N381"},{"id":"N382","chapter":19,"type":"single","stem":"按本章用户手册，交付团队要建立新租户并配置登录双因子验证。哪份操作安排正确？","options":["只调整大屏地图中心点即可完成租户创建与认证","用数据库插入租户作为正规入口，取消短信邮箱","从管理端Web创建租户，并使用短信或邮箱双因子认证","从租户端直接建租户，并以更换Logo代替双因子认证"],"answers":[2],"explanation":"正规租户创建入口是管理端Web，登录双因子通过短信或邮箱。初始化界面与租户身份配置不是同一件事。","focus":"租户创建与认证入口","difficulty":"应用","sourceSection":"一、租户与用户管理（星云）","sourceEvidence":"租户创建：登录管理端web创建租户；租户端和数据库方式都不是正规入口。\n双因子认证：用户登录通过短信或邮箱实现双因子认证。","sourcePages":[40],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N382"},{"id":"N383","chapter":16,"type":"single","stem":"一个机队同时使用焊接贴片卡和可插拔卡，且白天持续飞行。按资料，哪种迁移策略更合理？","options":["先停止所有业务，完成换卡后再补迁移方案","既然贴片卡难更换，就将整个机队排除纳管","分类制定方案，贴片卡避免简单换号，可插拔卡先统一纳管再鼓励换新","要求两类卡都在飞行中拔出更换，以统一时间表"],"answers":[2],"explanation":"迁移首要约束是飞行和业务不中断、客户基本无感知。贴片卡不能简单换号，可插拔卡也应在换新前统一纳管，需分类而非一刀切。","focus":"存量卡分类迁移","difficulty":"应用","sourceSection":"二、号段、卡片与商用节奏","sourceEvidence":"迁移原则：必须保证无人机飞行和业务不中断、客户基本无感知，这是迁移方案设计的第一约束。\n迁移难点：多卡品迁移难题、新旧号段并存、业务不能停。部分旧版本 eSIM 不支持远程升级；贴片卡焊在硬件设备上无法换号；插拔卡可鼓励换新，但换新前需统一纳管。","sourcePages":[33,34],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N383"},{"id":"N384","chapter":16,"type":"single","stem":"按本章方案，某存量非专用号段机队需纳入监管，团队认为不能使用11700以外的数据。哪项路线最有依据？","options":["把卡扣声直接作为核心网CDR话单来源","只采集平台Logo名称，就能完成所有非专用号段监管","只等全部卡换成专用号段，过渡期间不做任何监管","结合核心网DPI与CDR话单取数，并按场景采用区域限制、停机或切片准入管控"],"answers":[3],"explanation":"原文专门给出非专用号段的DPI、CDR取数与多种管控手段。不能将专用号码规划误解为存量号段完全无法监管。","focus":"非专用号段取数与处置","difficulty":"应用","sourceSection":"四、天翼星网平台与网联监管","sourceEvidence":"非专用号段监管：取数来源主要是核心网DPI数据与CDR话单；手段包括敏感区域限制、停机管控、切片准入拦截。","sourcePages":[35],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N384"},{"id":"N385","chapter":19,"type":"single","stem":"按本章手册，管理员把“手机号异常时可用数据库修改”理解为“创建租户也应常规直改数据库”。应如何纠正？","options":["只要手机号能修改，租户无需创建也能正常隔离管理","租户创建只能到租户端个人中心，管理端不能创建","手机号异常修改是逃生通道，租户创建仍应从管理端Web正规入口进行","数据库可改手机号就说明所有租户创建都应直接写库"],"answers":[2],"explanation":"原文对手机号异常修改提供逃生通道，不代表数据库成为所有管理动作的正规入口。租户创建与信息修正须按各自规则办理。","focus":"手机号维护与异常通道","difficulty":"应用","sourceSection":"一、租户与用户管理（星云）","sourceEvidence":"手机号修改：租户端个人中心可改、管理端用户管理可改，异常情况下还可以用数据库修改作为逃生通道——三种途径都支持。\n租户创建：登录管理端web创建租户；租户端和数据库方式都不是正规入口。","sourcePages":[40],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N385"},{"id":"N386","chapter":16,"type":"single","stem":"按资料测试低空卡，配置单写“切片1-080000、5QI9”，运维声称与低空专用配置等价。应如何修正？","options":["按低空专用切片1-040006和资料阶段的5QI7核对","只改成1-040006，仍称5QI9与5QI7优先级相同","只保留1-080000，将其解释为低空专用切片","切片与5QI都不需要检查，只看号码位数"],"answers":[0],"explanation":"资料区分低空专用与物联网全局切片，并说明低空卡暂按5QI7、较5QI9优先级更高。两项都需核对，不能只改编号或只看号段。","focus":"切片与QoS双重校验","difficulty":"应用","sourceSection":"三、网络保障、切片与计费","sourceEvidence":"切片号：低空专用切片为 1-040006，物联网全局切片为 1-080000，两个编号容易被互换设置。\n接入优先级：天翼低空卡暂按 5QI7 接入，相比普通物联网业务的 5QI9，接入优先级更高。","sourcePages":[34],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N386"},{"id":"N387","chapter":16,"type":"single","stem":"客户已有VPDN，但还要求链路保障和更高QoS。按资料，哪种答复准确？","options":["已有VPDN后无需核验任何QoS与带宽指标","VPDN与多DNN都不在低空卡支持能力内","低空卡仅提供号码，无法结合核心网保障策略","可结合切片、多通道和最低带宽保障，不能以已有VPDN替代所有保障"],"answers":[3],"explanation":"VPDN是能力之一，核心网保障还包括5G切片、多通道和最低带宽。单项功能存在不代表资源调度与传输性能已自动满足。","focus":"最低带宽与多通道保障","difficulty":"应用","sourceSection":"三、网络保障、切片与计费","sourceEvidence":"核心网保障策略：5G 切片、多通道通信、虚拟专用网络、最低带宽保障。\n低空卡支持的能力：多 DNN 通道、VPDN 专用通道、高 QoS 等级、低空专用切片。","sourcePages":[34],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N387"},{"id":"N388","chapter":16,"type":"single","stem":"按本章构建非专用号段识别模型，设计稿写“发现后先处置再识别”，并沿用大下行小上行特征。应怎样修改？","options":["保留先处置再识别，只增加一个模型名称","仅把大下行改小下行，但继续跳过识别和粗定位","按发现、识别、粗定位、处置组织，并以大上行小下行作为典型流量特征","把所有步骤改成生成账单，不分析流量"],"answers":[2],"explanation":null,"focus":"研判顺序与流量特征","difficulty":"应用","sourceSection":"四、天翼星网平台与网联监管","sourceEvidence":"研判模型流程：发现→识别→粗定位→处置。无人机场景的典型流量特征是大上行、小下行，与地面传统业务正好相反。","sourcePages":[35],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"none","displayId":"N388"},{"id":"N389","chapter":16,"type":"single","stem":"渠道商希望让企业客户看到可追溯的实时费用，草案却把B2B和B2B2C合并出账且无明细。按资料应采用哪种方案？","options":["只提供卡号，不提供B2B2C平台能力","经渠道商侧B2B2C能力，落实独立实时计费与分离账单明细","由政府侧网联监管替代渠道商计费系统","保留无明细合账，以免客户核对使用情况"],"answers":[1],"explanation":"星网平台渠道商侧提供B2B2C能力；计费模式要求独立实时计费、B2B与B2B2C分离且可查明细，合账无明细不符合资料。","focus":"计费分账与明细","difficulty":"应用","sourceSection":"三、网络保障、切片与计费","sourceEvidence":"计费模式：采用独立的 B2B2C 实时计费，B2B 与 B2B2C 分离账单、可查明细，避免合并出账无明细的做法。\n三端能力：客户侧（门户网站、卡管中心、资费管理、客服中心）、渠道商侧（B2B2C 平台）、政府侧（网联监管）。","sourcePages":[34],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N389"},{"id":"N390","chapter":16,"type":"single","stem":"按资料为客户开通高精定位套餐，交付单只有通信资费，没有RTK账号与服务接入信息。最合理的补充是？","options":["把RTK账号替换为政府侧监管账号","让客户自行另购RTK，再将原套餐作为完整交付","只提供AK，账号和服务接入点不需要交付","为号卡生成专属RTK账号及AK、SK和接入点，并按一体化资费出账"],"answers":[3],"explanation":"资料同时要求技术开通信息与商业资费耦合：专属RTK账号、AK/SK及接入点配套下发，RTK服务耦合通信资费统一出账。","focus":"RTK开通与资费协同","difficulty":"应用","sourceSection":"三、网络保障、切片与计费","sourceEvidence":"高精定位增值服务：客户订购后平台为该号卡生成专属 RTK 账号，同步下发 AK、SK 及服务接入点信息；合作模式是把 RTK 服务耦合进通信资费，实现资费一体化出账，而不是让客户分别采购。","sourcePages":[34],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N390"},{"id":"N391","chapter":16,"type":"single","stem":"按本章所述阶段，规划提出高空偏远地区多网融合，销售据此承诺天枢、天擎当前已支持星地一体融合。应如何评审？","options":["网络规划提及卫星即可证明所有终端已具备星地融合","终端适配机型多就必然具备卫星通信能力","区分网络规划与终端现有能力，不作终端已支持星地融合的承诺","只要将终端名称改为新版本即可无测试承诺该能力"],"answers":[2],"explanation":"原文虽提出网络多网融合策略，但明确当前天枢、天擎尚未支持卫星与地面通信一体融合。规划方向不等于每个终端的现有能力。","focus":"网络融合与终端能力边界","difficulty":"应用","sourceSection":"四、天翼星网平台与网联监管","sourceEvidence":"终端适配：天枢终端已适配5个以上主流品牌、20款以上机型；天枢、天擎终端目前尚未支持卫星通信与地面通信一体融合。\n分层覆盖：120 米以下城市区域复用现网基站；120 至 300 米沿航线与热点区域增强覆盖；300 至 600 米采用独立对空专用站；300 米以上与偏远地区以卫星与地面多网融合覆盖。四层各自对应不同技术手段，不可跨层套用。","sourcePages":[33,35],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N391"},{"id":"N392","chapter":16,"type":"single","stem":"同一项目需让企业客户管理套餐、渠道商处理B2B2C业务、政府查看网联监管。按资料，哪种功能配置正确？","options":["客户侧网联监管、渠道侧资费管理、政府侧B2B2C","将三端都替换为航空器维修模块","所有功能仅放在政府侧，客户不需要门户","客户侧资费管理、渠道侧B2B2C、政府侧网联监管"],"answers":[3],"explanation":"星网按服务对象分三端：客户侧有门户、卡管与资费，渠道商侧为B2B2C，政府侧为网联监管。应同时匹配对象与功能。","focus":"平台三端权限场景","difficulty":"应用","sourceSection":"四、天翼星网平台与网联监管","sourceEvidence":"三端能力：客户侧（门户网站、卡管中心、资费管理、客服中心）、渠道商侧（B2B2C 平台）、政府侧（网联监管）。","sourcePages":[34],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N392"},{"id":"N393","chapter":16,"type":"single","stem":"按本章五码合一设计，表单把“模组IMEI”一栏重命名为“无人机SN”，同时删去MSISDN。哪项修正准确？","options":["IMEI和无人机SN应分别保留，卡号码MSISDN也须独立纳入","MSISDN可由照片文件名代替，无需独立字段","IMEI与SN完全同义，保留任何一个都可满足五码完整性","只保留设备品牌名就能覆盖全部五码信息"],"answers":[0],"explanation":"五码分别关联用户识别、卡号码、模组、无人机与工业互联网标识。IMEI、SN和MSISDN不是同义字段，不能合并或删项。","focus":"身份字段区分","difficulty":"应用","sourceSection":"四、天翼星网平台与网联监管","sourceEvidence":"五码合一：IMSI、卡号码（MSISDN）、模组IMEI、无人机SN码及工业互联网标识。","sourcePages":[35],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N393"},{"id":"N394","chapter":19,"type":"single","stem":"按本章星巡本地化手册，项目既要把地图居中到新城市，也要更换监管和运营登录页名称。配置应如何分配？","options":["地图中心点到sys_config，登录页平台名称到sys_config_open","地图中心点写sys_config_open，登录页名称写sys_config","两类内容都只写入sys_config_open且无需地图配置","只更换Logo即可自动同步地图城市和全部平台名称"],"answers":[0],"explanation":null,"focus":"平台名称与地图配置分流","difficulty":"应用","sourceSection":"二、界面本地化（星巡）","sourceEvidence":"两类配置表：地图中心点配置在sys_config表；监管/运营平台登录页平台名称修改在sys_config_open表。","sourcePages":[40],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"none","displayId":"N394"},{"id":"N395","chapter":19,"type":"single","stem":"按本章手册，监管与运营登录页名称已改，但大屏登录页仍显示旧名称。团队只准备继续改sys_config_open。更合适的处理是什么？","options":["只反复改地图中心点，就能保证大屏名称变化","保留已完成的配置，另核对大屏../cim/dist/config/prod.js","只更换设备推送地址，不核对大屏配置文件","删除所有租户，以触发大屏标题自动重建"],"answers":[1],"explanation":"监管/运营登录页平台名称与大屏登录页名称入口不同，前者在sys_config_open，后者编辑prod.js。局部已生效不代表所有界面共享同一配置。","focus":"大屏与监管运营名称分流","difficulty":"应用","sourceSection":"二、界面本地化（星巡）","sourceEvidence":"大屏登录页名称：编辑../cim/dist/config/prod.js文件。\n两类配置表：地图中心点配置在sys_config表；监管/运营平台登录页平台名称修改在sys_config_open表。","sourcePages":[40],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N395"},{"id":"N396","chapter":19,"type":"single","stem":"按本章手册，浏览器中调整了大屏视角并取得__g._camera.get()结果，刷新后仍回旧视角。最应补什么？","options":["只更换平台Logo，不必检查视角配置","只把地图截图保存到电脑，视角就必定持久化","把取得视角命令换成租户创建入口即可","同步核对sys_config中bigscreen.*.location.page配置项"],"answers":[3],"explanation":"浏览器获取当前视角只是取值步骤，原文还要求同步修改sys_config对应视角配置项。临时画面调整不等于持久化配置完成。","focus":"视角获取与持久配置","difficulty":"应用","sourceSection":"二、界面本地化（星巡）","sourceEvidence":"大屏地图视角：浏览器控制台用__g._camera.get()获取当前视角配置；修改后还需同步修改sys_config表中config_key为bigscreen.*.location.page的配置项。","sourcePages":[40],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N396"},{"id":"N397","chapter":19,"type":"single","stem":"按本章手册，大屏已正确显示本地城市，但收不到无人机实时轨迹。哪项排查更针对？","options":["删除所有空域记录是本章首选排查手段","只更改登录页平台名称即可恢复实时轨迹","优先核对sys_config中*.mqtt.*配置，而非仅反复修改地图中心点","地图中心正确即证明MQTT已配置正确，可直接结案"],"answers":[2],"explanation":"城市中心点正确只证明静态地图配置的一部分；实时轨迹依赖相应MQTT配置。原文对此现象要求优先检查*.mqtt.*，不能用静态地图成功代替动态链路证据。","focus":"静态本地化与实时轨迹分流","difficulty":"应用","sourceSection":"二、界面本地化（星巡）","sourceEvidence":"大屏MQTT：修改sys_config表中config_key为*.mqtt.*的配置项；大屏无法接收无人机实时轨迹时，优先检查该MQTT配置。\n两类配置表：地图中心点配置在sys_config表；监管/运营平台登录页平台名称修改在sys_config_open表。","sourcePages":[40],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N397"},{"id":"N398","chapter":19,"type":"single","stem":"按本章手册，中心点配置已保存，交付员只看登录页名称变更就称地图本地化验收完成。应补哪种验证？","options":["只增加K8S节点数，就可证明地图中心正确","只检查租户是否能改手机号，以替代地图验证","只确认Logo图片能打开，就无需进入地图业务","在监管/运营平台新建空域、航路航线或起降点，检查地图是否居中目标城市"],"answers":[3],"explanation":"登录名称与地图中心是不同配置；原文通过新建空域、航路航线、起降点等实际业务入口验证地图居中目标城市。保存动作本身不足以验收。","focus":"地图本地化验收方法","difficulty":"应用","sourceSection":"二、界面本地化（星巡）","sourceEvidence":"验证方法：地图中心点配置完成后，在监管/运营平台新建空域、航路航线、起降点，验证地图是否居中于目标城市。\n两类配置表：地图中心点配置在sys_config表；监管/运营平台登录页平台名称修改在sys_config_open表。","sourcePages":[40],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N398"},{"id":"N399","chapter":16,"type":"multi","stem":"按本章覆盖策略评审一份跨城市与偏远区域的建设清单，哪些安排符合资料？","options":["偏远350米段沿用120米以下城市现网复用策略，不另评估多网融合","城市100米段优先复用现网基站","250米热点段沿航线增强","所有航段都不区分高度，只建设同一种地面站"],"answers":[1,2],"explanation":"城市100米优先复用现网，250米热点沿航线增强。偏远350米还需考虑卫星与地面多网融合，不能跨层直接套用低高度城市策略；所有区段也不宜采用同一种站型。","focus":"覆盖分层验收","difficulty":"应用","sourceSection":"一、覆盖策略与技术方案","sourceEvidence":"分层覆盖：120 米以下城市区域复用现网基站；120 至 300 米沿航线与热点区域增强覆盖；300 至 600 米采用独立对空专用站；300 米以上与偏远地区以卫星与地面多网融合覆盖。四层各自对应不同技术手段，不可跨层套用。","sourcePages":[33],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N399"},{"id":"N400","chapter":19,"type":"multi","stem":"按本章星云用户手册，哪些管理安排有依据？","options":["手机号可在租户端个人中心或管理端用户管理修改","新租户从管理端Web创建","登录双因子可通过短信或邮箱实现","因数据库可作为手机号异常逃生通道，创建租户也应常规直接写库"],"answers":[0,1,2],"explanation":"原文分别规定租户创建正规入口、认证方式和手机号修改途径。异常逃生通道不能扩张成租户创建的常规路径。","focus":"租户与个人信息管理边界","difficulty":"应用","sourceSection":"一、租户与用户管理（星云）","sourceEvidence":"租户创建：登录管理端web创建租户；租户端和数据库方式都不是正规入口。\n手机号修改：租户端个人中心可改、管理端用户管理可改，异常情况下还可以用数据库修改作为逃生通道——三种途径都支持。\n双因子认证：用户登录通过短信或邮箱实现双因子认证。","sourcePages":[40],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N400"},{"id":"N401","chapter":19,"type":"multi","stem":"按本章手册开展星巡本地化，哪些配置映射正确？","options":["监管/运营登录页名称使用sys_config_open","只改监管平台Logo即可自动完成所有页面名称和地图中心配置","大屏登录页名称需核对prod.js文件","地图中心点使用sys_config"],"answers":[0,2,3],"explanation":"图片资源、名称和地图中心各有配置对象。原文未把Logo替换定义为自动同步其他配置的操作，验收应逐项核对。","focus":"星巡界面配置对象分离","difficulty":"应用","sourceSection":"二、界面本地化（星巡）","sourceEvidence":"UI资源替换：初始化配置包含大屏标题图片更换、监管平台Logo更换、运营平台Logo更换三类。\n两类配置表：地图中心点配置在sys_config表；监管/运营平台登录页平台名称修改在sys_config_open表。\n大屏登录页名称：编辑../cim/dist/config/prod.js文件。","sourcePages":[40],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N401"},{"id":"N402","chapter":16,"type":"multi","stem":"按资料为混合卡型机队编制迁移风险表，哪些项应纳入？","options":["把焊接贴片卡列入现场拔插换新的实施清单","迁移实施要约束飞行和业务不中断","可插拔卡可以跳过统一纳管直接全面替换","部分旧版eSIM不能远程升级"],"answers":[1,3],"explanation":"迁移期间业务不中断和部分旧版eSIM无法远程升级，都应纳入风险表。焊接贴片卡不能按可拔插卡方式直接换号；可拔插卡鼓励换新前也应先统一纳管。","focus":"卡型迁移风险识别","difficulty":"应用","sourceSection":"二、号段、卡片与商用节奏","sourceEvidence":"迁移难点：多卡品迁移难题、新旧号段并存、业务不能停。部分旧版本 eSIM 不支持远程升级；贴片卡焊在硬件设备上无法换号；插拔卡可鼓励换新，但换新前需统一纳管。\n迁移原则：必须保证无人机飞行和业务不中断、客户基本无感知，这是迁移方案设计的第一约束。","sourcePages":[33,34],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N402"},{"id":"N403","chapter":19,"type":"multi","stem":"按本章手册，大屏改造的哪些验收方法有依据？","options":["新建空域、航路航线或起降点验证地图居中目标城市","获取当前视角后同步核对bigscreen.*.location.page配置项","只要能看到登录页，就可免除地图和实时轨迹验证","实时轨迹不更新时优先检查*.mqtt.*配置"],"answers":[0,1,3],"explanation":"视角持久化、消息订阅和业务地图验证是不同检查环节。登录页可见只是页面入口可达，不能证明后续地图与数据链路正确。","focus":"大屏地图与实时数据验收","difficulty":"应用","sourceSection":"二、界面本地化（星巡）","sourceEvidence":"大屏地图视角：浏览器控制台用__g._camera.get()获取当前视角配置；修改后还需同步修改sys_config表中config_key为bigscreen.*.location.page的配置项。\n大屏MQTT：修改sys_config表中config_key为*.mqtt.*的配置项；大屏无法接收无人机实时轨迹时，优先检查该MQTT配置。\n验证方法：地图中心点配置完成后，在监管/运营平台新建空域、航路航线、起降点，验证地图是否居中于目标城市。","sourcePages":[40],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N403"},{"id":"N404","chapter":16,"type":"multi","stem":"按本章检查网联监管接口，哪些审查意见成立？","options":["校验场景应覆盖初次入网、飞行前和飞行中","IMSI、MSISDN与模组IMEI应按不同身份字段传递","把模组IMEI当作无人机SN的替代字段，以减少重复上报","只要收到模组IMEI就可省略所有其他身份字段"],"answers":[0,1],"explanation":"IMSI、MSISDN、IMEI是不同标识，且三次核验覆盖初次入网、飞行前和飞行中。模组IMEI不能替代无人机SN，五码信息也不能被单一模组字段省略。","focus":"五码完整性核验","difficulty":"应用","sourceSection":"四、天翼星网平台与网联监管","sourceEvidence":"五码合一：IMSI、卡号码（MSISDN）、模组IMEI、无人机SN码及工业互联网标识。\n三次核验：在初次入网、飞行前、飞行中三个关键场景自动推送并校验五码信息；与信通院低空联网无人机监管平台的对接同样围绕这三个场景。","sourcePages":[35],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N404"},{"id":"N405","chapter":16,"type":"multi","stem":"方案已在初次入网校验五码，但准备取消飞行前与飞行中推送。按原文，哪些补充要求有依据？","options":["恢复飞行中的五码自动推送与校验","与信通院监管平台的对接也围绕这三个关键场景","初次入网校验通过后，后续全部身份核验均可省略","恢复飞行前的五码自动推送与校验"],"answers":[0,1,3],"explanation":"原文三次核验及与信通院平台对接均围绕初次入网、飞行前、飞行中，不能将初次校验成功作为取消后续核验的充分理由。","focus":"运行核验与平台对接","difficulty":"应用","sourceSection":"四、天翼星网平台与网联监管","sourceEvidence":"三次核验：在初次入网、飞行前、飞行中三个关键场景自动推送并校验五码信息；与信通院低空联网无人机监管平台的对接同样围绕这三个场景。\n五码合一：IMSI、卡号码（MSISDN）、模组IMEI、无人机SN码及工业互联网标识。","sourcePages":[35],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N405"},{"id":"N406","chapter":16,"type":"multi","stem":"按资料打包通信与RTK增值服务时，哪些交付要求成立？","options":["B2B与B2B2C账单分离且可查明细","在B2B2C统计中合并B2B账单，明细仅保留总额","RTK账号及AK、SK和服务接入点配套提供","RTK服务按本章推荐由客户单独采购，并与通信套餐分开计费"],"answers":[0,2],"explanation":"原文要求B2B与B2B2C账单分离且可查明细，技术开通还需专属RTK账号及AK、SK和接入点。RTK应耦合通信资费一体化出账；将其拆开另购或把B2B与B2B2C合并无明细，均偏离资料口径。","focus":"计费与RTK交付","difficulty":"应用","sourceSection":"三、网络保障、切片与计费","sourceEvidence":"计费模式：采用独立的 B2B2C 实时计费，B2B 与 B2B2C 分离账单、可查明细，避免合并出账无明细的做法。\n高精定位增值服务：客户订购后平台为该号卡生成专属 RTK 账号，同步下发 AK、SK 及服务接入点信息；合作模式是把 RTK 服务耦合进通信资费，实现资费一体化出账，而不是让客户分别采购。","sourcePages":[34],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N406"},{"id":"N407","chapter":16,"type":"multi","stem":"安全评审把“专用切片”直接等同于完成双重加密。按本章，哪些纠正意见成立？","options":["只做账单分离即可替代信道认证","低空卡具有专用切片就等于无需应用层加密","双重防护仍需网络层VPN认证信道加密","双重防护仍需应用层端到端信源加密"],"answers":[2,3],"explanation":"资料对双重防护明确分层。专用切片属于网络能力，并不能在逻辑上替代应用层端到端加密和VPN认证的分别落实。","focus":"双重防护边界","difficulty":"应用","sourceSection":"三、网络保障、切片与计费","sourceEvidence":"量子安全加密：提供双重防护：应用层端到端加密（信源加密）+ 网络层 VPN 认证（信道加密）。\n低空卡支持的能力：多 DNN 通道、VPDN 专用通道、高 QoS 等级、低空专用切片。","sourcePages":[34],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N407"},{"id":"N408","chapter":16,"type":"multi","stem":"按本章设计非专用号段监管闭环，哪些安排有原文依据？","options":["研判按发现、粗定位、识别、处置的顺序衔接","可结合敏感区域限制、停机管控和切片准入拦截","结合核心网DPI数据与CDR话单作为取数来源","把大下行小上行作为本章无人机典型流量特征"],"answers":[1,2],"explanation":"DPI与CDR是本章给出的取数来源，区域限制、停机与切片准入属于管控手段。研判顺序应是发现、识别、粗定位、处置；典型流量应为大上行、小下行，不能将这两处顺序或特征倒置。","focus":"非专用号段监管链","difficulty":"应用","sourceSection":"四、天翼星网平台与网联监管","sourceEvidence":"非专用号段监管：取数来源主要是核心网DPI数据与CDR话单；手段包括敏感区域限制、停机管控、切片准入拦截。\n研判模型流程：发现→识别→粗定位→处置。无人机场景的典型流量特征是大上行、小下行，与地面传统业务正好相反。","sourcePages":[35],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N408"},{"id":"N409","chapter":16,"type":"multi","stem":"连接管理平台出现订单、卡状态与计费关联不一致时，按资料应核对哪些来源？","options":["只核对飞行成果库中的照片数量","物联核心网卡资料","省CRM合账号码创建后的统一计费关联","集团CRM订单受理与资料同步"],"answers":[1,2,3],"explanation":"星网的三类来源分别支撑业务受理、卡资料与计费关联。飞行照片属于作业成果，不能替代这些连接管理数据。","focus":"数据链路完整性","difficulty":"应用","sourceSection":"四、天翼星网平台与网联监管","sourceEvidence":"数据来源：集团 CRM 的订单受理与资料同步、物联核心网的卡资料数据、省 CRM 合账号码创建后的统一计费关联。集团正面向车联网、卫星、低空等高价值垂类推进数据分离，低空数据由星网平台集约化管理。\n平台定位：天翼星网平台是对标天翼物联 5GCMP 的低空垂类连接管理平台。","sourcePages":[34],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N409"},{"id":"N410","chapter":19,"type":"multi","stem":"按本章星瀚手册，哪些内容可以纳入初始化交付清单？","options":["大屏本地化地图配置及相应生效处理","自动扩容K8S集群节点作为初始化自带功能","设备接入管理配置","登录背景与Logo更换"],"answers":[0,2,3],"explanation":"原文明确支持前三类初始化内容，但不支持自动扩容K8S。地图配置还需重启对应服务生效，不能只写“已保存”即结束。","focus":"星瀚初始化能力审查","difficulty":"应用","sourceSection":"三、平台初始化（星瀚）","sourceEvidence":"初始化功能范围：支持更换登录背景图片及LOGO、大屏配置本地化地图、设备接入管理配置；不支持自动扩容K8S集群节点。\nLOGO与背景更换：访问nginx服务IP:18888/admin，进入平台管理→文件菜单操作。\n本地化地图生效：修改dk-dist-config配置后，需重启dk-dist服务使配置生效。","sourcePages":[40],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N410"},{"id":"N411","chapter":19,"type":"multi","stem":"按本章星瀚手册，哪些补验可避免把“配置已填”误当成“功能已生效”？","options":["只保存地图配置但不按手册执行生效步骤即可认定完成","修改dk-dist-config后重启dk-dist使本地化地图配置生效","厂商完成推送配置后使用测试连接核对数据链路","只要能登录admin页面，设备链路就必定全部畅通"],"answers":[1,2],"explanation":"地图需要规定的配置生效步骤，设备推送需要实际连通测试。能登录管理页只说明管理入口可达，不代表业务配置和链路均完成。","focus":"从配置到链路生效","difficulty":"应用","sourceSection":"三、平台初始化（星瀚）","sourceEvidence":"本地化地图生效：修改dk-dist-config配置后，需重启dk-dist服务使配置生效。\n设备链路验证：设备厂商配置好推送数据后，点击测试连接检查数据链路是否打通。","sourcePages":[40,41],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N411"},{"id":"N412","chapter":16,"type":"multi","stem":"按资料，一条500米航线既有覆盖盲区又有资源竞争问题，哪些评审方向合理？","options":["评估切片、多通道和最低带宽等核心网保障","只因基站覆盖存在就跳过QoS保障评估","把卡片切片配置完成当作无线盲区已自动消除","评估300至600米独立对空站等无线覆盖方案"],"answers":[0,3],"explanation":"无线覆盖与核心网资源保障是两层工作。前者解决是否覆盖，后者处理资源与性能保障，任何一层均不能自动替代另一层。","focus":"分层规划与保障组合","difficulty":"应用","sourceSection":"一、覆盖策略与技术方案","sourceEvidence":"分层覆盖：120 米以下城市区域复用现网基站；120 至 300 米沿航线与热点区域增强覆盖；300 至 600 米采用独立对空专用站；300 米以上与偏远地区以卫星与地面多网融合覆盖。四层各自对应不同技术手段，不可跨层套用。\n核心网保障策略：5G 切片、多通道通信、虚拟专用网络、最低带宽保障。","sourcePages":[33,34],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N412"},{"id":"N413","chapter":16,"type":"multi","stem":"按本章所述阶段评审终端与网络能力承诺，哪些判断成立？","options":["偏远高空多网融合规划不能证明现有天枢、天擎已支持星地一体融合","只要网络规划出现卫星二字，所有现有终端都可直接承诺支持星地融合","资料阶段的天枢适配范围为5个以上主流品牌、20款以上机型","应依据当前终端能力边界安排交付承诺"],"answers":[0,2,3],"explanation":"原文终端适配范围与当前不支持星地一体融合同时存在。适配数量和网络规划都不能推导未具备的终端功能，交付需尊重能力边界。","focus":"终端适配与融合承诺","difficulty":"应用","sourceSection":"四、天翼星网平台与网联监管","sourceEvidence":"终端适配：天枢终端已适配5个以上主流品牌、20款以上机型；天枢、天擎终端目前尚未支持卫星通信与地面通信一体融合。\n分层覆盖：120 米以下城市区域复用现网基站；120 至 300 米沿航线与热点区域增强覆盖；300 至 600 米采用独立对空专用站；300 米以上与偏远地区以卫星与地面多网融合覆盖。四层各自对应不同技术手段，不可跨层套用。","sourcePages":[33,35],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N413"},{"id":"N414","chapter":17,"type":"single","stem":"巡查员需要每天早晨按固定点位拍照，并在指定点自动开启AI算法。按本章，应怎样组合航线与计划？","options":["航点航线配置动作，并采用多次重复定时计划","仅复制昨日照片，不安排航线和飞行计划","用带状航线替代所有动作，计划设为单次定时","只用指点飞行，不设置完整航线和重复计划"],"answers":[0],"explanation":"指定航点执行拍照与算法等动作适合航点航线；每日固定时间重复执行则对应多次重复定时。航线决定怎么飞，计划决定何时执行。","focus":"航线动作与周期计划","difficulty":"应用","sourceSection":"一、航线类型与适用场景","sourceEvidence":"航点航线：可在航点上挂载动作，如自动开启 AI 算法、喊话器、拍照，适合\"边飞边执行动作\"的任务。\n计划方式：单次定时、多次重复定时、不定时。每天固定时间对固定区域巡查应采用多次重复定时。","sourcePages":[35,36],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N414"},{"id":"N415","chapter":17,"type":"single","stem":"值班员临时要求查看地图上一处情况，不需建立长期航线。按本章，哪种操作安排同时兼顾效率与安全？","options":["必须先建立每天重复计划，才能临时查看一次","直接调整云台即可替代飞向指定位置和安全设置","使用指点飞行，因此可跳过全部飞行前设置","使用指点飞行，并在飞行前核对失联动作、返航高度与限高"],"answers":[3],"explanation":"指点飞行适合临时查看，但其便利性不免除驾驶舱飞行前设置。任务入口与安全配置需要同时落实。","focus":"临时查看与飞行安全","difficulty":"应用","sourceSection":"一、航线类型与适用场景","sourceEvidence":"指点飞行：临时让无人机飞往地图指定位置查看，不需要提前创建完整航线，是\"应急看一眼\"的首选功能。\n驾驶舱飞行前设置：飞行前需完成飞行设置（含失联动作、返航高度、限高等），这是飞行安全的入口环节。","sourcePages":[35,36],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N415"},{"id":"N416","chapter":17,"type":"single","stem":"园区需要周期性覆盖巡查，之后既要看本次照片，也要回放完整历史视频。按资料哪种组合最合适？","options":["带状航线，完整视频到角色管理，照片到流程中心","面状航线，照片到成果库，完整历史视频到历史库","巡逻航线，全部作业数据只到个人中心","只在驾驶舱实时看一次，不保留成果与历史入口"],"answers":[1],"explanation":"面状航线适合大范围覆盖；成果库统一查看照片视频等作业数据，历史库承担完整历史视频回看。实时观看不能替代事后归档复盘。","focus":"覆盖式巡查与结果复盘","difficulty":"应用","sourceSection":"一、航线类型与适用场景","sourceEvidence":"面状航线：按预设范围自动完成覆盖式飞行，适合面积较大的施工区域、园区等周期性巡查。\n成果库：统一查看某次飞行产生的照片、视频等作业数据；支持用历史图片进行二三维模型重建；支持在地图中加载成果、标注显隐、对比。\n历史库：下载 AI 飞行报告、回看上次飞行的全程历史视频。","sourcePages":[35,36],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N416"},{"id":"N417","chapter":17,"type":"single","stem":"某重复计划的两个航点位置不合理，下一次飞行即将执行，之后还要恢复任务。按资料应如何处理？","options":["只改照片名称，原计划继续执行","永久删除全部设备，避免下一次任务触发","删除用户账号以停止计划，事后重新建账号","先挂起计划，再修改航点位置，保留后续恢复可能"],"answers":[3],"explanation":"紧急阻止下一次飞行且需恢复时用挂起；既有航线可通过修改、移动、新增或删除航点修订。停计划与改航线要分开完成。","focus":"计划挂起与航线修订","difficulty":"应用","sourceSection":"二、计划与飞行控制","sourceEvidence":"计划挂起：发现已配置的飞行计划不合理、需要紧急阻止下一次飞行，应使用\"挂起\"而不是删除，保留后续恢复的可能。\n航线编辑：移动航点、修改航点位置、新增航点、删除航点，四种操作均可调整既有航线。","sourcePages":[36,37],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N417"},{"id":"N418","chapter":17,"type":"single","stem":"AI发现疑似问题后，业务方既要确认其地图位置，又要跟踪派单处置。按本章，哪条路径最完整？","options":["只下载模型文件，识别结果无需进入处置流转","先目标点标注确认位置，再经工单中心派单流转","先地图测距确认目标身份，再在个人中心派单","只保存视频截图，不确认目标位置也不派单"],"answers":[1],"explanation":"目标点标注是确认识别目标位置的入口，工单中心承接派单与处置。截图留存不等同于位置确认，更不代表完成业务处置。","focus":"识别位置确认与派单","difficulty":"应用","sourceSection":"三、功能模块归口","sourceEvidence":"目标点标注：AI 识别完成后，首先通过目标点标注确认识别出的目标位置；地图测距、视频截图、航线复制都不是确认目标位置的手段。\n工单中心：承接 AI 识别结果的派单与处置流转，是\"识别—处置\"闭环的落点。","sourcePages":[36,37],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N418"},{"id":"N419","chapter":17,"type":"single","stem":"演示需要两项能力：用上周图片重建模型，并在当前飞行中实时建模。按资料，怎样分配模块？","options":["两者都只能用个人中心","历史图片一律不能用于模型重建，实时建模只能到报告中心","历史图片重建用消息通知，实时建模用角色管理","历史图片重建用成果库，实时建模用驾驶舱"],"answers":[3],"explanation":"成果库支持用历史图片二三维重建，驾驶舱还承担实时建模。区分数据产生时机可帮助选择模块。","focus":"成果重建与实时建模","difficulty":"应用","sourceSection":"三、功能模块归口","sourceEvidence":"成果库：统一查看某次飞行产生的照片、视频等作业数据；支持用历史图片进行二三维模型重建；支持在地图中加载成果、标注显隐、对比。\n驾驶舱：除实时操控外，还承担实时建模功能。","sourcePages":[36],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N419"},{"id":"N420","chapter":17,"type":"single","stem":"某操作员离职，新接手人员只应执行任务、不能分配账号权限。按资料，哪种配置同时解决连续性与权限边界？","options":["把原用户所有账号权限无差别复制给接手者","直接注销原用户且忽略设备计划归属，再授予全权限","只修改消息通知，不处理资源归属和角色","移交设备和计划所属人，并用角色管理限制权限"],"answers":[3],"explanation":"用户管理的移交解决设备与计划归属，角色管理决定能做什么。资源连续交接与最小业务权限是两个需要分别处理的事项。","focus":"离职移交与权限控制","difficulty":"应用","sourceSection":"三、功能模块归口","sourceEvidence":"用户管理—移交：用户被注销时，通过\"移交\"功能统一完成设备、飞行计划的所属人变更。\n角色管理：控制不同角色的操作权限，例如普通人员可执行任务但不能分配账号权限。","sourcePages":[36],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N420"},{"id":"N421","chapter":17,"type":"single","stem":"客户要求每周固定时间生成巡检周报，并调整报告输出模板。按资料，哪种模块组合准确？","options":["个人中心安排周报，成果库分配账号权限","消息通知可同时替代周期报表与模板管理","作业中心配置周期周报，报告中心管理模板与输出","报告中心负责全部周期排班，角色管理负责模板"],"answers":[2],"explanation":"作业中心负责按周固定时间产出周报；报告中心管理模板与输出。两者面向周期任务和报告样式的职责不同。","focus":"周报与报告模板归口","difficulty":"应用","sourceSection":"三、功能模块归口","sourceEvidence":"作业中心：支持按周固定时间产出周报，是周期性报表的归口。\n报告中心：管理报告模板与输出，与作业中心的周期报表区分。","sourcePages":[36,37],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N421"},{"id":"N422","chapter":17,"type":"single","stem":"按本章当前版本，试验要同时开4个算法并导入osgb模型。方案评审应如何修改？","options":["所有格式和算法数量均不受本章限制","保留osgb导入，调整算法安排以遵守同时3个的限制","禁止osgb导入，4算法并发完全符合本章","保留4算法并发，只需改成b3dm就能解除限制"],"answers":[1],"explanation":"osgb是本章支持的格式之一，但同时算法上限为3个。格式兼容与并发能力独立，换格式不会自动提高并发上限。","focus":"并发约束与模型格式","difficulty":"应用","sourceSection":"四、算法、模型与流程组件","sourceEvidence":"算法并发：平台当前支持同时开启 3 个算法，不是 5 个也不是不限制。\n模型格式：当前支持 osgb、b3dm 两种三维模型格式导入。","sourcePages":[37],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N422"},{"id":"N423","chapter":17,"type":"single","stem":"需要按科室实行多级审核，并在识别火点后由管理员审核再自动执行。按资料，哪种方案最一致？","options":["成果库直接删掉识别结果，免去管理员审核","个人中心设套餐到期日即可完成火点审核执行","用角色管理直接替代所有审批，触发只选定时","流程中心配置科室多级审批，结合事件、手动与API触发"],"answers":[3],"explanation":"流程中心决定审批链；本章火点场景使用事件、API、手动触发组合。角色权限与审批流程不能互相替代，定时触发也不在所列组合中。","focus":"审批组织与触发组合","difficulty":"应用","sourceSection":"三、功能模块归口","sourceEvidence":"流程中心：按科室配置不同审批流程，支持多级审批。\n流程触发组件：事件触发、API 触发、手动触发。需要\"识别到火点后由管理员审核并自动执行\"时，用事件触发 + API 触发 + 手动触发组合，没有定时触发这一组。","sourcePages":[36,37],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N423"},{"id":"N424","chapter":17,"type":"single","stem":"团队已识别并保存结果，却既没生成AI识别报告，也未派单。按资料，哪项补充最完整？","options":["补报告与成果汇总，并通过工单中心衔接处置","只修改航线名称，不处理识别后的流程","只增加算法数量，报告和派单都可省略","只把结果截图发群即可认定两个闭环都完成"],"answers":[0],"explanation":"AI作业闭环包括识别、保存、报告、汇总；工单中心又承接识别到处置。保存结果仅是中间步骤，不能等同学习资料中的完整闭环。","focus":"AI报告与业务处置","difficulty":"应用","sourceSection":"四、算法、模型与流程组件","sourceEvidence":"AI 作业闭环：对目标进行识别 → 保存识别结果 → 生成 AI 识别报告 → 对识别成果进行汇总，四个环节缺一不可。\n工单中心：承接 AI 识别结果的派单与处置流转，是\"识别—处置\"闭环的落点。","sourcePages":[37],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N424"},{"id":"N425","chapter":17,"type":"single","stem":"主管要下载已完成任务的AI飞行报告，并核对该次飞行原始照片。按本章，怎样查找更准确？","options":["报告到历史库下载，原始照片到成果库查看","AI飞行报告只能在个人中心，照片只能在流程中心","报告模板存在即可替代该次任务报告与照片证据","两者都必须通过角色管理下载"],"answers":[0],"explanation":"历史库支持下载AI飞行报告，成果库统一查看作业照片等数据。报告中心管理模板与输出不意味着模板可替代特定任务的历史证据。","focus":"报表下载与素材查看","difficulty":"应用","sourceSection":"三、功能模块归口","sourceEvidence":"历史库：下载 AI 飞行报告、回看上次飞行的全程历史视频。\n成果库：统一查看某次飞行产生的照片、视频等作业数据；支持用历史图片进行二三维模型重建；支持在地图中加载成果、标注显隐、对比。\n报告中心：管理报告模板与输出，与作业中心的周期报表区分。","sourcePages":[36,37],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N425"},{"id":"N426","chapter":17,"type":"single","stem":"一项任务沿长河道连续查看，另一项任务是在城区片区反复巡逻发现变化。按本章，哪种匹配合适？","options":["两者都以下载历史报告替代飞行设计","前者带状航线，后者巡逻航线","前者只能航点航线，后者禁止重复经过","前者面状航线，后者一律只能单点指点飞行"],"answers":[1],"explanation":"带状航线解决河道等线性目标连续覆盖，巡逻航线强调区域常态重复经过和动态发现。应依据任务空间结构与运行目的双重匹配。","focus":"线性目标与区域巡逻","difficulty":"应用","sourceSection":"一、航线类型与适用场景","sourceEvidence":"带状航线：沿河道、道路、管线等线性目标布设，解决长条区域的连续覆盖。\n巡逻航线：适合区域常态化巡逻，强调重复经过与动态发现。","sourcePages":[35],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N426"},{"id":"N427","chapter":17,"type":"single","stem":"用户收到到期提醒后还要自行核对套餐是否到期，同时希望知道系统发版信息。按资料，应怎样使用模块？","options":["把到期提醒等同于已完成设备移交","从消息通知查看提醒及发版信息，到个人中心核对套餐状态","只查航线库，航点数量可以证明套餐有效","只查工单中心，那里统一管理套餐和系统发版"],"answers":[1],"explanation":"消息通知承载到期提醒和系统发版通知，个人中心查看套餐到期状态。通知入口与状态核对入口需要区分。","focus":"通知与套餐状态核对","difficulty":"应用","sourceSection":"三、功能模块归口","sourceEvidence":"消息通知：系统发版通知、安全提醒、用户到期提醒。\n个人中心：查看平台套餐是否到期。","sourcePages":[36],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N427"},{"id":"N428","chapter":17,"type":"single","stem":"新员工会规划航线和发起计划，却不知道完成后去哪看素材、去哪复盘。按本章，培训应补哪段主线？","options":["航线规划后无需执行计划，直接生成历史录像","计划执行后进入成果库查看，再到历史库复盘","把成果库与历史库删去，实时画面即为全部交付","计划执行后直接进入用户管理注销账号"],"answers":[1],"explanation":"本章主线为航线库规划、计划库执行、成果库查看、历史库复盘。前半段会操作不意味着已掌握成果获取和复盘流程。","focus":"任务链路缺口诊断","difficulty":"应用","sourceSection":"四、算法、模型与流程组件","sourceEvidence":"全流程闭环：航线库（规划航线）→ 计划库（执行飞行）→ 成果库（查看成果）→ 历史库（复盘任务），这是理解星云模块分工的主线。\n成果库：统一查看某次飞行产生的照片、视频等作业数据；支持用历史图片进行二三维模型重建；支持在地图中加载成果、标注显隐、对比。\n历史库：下载 AI 飞行报告、回看上次飞行的全程历史视频。","sourcePages":[36,37],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N428"},{"id":"N429","chapter":17,"type":"single","stem":"操作员为俯视目标把云台向下，便称“返航与失联设置已完成”。按本章，应如何纠正？","options":["云台向下会自动设置失联动作与返航高度","云台调整只解决观察角度，仍需单独核对返航、失联和限高设置","变焦成功即可证明所有飞行安全配置正确","云台回中即可取代低电量预警"],"answers":[1],"explanation":"云台动作服务于观察，飞行前设置和安全兜底则涉及失联、返航、限高及低电量。观察动作完成不能证明安全参数完成。","focus":"飞行设置与云台动作","difficulty":"应用","sourceSection":"二、计划与飞行控制","sourceEvidence":"驾驶舱飞行前设置：飞行前需完成飞行设置（含失联动作、返航高度、限高等），这是飞行安全的入口环节。\n云台控制：需要俯视地面目标时调整云台向下；此外还有变焦、锁定机头、云台回中三类常用动作。\n飞行安全能力：失联动作设置、低电量预警、返航模式设置、飞行高度限制，四项构成平台侧的安全兜底。","sourcePages":[36],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N429"},{"id":"N430","chapter":17,"type":"multi","stem":"按本章为多任务项目配置飞行方案，哪些组合合理？","options":["大面积园区要求按预设范围覆盖时，优先套用沿线目标的带状航线","所有一次性任务都必须先配置每天重复计划","每日固定时间重复巡查可配多次重复定时计划","固定点执行喊话或拍照可选航点航线并挂动作"],"answers":[2,3],"explanation":"固定点执行动作可用航点航线，固定时间重复任务可配多次重复定时。预设范围的园区覆盖对应面状航线，带状主要对应线性目标；一次性任务也不必先配置每日重复计划。","focus":"任务空间与时间组合","difficulty":"应用","sourceSection":"一、航线类型与适用场景","sourceEvidence":"航点航线：可在航点上挂载动作，如自动开启 AI 算法、喊话器、拍照，适合\"边飞边执行动作\"的任务。\n面状航线：按预设范围自动完成覆盖式飞行，适合面积较大的施工区域、园区等周期性巡查。\n计划方式：单次定时、多次重复定时、不定时。每天固定时间对固定区域巡查应采用多次重复定时。","sourcePages":[35,36],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N430"},{"id":"N431","chapter":17,"type":"multi","stem":"一条既有巡查航线中有三个目标坐标变动，另有一个旧目标已撤销；新任务只在客户另行通知时执行。按本章，哪些调整与这些约束匹配？","options":["通过移动或修改航点更新目标坐标","必须改成每天重复定时，才能对既有航线编辑","通过删除飞行计划代替删除已撤销目标对应的航点","执行时间不固定时，可采用不定时计划方式"],"answers":[0,3],"explanation":"目标坐标变化应通过移动或修改航点处理，执行时间不固定可采用不定时计划。删除计划与编辑航线内容是不同操作，不能代替删除撤销目标对应的航点；编辑航线也不要求每日重复计划。","focus":"航线内容与非定时计划分离","difficulty":"应用","sourceSection":"四、算法、模型与流程组件","sourceEvidence":"航线编辑：移动航点、修改航点位置、新增航点、删除航点，四种操作均可调整既有航线。\n计划方式：单次定时、多次重复定时、不定时。每天固定时间对固定区域巡查应采用多次重复定时。","sourcePages":[36,37],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N431"},{"id":"N432","chapter":17,"type":"multi","stem":"业主复核两次巡查的变化，要求在地图比对成果，并准确确认AI发现目标的位置。按本章，哪些操作分别有依据？","options":["仅用地图测距即可替代目标点标注完成目标位置确认","通过目标点标注确认AI识别目标的位置","在成果库加载地图成果、控制标注显隐并进行对比","只复制上一条航线，即可确认这次AI目标位置"],"answers":[1,2],"explanation":"成果库支持地图加载、标注显隐与对比；AI目标位置应通过目标点标注确认。成果变化比对与目标位置确认是两项任务，航线复制或单纯测距不能代替后者。","focus":"成果变化比对与目标位置确认","difficulty":"应用","sourceSection":"三、功能模块归口","sourceEvidence":"成果库：统一查看某次飞行产生的照片、视频等作业数据；支持用历史图片进行二三维模型重建；支持在地图中加载成果、标注显隐、对比。\n目标点标注：AI 识别完成后，首先通过目标点标注确认识别出的目标位置；地图测距、视频截图、航线复制都不是确认目标位置的手段。","sourcePages":[36],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N432"},{"id":"N433","chapter":17,"type":"multi","stem":"AI只输出识别框后，按资料哪些步骤有助于形成可确认、可汇总且可处置的成果？","options":["经工单中心派单处置流转","增加识别算法数量即可自动替代派单处置","保存结果并生成识别报告、汇总成果","用目标点标注确认目标位置"],"answers":[0,2,3],"explanation":"目标位置确认、AI成果形成、业务处置是相衔接但不同的环节。算法数量增加不能替代报告、汇总和工单流转。","focus":"识别到处置缺口补齐","difficulty":"应用","sourceSection":"三、功能模块归口","sourceEvidence":"目标点标注：AI 识别完成后，首先通过目标点标注确认识别出的目标位置；地图测距、视频截图、航线复制都不是确认目标位置的手段。\nAI 作业闭环：对目标进行识别 → 保存识别结果 → 生成 AI 识别报告 → 对识别成果进行汇总，四个环节缺一不可。\n工单中心：承接 AI 识别结果的派单与处置流转，是\"识别—处置\"闭环的落点。","sourcePages":[36,37],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N433"},{"id":"N434","chapter":17,"type":"multi","stem":"业务科室调整负责人后，哪些配置分别对应资料中的正确职责？","options":["通过角色管理限制操作与账号分配权限","只调整接手人的角色权限，即可自动改变设备和飞行计划所属人","只注销原负责人就可保证所有资源归属与审批自动正确","通过流程中心调整科室多级审批流程"],"answers":[0,3],"explanation":"角色管理控制能做什么，流程中心控制科室审批链；资源所属人变更另需用户管理的移交。调整角色或注销原负责人，都不能被当作设备计划归属及审批已自动正确的充分证据。","focus":"人员变更与审批权限","difficulty":"应用","sourceSection":"三、功能模块归口","sourceEvidence":"用户管理—移交：用户被注销时，通过\"移交\"功能统一完成设备、飞行计划的所属人变更。\n角色管理：控制不同角色的操作权限，例如普通人员可执行任务但不能分配账号权限。\n流程中心：按科室配置不同审批流程，支持多级审批。","sourcePages":[36],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N434"},{"id":"N435","chapter":17,"type":"multi","stem":"接口设计稿把“多次重复定时”当作流程触发组件，又把“API触发”当作飞行计划时间方式。按本章，哪些术语归口修正有依据？","options":["多次重复定时属于飞行计划方式","定时触发属于本章明确列出的流程触发组件，可替代手动触发","不定时属于流程触发组件，与API触发属于同一组概念","API触发属于流程触发组件"],"answers":[0,3],"explanation":"多次重复定时与不定时均属于飞行计划的时间方式；API、事件和手动属于流程触发组件。计划方式与流程启动逻辑不能互换归类，本章所列流程组件也不包含定时触发。","focus":"计划时间与流程触发概念边界","difficulty":"应用","sourceSection":"二、计划与飞行控制","sourceEvidence":"计划方式：单次定时、多次重复定时、不定时。每天固定时间对固定区域巡查应采用多次重复定时。\n流程触发组件：事件触发、API 触发、手动触发。需要\"识别到火点后由管理员审核并自动执行\"时，用事件触发 + API 触发 + 手动触发组合，没有定时触发这一组。","sourcePages":[36,37],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N435"},{"id":"N436","chapter":17,"type":"multi","stem":"按本章当前版本验收模型与AI能力，哪些检查项可通过？","options":["以导入模型成功证明同时5算法必然可用","以osgb文件验证三维模型导入","按同时不超过3个算法安排并发演示","以b3dm文件验证三维模型导入"],"answers":[1,2,3],"explanation":"资料列出osgb与b3dm格式，并另行给出3算法并发约束。格式导入成功不能推出更高算法并发能力。","focus":"模型与算法验收","difficulty":"应用","sourceSection":"四、算法、模型与流程组件","sourceEvidence":"模型格式：当前支持 osgb、b3dm 两种三维模型格式导入。\n算法并发：平台当前支持同时开启 3 个算法，不是 5 个也不是不限制。","sourcePages":[37],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N436"},{"id":"N437","chapter":17,"type":"multi","stem":"操作员准备起飞并俯视目标，哪些检查或操作符合本章分工？","options":["俯视地面目标时，将云台回中作为本章指定的对应动作","起飞前核对失联动作、返航高度和限高","用一次变焦成功替代全部失联和返航设置检查","核对低电量预警及返航模式等安全能力"],"answers":[1,3],"explanation":"飞行前需核对失联、返航和限高等参数，低电量预警与返航模式也属于安全兜底。原文俯视地面目标的对应动作是云台向下；回中或变焦不能被当作完成安全设置的证明。","focus":"安全参数与观察控制","difficulty":"应用","sourceSection":"二、计划与飞行控制","sourceEvidence":"驾驶舱飞行前设置：飞行前需完成飞行设置（含失联动作、返航高度、限高等），这是飞行安全的入口环节。\n云台控制：需要俯视地面目标时调整云台向下；此外还有变焦、锁定机头、云台回中三类常用动作。\n飞行安全能力：失联动作设置、低电量预警、返航模式设置、飞行高度限制，四项构成平台侧的安全兜底。","sourcePages":[36],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N437"},{"id":"N438","chapter":17,"type":"multi","stem":"按本章为不同任务选择入口，哪些判断合理？","options":["沿长道路连续覆盖可选带状航线","临时飞往地图位置查看可选指点飞行","区域常态重复巡逻可选巡逻航线","临时查看一个位置必须先建完整周期航线"],"answers":[0,1,2],"explanation":"带状航线匹配道路等线性目标的连续覆盖，巡逻航线匹配区域常态重复巡查，指点飞行匹配临时查看。指点飞行无需提前创建完整航线，不能人为增加必需步骤。","focus":"线性与临时任务入口","difficulty":"应用","sourceSection":"一、航线类型与适用场景","sourceEvidence":"带状航线：沿河道、道路、管线等线性目标布设，解决长条区域的连续覆盖。\n指点飞行：临时让无人机飞往地图指定位置查看，不需要提前创建完整航线，是\"应急看一眼\"的首选功能。\n巡逻航线：适合区域常态化巡逻，强调重复经过与动态发现。","sourcePages":[35],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N438"},{"id":"N439","chapter":17,"type":"multi","stem":"项目只展示一张航线图与一个识别截图，就称飞行和AI两条闭环均完成。按本章还应核查哪些证据？","options":["只要航线库有记录，就不必确认计划是否执行","只需把截图文件名改为闭环完成即可","识别结果保存、AI报告生成与成果汇总","计划执行与成果查看、历史复盘的链路"],"answers":[2,3],"explanation":"飞行主线包含规划、执行、成果、复盘；AI主线包含识别、保存、报告、汇总。两个截图只覆盖局部，不能证明全过程闭环。","focus":"流程闭环证据审查","difficulty":"应用","sourceSection":"四、算法、模型与流程组件","sourceEvidence":"全流程闭环：航线库（规划航线）→ 计划库（执行飞行）→ 成果库（查看成果）→ 历史库（复盘任务），这是理解星云模块分工的主线。\nAI 作业闭环：对目标进行识别 → 保存识别结果 → 生成 AI 识别报告 → 对识别成果进行汇总，四个环节缺一不可。","sourcePages":[37],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N439"},{"id":"N440","chapter":17,"type":"multi","stem":"新设备上线时用户同时询问套餐期限和发版提醒，按资料哪些安排正确？","options":["在消息通知查看发版与安全提醒","在个人中心核对套餐是否到期","把新设备注册放在报告模板管理中完成","在资产管理完成新设备注册"],"answers":[0,1,3],"explanation":"设备资产、套餐状态与系统通知分属不同模块。报告模板管理不承担设备注册，不能只因都在一个平台就混用入口。","focus":"平台状态与通知核验","difficulty":"应用","sourceSection":"三、功能模块归口","sourceEvidence":"消息通知：系统发版通知、安全提醒、用户到期提醒。\n个人中心：查看平台套餐是否到期。\n资产管理：新到设备在此完成注册。","sourcePages":[36],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N440"},{"id":"N441","chapter":18,"type":"single","stem":"按本章为Mavic 3T加装天枢，工程师准备因设备有E-Port就直接沿用其他机型快拆支架和安装位置。应如何纠正？","options":["确认E-Port接入，同时依据机型说明书核实支架、位置和挂载方式","有E-Port就必然兼容所有快拆支架，位置无需核实","只要能插SIM卡，支架与接口都无需核对","默认所有机型都装底部即可，不必查说明书"],"answers":[0],"explanation":"接口支持不等于机械支架通用。Mavic 3E/3T通过E-Port接入，但支架、挂载方式及安装位置仍需按机型确认。","focus":"接口兼容与安装方案","difficulty":"应用","sourceSection":"一、产品规格与适配","sourceEvidence":"支架不是万能：支持 PSDK/OSDK/USB/串口/网口/E-Port 的机型，并不能都用同一套快拆支架直接兼容。\n安装位置：不同机型安装位置可能不同，需参考无人机说明书确认，不能默认全部底部或顶部安装。\nMavic 3E/3T：通过 E-Port 接口接入天枢 S3。","sourcePages":[37,38],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N441"},{"id":"N442","chapter":18,"type":"single","stem":"现场发现天枢直接贴在机身，挂载板还未安装，且打算用M3替代M1.6。按资料应怎样整改？","options":["按先挂载板后终端的工序重做，并使用规定螺丝可靠紧固","只补听SIM卡扣声，就视为机械安装合格","保留直接贴机身，只把平台账号换新","先起飞验证能否脱落，再决定是否加挂载板"],"answers":[0],"explanation":"本章要求先装挂载板再装终端，M3替代M1.6属于工序错误；机械紧固关系飞行脱落风险，不能用账号或SIM检查替代。","focus":"安装顺序与紧固风险","difficulty":"应用","sourceSection":"二、安装工序","sourceEvidence":"正确工序：先将挂载板安装于无人机上，再将天枢安装于挂载板上；不能跳过挂载板直接把快拆板贴在机身；用 M3 螺丝代替 M1.6 属于安装工序错误。\n螺丝与间距：M1.6 螺丝未拧紧会导致挂载板松动，飞行中可能脱落；使用时需保持距建筑物 4 米以上，避免无人机受周边障碍物影响。","sourcePages":[38],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N442"},{"id":"N443","chapter":18,"type":"single","stem":"SIM已听到卡扣声，设备可以启动，但5G灯熄灭且未开通数据业务。按资料，哪种解释最完整？","options":["5G灯熄灭必然证明挂载板螺丝型号错误","卡扣声只证明锁定，仍需激活并开通数据业务才能形成数据链路","设备可以启动就说明SIM数据业务一定可用","听到卡扣声就证明已完成运营商激活和平台注册"],"answers":[1],"explanation":"SIM机械锁定与运营商业务状态是两回事。未激活或未开通数据业务时设备仍可启动，但数据链路不可用、不能完成平台注册。","focus":"SIM锁定与业务激活","difficulty":"应用","sourceSection":"二、安装工序","sourceEvidence":"SIM 卡安装：插入后听到轻微的卡扣锁定声即判定已正确锁定；卡扣声并非装饰音效。\nSIM未激活的后果：SIM卡未激活或未开通数据业务：设备上电后5G指示灯熄\n灭、平台无法注册设备、数据链路不可用；设备本身仍可启动。未激活状态下不可\n能完成平台注册。","sourcePages":[38],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N443"},{"id":"N444","chapter":18,"type":"single","stem":"现场WORK与5G灯均常亮，平台发送注册信息后已收到账号，但未联系运维写入天枢。按资料应优先补哪项？","options":["重新安装所有机型快拆支架以生成账号","只在日志管理反复下载旧文件，代替账号配置","认为发出注册信息就已完成配置，不再处理","联系运维确认账号配置到设备，再核对平台负载可见性"],"answers":[3],"explanation":"资料指出账号由运维配置，收到账号但未配置到设备是应规避诱因；WORK与5G正常但平台查不到时，应重点核对账号配置链。","focus":"账号发放与设备配置","difficulty":"应用","sourceSection":"三、注册与账号配置","sourceEvidence":"账号来源：平台点击\"发送注册信息\"后，账号密码由运维人员配置，不是系统自动生成或无人机厂商发放。\n应规避的诱因：收到账号后未联系运维配置到天枢设备，是注册过程中应主动规避的故障诱因。\n指示灯口径：WORK 灯熄灭 = 供电异常；WORK 常亮 + 5G 灯熄灭 + SIM 卡槽为空 = SIM 卡未插入；WORK 常亮 + 5G 常亮但平台负载管理查不到 = 账号配置错误；WORK、5G 全灭 = 无法开机，先检查连接线、电源接口、无人机端供电。","sourcePages":[38,39],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N444"},{"id":"N445","chapter":18,"type":"single","stem":"设备当前离线，平台已有昨天上传完成的日志。按资料，值班员要获取现有文件而非等待最新上传，应怎么做？","options":["删除昨天文件后，离线设备便会自动恢复上传","在天枢日志按钮持续拉取，保证一定获取离线后的最新文件","到日志管理下载已上传文件，同时说明离线时无法拉取最新实时日志","直接把上传进度页面当成日志正文交付"],"answers":[2],"explanation":"拉取是通知设备上传，下载是获取已上传文件。离线限制影响实时拉取，但不应把现有文件下载与实时上传混为同一操作。","focus":"离线日志与下载边界","difficulty":"应用","sourceSection":"四、日志管理","sourceEvidence":"两个入口：平台拉取日志——资产管理→负载管理→天枢页面→【日志】按钮；下载日志——资产管理→日志管理→【下载】。日志入口不止一个。\n两者区别：平台拉取是通知天枢上传日志；下载日志是下载已上传完成的文件。功能不同，不是同一种操作。\n离线限制：天枢设备离线（未入网）时拉不到实时日志，长期无响应最可能是设备离线。","sourcePages":[38,39],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N445"},{"id":"N446","chapter":18,"type":"single","stem":"日志提示应用层异常，现场又发现器件明显物理损坏。按资料，哪种处理最完整？","options":["只因能下载日志就断言硬件没有问题","删除日志并继续飞行，等待损坏自行消失","用日志辅助定位，同时针对物理损坏触发远程协助和硬件检查","日志能替代全部硬件检测，忽略外观损坏"],"answers":[2],"explanation":"日志可辅助识别应用或硬件异常链路，但不能替代现场硬件检测；明显物理损坏属于触发远程协助的情形，不能被日志可下载掩盖。","focus":"日志证据与硬件检测","difficulty":"应用","sourceSection":"四、日志管理","sourceEvidence":"日志价值边界：通过日志可初步判断网络注册失败原因、识别应用层错误与硬件异常链路；离线状态拉不到最新日志；日志不能替代现场硬件检测。\n远程协助时机：现场已用尽 Q\\&A 排查链仍无法定位、怀疑固件层或账号/平台侧深层问题、发现器件明显物理损坏，三种情境触发远程协助；SIM 未激活、接线松动这类现场可处理的不必上报。","sourcePages":[39],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N446"},{"id":"N447","chapter":18,"type":"single","stem":"新装设备WORK与5G全灭，团队准备先远程拉日志并更换账号。按资料更合理的处置顺序是什么？","options":["先改所有云端角色权限，不检查设备是否上电","立即拆开终端，跳过外部电源检查","先持续拉日志，供电检查放到所有平台操作之后","先检查连接线、电源接口与机端供电，再沿分层链路排查"],"answers":[3],"explanation":"双灯全灭首先指向无法开机。资料要求从电源起分层排查，并非所有故障都先拉日志或上报，先解决现场基础条件更有效。","focus":"双灯全灭与日志优先级","difficulty":"应用","sourceSection":"五、故障排查（分层判定）","sourceEvidence":"排查顺序：现场故障排查从 电源→SIM→网络→平台→业务负载 由下而上分层判定，不先拆机、不先换硬件。\n指示灯口径：WORK 灯熄灭 = 供电异常；WORK 常亮 + 5G 灯熄灭 + SIM 卡槽为空 = SIM 卡未插入；WORK 常亮 + 5G 常亮但平台负载管理查不到 = 账号配置错误；WORK、5G 全灭 = 无法开机，先检查连接线、电源接口、无人机端供电。\n上报原则：并非任何现场无法处理的故障都立即上报；也并非所有故障都先拉日志再处理，应先按分层思路现场排查。","sourcePages":[39],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N447"},{"id":"N448","chapter":18,"type":"single","stem":"按资料排障，补插SIM后5G灯已常亮，但负载列表仍无设备。下一步哪种安排最合适？","options":["转向账号与平台配置核验，并用负载可见和日志拉取等确认注册结果","继续把SIM槽为空当成唯一故障，忽略已恢复的5G状态","直接强制升级全部固件，作为注册成功的唯一标志","认为5G灯常亮已证明设备注册成功，无需核验"],"answers":[0],"explanation":"底层状态恢复后应继续沿网络、平台、业务层核验。资料的注册成功包括平台负载可见及日志拉取等，不要求强制升级全部固件。","focus":"网络恢复后的平台核验","difficulty":"应用","sourceSection":"五、故障排查（分层判定）","sourceEvidence":"排查顺序：现场故障排查从 电源→SIM→网络→平台→业务负载 由下而上分层判定，不先拆机、不先换硬件。\n指示灯口径：WORK 灯熄灭 = 供电异常；WORK 常亮 + 5G 灯熄灭 + SIM 卡槽为空 = SIM 卡未插入；WORK 常亮 + 5G 常亮但平台负载管理查不到 = 账号配置错误；WORK、5G 全灭 = 无法开机，先检查连接线、电源接口、无人机端供电。\n注册成功解锁：在资产管理-负载管理列表可见、日志可从平台侧拉取、可接收远程飞行控制指令；不会强制升级所有固件。","sourcePages":[38,39],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N448"},{"id":"N449","chapter":18,"type":"single","stem":"机队仅在弱覆盖区卡顿，偶有5G突然掉线，返回强覆盖区后恢复。按资料，哪项检查方向更合理？","options":["只要视频卡顿就证明终端主板损坏，应立即全量更换","先注销所有平台账号，因为覆盖环境不影响图传","优先排查SIM是否松动及信号覆盖，不能直接更换终端","把卡顿归为报告模板错误，不核查链路"],"answers":[2],"explanation":"飞行中断网初判方向包括SIM松动和覆盖不足；弱覆盖卡顿不能直接推成终端损坏。应把发生区域和链路现象结合起来判断。","focus":"飞行中断网与硬件替换","difficulty":"应用","sourceSection":"五、故障排查（分层判定）","sourceEvidence":"飞行中断网：5G 突然断网、实时图传中断，初判方向是 SIM 卡松动或信号覆盖不足。\n视频流异常：花屏且重启无法恢复，下一步是拉取 AI 日志与系统日志；信号薄弱区卡顿不能直接更换终端；也不是任何视频流异常都先重启设备和重登账号。","sourcePages":[39],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N449"},{"id":"N450","chapter":18,"type":"single","stem":"视频持续花屏，已重启仍未恢复，现场供电与SIM均已核实。按资料，下一轮诊断应怎样推进？","options":["认为所有视频异常都只能由SIM未插入造成","只反复重启并重新登录，直到偶然恢复为止","拉取AI日志和系统日志，结合现场检查定位异常链路","只下载一张飞行照片就可替代系统和AI日志"],"answers":[2],"explanation":"本章针对花屏且重启无效，建议拉取AI与系统日志。日志用于补充应用、系统和硬件链路证据，不替代现场已完成的基础检查。","focus":"花屏复现与日志组合","difficulty":"应用","sourceSection":"五、故障排查（分层判定）","sourceEvidence":"视频流异常：花屏且重启无法恢复，下一步是拉取 AI 日志与系统日志；信号薄弱区卡顿不能直接更换终端；也不是任何视频流异常都先重启设备和重登账号。\n日志价值边界：通过日志可初步判断网络注册失败原因、识别应用层错误与硬件异常链路；离线状态拉不到最新日志；日志不能替代现场硬件检测。","sourcePages":[39],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N450"},{"id":"N451","chapter":18,"type":"single","stem":"两个故障同时出现：甲机SIM未激活，乙机按Q&A完整排查仍疑似固件问题。按资料应如何分流？","options":["两者都先拆机，更换终端后再判断","甲立即上报，乙因无明显外观损坏就禁止协助","甲先现场处理激活，乙触发远程协助","两者都不能上报，必须无限重复本地检查"],"answers":[2],"explanation":"SIM未激活属现场可处理基础问题；完整排查仍疑固件或深层平台问题属于远程协助触发条件。分流基于问题层次与已完成检查。","focus":"现场可解与远程协助","difficulty":"应用","sourceSection":"五、故障排查（分层判定）","sourceEvidence":"远程协助时机：现场已用尽 Q\\&A 排查链仍无法定位、怀疑固件层或账号/平台侧深层问题、发现器件明显物理损坏，三种情境触发远程协助；SIM 未激活、接线松动这类现场可处理的不必上报。\n上报原则：并非任何现场无法处理的故障都立即上报；也并非所有故障都先拉日志再处理，应先按分层思路现场排查。","sourcePages":[39],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N451"},{"id":"N452","chapter":18,"type":"single","stem":"投标稿写“S3具备边缘智能且只能连接星云，自动返航充电由S3直接提供”。按本章应怎样修改？","options":["三项都是本章明确能力，可以全部保留","保留边缘智能，删除只能接星云与直接自动返航充电的承诺","将6TOPS改成自动返航充电的证明即可","删除边缘智能，仅保留只能接星云"],"answers":[1],"explanation":"资料列出边缘计算智能等能力，但S3不局限于星云，六大亮点不含自动返航充电。不能将终端、平台与机场补能能力混为一体。","focus":"能力宣传与实际交付","difficulty":"应用","sourceSection":"一、产品规格与适配","sourceEvidence":"S3 核心规格：机载 NPU 算力 6 TOPS，支持不少于 10 种 AI 算法；六大核心功能亮点包含 5G 全网通通信、量子加密、边缘计算智能，**不包含自动返航充电**。\n平台开放性：天枢 S3 并非只能对接天翼星云平台；其价值是突破传统无人机视距与通信距离的限制。","sourcePages":[37],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N452"},{"id":"N453","chapter":18,"type":"single","stem":"采购计划认为“某品牌未列官方适配，但它有USB，所以可直接用统一快拆支架承诺适配”。按本章评审应如何处理？","options":["分别核实官方适配与具体机械挂载，不能由USB接口推导通用支架兼容","接口名称与支架兼容完全同义，只核对一个即可","所有品牌只要能上电就可承诺同一种支架兼容","有USB即自动进入官方适配清单，无需测试"],"answers":[0],"explanation":"官方适配清单、接口支持与机械支架适配是不同证据。资料特别指出支持某些接口并不代表都能直接用同一套快拆支架。","focus":"适配清单与支架验证","difficulty":"应用","sourceSection":"一、产品规格与适配","sourceEvidence":"适配清单：官方适配大疆、联合飞机、纵横等品牌；派诺特（Parrot）不在适配清单内。\n支架不是万能：支持 PSDK/OSDK/USB/串口/网口/E-Port 的机型，并不能都用同一套快拆支架直接兼容。","sourcePages":[37],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N453"},{"id":"N454","chapter":18,"type":"single","stem":"验收员在负载管理看到设备和日志上传进度，便称“日志正文已核实，全部固件已自动升级”。按资料怎样评价？","options":["没有自动升级全部固件就可判定绝不可能注册成功","看到负载就说明无需再核对任何日志文件","可支持注册与上传状态核验，但页面不直接显示正文，注册也不强制升级全部固件","页面有进度就等于已审阅日志全文且固件全升级"],"answers":[2],"explanation":"负载可见和日志拉取可支持注册验收；日志页面显示进度、列表、下载按钮，不直接展示正文。强制升级所有固件不是注册成功标志。","focus":"注册验收证据完整性","difficulty":"应用","sourceSection":"三、注册与账号配置","sourceEvidence":"注册成功解锁：在资产管理-负载管理列表可见、日志可从平台侧拉取、可接收远程飞行控制指令；不会强制升级所有固件。\n日志页面可见信息：终端日志上传进度、已上传日志列表、下载按钮；看不到日志内容本身。","sourcePages":[38,39],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N454"},{"id":"N455","chapter":18,"type":"single","stem":"按本章手册，天枢SIM已激活且运维已发账号，但账号尚未配置到设备；客户要求距楼体2米演示远控。哪套演示前整改完整？","options":["只需确认SIM卡扣锁定，在原位置直接演示","只将场地改为距建筑物4米以上，收到账号就等于已完成平台注册","落实设备账号配置并核验注册结果，同时选择满足资料4米以上建筑物间距的演示位置","只核对负载列表；即使账号未写入且距楼体2米，也可直接演示"],"answers":[2],"explanation":"收到账号不等于账号已配置到终端，需落实运维配置并验证平台注册；本章还要求作业时距建筑物4米以上。通信准备与现场环境条件都要满足，单改其中一项不能作为完整演示条件。","focus":"平台注册与演示环境双条件","difficulty":"应用","sourceSection":"二、安装工序","sourceEvidence":"螺丝与间距：M1.6 螺丝未拧紧会导致挂载板松动，飞行中可能脱落；使用时需保持距建筑物 4 米以上，避免无人机受周边障碍物影响。\n账号来源：平台点击\"发送注册信息\"后，账号密码由运维人员配置，不是系统自动生成或无人机厂商发放。\n应规避的诱因：收到账号后未联系运维配置到天枢设备，是注册过程中应主动规避的故障诱因。\n注册成功解锁：在资产管理-负载管理列表可见、日志可从平台侧拉取、可接收远程飞行控制指令；不会强制升级所有固件。","sourcePages":[38],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N455"},{"id":"N456","chapter":18,"type":"single","stem":"雨天任务后发现终端表面潮湿、挂载板螺丝松动。按资料哪种处置同时覆盖两类问题？","options":["把松动解释为SIM卡扣提示，不再检查挂载板","只更换账号即可同时解决潮湿与机械松动","及时擦干设备并核查M1.6紧固情况，不能带松动状态继续作业","只擦干设备，螺丝松动只影响外观无需处理"],"answers":[2],"explanation":"雨后应及时擦干；M1.6未拧紧可能导致挂载板飞行脱落。养护与机械紧固应分别处理，不能用一项操作掩盖另一类风险。","focus":"雨后养护与机械安全","difficulty":"应用","sourceSection":"五、故障排查（分层判定）","sourceEvidence":"日常养护：雨天飞行作业后应及时擦干设备。\n螺丝与间距：M1.6 螺丝未拧紧会导致挂载板松动，飞行中可能脱落；使用时需保持距建筑物 4 米以上，避免无人机受周边障碍物影响。","sourcePages":[38,39],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N456"},{"id":"N457","chapter":18,"type":"single","stem":"设备能上电但SIM未激活，操作者却要先确认远控指令已能接收。按资料哪种验收路径合理？","options":["先强制升级全部固件即可替代SIM激活和账号配置","只验证挂载板位置即可完成所有网络平台验收","只要设备能上电，就可跳过网络与账号直接认定能远控","先补数据业务和网络，再落实运维账号配置，最后验平台注册与远控能力"],"answers":[3],"explanation":"设备上电不代表数据链路可用；未激活无法完成注册。应先满足通信与账号条件，再验证负载可见、日志和远控等平台注册结果。","focus":"启动通信平台注册分层","difficulty":"应用","sourceSection":"三、注册与账号配置","sourceEvidence":"SIM未激活的后果：SIM卡未激活或未开通数据业务：设备上电后5G指示灯熄\n灭、平台无法注册设备、数据链路不可用；设备本身仍可启动。未激活状态下不可\n能完成平台注册。\n账号来源：平台点击\"发送注册信息\"后，账号密码由运维人员配置，不是系统自动生成或无人机厂商发放。\n注册成功解锁：在资产管理-负载管理列表可见、日志可从平台侧拉取、可接收远程飞行控制指令；不会强制升级所有固件。","sourcePages":[38],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N457"},{"id":"N458","chapter":18,"type":"single","stem":"初检发现WORK灭，修复供电后WORK和5G均亮但平台仍无设备。按资料应如何更新故障判断？","options":["从供电层转向账号与平台配置核查，不再仅凭初始现象结案","灯都亮就必须宣布业务已完全恢复，无需看平台","初检曾供电异常，后续所有现象都应继续归为电源问题","立刻更换SIM型号，不核对已经正常的网络状态"],"answers":[0],"explanation":"分层排查要随最新证据推进：供电恢复只是解决底层问题，平台不可见仍需核查账号配置等上层链路，不能按初始现象一概定性。","focus":"故障证据随层更新","difficulty":"应用","sourceSection":"五、故障排查（分层判定）","sourceEvidence":"排查顺序：现场故障排查从 电源→SIM→网络→平台→业务负载 由下而上分层判定，不先拆机、不先换硬件。\n指示灯口径：WORK 灯熄灭 = 供电异常；WORK 常亮 + 5G 灯熄灭 + SIM 卡槽为空 = SIM 卡未插入；WORK 常亮 + 5G 常亮但平台负载管理查不到 = 账号配置错误；WORK、5G 全灭 = 无法开机，先检查连接线、电源接口、无人机端供电。\n应规避的诱因：收到账号后未联系运维配置到天枢设备，是注册过程中应主动规避的故障诱因。","sourcePages":[38,39],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N458"},{"id":"N459","chapter":18,"type":"multi","stem":"按本章验收不同机型的天枢安装，哪些项目应分别核查？","options":["有一种支持接口就可认定所有快拆支架都通用","是否先安装挂载板再安装终端","接口类型是否适配","安装位置与挂载方式是否符合对应机型"],"answers":[1,2,3],"explanation":"接口、结构位置和工序是不同验收维度。资料明确即使支持PSDK、USB等接口，也不能据此认为统一快拆支架直接适配全部机型。","focus":"接口机械双重验收","difficulty":"应用","sourceSection":"一、产品规格与适配","sourceEvidence":"支架不是万能：支持 PSDK/OSDK/USB/串口/网口/E-Port 的机型，并不能都用同一套快拆支架直接兼容。\n安装位置：不同机型安装位置可能不同，需参考无人机说明书确认，不能默认全部底部或顶部安装。\n正确工序：先将挂载板安装于无人机上，再将天枢安装于挂载板上；不能跳过挂载板直接把快拆板贴在机身；用 M3 螺丝代替 M1.6 属于安装工序错误。","sourcePages":[37,38],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N459"},{"id":"N460","chapter":18,"type":"multi","stem":"按本章检查“卡已插入但无法注册”的设备，哪些判断成立？","options":["设备可启动不等于SIM通信业务可用","SIM未激活或未开数据业务仍可能导致链路不可用","卡扣声本身就是运营商业务激活的证明","卡扣声可用于判断SIM机械锁定"],"answers":[0,1,3],"explanation":"卡扣反映机械安装；激活与数据业务决定通信条件。设备自身启动与网络平台可用是不同层级，不能混同验收证据。","focus":"机械锁定与通信条件","difficulty":"应用","sourceSection":"二、安装工序","sourceEvidence":"SIM 卡安装：插入后听到轻微的卡扣锁定声即判定已正确锁定；卡扣声并非装饰音效。\nSIM未激活的后果：SIM卡未激活或未开通数据业务：设备上电后5G指示灯熄\n灭、平台无法注册设备、数据链路不可用；设备本身仍可启动。未激活状态下不可\n能完成平台注册。","sourcePages":[38],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N460"},{"id":"N461","chapter":18,"type":"multi","stem":"按本章制定注册验收清单，哪些环节有依据？","options":["确认账号由运维配置并落实到天枢设备","把所有固件被强制升级作为注册成功的必要条件","核对资产管理的负载管理列表是否可见设备","核对平台侧日志拉取和远控指令接收能力"],"answers":[0,2,3],"explanation":"资料强调运维账号配置与设备落实，注册结果通过负载可见、日志拉取和远控等体现。注册成功不会强制升级所有固件。","focus":"账号配置到注册结果","difficulty":"应用","sourceSection":"三、注册与账号配置","sourceEvidence":"账号来源：平台点击\"发送注册信息\"后，账号密码由运维人员配置，不是系统自动生成或无人机厂商发放。\n应规避的诱因：收到账号后未联系运维配置到天枢设备，是注册过程中应主动规避的故障诱因。\n注册成功解锁：在资产管理-负载管理列表可见、日志可从平台侧拉取、可接收远程飞行控制指令；不会强制升级所有固件。","sourcePages":[38],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N461"},{"id":"N462","chapter":18,"type":"multi","stem":"设备在线，操作员刚点击天枢页面的日志按钮，上传进度尚未完成，日志管理里还没有新文件。有人据此认定SIM未激活。按本章，哪些判断合理？","options":["待文件已上传完成后，下载入口才是获取该文件的操作","只要文件暂未出现，就足以证明SIM未激活并应重新换卡","天枢页面的日志按钮直接下载已上传文件，日志管理的下载负责通知终端上传","应结合上传进度和已上传文件列表核对过程，而非把尚无新文件直接判为SIM故障"],"answers":[0,3],"explanation":"应观察上传进度与文件列表，待上传完成再从下载入口取文件。原文拉取是通知设备上传，下载才是取得已有文件，不能把两者职能对调；暂未出现文件也不足以认定SIM未激活。","focus":"日志上传过程与故障证据区分","difficulty":"应用","sourceSection":"四、日志管理","sourceEvidence":"两者区别：平台拉取是通知天枢上传日志；下载日志是下载已上传完成的文件。功能不同，不是同一种操作。\n日志页面可见信息：终端日志上传进度、已上传日志列表、下载按钮；看不到日志内容本身。\n两个入口：平台拉取日志——资产管理→负载管理→天枢页面→【日志】按钮；下载日志——资产管理→日志管理→【下载】。日志入口不止一个。","sourcePages":[38,39],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N462"},{"id":"N463","chapter":18,"type":"multi","stem":"一张工单只写“平台负载列表查不到终端”，没有记录WORK、5G指示灯或SIM卡槽状态，却直接定性为SIM未插入。按本章，哪些审核意见成立？","options":["若WORK和5G均常亮但平台查不到，应转而核对账号配置等平台链路","应补充灯状态和SIM卡槽信息，不能仅凭平台不可见确定底层原因","平台不可见就能唯一确定SIM未插入，无需补充观察","若WORK常亮、5G熄灭且卡槽为空，才符合本章SIM未插入的明确组合"],"answers":[0,1,3],"explanation":"平台不可见本身不足以区分多个故障层。原文以灯状态、卡槽状态等组合给出诊断线索；应补证后分流，而不是把缺失信息当成已确认的SIM故障。","focus":"故障工单信息充分性","difficulty":"应用","sourceSection":"五、故障排查（分层判定）","sourceEvidence":"指示灯口径：WORK 灯熄灭 = 供电异常；WORK 常亮 + 5G 灯熄灭 + SIM 卡槽为空 = SIM 卡未插入；WORK 常亮 + 5G 常亮但平台负载管理查不到 = 账号配置错误；WORK、5G 全灭 = 无法开机，先检查连接线、电源接口、无人机端供电。\n排查顺序：现场故障排查从 电源→SIM→网络→平台→业务负载 由下而上分层判定，不先拆机、不先换硬件。","sourcePages":[39],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N463"},{"id":"N464","chapter":18,"type":"multi","stem":"两架设备分别出现弱覆盖区断网和重启后仍花屏，按本章哪些处理有依据？","options":["持续花屏且重启无效时拉AI日志与系统日志","弱覆盖卡顿不能直接认定终端需要更换","弱覆盖断网先查SIM松动与信号覆盖","两种问题都必须先更换全部硬件才允许看日志"],"answers":[0,1,2],"explanation":"资料对链路中断和持续视频异常给出不同初判路径。应依据现象取证，而非把任何异常都归为硬件损坏。","focus":"弱覆盖与持续花屏分流","difficulty":"应用","sourceSection":"五、故障排查（分层判定）","sourceEvidence":"飞行中断网：5G 突然断网、实时图传中断，初判方向是 SIM 卡松动或信号覆盖不足。\n视频流异常：花屏且重启无法恢复，下一步是拉取 AI 日志与系统日志；信号薄弱区卡顿不能直接更换终端；也不是任何视频流异常都先重启设备和重登账号。","sourcePages":[39],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N464"},{"id":"N465","chapter":18,"type":"multi","stem":"按本章排查口径：甲机双灯全灭且未查供电；乙机已逐层核实供电、SIM、网络及账号写入，按Q&A检查后仍疑深层平台问题；丙机离线且拉不到新日志。哪些判断合理？","options":["甲应优先联系运维重配账号，供电条件可由云端拉取日志代替现场核查","三机都没有立即恢复，因此都应跳过剩余现场检查并直接更换终端","丙拉不到新日志符合离线限制，不能据此声称已排尽现场故障链或确认硬件损坏","乙可带上已完成的分层检查结论请求远程协助，继续定位深层平台问题"],"answers":[2,3],"explanation":"甲双灯全灭应先核查供电，不能用重配账号或远程日志代替现场基础检查。乙已用尽常规分层排查且仍疑深层平台问题，可请求协助；丙离线不能取得新日志，日志缺失不足以排尽故障或确认硬件损坏。","focus":"多机故障分流与证据充分性","difficulty":"应用","sourceSection":"五、故障排查（分层判定）","sourceEvidence":"排查顺序：现场故障排查从 电源→SIM→网络→平台→业务负载 由下而上分层判定，不先拆机、不先换硬件。\n指示灯口径：WORK 灯熄灭 = 供电异常；WORK 常亮 + 5G 灯熄灭 + SIM 卡槽为空 = SIM 卡未插入；WORK 常亮 + 5G 常亮但平台负载管理查不到 = 账号配置错误；WORK、5G 全灭 = 无法开机，先检查连接线、电源接口、无人机端供电。\n远程协助时机：现场已用尽 Q\\&A 排查链仍无法定位、怀疑固件层或账号/平台侧深层问题、发现器件明显物理损坏，三种情境触发远程协助；SIM 未激活、接线松动这类现场可处理的不必上报。\n离线限制：天枢设备离线（未入网）时拉不到实时日志，长期无响应最可能是设备离线。\n日志价值边界：通过日志可初步判断网络注册失败原因、识别应用层错误与硬件异常链路；离线状态拉不到最新日志；日志不能替代现场硬件检测。","sourcePages":[39],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N465"},{"id":"N466","chapter":18,"type":"multi","stem":"按本章审查S3产品承诺，哪些意见正确？","options":["不能把S3表述为只能接入星云平台","可把自动返航充电作为S3本身已列出的核心功能","不能由接口兼容推导所有机型统一快拆支架直接通用","可保留5G全网通、量子加密和边缘智能等能力"],"answers":[0,2,3],"explanation":"资料支持通信、安全与边缘智能，强调平台开放和机械适配边界；自动返航充电不在其六大核心亮点中，不能扩大承诺。","focus":"产品能力承诺审查","difficulty":"应用","sourceSection":"一、产品规格与适配","sourceEvidence":"S3 核心规格：机载 NPU 算力 6 TOPS，支持不少于 10 种 AI 算法；六大核心功能亮点包含 5G 全网通通信、量子加密、边缘计算智能，**不包含自动返航充电**。\n平台开放性：天枢 S3 并非只能对接天翼星云平台；其价值是突破传统无人机视距与通信距离的限制。\n支架不是万能：支持 PSDK/OSDK/USB/串口/网口/E-Port 的机型，并不能都用同一套快拆支架直接兼容。","sourcePages":[37],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N466"},{"id":"N467","chapter":18,"type":"multi","stem":"某验收方案规定“只要平台负载可见、能拉日志并接收远控，就免除机械挂载验收”。按本章，哪些审计意见成立？","options":["日志可辅助诊断，但不能替代现场硬件检测","平台能远控即可证明所有机型支架通用，无需机械验收","平台注册结果不能代替挂载板安装工序与紧固检查","设备可接受相同串口协议，因此可免除对应机型快拆支架的机械适配核验"],"answers":[0,2],"explanation":"平台注册结果不能代替挂载工序与紧固检查，日志也不能替代现场硬件检测。通信接口协议相同不等于机械支架适配；能远控更不能作为不同机型支架通用的证明。","focus":"云侧结果与机械验收证据边界","difficulty":"应用","sourceSection":"三、注册与账号配置","sourceEvidence":"注册成功解锁：在资产管理-负载管理列表可见、日志可从平台侧拉取、可接收远程飞行控制指令；不会强制升级所有固件。\n正确工序：先将挂载板安装于无人机上，再将天枢安装于挂载板上；不能跳过挂载板直接把快拆板贴在机身；用 M3 螺丝代替 M1.6 属于安装工序错误。\n支架不是万能：支持 PSDK/OSDK/USB/串口/网口/E-Port 的机型，并不能都用同一套快拆支架直接兼容。\n日志价值边界：通过日志可初步判断网络注册失败原因、识别应用层错误与硬件异常链路；离线状态拉不到最新日志；日志不能替代现场硬件检测。","sourcePages":[37,38,39],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N467"},{"id":"N468","chapter":18,"type":"multi","stem":"按本章核对“设备能开机但平台不可见”，哪些检查方向合理？","options":["若5G灯灭且SIM未激活，先处理卡业务状态","平台不可见一律说明挂载板位置错误，不必查通信账号","若WORK和5G均常亮，核对账号是否配置到设备","不能单凭能开机认定平台已注册成功"],"answers":[0,2,3],"explanation":"能开机只说明设备有启动条件；通信状态和账号配置影响平台注册。资料将不同指示灯组合对应不同层次，不能一律归为机械位置问题。","focus":"注册故障分层证据","difficulty":"应用","sourceSection":"五、故障排查（分层判定）","sourceEvidence":"指示灯口径：WORK 灯熄灭 = 供电异常；WORK 常亮 + 5G 灯熄灭 + SIM 卡槽为空 = SIM 卡未插入；WORK 常亮 + 5G 常亮但平台负载管理查不到 = 账号配置错误；WORK、5G 全灭 = 无法开机，先检查连接线、电源接口、无人机端供电。\nSIM未激活的后果：SIM卡未激活或未开通数据业务：设备上电后5G指示灯熄\n灭、平台无法注册设备、数据链路不可用；设备本身仍可启动。未激活状态下不可\n能完成平台注册。\n应规避的诱因：收到账号后未联系运维配置到天枢设备，是注册过程中应主动规避的故障诱因。","sourcePages":[38,39],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N468"},{"id":"N469","chapter":18,"type":"multi","stem":"工程师要用日志判断复杂异常，按本章哪些说法成立？","options":["只要日志能下载，就可排除全部硬件故障","日志可辅助判断网络注册失败和应用层异常","明显物理损坏仍需硬件检查并可触发远程协助","日志页面的上传进度不代表直接显示日志正文"],"answers":[1,2,3],"explanation":"日志提供链路证据但有显示与诊断边界。能够下载并不能证明硬件无损，资料明确日志不能替代现场硬件检测。","focus":"日志与现场检测互补","difficulty":"应用","sourceSection":"四、日志管理","sourceEvidence":"日志价值边界：通过日志可初步判断网络注册失败原因、识别应用层错误与硬件异常链路；离线状态拉不到最新日志；日志不能替代现场硬件检测。\n日志页面可见信息：终端日志上传进度、已上传日志列表、下载按钮；看不到日志内容本身。\n远程协助时机：现场已用尽 Q\\&A 排查链仍无法定位、怀疑固件层或账号/平台侧深层问题、发现器件明显物理损坏，三种情境触发远程协助；SIM 未激活、接线松动这类现场可处理的不必上报。","sourcePages":[39],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N469"},{"id":"N470","chapter":18,"type":"multi","stem":"培训中提出两条通则：“任何现场故障都先换硬件”“所有升级协助都必须先取得实时日志”。按本章，哪些原文事实可用于反驳这些绝对规则？","options":["发现器件明显物理损坏属于远程协助触发情形","排查应从电源等基础层开始，不先拆机或换硬件","SIM未激活一律证明固件损坏，因此所有问题都应先换硬件","设备离线时拉不到实时日志，不能把最新日志设成所有情形的硬性前提"],"answers":[0,1,3],"explanation":"原文要求先分层现场排查，且指出离线实时日志有获取限制，同时明确物理损坏等协助触发情境。诊断与升级须依据情境，不能将换硬件或取得实时日志当作所有故障的统一前提。","focus":"用反例审查绝对排障规则","difficulty":"应用","sourceSection":"五、故障排查（分层判定）","sourceEvidence":"排查顺序：现场故障排查从 电源→SIM→网络→平台→业务负载 由下而上分层判定，不先拆机、不先换硬件。\n离线限制：天枢设备离线（未入网）时拉不到实时日志，长期无响应最可能是设备离线。\n远程协助时机：现场已用尽 Q\\&A 排查链仍无法定位、怀疑固件层或账号/平台侧深层问题、发现器件明显物理损坏，三种情境触发远程协助；SIM 未激活、接线松动这类现场可处理的不必上报。\n上报原则：并非任何现场无法处理的故障都立即上报；也并非所有故障都先拉日志再处理，应先按分层思路现场排查。","sourcePages":[39],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N470"},{"id":"N471","chapter":20,"type":"single","stem":"按本章部署手册，后端使用了JDK17，且cloud相关加解密能力不可用。哪种环境核对最有针对性？","options":["只增加摄像头数量，即可补齐后端依赖","把PostgreSQL换成日志文件，避免检查扩展","只更换流媒体管理端口，不检查运行时与数据库扩展","核对JDK21要求及PostgreSQL的pgcrypto扩展"],"answers":[3],"explanation":"本章同时规定后端依赖JDK21和cloud相关加解密依赖pgcrypto。运行时与数据库扩展是独立前置条件，调整视频或端口不能替代。","focus":"后端环境与加密依赖","difficulty":"应用","sourceSection":"一、星云平台架构与依赖","sourceEvidence":"数据库：后端服务使用 PostgreSQL，默认库名 `nebula`；`nebula.cloud` 库依赖 pgcrypto 加解密扩展；nebula 后端依赖 jdk21。","sourcePages":[41],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N471"},{"id":"N472","chapter":19,"type":"single","stem":"按本章星瀚手册，验收单把“更换背景和地图本地化”与“自动扩容K8S节点”都列为初始化必达能力。应怎样修正？","options":["将Logo文件改名为节点数，即可完成自动扩容","初始化支持自动扩容，因此可删除地图本地化要求","只要背景能更换，K8S节点就会自动增加","保留界面及地图初始化，删除自动扩容承诺，并核对地图改配置后的服务重启"],"answers":[3],"explanation":"原文初始化支持界面、本地化地图和设备接入管理，不支持自动扩容K8S。地图配置修改后还需重启dk-dist，不能把两类能力混为一体。","focus":"初始化范围与基础设施边界","difficulty":"应用","sourceSection":"三、平台初始化（星瀚）","sourceEvidence":"初始化功能范围：支持更换登录背景图片及LOGO、大屏配置本地化地图、设备接入管理配置；不支持自动扩容K8S集群节点。\n本地化地图生效：修改dk-dist-config配置后，需重启dk-dist服务使配置生效。","sourcePages":[40],"verification":"已对照43页课程全文及核实补全稿；按课程所述版本与阶段出题","explanationStatus":"meaningful","displayId":"N472"},{"id":"N473","chapter":20,"type":"single","stem":"按本章部署手册，项目既要调整Docker存储目录，又要控制数据库自动初始化，哪份变更单归口正确？","options":["存储目录改auto-table，数据库初始化改录像路径","两项都只在Nginx首页文字里修改","存储目录改daemon.json，自动初始化核对Nacos的auto-table","只修改docker-compose.yml文件名即可完成两项变更"],"answers":[2],"explanation":"本章将Docker存储目录指向daemon.json，数据库自动初始化由Nacos的auto-table控制。容器编排文件存在不代表所有配置都集中在它里面。","focus":"存储与初始化配置分工","difficulty":"应用","sourceSection":"一、星云平台架构与依赖","sourceEvidence":"关键配置文件：修改 docker 存储目录编辑 `/etc/docker/daemon.json`；中间件容器统一编排用 `docker-compose.yml`；数据库自动初始化由
