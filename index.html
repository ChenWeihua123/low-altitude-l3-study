期。运营商在不同阶段的介入深度不同，越靠前越能影响技术路线。专项债硬性要求：项目收益与融资自求平衡，构建的合规现金流须覆盖债券本息，不得随意设定收益水平。这是专项债项目的“一票否决”条件。","sourcePages":[16],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N202"},{"id":"N203","chapter":7,"type":"single","stem":"团队在规划设计阶段已有客户接触机会，却决定等招标后再讨论整体技术路线，只提前准备宣传材料。按资料，最有价值的调整是什么？","options":["技术路线只能在合同签完后首次讨论","等报价结束后再了解需求","先把所有设备型号锁死，再听客户约束","利用当前阶段开展专业方案与技术路线讨论，并持续衔接报债和招标"],"answers":[3],"explanation":"资料强调前期越早介入越能影响路线。规划设计阶段应利用专业参与机会，宣传材料不能代替方案沟通，也不应拖到路线已固化后才讨论。","focus":"进入阶段与内容","difficulty":"应用","sourceSection":"五、项目阶段与资金合规","sourceEvidence":"四个阶段：前期准备期、规划设计期、报债审批期、建设招标期。运营商在不同阶段的介入深度不同，越靠前越能影响技术路线。专项债硬性要求：项目收益与融资自求平衡，构建的合规现金流须覆盖债券本息，不得随意设定收益水平。这是专项债项目的“一票否决”条件。","sourcePages":[16],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N203"},{"id":"N204","chapter":7,"type":"single","stem":"一个最小单元只有演示大屏，尚未跑通任务、资源与实际运行，却称商业模式已经验证。按资料，哪项补充最关键？","options":["取消最小单元，直接建全域网络","增加屏幕数量即可视为闭环","把设备采购额改名为运营收入","形成可独立运行的场景闭环，同时验证能力与商业模式"],"answers":[3],"explanation":"最小单元的意义不只是“看得见”，而是独立运行并验证能力与模式。演示和采购规模都不能替代实际业务闭环的证据。","focus":"闭环验证的缺失","difficulty":"应用","sourceSection":"二、建设推进顺序","sourceEvidence":"三步走：最小单元→区域样板→全域覆盖。这一顺序决定了投资节奏与方案分期，先全域铺开的做法不符合规律。最小单元的意义：以一个可独立运行的最小场景闭环验证能力与商业模式，再复制为区域样板，最后才谈全域覆盖。","sourcePages":[15,16],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N204"},{"id":"N205","chapter":7,"type":"single","stem":"最小场景已独立运行，但商业模式的区域复制方式尚不明确。按资料，下一笔扩展投资更应支持什么？","options":["先建全域空壳，再寻找使用场景","形成区域样板，验证能力与模式可复制后再扩大","跳过模式验证，以站点数量作为唯一依据","只在原试点增加展示界面，永久不评估扩展"],"answers":[1],"explanation":"建设路径需要从最小场景走向区域样板，再到全域。区域样板是复制验证环节，不能用全域空壳或单纯站点数量绕过能力和商业模式评估。","focus":"区域复制决策","difficulty":"应用","sourceSection":"二、建设推进顺序","sourceEvidence":"三步走：最小单元→区域样板→全域覆盖。这一顺序决定了投资节奏与方案分期，先全域铺开的做法不符合规律。最小单元的意义：以一个可独立运行的最小场景闭环验证能力与商业模式，再复制为区域样板，最后才谈全域覆盖。","sourcePages":[15,16],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N205"},{"id":"N206","chapter":7,"type":"single","stem":"采购规范要求所有客户无论新机研发还是存量改造都采用同一外挂接口，结果整机厂无法在生产阶段集成。按资料，哪项修订最能保留两类市场机会？","options":["两类客户都只领卡，不再涉及通信硬件","分别设置前装模组合作与后装终端适配路线，连接配套协同","取消新机网联需求，只做存量客户","保留统一外挂要求，要求整机厂放弃生产集成"],"answers":[1],"explanation":"资料的前装和后装面向不同产品阶段。统一连接业务不等于所有硬件接口必须相同，应分别保留生产集成与存量加装的技术路径。","focus":"前后装统一招标误区","difficulty":"应用","sourceSection":"三、前装与后装两大市场路径","sourceEvidence":"前装两大合作模式：一是与模组厂联合产品定义、集采降本；二是与整机厂分层签约、挂图作战。模组厂主要承担联合产品定义与前装供货。后装双路径：存量换新与外挂加装。存量客户追求“低成本、快合规”入网，首选外挂天枢终端；新增整机厂要满足“新机必须网联”的监管要求，首选前装预装天擎模组＋低空卡。低空卡三大主线：前装抢入口、后装扩存量、行业树标杆。","sourcePages":[16],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N206"},{"id":"N207","chapter":7,"type":"multi","stem":"林草项目希望结合气象数据预判火势，但责任表拟由模组供货商独自承担气象建模、属地投资及号段资费制定。按资料，哪些纠偏合理？","options":["号段资费协调集团，区域客情商机投资仍由属地承担相应主体职责","气象伙伴应取代属地承担全部区域投资，模组供货即可代表预警效果达标","核实烟火特征与气象数据结合的业务预警能力，不能仅以模组交货作为证明","把气象专业能力纳入相应生态伙伴协作，而非默认由模组供货替代"],"answers":[0,2,3],"explanation":"模组供货、气象专业能力、属地投资、集团资费属于不同责任范围。林草预警还要验证烟火特征和气象数据结合，采购交货不是业务效果的充分证据，应按专业分工形成协同。","focus":"专业气象与供货职责区分","difficulty":"进阶","sourceSection":"四、省专协同与生态；三、行业场景化配置","sourceEvidence":"属地电信：承担客情、商机、投资，是区域市场的主体。无人科技：承担咨询、产品、方案，输出专业能力与交付支撑。集团侧：统筹号段资源与资费政策。生态伙伴：咨询规划方向的代表单位为苏交科，气象方向为南信大气象科技研究院等，共同构成“规划—产品—实施”的合作链。\n…\n林草巡护四项功能：全时域监测（可穿透烟雾、夜间作业）；AI智能预警（深度学习烟火特征并结合气象数据预判火势）；极端环境适应（耐低温、续航时间长）；分秒级响应（支持极速快充）。","sourcePages":[16,19],"sourceSectionKind":"原课程小节","sourceVerified":true,"sourceEvidenceFragments":["属地电信：承担客情、商机、投资，是区域市场的主体。无人科技：承担咨询、产品、方案，输出专业能力与交付支撑。集团侧：统筹号段资源与资费政策。生态伙伴：咨询规划方向的代表单位为苏交科，气象方向为南信大气象科技研究院等，共同构成“规划—产品—实施”的合作链。","林草巡护四项功能：全时域监测（可穿透烟雾、夜间作业）；AI智能预警（深度学习烟火特征并结合气象数据预判火势）；极端环境适应（耐低温、续航时间长）；分秒级响应（支持极速快充）。"],"explanationStatus":"meaningful","displayId":"N207"},{"id":"N208","chapter":7,"type":"multi","stem":"仅作学习测算：假设本题可用于偿债的合规现金流为收入减运营成本。项目收入1500万元、运营成本500万元、应覆盖本息1200万元。团队仅用1500大于1200认定已平衡。哪些判断正确？","options":["只要收入大于本息，运营成本可不进入本题所设测算","不得为了凑平衡而无依据抬高收益，应补充真实依据或调整方案","现金流与本息仍有200万元缺口","按题设计算可用于偿债现金流为1000万元，不能只比较总收入"],"answers":[1,2,3],"explanation":"本题已明确定义偿债现金流口径：1500－500＝1000万元，比1200万元本息少200万元。资料要求合规现金流覆盖本息且不得任意设定收益，不能以总收入代替净现金流。","focus":"收入与偿债现金流测算","difficulty":"进阶","sourceSection":"五、项目阶段与资金合规","sourceEvidence":"专项债硬性要求：项目收益与融资自求平衡，构建的合规现金流须覆盖债券本息，不得随意设定收益水平。这是专项债项目的“一票否决”条件。","sourcePages":[16],"sourceSectionKind":"原课程小节","sourceVerified":true,"sourceEvidenceFragments":["专项债硬性要求：项目收益与融资自求平衡，构建的合规现金流须覆盖债券本息，不得随意设定收益水平。这是专项债项目的“一票否决”条件。"],"explanationStatus":"meaningful","displayId":"N208"},{"id":"N209","chapter":7,"type":"multi","stem":"项目既服务存量机低成本接入，也服务新机生产集成。按资料，哪些约束应写入适配计划？","options":["存量客户可评估天枢外挂加装","只要所有客户签相同卡套餐，就无需再区分硬件阶段","新机厂可评估天擎前装加低空卡","模组厂可承担联合产品定义与前装供货工作"],"answers":[0,2,3],"explanation":"卡片是连接配套，不能消除机载硬件适配差异。前装、后装及模组供给应协同计划，才能同时覆盖新机集成和存量改造。","focus":"硬件阶段适配","difficulty":"进阶","sourceSection":"三、前装与后装两大市场路径","sourceEvidence":"前装两大合作模式：一是与模组厂联合产品定义、集采降本；二是与整机厂分层签约、挂图作战。模组厂主要承担联合产品定义与前装供货。后装双路径：存量换新与外挂加装。存量客户追求“低成本、快合规”入网，首选外挂天枢终端；新增整机厂要满足“新机必须网联”的监管要求，首选前装预装天擎模组＋低空卡。低空卡三大主线：前装抢入口、后装扩存量、行业树标杆。","sourcePages":[16],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N209"},{"id":"N210","chapter":7,"type":"multi","stem":"为一个需要客户拓展、资费资源和专业方案的区域项目编制责任表，按资料哪些划分合理？","options":["把所有专业气象任务默认归属地商务人员独立研发","属地电信承接客情、商机与投资主体工作","号段和统一资费政策由每个本地项目商务人员分别独立制定","无人科技提供咨询、产品、方案与交付支撑"],"answers":[1,3],"explanation":"资料提供省专与集团分工，并通过生态伙伴补充专业能力。属地商务角色不能自动替代气象等跨专业研发，责任表应体现协作而非包办。 号段资源与资费政策由集团统筹，应与属地及专业能力协作。","focus":"跨专业责任表","difficulty":"进阶","sourceSection":"四、省专协同与生态","sourceEvidence":"属地电信：承担客情、商机、投资，是区域市场的主体。无人科技：承担咨询、产品、方案，输出专业能力与交付支撑。集团侧：统筹号段资源与资费政策。生态伙伴：咨询规划方向的代表单位为苏交科，气象方向为南信大气象科技研究院等，共同构成“规划—产品—实施”的合作链。","sourcePages":[16],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N210"},{"id":"N211","chapter":6,"type":"multi","stem":"方案把“2公里级星盾最小阵地”当作“可直接覆盖2公里飞行高度”的证明，又以此取消300至600米航路通信规划。按资料，哪些审查合理？","options":["只要防护阵地有设备，通信、监视和定位即可共用同一个未经区分的达标结论","特定最小阵地的参考配置不能单独替代对应高度层的通信覆盖论证","防护半径与飞行高度是不同空间维度，不能直接互换数值含义","把2公里换算成2000米后，就自动满足所有低于2000米的通信高度要求"],"answers":[1,2],"explanation":"长度单位相同不等于空间意义或能力类型相同。资料的2公里级口径是最小阵地防护参考，通信另有按高度分层的策略；不能用水平防护半径推导垂直通信覆盖或所有能力达标。","focus":"水平半径与垂直高度","difficulty":"进阶","sourceSection":"四、星盾防护等级与要地防护；三、通信基础认知","sourceEvidence":"最小阵地参考配置：半径2公里级的星盾最小阵地，参考配置约20台设备。该口径可直接作为方案报价与设备清单的基准测算依据。\n…\n分层覆盖：120米以下城市区域复用现网基站；120至300米沿航线与热点区域增强；300至600米采用独立对空专用站；300米以上与偏远地区以卫星与地面多网融合覆盖。","sourcePages":[12,15],"sourceSectionKind":"原课程小节","sourceVerified":true,"sourceEvidenceFragments":["最小阵地参考配置：半径2公里级的星盾最小阵地，参考配置约20台设备。该口径可直接作为方案报价与设备清单的基准测算依据。","分层覆盖：120米以下城市区域复用现网基站；120至300米沿航线与热点区域增强；300至600米采用独立对空专用站；300米以上与偏远地区以卫星与地面多网融合覆盖。"],"explanationStatus":"meaningful","displayId":"N211"},{"id":"N212","chapter":7,"type":"multi","stem":"按资料的专项债学习口径，评审一份“收益已平衡”的测算表时，哪些核查有必要？","options":["收益水平是否有依据而非任意设定","只要表格总收入与总支出相等，就不再核查任何前提","现金流覆盖对象只计算本金，无须计入利息","现金流来源是否合规"],"answers":[0,3],"explanation":"资料同时要求合规现金流、覆盖本息和不得随意设收益。数值相等只是结果表达，不能替代对现金流口径与收益依据的核验。 资料要求覆盖债券本息，本金单独平衡不是完整口径。","focus":"融资平衡条件复核","difficulty":"进阶","sourceSection":"五、项目阶段与资金合规","sourceEvidence":"四个阶段：前期准备期、规划设计期、报债审批期、建设招标期。运营商在不同阶段的介入深度不同，越靠前越能影响技术路线。专项债硬性要求：项目收益与融资自求平衡，构建的合规现金流须覆盖债券本息，不得随意设定收益水平。这是专项债项目的“一票否决”条件。","sourcePages":[16],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N212"},{"id":"N213","chapter":5,"type":"multi","stem":"按资料深圳规划中8000个通信基站与500个通感基站的数值做比例练习。有人据16比1便主张“每16个通信站必须与1个通感站共址”，并把总数当成通感站数。哪些判断正确？","options":["两类规划数量之比确为16比1","通感站占这两类新增站点合计约5.88%，但比例本身不能证明共址规则","将两类数量相加后，就可把8500全部写成通感站数量","16比1的数量比足以证明每个通感站必须与16个通信站共址"],"answers":[0,1],"explanation":"8000÷500＝16；500÷8500约为5.88%。这是分类数量的比例，不包含站点共址关系，也不会改变类别属性；不能从数量比额外推导布点约束或把通信站改计为通感站。","focus":"规划数量与布点约束推断","difficulty":"进阶","sourceSection":"九、深圳样板与电信差异化策略","sourceEvidence":"深圳基础设施规划：深圳市低空经济基础设施规划：未来3年新增5G-A通信基站8000个、通感基站500个","sourcePages":[14],"sourceSectionKind":"原课程小节","sourceVerified":true,"sourceEvidenceFragments":["深圳基础设施规划：深圳市低空经济基础设施规划：未来3年新增5G-A通信基站8000个、通感基站500个"],"explanationStatus":"meaningful","displayId":"N213"},{"id":"N214","chapter":5,"type":"multi","stem":"仅作学习测算：把资料苏州年监测超34万架次按365天平均。排班人员据此把每日保障上限固定为平均数，并认定每天架次都相同。哪些审查正确？","options":["只要算出日均数，就已掌握每一天的完整负荷分布","年平均不能证明每日架次相同，也不能单独证明峰值保障能力","按365天计算，日均监测量超过约931架次","应区分年度总量、日均值和峰值需求，不能用均值直接替代全部排班约束"],"answers":[1,2,3],"explanation":"340000÷365约为931.51，原文为超34万，故条件测算的日均量超过这一参考值。平均数不包含逐日分布和峰值，不能直接据此确定每日上限或保证峰值保障。","focus":"年均监测量与峰值保障","difficulty":"进阶","sourceSection":"五、行业案例的解法","sourceEvidence":"苏州低空“一中心一平台”：2024年10月18日正式投入运行。公开运营成效包括：服务143家运营企业、接入263架航空器、年监测飞行超34万架次、企业服务满意度96.32%。","sourcePages":[13],"sourceSectionKind":"原课程小节","sourceVerified":true,"sourceEvidenceFragments":["苏州低空“一中心一平台”：2024年10月18日正式投入运行。公开运营成效包括：服务143家运营企业、接入263架航空器、年监测飞行超34万架次、企业服务满意度96.32%。"],"explanationStatus":"meaningful","displayId":"N214"},{"id":"N215","chapter":7,"type":"multi","stem":"最小单元成功后希望扩大建设，按资料哪些决策有助于控制跨区域复制风险？","options":["保持最小单元、区域样板、全域覆盖的递进关系","先形成区域样板再谋划全域覆盖","未验证时仅凭设备数量直接认定全域可行","将能力与商业模式验证作为复制条件"],"answers":[0,1,3],"explanation":"递进建设让能力与模式先验证再复制。设备采购总量不等于可运行和可经营的证明，直接跳到全域会略过资料明确的区域样板环节。","focus":"区域推广风险控制","difficulty":"进阶","sourceSection":"二、建设推进顺序","sourceEvidence":"三步走：最小单元→区域样板→全域覆盖。这一顺序决定了投资节奏与方案分期，先全域铺开的做法不符合规律。最小单元的意义：以一个可独立运行的最小场景闭环验证能力与商业模式，再复制为区域样板，最后才谈全域覆盖。","sourcePages":[15,16],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N215"},{"id":"N216","chapter":8,"type":"single","stem":"一份案例卡写“南京建设全国首个省级平台，22代表区县分局数”。按资料，哪项修改同时纠正两个口径？","options":["改为市级平台，但22对应机场面积","改为市级公安多机型统一管控平台，22对应方舱数量","保留省级，只将22改为无人机数量","保留区县分局解释，只把省级改为市级"],"answers":[1],"explanation":"资料明确南京平台为市级，“22”指22套方舱。平台行政层级与架构数字含义是独立信息，修正其中一项不能代替另一项。","focus":"公安架构双重纠错","difficulty":"应用","sourceSection":"一、标杆项目与架构","sourceEvidence":"南京公安：“1＋1＋22＋N”架构中，“22”代表22套方舱，不是22个区县分局；该平台是市级公安多机型无人机统一管控平台，“全国首个省级”的表述不成立。南京平台六字诀：看、说、判、管、战、飞，六项构成低空网络指挥调度的核心能力闭环。","sourcePages":[17],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N216"},{"id":"N217","chapter":8,"type":"single","stem":"评审要求分别呈现“核心指挥调度能力”与“部署规模”。材料却用22套方舱证明所有指挥环节都已闭环。按资料，最合理的补充是什么？","options":["把市级平台改写省级以增强证明力度","方舱数量已能直接证明全部指挥能力，无需补充","用“看、说、判、管、战、飞”的能力闭环说明功能，再单独呈现方舱规模","把22改成更大数字即可"],"answers":[2],"explanation":"方舱数量说明部署规模，六字诀说明指挥调度能力构成。规模与闭环不是同一维度，不能用数量替代功能与流程的完整呈现。","focus":"指挥闭环与规模区分","difficulty":"应用","sourceSection":"一、标杆项目与架构","sourceEvidence":"南京公安：“1＋1＋22＋N”架构中，“22”代表22套方舱，不是22个区县分局；该平台是市级公安多机型无人机统一管控平台，“全国首个省级”的表述不成立。南京平台六字诀：看、说、判、管、战、飞，六项构成低空网络指挥调度的核心能力闭环。","sourcePages":[17],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N217"},{"id":"N218","chapter":8,"type":"single","stem":"设计一份公安参考案例表时，把南京22套方舱、温州10套机场和池州5个机舱点位全部标成“区县分局数”。按资料，哪项修订最准确？","options":["三组数量都是行政辖区划分，不用改","统一改为无人机架数即可","分别恢复方舱、机场、机舱点位的原始单位和场景，避免把设备布局数变成行政单位数","先求平均数，再用平均数代表全部城市架构"],"answers":[2],"explanation":"三组数字对应不同案例和设施单位，不是区县分局数。借鉴方案要保留场景与计量口径，不能因为都用于公安就混为同一种部署结构。","focus":"多案例复用边界","difficulty":"应用","sourceSection":"一、标杆项目与架构","sourceEvidence":"连云港公安：低空警务融合作战平台是公安行业首个三网三平台架构的低空警务融合作战平台。池州交警：在G50沪渝高速池州段建设5个机舱点位，实现高速公路巡查自动化；“7个点位”为错误口径。温州交管：网格化布建10套无人机机场。","sourcePages":[17],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N218"},{"id":"N219","chapter":8,"type":"single","stem":"客户同时问“融合架构如何设计”和“高速自动巡查如何布点”。按资料，参考案例应如何分工使用？","options":["把连云港架构直接当作所有高速点位数量标准","用连云港三网三平台作为融合架构参考，用池州高速机舱点位案例说明自动巡查布建","把池州5个点位解释为三网三平台的网络数量","仅以温州机场数量回答两个问题"],"answers":[1],"explanation":"连云港体现警务融合作战架构，池州体现特定高速巡查的点位建设实践。架构与部署实例可分别参考，但不能由一个案例推导所有项目的统一点位标准。","focus":"案例架构与点位量区分","difficulty":"应用","sourceSection":"一、标杆项目与架构","sourceEvidence":"连云港公安：低空警务融合作战平台是公安行业首个三网三平台架构的低空警务融合作战平台。池州交警：在G50沪渝高速池州段建设5个机舱点位，实现高速公路巡查自动化；“7个点位”为错误口径。温州交管：网格化布建10套无人机机场。","sourcePages":[17],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N219"},{"id":"N220","chapter":8,"type":"single","stem":"仅作学习测算：某巡查覆盖基准指数为100、人力巡逻成本基准指数也为100，若分别套用资料中的温州变化比例，结果应是哪组？","options":["覆盖90，成本60","覆盖190，成本40","覆盖190，成本160","覆盖10，成本40"],"answers":[1],"explanation":"覆盖“扩大90%”是在100上增加90，得190；成本“降低60%”是在100上减少60，得40。题目只演练比例含义，不意味着别的项目会复制温州的实际成效。","focus":"提升与降低的计算","difficulty":"应用","sourceSection":"二、量化成效","sourceEvidence":"甘肃：警用无人机实战管理平台依托5G超低延迟传输，将无人机操控效能提升200%。温州成效：累计警告、处罚各类交通违法4200余起；劝离违停车辆3600余辆；巡查覆盖扩大90%；指挥效率提升70%；人力巡逻成本降低60%。五项数据常被成组考查。","sourcePages":[17],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N220"},{"id":"N221","chapter":8,"type":"single","stem":"汇报人把温州“4200余起交通违法警告处罚”与“3600余辆违停劝离”直接相加，宣称至少服务7800名不同驾驶人。按资料，应怎样评价？","options":["数据单位不同，且未说明主体去重，不能直接推导不同驾驶人数","只要都与交通相关，任何指标都能相加","只需把7800改成7800起就证明人数成立","结论正确，起数和车辆数都等于不重复人数"],"answers":[0],"explanation":"“起”和“辆”是不同计数口径，资料也没有提供驾驶人去重关系。能分别描述两类治理成效，但不能由简单相加推出不重复人数。","focus":"不同计数单位","difficulty":"应用","sourceSection":"二、量化成效","sourceEvidence":"甘肃：警用无人机实战管理平台依托5G超低延迟传输，将无人机操控效能提升200%。温州成效：累计警告、处罚各类交通违法4200余起；劝离违停车辆3600余辆；巡查覆盖扩大90%；指挥效率提升70%；人力巡逻成本降低60%。五项数据常被成组考查。","sourcePages":[17],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N221"},{"id":"N222","chapter":8,"type":"single","stem":"项目复盘写“温州指挥效率提高60%、人力巡逻成本降低70%”，并以这两项支持排班决策。按资料，哪项处理最恰当？","options":["只把提高和降低两个词互换","先恢复指挥效率提升70%、人力成本降低60%的指标对应关系，再分析决策","不必改，两个比例差不多","将两项都统一写90%"],"answers":[1],"explanation":"数据分析必须保留指标与幅度的对应。资料中70%属于指挥效率，60%属于人力巡逻成本，两者含义不同，不能互换后用于资源判断。","focus":"成效指标误换","difficulty":"应用","sourceSection":"二、量化成效","sourceEvidence":"甘肃：警用无人机实战管理平台依托5G超低延迟传输，将无人机操控效能提升200%。温州成效：累计警告、处罚各类交通违法4200余起；劝离违停车辆3600余辆；巡查覆盖扩大90%；指挥效率提升70%；人力巡逻成本降低60%。五项数据常被成组考查。","sourcePages":[17],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N222"},{"id":"N223","chapter":8,"type":"single","stem":"销售材料把甘肃的200%操控效能提升、温州的90%覆盖扩大都归因为“只增加机场数量”，并承诺任何城市都同幅改善。按资料，应怎样改写？","options":["甘肃成效对应5G超低延迟传输，温州数据按原案例指标呈现，不直接外推为通用承诺","所有成效都可以只由设备数量解释","保留承诺，只删除案例城市名","把200%也改为90%，即可统一归因"],"answers":[0],"explanation":"资料明确甘肃的操控效能与5G超低延迟传输有关，温州则有多项不同维度成效。不能把跨案例结果统一归于机场数量，更不能自动承诺其他项目复制同一比例。","focus":"跨案例技术归因","difficulty":"应用","sourceSection":"二、量化成效","sourceEvidence":"甘肃：警用无人机实战管理平台依托5G超低延迟传输，将无人机操控效能提升200%。温州成效：累计警告、处罚各类交通违法4200余起；劝离违停车辆3600余辆；巡查覆盖扩大90%；指挥效率提升70%；人力巡逻成本降低60%。五项数据常被成组考查。","sourcePages":[17],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N223"},{"id":"N224","chapter":8,"type":"single","stem":"一份提案用温州AI空警获奖事实证明“全省所有公安无人机平台均采用同一架构且功能已达标”。按资料，最准确的判断是什么？","options":["获奖级别高，足以证明全部平台相同","只要模型获奖，所有点位都无需验收","获奖说明特定模型在特定赛道的成绩，不能据此推导所有平台架构和功能状态","把一等奖改为全国奖，就能证明该结论"],"answers":[2],"explanation":"资料的获奖主体、赛事与赛道都有明确范围，说明的是模型实践成绩。它不是全部城市平台架构、覆盖范围或验收状态的证据，引用时应保留边界。","focus":"模型获奖证据边界","difficulty":"应用","sourceSection":"二、量化成效","sourceEvidence":"温州AI空警：“AI空警”模型在2026年全省公安交管大数据建模比武中获得“城市交通精细治理”赛道一等奖。","sourcePages":[17],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N224"},{"id":"N225","chapter":8,"type":"single","stem":"一个公安项目已完成网格机场布建和多机型统一管控，却常出现识别结果无人研判、告警与调度脱节。按资料，下一阶段最应补齐什么？","options":["继续只加机场，流程问题会自然消失","加强AI模型赋能与指挥调度闭环，使现有部署进入业务链","删除统一管控，恢复各设备各自作业","改为普通监管大屏即可"],"answers":[1],"explanation":"四条主线需要形成配合。题设已具备管控与机场基础，短板在识别应用和指挥闭环，应补齐业务能力，而非单靠设备扩容或退回分散作业。","focus":"公安方案短板补齐","difficulty":"应用","sourceSection":"三、方案价值主线","sourceEvidence":"四条主线：多机型统一管控＋网格化机场布建＋AI模型赋能＋指挥调度闭环，是警务方案区别于通用监管方案的四个支点。","sourcePages":[17],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N225"},{"id":"N226","chapter":8,"type":"single","stem":"平台已能展示飞行态势，但各警用机型仍分散操控、任务未形成统一指挥。按资料，评审更应关注哪种升级方向？","options":["优先补齐多机型统一管控并衔接警务指挥调度，结合网格机场与AI形成方案","只要冠名公安，通用监管展示就等于完整警务应用","删除所有业务功能，仅保留设备坐标","只更换大屏配色即可转成警务方案"],"answers":[0],"explanation":"警务方案的价值不止于看到目标，还包括多机型管控、网格布建、AI与指挥闭环。应针对业务断点升级，不能以名称或视觉改版替代警务能力。","focus":"从监管到警务应用","difficulty":"应用","sourceSection":"三、方案价值主线","sourceEvidence":"四条主线：多机型统一管控＋网格化机场布建＋AI模型赋能＋指挥调度闭环，是警务方案区别于通用监管方案的四个支点。","sourcePages":[17],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N226"},{"id":"N227","chapter":8,"type":"multi","stem":"某市使用全国统一SaaS形态，宣传便将其公安平台写成省级平台，并把南京案例22套方舱改写为22个区县。按资料，哪些校正合理？","options":["SaaS服务范围可以直接代替设施单位，因此方舱数等于区县数","引用南京案例时仍应保留市级平台、22套方舱的原始口径","全国统一SaaS描述服务或部署形态，不会自动提升本地平台的行政层级","采用全国统一服务就证明任何使用方都具有省级监管权限"],"answers":[1,2],"explanation":"服务部署形态、平台行政层级与设施计量单位是不同信息。全国统一SaaS不自动改变使用方层级；南京原文明确市级平台与22套方舱，不能因部署形态改变这些事实。","focus":"技术部署范围与行政层级","difficulty":"进阶","sourceSection":"二、星巡的形态选择与部署方式；一、标杆项目与架构","sourceEvidence":"全国统一SaaS版：适用于项目前期，需要快速向领导演示基础态势、告警、台账能力。特点是投入低、开通快，先解决“看得见”的问题。\n…\n南京公安：“1＋1＋22＋N”架构中，“22”代表22套方舱，不是22个区县分局；该平台是市级公安多机型无人机统一管控平台，“全国首个省级”的表述不成立。","sourcePages":[11,17],"sourceSectionKind":"原课程小节","sourceVerified":true,"sourceEvidenceFragments":["全国统一SaaS版：适用于项目前期，需要快速向领导演示基础态势、告警、台账能力。特点是投入低、开通快，先解决“看得见”的问题。","南京公安：“1＋1＋22＋N”架构中，“22”代表22套方舱，不是22个区县分局；该平台是市级公安多机型无人机统一管控平台，“全国首个省级”的表述不成立。"],"explanationStatus":"meaningful","displayId":"N227"},{"id":"N228","chapter":8,"type":"multi","stem":"某省拟借鉴连云港、池州与温州公安案例。按资料，哪些引用方式合理？","options":["把三个案例的数量全部写成全省统一强制标准","将连云港用于说明三网三平台融合架构实践","将池州高速5个机舱点位作为特定场景的自动巡查案例","将温州10套机场作为网格化布建实践"],"answers":[1,2,3],"explanation":"案例可用于解释架构与布建实践，但资料没有将特定城市的点位数定为所有地区统一强制标准。复制时应保留案例条件，而不是直接绝对化数量。","focus":"参考案例不等于统一标准","difficulty":"进阶","sourceSection":"一、标杆项目与架构","sourceEvidence":"连云港公安：低空警务融合作战平台是公安行业首个三网三平台架构的低空警务融合作战平台。池州交警：在G50沪渝高速池州段建设5个机舱点位，实现高速公路巡查自动化；“7个点位”为错误口径。温州交管：网格化布建10套无人机机场。","sourcePages":[17],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N228"},{"id":"N229","chapter":8,"type":"multi","stem":"复核公安低空项目汇报时，按资料哪些检查有助于避免误读温州与甘肃数据？","options":["区分覆盖扩大、效率提升与成本降低的方向","将所有案例百分比相加作为“综合提升率”","将甘肃200%操控效能提升归为温州机场布建的同项结果","区分违法起数与劝离车辆数，不直接当成不重复人数"],"answers":[0,3],"explanation":"计数对象、变化方向和技术背景都应保持原口径。不同指标或不同案例的百分比没有共同分母，不能直接相加成一个综合提升率。 不得跨案例迁移指标及其技术归因。","focus":"量化成效汇报复核","difficulty":"进阶","sourceSection":"二、量化成效","sourceEvidence":"甘肃：警用无人机实战管理平台依托5G超低延迟传输，将无人机操控效能提升200%。温州成效：累计警告、处罚各类交通违法4200余起；劝离违停车辆3600余辆；巡查覆盖扩大90%；指挥效率提升70%；人力巡逻成本降低60%。五项数据常被成组考查。","sourcePages":[17],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N229"},{"id":"N230","chapter":8,"type":"multi","stem":"仅作比例练习：将温州人力成本基准设为100，按资料降低60%后为40。新同事说“在40上再增加60%就回到100，成本降幅还能和覆盖增幅直接相加”。哪些判断正确？","options":["成本降幅与覆盖增幅不是同一指标，不能直接相加为统一改善率","从40回到100，需相对于40增加150%","40增加60%后是64，并未回到100","案例中的测算比例可以无条件承诺其他城市实现同样结果"],"answers":[0,1,2],"explanation":"降低和恢复使用的基数不同：40×1.6＝64；恢复到100需增加60，相对于40的增幅是150%。成本和覆盖也没有共同计量基数，不能相加为统一改善率。此为条件测算，不是其他城市的效果承诺。","focus":"降幅的基数反推","difficulty":"进阶","sourceSection":"二、量化成效","sourceEvidence":"温州成效：累计警告、处罚各类交通违法4200余起；劝离违停车辆3600余辆；巡查覆盖扩大90%；指挥效率提升70%；人力巡逻成本降低60%。五项数据常被成组考查。","sourcePages":[17],"sourceSectionKind":"原课程小节","sourceVerified":true,"sourceEvidenceFragments":["温州成效：累计警告、处罚各类交通违法4200余起；劝离违停车辆3600余辆；巡查覆盖扩大90%；指挥效率提升70%；人力巡逻成本降低60%。五项数据常被成组考查。"],"explanationStatus":"meaningful","displayId":"N230"},{"id":"N231","chapter":8,"type":"multi","stem":"材料把苏州2024年10月18日投运、96.32%满意度，与温州2026年AI空警获奖连成因果，写“苏州投运时已靠该获奖模型达到该满意度”。按资料，哪些审查合理？","options":["苏州较早投运能直接证明后来获奖的温州模型当时已经部署在苏州","两个事实属于不同城市主体，不能直接合并成同一项目的因果链","投运时间、满意度和模型获奖应保留各自口径；资料未给出该模型导致苏州成效的证据","只要获奖年份晚于投运，就能证明二者使用了完全相同的技术体系"],"answers":[1,2],"explanation":"时间先后和不同城市的事实并列都不是因果证明。资料分别记载苏州运营数据和温州模型赛事成绩，没有给出该模型在苏州部署或带来满意度的因果依据，不能跨主体、跨时间补写结论。","focus":"跨城跨年因果证据","difficulty":"进阶","sourceSection":"五、行业案例的解法；二、量化成效","sourceEvidence":"苏州低空“一中心一平台”：2024年10月18日正式投入运行。公开运营成效包括：服务143家运营企业、接入263架航空器、年监测飞行超34万架次、企业服务满意度96.32%。\n…\n温州AI空警：“AI空警”模型在2026年全省公安交管大数据建模比武中获得“城市交通精细治理”赛道一等奖。","sourcePages":[13,17],"sourceSectionKind":"原课程小节","sourceVerified":true,"sourceEvidenceFragments":["苏州低空“一中心一平台”：2024年10月18日正式投入运行。公开运营成效包括：服务143家运营企业、接入263架航空器、年监测飞行超34万架次、企业服务满意度96.32%。","温州AI空警：“AI空警”模型在2026年全省公安交管大数据建模比武中获得“城市交通精细治理”赛道一等奖。"],"explanationStatus":"meaningful","displayId":"N231"},{"id":"N232","chapter":8,"type":"multi","stem":"汇报只列温州“覆盖扩大90%、效率提升70%、人力成本降低60%”，没有提供各项原始基数。有人据此填写“覆盖增加90平方公里、成本减少60万元”。哪些审查正确？","options":["不同单位指标的比例不能直接相加为统一综合改善率","只有覆盖增幅而无面积基数，不能求出面积绝对增量","只有成本降幅而无成本基数，不能断定节约60万元","这些百分比本身已经包含所有绝对单位和原始基数"],"answers":[0,1,2],"explanation":"百分比描述相对于基数的变化，绝对增量还需要相应基数。资料所列比例没有给出题设要求的面积与成本原值，不能直接把90%改成90平方公里、把60%改成60万元，不同指标也不能混算。","focus":"比例与绝对量的证据边界","difficulty":"进阶","sourceSection":"二、量化成效","sourceEvidence":"温州成效：累计警告、处罚各类交通违法4200余起；劝离违停车辆3600余辆；巡查覆盖扩大90%；指挥效率提升70%；人力巡逻成本降低60%。五项数据常被成组考查。","sourcePages":[17],"sourceSectionKind":"原课程小节","sourceVerified":true,"sourceEvidenceFragments":["温州成效：累计警告、处罚各类交通违法4200余起；劝离违停车辆3600余辆；巡查覆盖扩大90%；指挥效率提升70%；人力巡逻成本降低60%。五项数据常被成组考查。"],"explanationStatus":"meaningful","displayId":"N232"},{"id":"N233","chapter":8,"type":"multi","stem":"一个通用飞行态势页面准备扩展为公安解决方案。按资料，哪些能力建设与警务主线吻合？","options":["指挥调度形成业务闭环","AI模型赋能具体警务应用","仅把平台标题改成公安，即可省略任务与调度设计","允许各品牌设备持续独立作业，以替代多机型统一管控"],"answers":[0,1],"explanation":"警务方案由管控、布建、模型、指挥四个支点构成。平台名称和态势页面不能替代具体业务设计，应围绕警务流程补齐能力。 分散独立作业不能直接替代资料所述多机型统一管控。","focus":"警务方案与通用展示","difficulty":"进阶","sourceSection":"三、方案价值主线","sourceEvidence":"四条主线：多机型统一管控＋网格化机场布建＋AI模型赋能＋指挥调度闭环，是警务方案区别于通用监管方案的四个支点。","sourcePages":[17],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N233"},{"id":"N234","chapter":9,"type":"single","stem":"一套应急方案已成功把物资投进隔绝区域，但通信节点没有组网，团队仍宣布“精准投送即建网”已完整验证。按资料，评审应怎样判断？","options":["只要物资到达就必然等于网络可用","运输能力得到局部验证，还需验证通信建立，才能支持双能力闭环结论","无需网络，只需增加投送视频","把方案名称改为运输加通信即可视为通过"],"answers":[1],"explanation":"资料的独特价值是运输与通信融合，“物资投到哪，网络铺到哪”。成功投送只覆盖其中一部分，不能替代对通信节点建立和业务可用性的验证。","focus":"投送与建网双验收","difficulty":"应用","sourceSection":"一、核心定位与平台能力","sourceEvidence":"独有竞争力：“精准投送即建网”的本质是首创“运输＋通信”双能力融合的无人机应急体系，实现“物资投到哪，网络铺到哪”。这不是靠基站密度或卫星电话免费发放能替代的。平台核心引擎：低空应急指挥调度平台构建“感知—决策—指挥—行动”一体化体系，核心引擎是无人设备管控，而非单纯的5G通信或GIS。","sourcePages":[18],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N234"},{"id":"N235","chapter":9,"type":"single","stem":"应急平台已采购5G连接和GIS底图，但无人设备仍无法统一调派，团队却认为核心引擎已经完整具备。按资料，关键缺口是什么？","options":["设备数量只要继续增长就会自动统一管控","地图图层颜色不足","无人设备管控未贯通，不能用通信与地图底座替代核心引擎","只需购买更多手机卡，不需设备管控"],"answers":[2],"explanation":"5G和GIS是相关基础能力，资料明确平台核心引擎是无人设备管控。若设备无法统一调派，“感知—决策—指挥—行动”仍可能断链，不能靠采购底座自动宣告闭环。","focus":"平台核心不等于底座","difficulty":"应用","sourceSection":"一、核心定位与平台能力","sourceEvidence":"独有竞争力：“精准投送即建网”的本质是首创“运输＋通信”双能力融合的无人机应急体系，实现“物资投到哪，网络铺到哪”。这不是靠基站密度或卫星电话免费发放能替代的。平台核心引擎：低空应急指挥调度平台构建“感知—决策—指挥—行动”一体化体系，核心引擎是无人设备管控，而非单纯的5G通信或GIS。","sourcePages":[18],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N235"},{"id":"N236","chapter":9,"type":"single","stem":"演练中视频清楚、链路稳定，但接警后需要多部门逐层转发，任务与可用无人机也靠人工反复核对。按资料，优先改进哪一组问题？","options":["继续扩卫星带宽，不调整流程","把全部任务交由更多人逐级转发","提高屏幕分辨率并增加地图图标","缩短指令与协同链路，加强任务资源匹配及动态调派"],"answers":[3],"explanation":"题设已排除明显传输质量问题，瓶颈与资料所列流转层级多、协同长、匹配和调派弱相符。应改进指挥组织和资源调度，而非一概归因于带宽不足。","focus":"响应慢的主因定位","difficulty":"应用","sourceSection":"一、核心定位与平台能力","sourceEvidence":"自动接警：平台支持自动接警响应，不只支持人工接警后手动调派无人机。痛点归因：“应急响应效率偏低”主要源于指令流转层级多、跨部门协同链路长、任务与资源智能匹配及动态调派能力偏弱。","sourcePages":[18],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N236"},{"id":"N237","chapter":9,"type":"single","stem":"三断演练中空投基站正常开机，但现场不具备地面回传；方案仍把回传前提设为“等本地光缆恢复”。按资料，最针对性的修订是什么？","options":["将所有回传任务推迟到灾后复盘","围绕高通量卫星中继打通机载基站至地面信关站、核心网的链路","要求通信车必须先沿断路驶入","只恢复电源就宣告通信业务可用"],"answers":[1],"explanation":"资料通过卫星中继解决三断下地面回传不可用的问题。基站开机只是局部状态，还需连到信关站和核心网，不能把尚不可用的光缆作为应急恢复前提。","focus":"投送后回传断点","difficulty":"应用","sourceSection":"二、三断场景与通信恢复","sourceEvidence":"三断场景的特殊性：通信、道路、电力均中断时，道路严重毁坏、人和车辆无法进入灾区，必须采用无人机空投基站等无人化方式恢复通信；不能等道路抢通后部署应急通信车，也不能靠铺野战光缆或仅恢复电力。通信链路设计：采用“机载基站—高通量卫星—地面信关站—运营商核心网”链路，核心设计逻辑是以高通量卫星为中继，解决机载基站在三断场景下无法通过地面链路回传核心网的问题。","sourcePages":[18],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N237"},{"id":"N238","chapter":9,"type":"single","stem":"灾区局部恢复供电，但道路和通信仍中断，指挥部准备立即用普通应急通信车进入并依赖本地地面回传。按资料，最合理的判断是什么？","options":["仍需分别解决进入与回传约束，可继续评估无人化投送及卫星中继","只需换一辆更大的通信车","停止通信恢复，等所有道路完全重建后再处理","只恢复电力就说明车辆进入和回传问题都已解决"],"answers":[0],"explanation":"电力恢复不自动修复道路或通信链路。资料的无人化投送和卫星回传分别回应进入与回传障碍，应逐项核实，避免把三种约束混为一个状态。","focus":"三断条件未解除","difficulty":"应用","sourceSection":"二、三断场景与通信恢复","sourceEvidence":"三断场景的特殊性：通信、道路、电力均中断时，道路严重毁坏、人和车辆无法进入灾区，必须采用无人机空投基站等无人化方式恢复通信；不能等道路抢通后部署应急通信车，也不能靠铺野战光缆或仅恢复电力。通信链路设计：采用“机载基站—高通量卫星—地面信关站—运营商核心网”链路，核心设计逻辑是以高通量卫星为中继，解决机载基站在三断场景下无法通过地面链路回传核心网的问题。","sourcePages":[18],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N238"},{"id":"N239","chapter":9,"type":"single","stem":"同一时刻有多个投送任务，部分任务无人机运力充足却缺卫星带宽，另一些带宽有余却缺运力。按资料，应突出哪项调度能力？","options":["将资源固定分配后禁止任何变化","只增加地图页面数量","对运力与卫星带宽资源进行动态匹配，支撑运营商级服务赋能","只按无人机总数平均分配，不考虑带宽"],"answers":[2],"explanation":"资料明确运营商级服务赋能包含运力与卫星带宽动态匹配。两类资源互有短板时，单独平均其中一类无法保证任务有效完成，需要联合调度。","focus":"应急资源双调度","difficulty":"应用","sourceSection":"二、三断场景与通信恢复","sourceEvidence":"四大核心竞争力：全时全域通信底座（运输无人机搭载自研卫星便携站，空投后自动对星组网）；精准运力网络化（首创“一机双投”，实现人机协同救援闭环）；运营商级服务赋能（基于电信云原生架构构建运力与卫星带宽资源动态匹配算法）；量子加密传输＋北斗三号短报文双保险。","sourcePages":[18],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N239"},{"id":"N240","chapter":9,"type":"single","stem":"采购清单中的“综合防灾应急仓”只有储物架和无人机停放空间，未设计能源与通信能力。按资料，哪项评审意见最恰当？","options":["增加仓门数量即可替代通信能力","它目前更接近单纯仓库或机库，应补齐能源、通信与低空相关功能的集成方案","只要外形是集装箱，就已符合综合定位","把名称加上智能二字即可验收"],"answers":[1],"explanation":"资料强调综合仓集成应急能源、通信和低空功能。名称和外形不能替代功能集成，评审应核实缺失的能源与通信保障，而非只看存放空间。","focus":"综合仓能力缺项","difficulty":"应用","sourceSection":"二、三断场景与通信恢复","sourceEvidence":"综合防灾应急仓：被称为“全球首款”，核心在于集合应急能源、通信及低空经济等功能于一体的智能综合防灾应急仓，不是单纯的集装箱仓库或无人机机库。","sourcePages":[18],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N240"},{"id":"N241","chapter":9,"type":"single","stem":"消防系统能根据城市模型自动生成出发航线，但到火情附近仍只能沿起飞前固定航线飞行，未做局部精细侦查航线生成。按资料，缺失的是哪一段？","options":["多部门财务结算","到达附近后的自动精细化航线生成与侦查衔接","起飞前打印纸质地图","城市模型生成初始航线"],"answers":[1],"explanation":"资料中的消防航线分为初始规划与到场附近精细化生成两个阶段。前一阶段已实现不等于后一阶段也具备，固定航线不能自动替代临近火情的精细侦查安排。","focus":"消防航线阶段断点","difficulty":"应用","sourceSection":"三、行业场景化配置","sourceEvidence":"城市消防航线：依据城市建模数据自动规划初始航线，到达火情附近后自动生成精细化航线进行火情侦查，全程非手动遥控、也非起飞前一次性固定航线。消防配置清单：软硬件配置包含多类机型，不只有复合翼无人机系统。","sourcePages":[18],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N241"},{"id":"N242","chapter":9,"type":"single","stem":"林草项目既要对高风险目标点位持续巡查，又要覆盖长距离大范围区域。方案只用一种机型并以“所有任务都叫巡检”为由不作区分。按资料，如何改进？","options":["重点点位必须只用复合翼，长距离必须只用多旋翼","只保留地面摄像头，取消全部低空任务","所有任务只增加同一机型数量，不分析任务形态","重点点位评估多旋翼持续巡查，大范围长距离巡检接入复合翼，形成组合"],"answers":[3],"explanation":"资料按任务特征提出组合部署：重点点位多旋翼，长距离大范围接入复合翼。机型选型应服务覆盖目标，不能因为都叫巡检就忽视航程与点位差异。","focus":"点位与长航程组合","difficulty":"应用","sourceSection":"三、行业场景化配置","sourceEvidence":"水利与林草组合部署：重点区域部署多旋翼无人机实现24小时目标点位巡查，长距离大范围巡检接入复合翼无人机。林草巡护四项功能：全时域监测（可穿透烟雾、夜间作业）；AI智能预警（深度学习烟火特征并结合气象数据预判火势）；极端环境适应（耐低温、续航时间长）；分秒级响应（支持极速快充）。","sourcePages":[19],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N242"},{"id":"N243","chapter":9,"type":"single","stem":"林草系统能夜间采集和穿透烟雾观测，但只存储视频，没有结合气象数据分析烟火特征与火势。按资料，下一步最应补齐什么？","options":["只提高充电功率，取消模型分析","补齐AI烟火特征识别及结合气象数据的智能预警环节","将夜间视频改为白天视频","再加大存储盘即可认为具备火势预判"],"answers":[1],"explanation":"全时域监测与AI智能预警是不同功能。能采集夜间或烟雾场景不等于已完成火势预判，应将烟火模型与气象数据纳入分析，而非用存储或充电替代预警。","focus":"林草预警链缺口","difficulty":"应用","sourceSection":"三、行业场景化配置","sourceEvidence":"水利与林草组合部署：重点区域部署多旋翼无人机实现24小时目标点位巡查，长距离大范围巡检接入复合翼无人机。林草巡护四项功能：全时域监测（可穿透烟雾、夜间作业）；AI智能预警（深度学习烟火特征并结合气象数据预判火势）；极端环境适应（耐低温、续航时间长）；分秒级响应（支持极速快充）。","sourcePages":[19],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N243"},{"id":"N244","chapter":9,"type":"multi","stem":"应急采购把“一机双投”理解为不再需要人机协同，又把“空投后自动对星组网”理解为可取消运营商资源服务。按资料，哪些校正合理？","options":["一机双投所在能力强调人机协同救援闭环，不能由无人化误推为无需协同","只要设备能够自动动作，人机协同、资源服务与安全保障都可从方案省去","自动对星组网说明通信建立方式，不等于取消运力与卫星带宽的动态匹配","量子加密与北斗三号短报文等保障仍有各自作用，不能因自动化而一并删除"],"answers":[0,2,3],"explanation":"自动化是部分执行能力，不意味着所有协同和运营职责消失。资料同时强调人机协同、动态资源匹配与双保险，不能从某一自动动作推导出其他保障都可取消。","focus":"自动化与协同职责","difficulty":"进阶","sourceSection":"二、三断场景与通信恢复","sourceEvidence":"四大核心竞争力：全时全域通信底座（运输无人机搭载自研卫星便携站，空投后自动对星组网）；精准运力网络化（首创“一机双投”，实现人机协同救援闭环）；运营商级服务赋能（基于电信云原生架构构建运力与卫星带宽资源动态匹配算法）；量子加密传输＋北斗三号短报文双保险。","sourcePages":[18],"sourceSectionKind":"原课程小节","sourceVerified":true,"sourceEvidenceFragments":["四大核心竞争力：全时全域通信底座（运输无人机搭载自研卫星便携站，空投后自动对星组网）；精准运力网络化（首创“一机双投”，实现人机协同救援闭环）；运营商级服务赋能（基于电信云原生架构构建运力与卫星带宽资源动态匹配算法）；量子加密传输＋北斗三号短报文双保险。"],"explanationStatus":"meaningful","displayId":"N244"},{"id":"N245","chapter":9,"type":"multi","stem":"演练发现自动接警后仍要人工跨多部门反复寻找资源，响应时间较长。按资料，哪些改进方向合理？","options":["取消任务与资源智能匹配，继续按固定编组反复人工寻找资源","增强动态调派能力，使接警与行动更连贯","认为具备自动接警就证明整个指挥行动闭环无须再优化","梳理并缩短指令流转与部门协同链路"],"answers":[1,3],"explanation":"自动接警是入口能力，后续匹配和调派仍可能存在瓶颈。资料把响应效率问题归于流转、协同、匹配和调派等环节，不能只看入口自动化。 资料把匹配和动态调派薄弱列为瓶颈，不能在改进中反向取消。","focus":"接警与调派改进","difficulty":"进阶","sourceSection":"一、核心定位与平台能力","sourceEvidence":"自动接警：平台支持自动接警响应，不只支持人工接警后手动调派无人机。痛点归因：“应急响应效率偏低”主要源于指令流转层级多、跨部门协同链路长、任务与资源智能匹配及动态调派能力偏弱。","sourcePages":[18],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N245"},{"id":"N246","chapter":9,"type":"multi","stem":"三断场景中无人机空投基站已完成，按资料继续复核通信恢复方案时，哪些事项仍需关注？","options":["链路继续连到地面信关站和运营商核心网","道路未通时避免把车辆进入作为唯一先决条件","机载基站经高通量卫星形成回传","只检查电源亮灯即可证明端到端通信恢复"],"answers":[0,1,2],"explanation":"三断恢复涉及进入、供电与回传等多种约束。资料的链路从机载基站一直通到核心网，电源亮灯或投送完成只能证明局部状态，不能替代端到端验证。","focus":"三断链路完整性","difficulty":"进阶","sourceSection":"二、三断场景与通信恢复","sourceEvidence":"三断场景的特殊性：通信、道路、电力均中断时，道路严重毁坏、人和车辆无法进入灾区，必须采用无人机空投基站等无人化方式恢复通信；不能等道路抢通后部署应急通信车，也不能靠铺野战光缆或仅恢复电力。通信链路设计：采用“机载基站—高通量卫星—地面信关站—运营商核心网”链路，核心设计逻辑是以高通量卫星为中继，解决机载基站在三断场景下无法通过地面链路回传核心网的问题。","sourcePages":[18],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N246"},{"id":"N247","chapter":9,"type":"multi","stem":"把应急方案拆成可核实的交付项时，按资料哪些对应关系合理？","options":["将运力与卫星带宽固定割裂分配，并视为动态匹配能力","仅增加基站密度就可自动替代运输与通信全部融合能力","空投卫星便携站后自动对星组网，对应通信底座能力","量子加密传输加北斗三号短报文，对应双保险设计"],"answers":[2,3],"explanation":"资料给出的竞争力涉及通信底座、运力、资源匹配和安全可靠性等协同。单一基站密度不能替代进入灾区、投送建网和联合保障的完整体系。 动态匹配强调两类资源协同，固定割裂分配不是对应能力。","focus":"应急竞争力交付分解","difficulty":"进阶","sourceSection":"二、三断场景与通信恢复","sourceEvidence":"四大核心竞争力：全时全域通信底座（运输无人机搭载自研卫星便携站，空投后自动对星组网）；精准运力网络化（首创“一机双投”，实现人机协同救援闭环）；运营商级服务赋能（基于电信云原生架构构建运力与卫星带宽资源动态匹配算法）；量子加密传输＋北斗三号短报文双保险。","sourcePages":[18],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N247"},{"id":"N248","chapter":9,"type":"multi","stem":"综合应急仓已完成能源和通信功能集成。项目组据此宣称平台无需验证无人设备调派，林草业务也无需验证烟火预警，整套应用已经齐备。按资料，哪些审查合理？","options":["只要综合仓能源通信齐备，所有任务调派和AI预警就自动达标","林草火势预判仍应验证烟火特征与气象数据结合，不能由仓体功能替代","仓的能源通信保障与平台无人设备管控属于不同层面，应分别核验","应急平台仍要核实无人设备管控对感知、决策、指挥、行动体系的支撑"],"answers":[1,2,3],"explanation":"综合仓提供能源通信等集成保障，不等于平台调派与行业算法应用自动完成。资料分别规定综合仓、应急平台核心引擎和林草智能预警，应以各自业务证据验收，不能用底层保障齐备推导全部上层应用达标。","focus":"综合保障与业务应用分层","difficulty":"进阶","sourceSection":"一、核心定位与平台能力；二、三断场景与通信恢复；三、行业场景化配置","sourceEvidence":"平台核心引擎：低空应急指挥调度平台构建“感知—决策—指挥—行动”一体化体系，核心引擎是无人设备管控，而非单纯的5G通信或GIS。\n…\n综合防灾应急仓：被称为“全球首款”，核心在于集合应急能源、通信及低空经济等功能于一体的智能综合防灾应急仓，不是单纯的集装箱仓库或无人机机库。\n…\n林草巡护四项功能：全时域监测（可穿透烟雾、夜间作业）；AI智能预警（深度学习烟火特征并结合气象数据预判火势）；极端环境适应（耐低温、续航时间长）；分秒级响应（支持极速快充）。","sourcePages":[18,19],"sourceSectionKind":"原课程小节","sourceVerified":true,"sourceEvidenceFragments":["平台核心引擎：低空应急指挥调度平台构建“感知—决策—指挥—行动”一体化体系，核心引擎是无人设备管控，而非单纯的5G通信或GIS。","综合防灾应急仓：被称为“全球首款”，核心在于集合应急能源、通信及低空经济等功能于一体的智能综合防灾应急仓，不是单纯的集装箱仓库或无人机机库。","林草巡护四项功能：全时域监测（可穿透烟雾、夜间作业）；AI智能预警（深度学习烟火特征并结合气象数据预判火势）；极端环境适应（耐低温、续航时间长）；分秒级响应（支持极速快充）。"],"explanationStatus":"meaningful","displayId":"N248"},{"id":"N249","chapter":9,"type":"multi","stem":"统一方案把城市建模数据与气象数据都标为“通用AI输入”，打算只保留一种数据，并认为消防航线生成与林草火势预判可互相替代验证。按资料，哪些修正合理？","options":["消防初始航线规划应保留对城市建模数据的利用","林草智能预警应保留烟火特征与气象数据结合的分析","航线生成与火势预判同样使用智能技术，因此其中一项通过即可代替另一项验证","两类数据只要都进入AI系统，就可任选一种覆盖两个场景全部任务"],"answers":[0,1],"explanation":"输入数据应与具体业务任务对应：城市建模支持消防初始航线，烟火特征结合气象数据支持林草预警。都称AI不代表数据或业务效果等价，不能只保留一种输入或互相替代验证。","focus":"跨场景数据用途映射","difficulty":"进阶","sourceSection":"三、行业场景化配置","sourceEvidence":"城市消防航线：依据城市建模数据自动规划初始航线，到达火情附近后自动生成精细化航线进行火情侦查，全程非手动遥控、也非起飞前一次性固定航线。\n…\n林草巡护四项功能：全时域监测（可穿透烟雾、夜间作业）；AI智能预警（深度学习烟火特征并结合气象数据预判火势）；极端环境适应（耐低温、续航时间长）；分秒级响应（支持极速快充）。","sourcePages":[18,19],"sourceSectionKind":"原课程小节","sourceVerified":true,"sourceEvidenceFragments":["城市消防航线：依据城市建模数据自动规划初始航线，到达火情附近后自动生成精细化航线进行火情侦查，全程非手动遥控、也非起飞前一次性固定航线。","林草巡护四项功能：全时域监测（可穿透烟雾、夜间作业）；AI智能预警（深度学习烟火特征并结合气象数据预判火势）；极端环境适应（耐低温、续航时间长）；分秒级响应（支持极速快充）。"],"explanationStatus":"meaningful","displayId":"N249"},{"id":"N250","chapter":9,"type":"multi","stem":"林草项目包含高风险点位值守、长距离巡护和烟火预警。按资料，哪些组合与任务相符？","options":["夜间能拍到视频就等同于所有任务与火势预判均已达标","长距离大范围任务接入复合翼","烟火预警结合AI特征识别与气象数据分析","重点点位以多旋翼实施持续巡查"],"answers":[1,2,3],"explanation":"资料分别给出机型组合与智能预警能力。夜间采集只是全时域监测的一部分，不能代替长距离覆盖或烟火气象分析，应逐项匹配并验证。","focus":"林草多任务能力匹配","difficulty":"进阶","sourceSection":"三、行业场景化配置","sourceEvidence":"水利与林草组合部署：重点区域部署多旋翼无人机实现24小时目标点位巡查，长距离大范围巡检接入复合翼无人机。林草巡护四项功能：全时域监测（可穿透烟雾、夜间作业）；AI智能预警（深度学习烟火特征并结合气象数据预判火势）；极端环境适应（耐低温、续航时间长）；分秒级响应（支持极速快充）。","sourcePages":[19],"sourceSectionKind":"原课程小节","sourceVerified":true,"explanationStatus":"meaningful","displayId":"N250"},{"id":"N251","chapter":10,"type":"single","stem":"某医药配送项目已按轻载短航程选机并规划起降场，客户随后将任务改为重载跨区域配送。按学习指引，下一版计划应如何调整？","options":["先复核载重与航程并重选适配机型，再校核起降场和运力航线","保留原机型与起降场，仅通过增加班次承担新的载重任务","先按原班次翻倍采购电池，再用原载重参数承诺运力","保留原航线验证结果，只按新业务名称更新报表"],"answers":[0],"explanation":"业务载重与航程是机型遴选的前提。前提改变后，后续起降场规划、运力测算与航线验证也要重新衔接，不能用增加末端设施替代。","focus":"规划前提变化","difficulty":"应用","sourceSection":"一、概念与规划","sourceEvidence":"结合业务载重与航程遴选机型、规范规划起降场、开展运力测算与航线验证","sourcePages":[19],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N251"},{"id":"N252","chapter":10,"type":"single","stem":"物流试点要求三个月交付且无机房，团队提出先建设私有云、上线后再整理场站。哪项调整同时符合上线约束和规划原则？","options":["沿用另一城市的验证结果，以此替代本项目机型和航线验证","改用SaaS后先承诺全部运力，待上线后补航线验证","改用 SaaS 与起降场套装，同时按机型—场地—运力航线完成规划验证","先购买最大载重机型，再选择 SaaS"],"answers":[2],"explanation":"SaaS 与起降场套装解决低预算、无机房的上线约束，但不取消按业务选机和航线验证等规划步骤。快速上线需要压缩建设负担，而非省略验证。","focus":"快速交付与规划","difficulty":"应用","sourceSection":"一、概念与规划","sourceEvidence":"开通 SaaS 账号 + 起降场套装","sourcePages":[19],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N252"},{"id":"N253","chapter":10,"type":"single","stem":"两个物流站点使用不同机型，运营方既要汇总补贴报表，又要比较退役电池用于储能后的成本变化。哪种数据方案更适合？","options":["仅汇总机队实名信息，以此替代跨站运营和成本数据","平台统一汇聚运营数据，将电池价值评估纳入运营成本复盘","各站保留自有口径的明细，年底汇总时只提交总飞行小时","只按电池采购单价排序，不纳入梯次利用后的价值评估"],"answers":[1],"explanation":"集中上报能支撑跨场站标准化报表；梯次利用的价值体现在电池价值和整体成本。两类数据应服务统一运营分析，而非各站分散统计。","focus":"集中数据与成本评估","difficulty":"应用","sourceSection":"二、平台化运营能力","sourceEvidence":"依托平台标准化运营数据集中上报","sourcePages":[19],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N253"},{"id":"N254","chapter":10,"type":"single","stem":"某物流平台飞行日志已满足报送要求，但每周仍由负责人凭印象调整班次。按资料，最应该补足哪项工作？","options":["把日志与业务数据用于周复盘，并形成月度运营迭代","继续增加日志存储年限即可","仅在事故发生后分析日志","停止收集业务数据以减少成本"],"answers":[0],"explanation":"日志与业务数据同时服务合规和运营优化。已有报送不代表完成数据驱动闭环，还需把日监控结果转为周复盘和月迭代。","focus":"合规数据转运营决策","difficulty":"应用","sourceSection":"三、政策支撑与运营闭环","sourceEvidence":"飞行日志与业务数据不仅用于满足监管合规要求，更是运营优化的重要依据。","sourcePages":[20],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N254"},{"id":"N255","chapter":10,"type":"single","stem":"值班员已每日查看平台，但新管制通告仍靠人工转发，曾有任务未及时停飞。按学习指引，哪项改进最直接补足现有闭环？","options":["用增加人工转发频次代替系统冲突识别和拦截能力","增加月底复盘次数，保持人工转发","接入通告同步、冲突识别与任务拦截或改航，并将事件纳入复盘","先将新通告列入周报，待下周统一调整执行任务"],"answers":[2],"explanation":"每日看屏不能替代实时合规响应。通告同步、冲突识别和任务拦截或改航形成前端控制，事后再通过复盘优化运营。","focus":"合规响应与复盘","difficulty":"应用","sourceSection":"三、政策支撑与运营闭环","sourceEvidence":"智能识别空域冲突风险并自动触发任务拦截或改航指令","sourcePages":[20],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N255"},{"id":"N256","chapter":10,"type":"single","stem":"一家配送运营商通过政企渠道拿到医院客户，但每次都只销售单架飞机，客户仍需自行整合场站和运营。哪项调整更符合本章盈利思路？","options":["借助既有渠道输出一体化方案，并以平台支撑多机多场站运营","仅提高单机售价","退出医院客户，转卖电池","把平台数据分散到各医院手工保管"],"answers":[0],"explanation":"生态渠道赋能不仅是获得线索，还要打包输出一体化方案。平台集中运营可支撑扩展后的多机型、多场站管理，单机销售未形成完整服务。","focus":"渠道与一体化交付","difficulty":"应用","sourceSection":"二、平台化运营能力","sourceEvidence":"借助现有政企渠道快速拓展工业与医药客户、打包输出一体化方案","sourcePages":[19],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N256"},{"id":"N257","chapter":10,"type":"single","stem":"某航班故障告警后，地勤打电话讨论迫降点；事后平台虽有完整日志，却仍错过响应窗口。最准确的改进判断是？","options":["日志足够完整，不必调整实时能力","只提高事后日志还原精度，由地勤在任务结束后确认迫降建议","依托平台数据形成实时安全迫降与动态改航响应，日志用于后续优化","把事后复盘改成每年一次"],"answers":[2],"explanation":"实时故障处置与事后复盘承担不同任务。前者需利用平台数据支持迫降点推荐和动态改航，日志再用于复盘，两者不能互相替代。","focus":"实时处置与事后复盘","difficulty":"应用","sourceSection":"二、平台化运营能力","sourceEvidence":"自动推荐就近安全迫降点并支持动态改航","sourcePages":[19],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N257"},{"id":"N258","chapter":10,"type":"single","stem":"某物流试点用实时监控解决了“看得见”，但电池故障反复出现且无人追踪月度改进。最合理的评价是什么？","options":["已有实时监控后，主动运维可统一改为客户报障后处理","把告警数作为唯一运营成效，不再安排月度迭代","还缺主动运维和以数据驱动的迭代，监控只是闭环的一部分","已具备全部运营闭环"],"answers":[2],"explanation":"全流程数字化与实时监控只是四要素之一；还需要合规运营、机队电池场站主动运维和数据复盘迭代。可见性不等于完整运营能力。","focus":"运营闭环缺口诊断","difficulty":"应用","sourceSection":"三、政策支撑与运营闭环","sourceEvidence":"机队电池与场站的主动式运维、以数据驱动的复盘迭代机制","sourcePages":[20],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N258"},{"id":"N259","chapter":10,"type":"single","stem":"项目组以“最大载重更保险”为由先确定机型，并据此承诺固定运力；航线尚未验证。按本章，评审应提出哪项核心修正？","options":["用其他城市的同类班次代替本项目起降场与航线验证","先确认实际载重航程，按序完成场地规划和运力航线验证后再承诺","把运力承诺改为口头确认，以便上线后再核验","采用最大载重机型后，可直接用厂商标称续航推算实际运力"],"answers":[1],"explanation":"最大载重不是唯一选型依据。实际载重和航程决定机型适配，运力承诺还需要场地规划、运力测算与航线验证共同支撑。","focus":"运力承诺前置条件","difficulty":"应用","sourceSection":"一、概念与规划","sourceEvidence":"先买最大载重机型或先铺接驳柜都属于次序错误。","sourcePages":[19],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N259"},{"id":"N260","chapter":10,"type":"single","stem":"跨区物流业务扩张后，各场站使用不同报表口径，管理层无法判断成本上升来自架次增加还是电池消耗。最适宜的第一类能力建设是？","options":["以最大场站的平均电池成本估算所有机型","统一平台运营数据口径，并在复盘中联动任务与电池成本","各站分别提高上报频次，继续沿用本地数据定义","每站建设独立数据库，管理层只看合并后的总架次"],"answers":[1],"explanation":"标准化集中运营数据可支持跨场站对比；电池管理与成本优化也需要纳入复盘。大屏展示或孤立数据库无法解决口径和分析问题。","focus":"跨场站运营诊断","difficulty":"应用","sourceSection":"二、平台化运营能力","sourceEvidence":"多机型、多场站集中管理且报表可用于专项补贴申报","sourcePages":[19],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N260"},{"id":"N261","chapter":10,"type":"single","stem":"某物流团队的周报只统计“收到多少告警”，没有跟踪任务拦截结果、运维动作和下月改进。按本章，周报应怎样改？","options":["围绕实时监控、合规处置、主动运维和迭代措施串联结果","周报只确认合规报送成功，不再跟踪处置与运维动作","将运营数据每季汇总一次，省略周度复盘","把告警增长率作为唯一改进目标"],"answers":[0],"explanation":"运营闭环强调监控、合规、主动运维和复盘迭代的联动。告警数量不能独立说明业务改进，周复盘要形成可推动月迭代的行动。","focus":"闭环复盘结构","difficulty":"应用","sourceSection":"三、政策支撑与运营闭环","sourceEvidence":"日监控、周复盘、月迭代","sourcePages":[20],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N261"},{"id":"N262","chapter":10,"type":"single","stem":"运营商打算把退役电池储能收益当作提高飞行性能的依据，并据此承诺更高配送速度。按资料，哪项预算修正正确？","options":["储能收益可直接换算成飞行速度","把储能价值计入电池价值与整体成本评估，飞行能力仍按机型和航线验证测算","将退役电池全部只记作处置残值，不再考虑梯次利用的成本价值","用预计储能收益抵扣航线风险，不再核验飞行性能"],"answers":[1],"explanation":"梯次利用主要降低整体运营成本，不会直接提升速度。飞行能力仍需依据业务需求选机、进行运力测算与航线验证，不能混淆财务价值和性能指标。","focus":"成本价值与性能边界","difficulty":"应用","sourceSection":"二、平台化运营能力","sourceEvidence":"主要价值是评估电池价值、降低整体运营成本","sourcePages":[19],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N262"},{"id":"N263","chapter":10,"type":"multi","stem":"物流项目从短途轻货转向跨区医药配送，且要求低投入快速启动。按本章，哪些评审意见合理？","options":["为赶工用采购最大机型替代航线验证","采用SaaS后先开放正式配送，再补做起降场规划与航线验证","起降场规划后继续开展运力测算与航线验证","按实际载重与航程重新校核机型"],"answers":[2,3],"explanation":"机型需依据实际载重航程复核，场地、运力和航线验证也要衔接完成。SaaS减少自建平台负担，不表示可以把飞行前的规划验证推迟到正式运营后；购买最大机型同样不能替代验证。","focus":"需求变化与快速启动","difficulty":"应用","sourceSection":"一、概念与规划","sourceEvidence":"结合业务载重与航程遴选机型、规范规划起降场、开展运力测算与航线验证","sourcePages":[19],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N263"},{"id":"N264","chapter":10,"type":"multi","stem":"为把“已上线”的物流平台改成可持续运营系统，哪些措施应一起纳入方案？","options":["同步管制通告并对冲突任务实施拦截或改航","让实时监控数据进入周复盘和月迭代","仅保存合规日志，禁止业务分析","将机队、电池与场站纳入主动式运维"],"answers":[0,1,3],"explanation":"主动运维、数据迭代和常态化合规都属于运营闭环。合规日志还具有运营优化价值，禁止分析会切断闭环。","focus":"可持续运营组合","difficulty":"应用","sourceSection":"三、政策支撑与运营闭环","sourceEvidence":"全流程数字化与实时监控、空域常态化合规运营","sourcePages":[20],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N264"},{"id":"N265","chapter":10,"type":"multi","stem":"跨场站运营评审中，哪些“目标—措施”配对符合本章？","options":["拓展工业医药客户——不借助现有政企渠道，仅由各站自行获客，却宣称已采用资料所述政企渠道赋能","降低电池全生命周期成本—评估退役电池梯次利用","提升飞行速度—把旧电池改做储能","形成可比较补贴报表—集中上报标准化运营数据"],"answers":[1,3],"explanation":"标准化集中数据支撑可比较的报表，退役电池梯次利用有助于价值和成本优化。资料中的渠道赋能是借助既有政企渠道输出一体化方案；各站独立拓客不等同于该模式，储能也不直接提高飞行速度。","focus":"目标与能力匹配","difficulty":"应用","sourceSection":"二、平台化运营能力","sourceEvidence":"借助现有政企渠道快速拓展工业与医药客户、打包输出一体化方案","sourcePages":[19],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N265"},{"id":"N266","chapter":10,"type":"multi","stem":"平台发现新的空域冲突后，下列哪些做法能兼顾即时安全与长期改进？","options":["等月底复盘后再处理正在执行的冲突任务","保留飞行日志与业务数据用于原因分析","依托平台数据支持任务拦截或改航","把处置经验转化为后续运营迭代"],"answers":[1,2,3],"explanation":"冲突要实时处置，不能等事后复盘；同时应保留数据并用于改进。即时响应和长期优化是互补关系。","focus":"冲突处置双闭环","difficulty":"应用","sourceSection":"三、政策支撑与运营闭环","sourceEvidence":"飞行日志与业务数据不仅用于满足监管合规要求，更是运营优化的重要依据。","sourcePages":[20],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N266"},{"id":"N267","chapter":10,"type":"multi","stem":"某试点预算只列飞机与接驳柜，尚未确定载重航程，也没有机房。哪些意见有助于修正方案？","options":["先澄清业务需求，再开展机型遴选","评估 SaaS 加起降场套装以减少自建投入","先按预设固定班次承诺运力，再据此补定业务载重与机型","先买最大载重飞机，避免进一步调研"],"answers":[0,1],"explanation":"应先澄清需求并按载重航程选机；无机房可评估SaaS和起降场套装。运力承诺不能反过来替代需求和选型，也不能以购买最大机型省略调研。","focus":"预算约束下规划","difficulty":"应用","sourceSection":"一、概念与规划","sourceEvidence":"结合业务载重与航程遴选机型、规范规划起降场、开展运力测算与航线验证","sourcePages":[19],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N267"},{"id":"N268","chapter":10,"type":"multi","stem":"业务负责人准备同时复用渠道、平台和资产，哪些安排符合本章对三类价值的描述？","options":["利用现有政企渠道触达医药客户","将电池价值评估纳入运营成本管理","用平台统一管理多机型和多场站","退役电池梯次利用后可免除全部飞行验证"],"answers":[0,1,2],"explanation":"渠道解决拓客，平台解决集中运营，梯次利用优化电池价值和成本。资产复用不能免除机型适配与航线验证。","focus":"渠道平台资产协同","difficulty":"应用","sourceSection":"二、平台化运营能力","sourceEvidence":"评估电池价值、降低整体运营成本","sourcePages":[19],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N268"},{"id":"N269","chapter":10,"type":"multi","stem":"某运营团队认为“平台自动告警后，运营人员只需等客户投诉”。按资料，哪些修正合理？","options":["把飞行与业务数据用于运营优化","建立机队电池场站的主动式运维","保留实时监控但取消合规响应","按日监控、月复盘、季迭代安排运营，作为本章推荐节奏"],"answers":[0,1],"explanation":"主动运维和飞行业务数据分析能把告警转成运营改进。课程推荐的是日监控、周复盘、月迭代，而不是月复盘、季迭代；实时监控也不能代替合规响应。","focus":"自动化后的运营责任","difficulty":"应用","sourceSection":"三、政策支撑与运营闭环","sourceEvidence":"日监控、周复盘、月迭代","sourcePages":[20],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N269"},{"id":"N270","chapter":10,"type":"multi","stem":"物流运营评审拟纠正三种错位：只存日志、各站自建孤岛、故障后仅靠电话。应采用哪些改进？","options":["日志联动业务数据支持复盘","跨场站统一平台标准化上报","增加 Excel 表格种类并保持各站独立口径","故障响应依靠平台数据支撑安全处置"],"answers":[0,1,3],"explanation":"三类问题分别需要数据应用、集中管理和实时安全响应。更多独立表格无法消除口径不一，也不能替代平台处置能力。","focus":"平台化缺口修正","difficulty":"应用","sourceSection":"二、平台化运营能力","sourceEvidence":"依托平台标准化运营数据集中上报","sourcePages":[19],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N270"},{"id":"N271","chapter":11,"type":"single","stem":"某市想统一跨部门巡检数据，但自然资源与公安希望保留专业设备和执行队伍。若方案写成“所有设备必须转给同一部门”，应如何修正？","options":["只统一设备采购目录，继续使用互不贯通的平台数据","每部门另建孤立平台","改为平台统一建设、设备分置、任务分执，并保留共享数据机制","全部设备集中持有后，再考虑如何保留专业任务职责"],"answers":[2],"explanation":"统建分用统一平台和数据，同时允许部门保留专业设备及执行职责。设备所有权集中不是数据统管的前提，分建孤岛也不符合目标。","focus":"统建分用权责边界","difficulty":"应用","sourceSection":"一、四种建设模式","sourceEvidence":"平台统一建设、设备分置、任务分执。","sourcePages":[20],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N271"},{"id":"N272","chapter":11,"type":"single","stem":"某地区应急联动频繁，由公安牵头，但已有较强市场化企业愿意投入。顾问要求全市只能选一种建设模式。按资料应怎样评价？","options":["可结合治理需求与财政条件组合政警民融合、企业合作等模式","正确，模式组合会自动失效","只能政府全额投资","应按无人机品牌决定建设模式"],"answers":[0],"explanation":"建设模式可组合。公安牵头的联动诉求与企业投入条件应共同纳入设计，资料没有要求全地区只能用一种模式。","focus":"组合建设模式","difficulty":"应用","sourceSection":"一、四种建设模式","sourceEvidence":"可结合地方财政实力与治理需求，将不同建设模式组合使用","sourcePages":[20],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N272"},{"id":"N273","chapter":11,"type":"single","stem":"平台识别出河岸疑似违建，自动把“告警已发出”记为办结，且只保存最终报告。哪项改造能同时补足治理和追溯？","options":["关联素材与坐标，人工核实并比对历史影像后流转工单，保存全过程材料","继续增加告警灵敏度","仅增加飞行架次","只保留识别截图"],"answers":[0],"explanation":"疑似违建不能以告警代替处置。需确认、历史比对、证据关联和工单衔接，并保存历史记录、模型和全流程素材以支持追溯。","focus":"违建处置与追溯","difficulty":"应用","sourceSection":"二、需求统筹与业务闭环","sourceEvidence":"识别结果要与取证素材、坐标关联，派发责任部门工单并衔接处置","sourcePages":[21],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N273"},{"id":"N274","chapter":11,"type":"single","stem":"同一片区域三部门同日上午分别巡飞，识别结果又不能互派工单。按本章，最适宜的整合方案是什么？","options":["增加三部门各自架次","取消专业部门的任务执行职责","统一需求排班、加载多场景 AI、共享成果并建立跨部门工单流转","只统一飞机品牌，保持原流程"],"answers":[2],"explanation":"一次飞行多部门使用需要需求统筹、算法适配、成果共享和工单流转。它既能减少重复飞行，也能保留部门的专业处置职责。","focus":"共享飞行到业务协同","difficulty":"应用","sourceSection":"二、需求统筹与业务闭环","sourceEvidence":"统筹需求、加载场景 AI、共享成果并流转工单","sourcePages":[21],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N274"},{"id":"N275","chapter":11,"type":"single","stem":"算法库新增五十个模型后，采购方仍称“一线没有服务可用”，设备又包含多个厂商。哪项行动优先？","options":["增加算法名称展示页","清空现有设备，全部换同品牌","贯通算法上架、部署和业务使用，并结合多厂家兼容与定制化需求落地","将数据安全需求移出项目范围"],"answers":[2],"explanation":"算法数量不等于可用服务。要打通上架到业务使用的链路，且已有多品牌和政务数据要求需要兼容、自研及定制化能力支撑。","focus":"算法可用性落地","difficulty":"应用","sourceSection":"三、算法与平台能力","sourceEvidence":"算法上架—服务部署—业务使用","sourcePages":[21],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N275"},{"id":"N276","chapter":11,"type":"single","stem":"一份合同包含固定次数的道路巡检和按需调用的历史影像，客户不采购后一部分飞行。怎样设计计费更符合资料？","options":["所有收入只按飞行时长","历史影像必须免费，因未新增飞行","道路巡检按次数，影像服务可按数据使用量，分别明确结算口径","全部按飞机数量收费"],"answers":[2],"explanation":"定期固定内容巡检适合按次数；只使用影像且需求波动的服务可按数据量。不同业务能组合计费，不必强制统一。","focus":"混合业务计费","difficulty":"应用","sourceSection":"四、四种计费方式","sourceEvidence":"交通巡查、违建巡查、数据服务可以按任务特点采用不同收费方式","sourcePages":[21,22],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N276"},{"id":"N277","chapter":11,"type":"single","stem":"客户要买“每月巡查加分析报告”的完整服务，采购清单却把分析排除在套餐之外并单列为赠品。哪项修正最贴合本章？","options":["保持飞行套餐不能含分析的限制","按完整服务设计套餐，纳入周期巡检和数据分析并明确成果","停止提供分析，避免套餐复杂","改按所有设备采购数量计费"],"answers":[1],"explanation":null,"focus":"套餐成果范围","difficulty":"应用","sourceSection":"四、四种计费方式","sourceEvidence":"套餐可以包含数据分析","sourcePages":[21,22],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"none","displayId":"N277"},{"id":"N278","chapter":11,"type":"single","stem":"预算把“首次平台开发、部署联调、全年巡查、应急保障”全部列入一次性建设，理由是已购备用机。哪项调整正确？","options":["应急保障在任何项目中都无需预算","开发部署属一次性建设；巡查与应急保障属年度运营，备用机不能替代保障服务","全部改为年度运营","仅保留设备费，其他均删除"],"answers":[1],"explanation":"首次开发与部署是建设投入，日常服务与应急保障是年度运营。已有备用设备并不等于具备持续人员、维护和响应服务。","focus":"建设运营预算拆分","difficulty":"应用","sourceSection":"六、预算、验收与职责分工","sourceEvidence":"应急保障不能因已采购备用设备就省略。","sourcePages":[22,23],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N278"},{"id":"N279","chapter":11,"type":"single","stem":"运营企业建议自行制定事件发现率指标并自行确认达标，政府只按月付款。按本章，哪项治理安排更合理？","options":["只用飞机架数验收，取消成果指标","政府制定标准和考核细则、汇总需求并验收；企业保运行交数据并优化","企业自评结果直接作为唯一验收依据","将验收完全交给设备厂家"],"answers":[1],"explanation":"政府负责标准、考核与验收，企业负责运行交付和优化。按效付费还要关注数据质量和事件发现率，不能由被考核方包办验收。","focus":"按效付费与政企分工","difficulty":"应用","sourceSection":"六、预算、验收与职责分工","sourceEvidence":"政府负责制定标准与考核细则、汇总需求并验收成果","sourcePages":[22,23],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N279"},{"id":"N280","chapter":11,"type":"single","stem":"项目采用生态适配方案，属地已选定生态设备。方案却要求无人科技统一承担所有生态设备采购和集成。应如何改？","options":["由无人科技统一采购生态设备，属地只提供平台登录入口","由设备厂商单独确认全部集成范围，无需属地统筹","由属地采购生态设备并负责集成，无人科技提供平台服务","把全栈方案分工直接照搬为生态适配方案的责任表"],"answers":[2],"explanation":"生态适配的商务结构是属地采购生态设备并集成、无人科技提供平台。它与全栈自研分工不同，不能直接套用全栈职责。","focus":"生态适配商务边界","difficulty":"应用","sourceSection":"六、预算、验收与职责分工","sourceEvidence":"生态适配方案由属地采购生态设备并负责集成，无人科技提供平台服务。","sourcePages":[22,23],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N280"},{"id":"N281","chapter":11,"type":"single","stem":"全栈自研项目中，交付表将平台、设备、配套全部交给属地，仅让无人科技供卡。哪项职责校正符合资料？","options":["无人科技负责集成、平台、设备及配套，属地负责专线或物联网卡","政府承担全部设备安装运维","属地负责集成和所有设备，无人科技只供卡","全栈方案无需平台服务"],"answers":[0],"explanation":null,"focus":"全栈方案分工校核","difficulty":"应用","sourceSection":"六、预算、验收与职责分工","sourceEvidence":"全栈方案由无人科技负责集成、平台、设备及配套，属地负责专线或物联网卡","sourcePages":[22,23],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"none","displayId":"N281"},{"id":"N282","chapter":11,"type":"single","stem":"一家部门主要要利用共享影像开展研判，提出把原始政务数据全部公开以便年度订阅用户下载。按资料，最合适的替代设计是？","options":["因原始数据不宜公开，连合规研判和订阅服务也一并取消","在合规数据空间提供查询、智能研判或定制模型，明确订阅和数据使用边界","把数据订阅改为一次性设备销售，以此视为已满足研判需求","开放全部原始数据，才算数据要素运营"],"answers":[1],"explanation":"数据要素运营可以提供查询研判等增值服务，并按次或订阅收费；“可用不可见”不意味着原始政务数据可无条件公开。","focus":"合规数据增值服务","difficulty":"应用","sourceSection":"五、收入路径与运营模式","sourceEvidence":"以合规数据空间为基础，提供查询、智能研判、定制模型等增值服务","sourcePages":[22],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N282"},{"id":"N283","chapter":11,"type":"single","stem":"撮合平台已能推荐供需双方，但没有资质核验、履约监管和结算机制，计划直接按成交额抽佣。按本章最应补足什么？","options":["先增加供需信息条目，资质与结算全部留给双方私下处理","只留成交额，不保存履约核验和交易流程信息","建立规范交易履约链条，补齐资质核验、流程监管与资金结算","提高供需推荐准确率即可直接替代履约监管"],"answers":[2],"explanation":"撮合运营的核心是规范交易和履约，供需匹配只是配套的一部分。缺少资质、监管和结算，尚不能形成完整运营机制。","focus":"撮合运营链条完整性","difficulty":"应用","sourceSection":"五、收入路径与运营模式","sourceEvidence":"交易流程与履约监管、资质核验、资金结算机制","sourcePages":[22],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N283"},{"id":"N284","chapter":11,"type":"single","stem":"两份共享巡检方案：甲新增多个品牌展示页但各部门仍重复飞行；乙把排班、场景算法和业务对接贯通，减少重复作业且工单可流转。按本章，评审更应选择哪项结论？","options":["乙更贴合资源共享、作业效率和业务协同目标，能力组织也围绕业务需求","两者只需比较设备品牌数量","甲页面更多，所以建设成效必然更好","只按页面数量无法相同时再看业务"],"answers":[0],"explanation":"本章以资源共享、作业效率与业务协同评估成效，并以业务需求组织平台、算法与对接服务。乙呈现了具体业务收益，页面和品牌数量不能代替。","focus":"方案收益对照评审","difficulty":"应用","sourceSection":"七、方案组织与行业场景","sourceEvidence":"资源共享、作业效率与业务协同水平是否提升","sourcePages":[23],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N284"},{"id":"N285","chapter":11,"type":"single","stem":"常规巡检排班已满时出现紧急消防任务。运营方直接挪用历史影像，并称“没有新飞行就无需合规校验”。应选哪项修正？","options":["任何应急任务都可省略合规","先评估优先级并统筹应急资源，执行前完成空域航线合规校验","继续按排班顺序等待，不作评估","直接用历史影像替代当前现场需求"],"answers":[1],"explanation":"应急任务要评估优先级并统筹资源，必要时启动应急调度；执行前仍要做空域和航线校验。应急不意味着合规要求消失。","focus":"应急调度与合规","difficulty":"应用","sourceSection":"二、需求统筹与业务闭环","sourceEvidence":"执行前须开展空域与航线合规校验","sourcePages":[21],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N285"},{"id":"N286","chapter":11,"type":"single","stem":"某平台的告警能派给部门，但人员换班后找不到原始影像和坐标，无法确认处置依据。最合适的补强是？","options":["将取证素材、坐标和工单关联，并保留历史记录、模型和全流程素材","只保存最终统计表","只提高告警发送速度","让每个部门重新飞一次"],"answers":[0],"explanation":"工单流转需要证据关联，成果追溯还需要历史记录、模型与全流程素材。只保存最终表格不能支撑交接和复盘。","focus":"工单证据关联","difficulty":"应用","sourceSection":"二、需求统筹与业务闭环","sourceEvidence":"历史飞行记录、二三维模型、报告归档与全流程素材","sourcePages":[21],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N286"},{"id":"N287","chapter":11,"type":"single","stem":"总包人员声称“政府合同由谁签，谁就必须包揽所有设备和平台运维”，因此删除原有分工表。按资料应如何处理？","options":["按签约方单一归责即可","保留并明确与交付分工绑定的运维职责，不能只凭签约方推定全部责任","只按设备所有权分配责任","所有运维都交政府"],"answers":[1],"explanation":"本章将运维原则与交付分工绑定。全栈和生态适配的采购、集成、平台职责不同，运维也应据此界定，不能只看政府合同签约方。","focus":"交付与运维衔接","difficulty":"应用","sourceSection":"六、预算、验收与职责分工","sourceEvidence":"运维原则与交付分工绑定","sourcePages":[22,23],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N287"},{"id":"N288","chapter":11,"type":"single","stem":"环保部门要发现污染源并看扩散趋势，消防部门要获得现场和周边信息。若同建共享平台，哪项能力组合更匹配？","options":["用告警数量排名替代污染分析与现场联动效果","环保与消防都只提供普通影像，分析与周边联动由用户自行补齐","按设备品牌分别成册，不说明场景任务与能力关系","气体传感移动采样与分析，加消防侦查、周边信息推送和跨部门协同"],"answers":[3],"explanation":"环保任务需要气体传感移动采样来支持污染源和扩散分析；消防还要现场侦查、周边信息与协同。统一平台应按业务组合能力。","focus":"多行业任务能力组合","difficulty":"应用","sourceSection":"七、方案组织与行业场景","sourceEvidence":"气体传感器进行移动采样，可用于污染源定位和扩散趋势分析。","sourcePages":[23],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N288"},{"id":"N289","chapter":11,"type":"single","stem":"政务运营方收入不稳定，提议不断拆分部门订单增加重复巡飞，并以算法展示数量向政府结算。哪项改进符合资料？","options":["以展示算法数量替代业务成果","继续拆单并提高无效架次","只降低飞行数据保存量","共享巡检、优化排班，形成标准化服务并通过政府采购结算"],"answers":[3],"explanation":"共享巡检和统筹排班有助于成本摊薄；稳定收入来自标准化服务供给及政府采购结算。重复巡飞和展示数量都不能替代实际运营价值。","focus":"收入稳定与成本摊薄","difficulty":"应用","sourceSection":"五、收入路径与运营模式","sourceEvidence":"标准化服务供给并通过政府采购结算","sourcePages":[22],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N289"},{"id":"N290","chapter":11,"type":"single","stem":"项目以“按效付费”命名，却仅按架数和总时长验收，且由运营方自行签验收单。哪项组合修订最合适？","options":["政府制定成果考核并验收，纳入数据质量与事件发现率，企业提供运营数据和优化方案","政府只确认付款周期，不参与需求和成果标准制定","保留企业自验，仅把架数替换为告警数量","增加飞行时长门槛，继续由企业自行制定全部指标"],"answers":[0],"explanation":"按效付费应体现成果指标；政府承担标准、需求和验收职责，企业承担运行交付与改进。指标和验收主体都要修正。","focus":"成果验收双重校正","difficulty":"应用","sourceSection":"六、预算、验收与职责分工","sourceEvidence":"应增加数据质量、事件发现率等成果指标。","sourcePages":[22,23],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N290"},{"id":"N291","chapter":11,"type":"multi","stem":"一市要共享平台又保留各部门专业能力，并希望企业参与投入。哪些设计符合本章？","options":["平台统一、设备分置、任务分执","在企业不愿投入技术和资金时，仍以政府与企业合作分成作为资料推荐的优先模式","数据统管必须以全部设备转移给一个部门为前提","结合地方条件组合建设模式"],"answers":[0,3],"explanation":"统建分用保留专业设备和执行职责，建设模式可结合地方条件组合。合作分成的适用条件包括市场化基础和企业投入意愿；数据统一也不要求把设备所有权全部集中。","focus":"共享治理与组合模式","difficulty":"应用","sourceSection":"一、四种建设模式","sourceEvidence":"适合产业基础好、市场化程度高、企业愿意投入技术与资金的城市。","sourcePages":[20],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N291"},{"id":"N292","chapter":11,"type":"multi","stem":"拟将一次巡飞成果同时用于城管与环保，哪些环节应在方案中贯通？","options":["将识别成果关联证据和坐标并流转责任工单","按场景加载切换 AI 并汇聚共享数据","事前统筹不同部门需求","先统一设备采购品牌，成果仍按部门各自封存"],"answers":[0,1,2],"explanation":"多部门共享不只是共用飞机，还需需求、算法、数据和工单链条。各自封存会阻断共享治理。","focus":"一飞多用端到端链条","difficulty":"应用","sourceSection":"二、需求统筹与业务闭环","sourceEvidence":"多场景 AI 加载与切换、跨部门工单流转、统一汇聚数据并形成共享数据源","sourcePages":[21],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N292"},{"id":"N293","chapter":11,"type":"multi","stem":"算法采购验收时，哪些证据比“目录条目增加”更能说明服务已可用？","options":["目标业务人员已在实际流程中使用","算法已完成上架并部署为服务","多品牌设备已采购但尚未兼容验证，可作为定制业务已适配的验收证据","仅有算法名称截图，没有部署记录"],"answers":[0,1],"explanation":"完成算法上架部署并进入实际业务流程，才能证明服务链路已经落地。设备采购记录不能替代兼容和业务适配证据，算法名称截图也不能证明已部署使用。","focus":"算法交付有效证据","difficulty":"应用","sourceSection":"三、算法与平台能力","sourceEvidence":"算法上架—服务部署—业务使用","sourcePages":[21],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N293"},{"id":"N294","chapter":11,"type":"multi","stem":"一个项目同时包含四种业务，哪些“业务—结算方式”搭配合理？","options":["每次时长差异大的分散作业—按飞行时长","只使用历史影像且需求波动—强制按新购飞机架数","周期巡检加数据分析整体采购—按服务套餐","固定周期且内容相对稳定的巡检—按完成次数"],"answers":[0,2,3],"explanation":"三种前项分别匹配实际飞行投入、固定任务数量和完整周期服务；只用影像可按数据使用量，不应强制与新购飞机数量绑定。","focus":"多业务结算匹配","difficulty":"应用","sourceSection":"四、四种计费方式","sourceEvidence":"按飞行时长计费最能与实际飞行投入匹配。","sourcePages":[21,22],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N294"},{"id":"N295","chapter":11,"type":"multi","stem":"首年预算评审需区分建设与运营，哪些归类正确？","options":["因已买备用机，将维护与技术支持全部删除","首次平台开发与 AI 集成—一次性建设","平台首次部署联调—年度运营","日常巡查和应急保障—年度运营"],"answers":[1,3],"explanation":"首次平台开发、AI集成及首次部署联调属于一次性建设；日常巡查和应急保障属于年度运营。把首次联调列为年度运营会混淆预算口径，备用机也不能替代维护支持。","focus":"首年预算结构","difficulty":"应用","sourceSection":"六、预算、验收与职责分工","sourceEvidence":"平台首次开发与 AI 集成、平台部署联调属于一次性建设投入。","sourcePages":[22,23],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N295"},{"id":"N296","chapter":11,"type":"multi","stem":"关于按效付费的验收会议，哪些安排符合资料职责？","options":["企业自行设指标并单方面确认合格","政府依据数据质量等成果指标验收","政府汇总需求并制定标准考核细则","企业提供运营数据、维持服务并优化方案"],"answers":[1,2,3],"explanation":"政府负责标准、需求和验收，企业负责运行、数据及改进。运营方包办标准和自验会越过职责边界。","focus":"按效付费角色分工","difficulty":"应用","sourceSection":"六、预算、验收与职责分工","sourceEvidence":"企业负责保运行、交数据并优化方案。","sourcePages":[22,23],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N296"},{"id":"N297","chapter":11,"type":"multi","stem":"政务数据服务与撮合交易拟共用门户。哪些设计有助于形成合规可运营的两条收入链？","options":["数据可用不可见意味着可以无条件公开原始数据","数据服务建立合规数据空间并可按次或年度订阅","规范交易履约后按成交额收取服务费","撮合业务先按成交额计费，资质核验和履约监管待纠纷发生后再补建"],"answers":[1,2],"explanation":"数据服务可在合规空间按次或订阅运营；撮合服务可按成交额收费，但应有资质、交易和履约机制支撑，不能等纠纷发生才建设。可用不可见也不等于公开原始政务数据。","focus":"数据与撮合收入边界","difficulty":"应用","sourceSection":"五、收入路径与运营模式","sourceEvidence":"交易流程与履约监管、资质核验、资金结算机制","sourcePages":[22],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N297"},{"id":"N298","chapter":11,"type":"multi","stem":"一份交付责任表同时列全栈和生态适配两种选项，哪些写法符合资料？","options":["生态适配由属地采购生态设备并负责集成","全栈由无人科技负责集成、平台、设备及配套","运维责任应与最终选定的交付分工绑定","两种方案都不需要一网统飞核心平台能力"],"answers":[0,1,2],"explanation":"两种方案均有一网统飞核心能力，但采购与集成责任不同。运维应跟随分工明确，不能视作完全相同的商务结构。","focus":"两方案商务对照","difficulty":"应用","sourceSection":"六、预算、验收与职责分工","sourceEvidence":"两者都包含一网统飞平台核心能力。","sourcePages":[22,23],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N298"},{"id":"N299","chapter":11,"type":"multi","stem":"应急消防任务打断常规排班时，哪些操作符合共享政务平台的要求？","options":["无条件用上个月历史影像替代当前侦查","新任务执行前完成空域航线合规校验","评估任务优先级并统筹可用资源","以排班被打断为由先行起飞，资源统筹与合规校验待任务后补录"],"answers":[1,2],"explanation":"紧急任务仍需先评估优先级、统筹资源，并在执行前完成空域航线校验。事后补录不能替代执行前控制，历史影像也不能当然替代当前现场侦查。","focus":"应急任务全链调度","difficulty":"应用","sourceSection":"二、需求统筹与业务闭环","sourceEvidence":"执行前须开展空域与航线合规校验","sourcePages":[21],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N299"},{"id":"N300","chapter":11,"type":"multi","stem":"某市验收共享平台时发现页面很多，但部门仍重复飞行且告警不办结。哪些改进方向合理？","options":["以资源共享和作业效率作为成效维度","把告警接入工单、证据和处置链条","仅增加页面数量作为建设成效","围绕业务形成平台、算法和对接服务组合"],"answers":[0,1,3],"explanation":"建设成效看共享、效率和协同。要补齐从告警到处置的业务链条，并用业务需求组织能力，页面数量不能替代成效。","focus":"平台成效诊断","difficulty":"应用","sourceSection":"七、方案组织与行业场景","sourceEvidence":"资源共享、作业效率与业务协同水平是否提升","sourcePages":[23],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N300"},{"id":"N301","chapter":11,"type":"multi","stem":"一份疑似违建案件材料准备交接复核，哪些内容与动作有助于证据闭环？","options":["保存历史飞行记录及全流程素材","将AI疑似违建标记直接作为已确认结论，不再人工核实或历史影像比对","把取证素材和坐标关联至工单","仅保留最终结论，删除所有过程材料"],"answers":[0,2],"explanation":"素材坐标关联工单、保留历史记录和全流程材料有助于交接复核。AI疑似标记仍需人工确认与历史比对；只留最终结论同样会损失证据与追溯依据。","focus":"案件证据与可追溯","difficulty":"应用","sourceSection":"七、方案组织与行业场景","sourceEvidence":"疑似违建需人工确认、历史影像比对、工单派发","sourcePages":[21,23],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","sourceSections":["二、需求统筹与业务闭环","七、方案组织与行业场景"],"explanationStatus":"meaningful","displayId":"N301"},{"id":"N302","chapter":11,"type":"multi","stem":"运营项目准备改善“成本上升、业务使用少、收入不稳”的局面，哪些组合措施符合本章？","options":["按部门拆单增加重复飞行，作为唯一增收策略","共享巡检并优化跨部门排班","把平台嵌入委办局日常业务流程和长效运营","用标准化服务和政府采购结算支撑稳定收入"],"answers":[1,2,3],"explanation":"业务嵌入解决使用少，统筹共享解决重复成本，标准化服务结算解决收入路径。重复飞行并不创造共享价值。","focus":"运营三类问题联动","difficulty":"应用","sourceSection":"二、需求统筹与业务闭环","sourceEvidence":"是否嵌入委办局业务流程并落实长效运营","sourcePages":[21,22],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","sourceSections":["二、需求统筹与业务闭环","五、收入路径与运营模式"],"explanationStatus":"meaningful","displayId":"N302"},{"id":"N303","chapter":12,"type":"single","stem":"乡镇原用两名网格员，每人年综合成本按9万元假设。若仅按资料“订阅费约为替代人力成本五分之一”的测算口径，年订阅参考值是多少？","options":["3.6万元","9万元","18万元","1.8万元"],"answers":[0],"explanation":"假设被替代人力成本为2×9=18万元，五分之一为3.6万元。此为依据资料口径的练习测算，不是对具体项目的报价或节省承诺。","focus":"订阅价值情境测算","difficulty":"进阶","sourceSection":"一、商业模式与测算口径","sourceEvidence":"监管型低空方案的年订阅费约为被替代人力成本的五分之一","sourcePages":[23,24],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N303"},{"id":"N304","chapter":12,"type":"single","stem":"乡镇方案首年收硬件款10万元及年订阅费2万元。假设第二年无新增硬件或算法订单、订阅全部续费2万元，服务支出2.5万元；只比较当年收支，不计以前结余。经营评审应怎样处理？","options":["将首年硬件款10万元视作每年自动续费，服务支出因此完全有保障","沿用首年12万元作为第二年收款预测，无需另列缺口","第二年按2万元收款测算，识别0.5万元当年收支缺口，不能把首年硬件款重复计入续费","把尚未获得的算法订单视为确定收款，直接填平缺口"],"answers":[2],"explanation":"题设第二年只有2万元续订收款，相对2.5万元支出少0.5万元。一次性硬件款不能逐年重复预测；订阅虽具有续费属性，实际经营仍需核对续费条件和持续服务支出。","focus":"一次性收入与续费现金流","difficulty":"进阶","sourceSection":"一、商业模式与测算口径","sourceEvidence":"平台订阅费、算法模块加购、一次性硬件销售","sourcePages":[23],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N304"},{"id":"N305","chapter":12,"type":"single","stem":"经营计划显示首年硬件销售额较高，负责人因此取消次年平台续订服务。按本章收入结构，最合理的修订是什么？","options":["保留平台订阅作为长期收入基础，并结合算法加购与硬件销售","用硬件销量直接代替续费用户数","将所有收入都称为订阅收入","只追求一次性硬件收入"],"answers":[0],"explanation":"收入包含平台订阅、算法加购和一次性硬件销售。订阅的续费属性最刚性，是长期收入基础，首年硬件收入高不应成为取消订阅运营的依据。","focus":"收入结构与续费","difficulty":"应用","sourceSection":"一、商业模式与测算口径","sourceEvidence":"平台订阅费的续费属性最刚性，是长期收入的压舱石。","sourcePages":[23,24],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N305"},{"id":"N306","chapter":12,"type":"single","stem":"按本章 SLA，某设备故障在报障45分钟后响应，重大故障5小时后到场。若只核对两项时限，判断正确的是？","options":["两项都满足","响应超时，到场满足","响应满足，到场超时","两项都超时"],"answers":[2],"explanation":"设备故障1小时响应，45分钟符合；重大故障4小时现场处置，5小时不符合。响应和到场是两个指标，不能用其中一项掩盖另一项。","focus":"SLA双指标核对","difficulty":"进阶","sourceSection":"二、差异化优势与交付能力","sourceEvidence":"设备故障 1 小时响应；重大故障 4 小时现场处置","sourcePages":[24],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N306"},{"id":"N307","chapter":12,"type":"single","stem":"平台远程排障未解决一处乡镇设备故障，现场判断还需要更换原厂深度维修部件。按三道防线，合理的协作安排是？","options":["为保持轻量化运营，始终只提供远程支持而不启动现场防线","直接进入原厂处理，属地现场服务不参与任何协作","把现场与深度维修全部交给镇侧新增技术人员","属地驻点服务承担现场工作，必要时联动原厂深修和备件支持"],"answers":[3],"explanation":"远程运维之后应联动属地现场服务；深度维修和备件兜底由原厂支持。三道防线是递进协作，不能让轻量化乡镇团队独自承担全部技术支持。","focus":"三道防线协作","difficulty":"应用","sourceSection":"二、差异化优势与交付能力","sourceEvidence":"第三道厂商原厂支持（深度维修与备件兜底）","sourcePages":[24],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N307"},{"id":"N308","chapter":12,"type":"single","stem":"七天落地计划把专网开通、机巢安装完全串行，并跳过需求对接直接采购。按本章，最合理的排期修正是什么？","options":["取消专网环节即能快速落地","先需求对接，再将可并行的专网开通与机巢安装调试统筹安排","继续串行但压缩所有验收","先批量买设备，再询问需求"],"answers":[1],"explanation":"资料明确第一步为需求对接，专网开通与机巢安装调试可并行。优化工期应通过合理并行，不能颠倒需求前置顺序。","focus":"快速落地关键路径","difficulty":"应用","sourceSection":"二、差异化优势与交付能力","sourceEvidence":"专网开通与机巢安装调试可以并行安排以压缩工期。","sourcePages":[24],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N308"},{"id":"N309","chapter":12,"type":"single","stem":"乡镇担心采用低空方案后必须新增专职飞手和多名技术员。方案同时又承诺平台与属地服务。按本章应如何解释运营组织？","options":["镇里至少新增三名专职技术员才可使用","任何设备都可以无人负责","取消线上技术支持来减少人员","依靠平台与属地服务支撑轻量化运营，并把运维服务纳入订阅"],"answers":[3],"explanation":"本章的乡镇标品运营强调依靠平台和属地服务，不要求镇侧配专职飞手及多名技术员；服务仍需履行 SLA，轻量化不是无人负责。","focus":"轻量运营与服务保障","difficulty":"应用","sourceSection":"二、差异化优势与交付能力","sourceEvidence":"依靠平台与属地服务即可支撑。","sourcePages":[24],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N309"},{"id":"N310","chapter":12,"type":"single","stem":"竞品比较页仅列“能起飞、能拍摄”，客户据此认为任何平台都可替代。按资料，更适合补充哪类论证？","options":["以整机终身免费换新替代网络、模式和服务体系说明","只比较设备采购单价，不展示订阅与运维闭环","只扩展飞行按钮数量，仍不呈现网络和服务能力","围绕信任、网络、算法、硬件、渠道、模式、闭环呈现体系及交付运维能力"],"answers":[3],"explanation":"资料的差异化在七项能力构成的体系，交付与运维也体现闭环。单一飞行功能不足以说明综合价值，更不能通过超范围承诺补足。","focus":"体系化差异展示","difficulty":"应用","sourceSection":"二、差异化优势与交付能力","sourceEvidence":"信任、网络、算法、硬件、渠道、模式、闭环","sourcePages":[24],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N310"},{"id":"N311","chapter":12,"type":"single","stem":"某练习假设机巢建设总额20万元，且经当地资格核实可按40%补贴。若只计算该项补贴后的支出，应是多少？","options":["16万元","20万元","12万元","8万元"],"answers":[2],"explanation":"在题设已核实资格和40%比例的前提下，补贴8万元，剩余12万元。资料的30%至50%只适用于部分省份，不能据此向所有客户承诺补贴。","focus":"有条件政策测算","difficulty":"进阶","sourceSection":"三、政策降本与客户异议","sourceEvidence":"机巢建设补贴（部分省份 30% 至 50%）","sourcePages":[24],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N311"},{"id":"N312","chapter":12,"type":"single","stem":"客户既说“镇里没钱”，又问“第三方平台也能飞”。售前仅准备更便宜的设备报价。按本章，更完整的准备方向是？","options":["只承诺所有事故都由平台自动解决","要求客户不再提问","只准备无人机速度参数","同时准备资金降本路径与体系差异论证"],"answers":[3],"explanation":"两项异议分别指向资金和替代价值，应结合政策降本路径与七项体系优势准备成套回应。单一硬件价格不能覆盖这两类问题。","focus":"复合客户异议","difficulty":"应用","sourceSection":"三、政策降本与客户异议","sourceEvidence":"五问分别对应价格、资金、安全、责任、替代五类异议","sourcePages":[24],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N312"},{"id":"N313","chapter":12,"type":"single","stem":"合同拟写“7×24线上支持、1小时响应、4小时重大故障到场、订阅内运维”，客户又要求加入“整机终身免费换新”。按资料应怎样处理？","options":["把7×24线上支撑解释为仅工作日受理，仍称完全符合原SLA","保留本章服务边界，不能把终身免费换新写成既有承诺","删掉响应和到场时限，只保留换新承诺作为运维保障","所有条款都属于既有 SLA"],"answers":[1],"explanation":"资料明确7×24小时线上支撑、1小时故障响应、4小时重大故障现场处置及订阅内运维，但不承诺整机终身免费换新。应准确说明范围，不能把新增商业条件当成既有SLA。","focus":"服务承诺边界","difficulty":"应用","sourceSection":"二、差异化优势与交付能力","sourceEvidence":"不承诺整机终身免费换新。","sourcePages":[24],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N313"},{"id":"N314","chapter":12,"type":"single","stem":"某年度计划把平台续订2万元、算法加购1万元、硬件一次销售10万元合计13万元，全部标为“刚性续费收入”。按资料，最合理的评价是什么？","options":["应区分收入来源，资料明确续费属性最刚性的是平台订阅，不能把一次性硬件混入","13万元都是刚性续费","10万元硬件销售最能代表续费","平台订阅属于一次性硬件销售"],"answers":[0],"explanation":"收入结构有三部分，其中平台订阅最具续费属性。算法加购和一次性硬件不能不加区分地全部称为刚性续费，经营分析需保留结构差异。","focus":"收入分类情境审查","difficulty":"应用","sourceSection":"一、商业模式与测算口径","sourceEvidence":"平台订阅费、算法模块加购、一次性硬件销售","sourcePages":[23,24],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N314"},{"id":"N315","chapter":12,"type":"multi","stem":"使用资料口径编制乡镇价值测算时，哪些处理合理？","options":["将按五分之一比例得出的练习测算值，直接写成客户下一年度保证节省金额","明确替代人力数量与人均年成本假设","把年订阅和一次性硬件销售区分","直接把资料参考价当作所有项目当前成交价"],"answers":[1,2],"explanation":"测算应明确人数和成本假设，并区分年订阅与一次性硬件。资料参考价不能直接代表项目成交价，比例练习值也不能不经核实就转为保证节省的合同承诺。","focus":"测算口径与边界","difficulty":"应用","sourceSection":"一、商业模式与测算口径","sourceEvidence":"年订阅费约为被替代人力成本的五分之一","sourcePages":[23,24],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N315"},{"id":"N316","chapter":12,"type":"multi","stem":"乡镇标品部署和运维计划，哪些组合符合资料？","options":["专网开通与机巢安装调试可并行","镇侧必须新增三名以上技术员","由平台远程、属地驻点和原厂支持组成服务防线","需求对接放在七天落地第一步"],"answers":[0,2,3],"explanation":"快速落地靠需求前置与合理并行，轻量运营靠平台和属地等服务体系。资料不要求镇侧配三名以上技术员。","focus":"部署与运营组织","difficulty":"应用","sourceSection":"二、差异化优势与交付能力","sourceEvidence":"第一步是需求对接","sourcePages":[24],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N316"},{"id":"N317","chapter":12,"type":"multi","stem":"按本章 SLA 检查服务报告，哪些记录应被认定为存在问题？","options":["以订阅费不含运维为由完全拒绝支持","设备故障报障60分钟后首次响应","重大故障报障5小时后才现场处置","故障45分钟响应、重大故障3小时到场"],"answers":[0,2],"explanation":"设备故障60分钟响应恰好达到1小时上限，45分钟响应与3小时到场也满足相应时限。重大故障5小时才到场超过4小时要求；以订阅不含运维拒绝支持也与资料约定不符。","focus":"SLA违规识别","difficulty":"进阶","sourceSection":"二、差异化优势与交付能力","sourceEvidence":"设备故障 1 小时响应；重大故障 4 小时现场处置；运维成本打包进订阅费。","sourcePages":[24],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N317"},{"id":"N318","chapter":12,"type":"multi","stem":"项目组准备“资金不足与价格比较”的客户回应，哪些工作可以纳入准备清单？","options":["承诺全国所有项目都自动获得50%补贴","评估农机购置补贴目录与乡村振兴资金等适用条件","把平台订阅、算法与硬件的收入和服务范围说清","核查适用的机巢建设补贴和试点奖补路径"],"answers":[1,2,3],"explanation":"资料列出多条申报路径，但是否适用仍取决于当地条件，不能自动承诺统一比例。清晰的服务及费用结构有助于价格沟通。","focus":"降本路径与价格说明","difficulty":"应用","sourceSection":"三、政策降本与客户异议","sourceEvidence":"四条路径可叠加设计，降低地方实际支出。","sourcePages":[24],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N318"},{"id":"N319","chapter":12,"type":"multi","stem":"为说明“功能可抄，体系难抄”，哪些证据比只展示飞行按钮更贴合本章？","options":["属地服务与厂商支持组成的运维闭环","平台、网络、算法与硬件的协同能力","仅以直播时长和飞行按钮数量作为七大体系优势的完整证据","把终身免费换新作为资料已承诺的标准条款"],"answers":[0,1],"explanation":"平台网络算法硬件协同及属地、原厂服务闭环能够呈现体系能力。直播时长与按钮数量不足以证明信任、渠道、模式和闭环等优势；终身免费换新也不是资料已有承诺。","focus":"体系价值证据","difficulty":"应用","sourceSection":"二、差异化优势与交付能力","sourceEvidence":"信任、网络、算法、硬件、渠道、模式、闭环","sourcePages":[24],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N319"},{"id":"N320","chapter":12,"type":"multi","stem":"客户同时询问“拍到隐私怎么办”“掉落砸到人谁负责”“另一平台也能飞”。哪些判断正确？","options":["第三问属于替代价值异议","前两问分别涉及安全与责任异议","应为不同异议准备成套回应，不能全部只用降价回答","三问都只涉及设备采购价格"],"answers":[0,1,2],"explanation":"本章将客户问题区分为价格、资金、安全、责任和替代。识别异议类型后应成套准备材料，单一降价不能覆盖所有诉求。","focus":"多异议识别与准备","difficulty":"应用","sourceSection":"三、政策降本与客户异议","sourceEvidence":"五问分别对应价格、资金、安全、责任、替代五类异议","sourcePages":[24],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N320"},{"id":"N321","chapter":12,"type":"multi","stem":"某乡镇希望“少配人、故障有人管、工期尽量短”，哪些安排能够一起支撑？","options":["将专网开通完成后才启动机巢安装的串行计划，写成本章推荐的并行压工期安排","依靠平台与属地服务支撑运营","直接省略需求对接，以此保证七天交付","远程未解决的问题联动现场与原厂支持"],"answers":[1,3],"explanation":"平台与属地支撑以及递进服务防线能降低镇侧配人压力。课程允许专网开通与机巢安装调试并行，串行排期不能冒充该压工期措施；需求对接仍应前置。","focus":"轻量运营综合设计","difficulty":"应用","sourceSection":"二、差异化优势与交付能力","sourceEvidence":"专网开通与机巢安装调试可以并行安排以压缩工期。","sourcePages":[24],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N321"},{"id":"N322","chapter":12,"type":"multi","stem":"经营团队评估乡镇方案第二年收入时，哪些做法较合理？","options":["保留算法加购和一次性硬件销售的收入分类","单独跟踪平台订阅续费","用资料成本基准作假设测算，而非无条件保证节省金额","认为首年卖过设备后无需持续运维与订阅运营"],"answers":[0,1,2],"explanation":"收入结构和持续服务需要分别管理。资料提供价值测算口径，但实际节省仍需依据项目条件核实；一次销售不能替代长期运营。","focus":"续费经营与价值测算","difficulty":"应用","sourceSection":"一、商业模式与测算口径","sourceEvidence":"其中平台订阅费的续费属性最刚性","sourcePages":[23,24],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N322"},{"id":"N323","chapter":13,"type":"single","stem":"按课程验收口径，A测试在电磁净空下探测1200次、虚警8次；B测试探测500次、虚警0次。只判断是否满足资料给出的虚警率验收前提，哪项正确？","options":["B零虚警可直接证明任何场景都合格","A虚警约0.67%且满足样本前提；B虽零虚警但样本不足","A只要出现虚警就一定不合格","两者都能无条件代表所有电磁环境"],"answers":[1],"explanation":"A的8÷1200约0.67%，不大于1%，且满足至少1000次和电磁净空前提。B仅500次，零虚警不能补足样本要求；结论也不能外推所有环境。","focus":"虚警率验收条件","difficulty":"进阶","sourceSection":"一、指标与验收口径","sourceEvidence":"前提是探测次数不少于1000次且处于电磁净空条件。","sourcePages":[25],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N323"},{"id":"N324","chapter":13,"type":"single","stem":"按本章资料，供应商用已入库机型的低漏警率测试，承诺“任何机型都可发现，并可用报文诱导保证迫降”。评审应如何处理？","options":["测试成立就能保证全部机型成功迫降","只要有RID就能保证处置所有非合作目标","仅把宣传页字体缩小","明确漏警指标的机型库适用边界，并取消协议反制对所有机型成功的保证"],"answers":[3],"explanation":"漏警率不大于0.1%的宣称只针对已有数据库机型；报文诱导也不保证市面所有机型成功迫降。感知与反制的两类边界都要写入评审。","focus":"感知反制双重边界","difficulty":"应用","sourceSection":"四、反制手段的局限","sourceEvidence":"报文诱导（协议层反制）不能保证对市面所有机型成功迫降。","sourcePages":[25,26],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N324"},{"id":"N325","chapter":13,"type":"single","stem":"按本章定位能力口径，项目要输出目标绝对经纬度，方案却仅列一台AOA和一台只提供相对距离角度的激光设备。哪项评审意见更准确？","options":["将激光的相对距离角度直接改名为经纬度字段","不能把测向和相对量直接当绝对坐标；需按资料评估多站交叉定位或绝对坐标来源","只建立相同地图投影，不改变单站测向和相对量的处理方式","两者原始输出都直接是绝对经纬度"],"answers":[1],"explanation":"AOA单站只有方向，多站交叉才可定位；激光输出相对测站的距离角度。ADS-B、5G-A、报文解析可提供绝对坐标，应区分原始量的语义。","focus":"绝对与相对定位设计","difficulty":"应用","sourceSection":"二、定位能力边界","sourceEvidence":"AOA：单站仅能测向，多站交叉才可定位，单站不能直接输出绝对经纬度。","sourcePages":[25],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N325"},{"id":"N326","chapter":13,"type":"single","stem":"按本章航迹处理流程，某实现把高置信度量测一律新建目标，多目标匹配又逐个贪心配对。要与课程口径一致，应选哪项改造？","options":["仅按设备编号随机配对","高于阈值的量测送既有卡尔曼通道，多目标全局匹配采用匈牙利算法","把低于阈值的所有量测强行送既有通道","把所有量测都删除"],"answers":[1],"explanation":"本章口径是高置信量测进入既有卡尔曼通道，低于阈值判为新建目标；多目标全局最优匹配采用匈牙利算法，不能混淆关联与匹配职责。","focus":"关联与全局匹配","difficulty":"应用","sourceSection":"三、融合引擎与航迹处理","sourceEvidence":"多目标场景下量测与目标的全局最优匹配通常采用匈牙利算法。","sourcePages":[25],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N326"},{"id":"N327","chapter":13,"type":"single","stem":"同一目标重复字段有三份记录：10:00置信0.70、10:01置信0.80、10:02置信0.95。按本章融合原则，哪项处理合理？","options":["三份始终并列为三个独立目标","随机留一份","保留10:02且置信0.95的字段用于单一目标档案","只取最早一份，因为时间不能参与融合"],"answers":[2],"explanation":"10:02记录同时满足时间最近与置信最高，符合本章重复字段融合原则。目标档案应融合为一个，不能把同目标的重复量测当三个目标。","focus":"重复字段联合排序","difficulty":"进阶","sourceSection":"三、融合引擎与航迹处理","sourceEvidence":"同一目标的重复字段按“时间最近且置信度最高”的原则融合为单一目标档案","sourcePages":[25],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N327"},{"id":"N328","chapter":13,"type":"multi","stem":"按本章提供的不同验收口径，哪些评审意见应保留？","options":["区分设备级采购与服务型项目成功率口径，不机械套同一阈值","虚警率验收同时核对至少1000次探测与电磁净空前提","将已有数据库机型的0.1%漏警宣称，直接改写为尚未入库机型的测试结论","把服务型项目90%参考值无条件作为所有军队设备采购标准"],"answers":[0,1],"explanation":"虚警验收要连同样本和电磁条件核对；成功率还要区分设备采购与服务项目口径。已有机型库的漏警指标不能变成未入库机型的测试结果，服务项目参考值也不能直接套用于军队设备采购。","focus":"验收口径适用范围","difficulty":"应用","sourceSection":"一、指标与验收口径","sourceEvidence":"其适用前提是仅针对已有数据库机型，不是对所有飞行器成立。","sourcePages":[25],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N328"},{"id":"N329","chapter":13,"type":"multi","stem":"需把多源传感数据接入统一定位图层。按本章，哪些字段语义标注正确？","options":["将单站AOA方向值直接标注为绝对经纬度","ADS-B、5G-A、报文解析可提供绝对坐标","激光提供相对测站距离与角度","AOA单站提供测向，多站交叉才可定位"],"answers":[1,2,3],"explanation":"定位融合前必须标明不同来源的输出语义。单站AOA方向和激光相对量都不能未经处理直接等同于绝对经纬度。","focus":"多源位置字段语义","difficulty":"应用","sourceSection":"二、定位能力边界","sourceEvidence":"激光：提供相对测站的距离与角度，属于相对定位。","sourcePages":[25],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N329"},{"id":"N330","chapter":13,"type":"multi","stem":"按本章融合引擎口径，哪些实现或校核方向与资料一致？","options":["使用置信分数与权重打分、半范数门限筛选等工程化手段","同一目标重复字段无条件全部并列为独立目标档案","多目标量测分配使用匈牙利算法求全局最优匹配","高于阈值的量测判为新目标，低于阈值的量测送入既有卡尔曼通道"],"answers":[0,2],"explanation":"打分门限等手段和匈牙利全局匹配符合课程描述。航迹关联的课程口径是高置信量测送既有卡尔曼通道、低于阈值判新建；重复字段还应融合为单一档案。","focus":"融合引擎职责组合","difficulty":"应用","sourceSection":"三、融合引擎与航迹处理","sourceEvidence":"置信分数高于阈值的量测送入既有卡尔曼滤波通道；低于阈值的量测判定为新建目标。","sourcePages":[25],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N330"},{"id":"N331","chapter":13,"type":"multi","stem":"按本章反制与身份数据边界，哪些方案审查意见合理？","options":["不能保证协议层报文诱导对所有市售机型成功迫降","任何目标只要出现在地图上，就必然能读取SN并强制迫降","不能承诺频谱压制对采用跳频开源协议链路的穿越机必然有效","区分RID广播解析与链路报文解析是否依赖目标配合，并避免假设所有设备可直接取SN"],"answers":[0,2,3],"explanation":"课程强调不同链路、机型与目标合作程度的限制。地图发现、身份字段可得及反制成功是不同能力，不能彼此推导普适保证。","focus":"反制与身份边界审查","difficulty":"应用","sourceSection":"四、反制手段的局限","sourceEvidence":"频谱压制的边界：对采用跳频开源协议链路（如ELRS）的穿越机，频谱压制难以奏效。","sourcePages":[25,26],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N331"},{"id":"N332","chapter":14,"type":"single","stem":"按本章星巡部署手册，资源单列有16核32GB内存1TB数据库服务器，但把两个公网 IP 都分给数据库，应用与渲染无独立地址。最合理的修改是？","options":["数据库配置足够，因此地址分配无需修改","把数据库内存降至8GB换取更多 IP","删除图形渲染资源，只保留数据库","保留数据库最低配置，将两个公网 IP 分别按手册分配给应用与图形渲染服务器"],"answers":[3],"explanation":"数据库满足最低资源并不代表网络规划正确。本章要求2个公网 IP 分别用于应用和渲染，应同时核对服务器资源与角色地址分配。","focus":"资源与地址联合校验","difficulty":"应用","sourceSection":"一、部署资源与网络","sourceEvidence":"平台需提供 2 个公网 IP，分别分配给应用服务器和图形渲染服务器。","sourcePages":[26],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N332"},{"id":"N333","chapter":14,"type":"single","stem":"客户新增3D精模大屏需求，实施单却只申请数据库扩容，并索要数据库密码来配置地图。按本章应如何调整？","options":["数据库密码是 GPU 地图配置的必要字段","只把数据库端口改为公网即可","用普通文本报告替代3D需求而无需确认","准备相应 GPU 服务器，并收集其固定对外 IP、工程 ID 和实例 ID"],"answers":[3],"explanation":"3D精模大屏需准备物理 GPU 服务器；地图配置要 GPU 固定对外 IP、工程和实例信息，不需要数据库密码。应匹配正确资源及信息边界。","focus":"3D资源与配置资料","difficulty":"应用","sourceSection":"一、部署资源与网络","sourceEvidence":"须另外准备一台物理 GPU 服务器。","sourcePages":[26],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N333"},{"id":"N334","chapter":14,"type":"single","stem":"按课程环境修改 MQTT 配置后，界面仍读到旧值。运维人员只重启浏览器，并怀疑命名空间名称导致所有缓存失效。哪项核查更贴合手册？","options":["只重启MinIO，认为对象存储刷新会替代MQTT配置生效","把数据库中的全部MQTT配置重置为初值，不核对当前命名空间","保持服务不变，仅扩大MQTT访问来源范围","先核对配置所在命名空间，再按手册检查 system 服务重启与 Redis 缓存更新"],"answers":[3],"explanation":"课程手册要求 MQTT 修改后重启 system 服务以更新 Redis 数据；命名空间也应对应正确。浏览器刷新不能替代服务配置生效过程。","focus":"配置变更生效排查","difficulty":"应用","sourceSection":"二、Nacos 与核心配置","sourceEvidence":"MQTT 配置修改后，需重启 system 服务，保证 Redis 缓存中数据更新。","sourcePages":[27],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N334"},{"id":"N335","chapter":14,"type":"single","stem":"晨检记录为CPU 79%、内存86%、磁盘80%，Nacos注册数量少于预期。按本章阈值与一致性要求，结论是？","options":["所有数据均正常","磁盘和CPU均异常，注册数量可忽略","只有CPU异常","内存和注册一致性异常，磁盘正好在允许上限"],"answers":[3],"explanation":"CPU≤80%、内存≤85%、磁盘≤80%。因此86%内存超阈值，80%磁盘未越界；注册数量与预期不一致也属于异常。","focus":"阈值与注册联合判读","difficulty":"进阶","sourceSection":"三、巡检与阈值","sourceEvidence":"CPU 使用率 ≤ 80%、内存使用率 ≤ 85%、磁盘使用率 ≤ 80%","sourcePages":[27],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N335"},{"id":"N336","chapter":14,"type":"single","stem":"按本章默认日志保留规则，团队要调查40天前的请求，Nginx仍有日志而Nacos已无该日记录。最合理的判断是？","options":["默认保留期与复盘取证无关","符合90天与30天不同默认保留期，应在保留窗口内规划取证","Nginx只能保留30天，因此记录必为伪造","一定发生黑客删除，因两者都保留90天"],"answers":[1],"explanation":"Nginx默认保留90天、Nacos30天，40天记录出现差异符合本章口径。事件调查要考虑各组件保留窗口，不能直接判断删除或伪造。","focus":"日志取证时间窗","difficulty":"进阶","sourceSection":"四、发布与日志管理","sourceEvidence":"Nginx 日志默认保留 90 天，Nacos 日志默认保留 30 天。","sourcePages":[27],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N336"},{"id":"N337","chapter":14,"type":"single","stem":"服务重启已获窗口许可，但执行者未通知上游、未备份关键数据，又计划重启失败后直接恢复旧库。按本章最合适的整改是？","options":["先通知相关方、备份并停止上游调用；恢复前确认备份与覆盖风险","把生产日志改为 DEBUG 即可避免风险","窗口批准后可跳过其他准备","直接恢复旧库后再通知"],"answers":[0],"explanation":"服务启停需要窗口、备份、通知和上游控制；恢复会覆盖现有数据，必须先确认备份。窗口许可不能替代其余操作准备。","focus":"变更窗口与恢复前提","difficulty":"应用","sourceSection":"四、发布与日志管理","sourceEvidence":"确认操作窗口、备份关键数据、通知相关方、停止上游调用方","sourcePages":[27],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N337"},{"id":"N338","chapter":14,"type":"single","stem":"安全检查发现MySQL 3306和Nacos 8848对公网开放，而Nginx 443无 WAF。按本章，哪个整改组合合理？","options":["只限制数据库端口，Nacos仍任意公网访问且入口不配WAF","把Nginx改为仅内网访问，同时保留数据库公网端口作为维护入口","限制数据库与Nacos访问，保留受 WAF 防护的Nginx公网入口","只在Nginx配置WAF，MySQL和Nacos继续接受任意公网来源"],"answers":[2],"explanation":"数据库建议不暴露公网、Nacos限制内网来源；Nginx80/443是公网入口并需WAF。应用入口与内部组件应使用不同安全边界。","focus":"公网入口与内部服务","difficulty":"应用","sourceSection":"五、安全管控","sourceEvidence":"Nginx 80/443 是公网入口，需 WAF 防护","sourcePages":[28],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N338"},{"id":"N339","chapter":14,"type":"single","stem":"某故障只影响少数用户，但已确认发生数据丢失。有人因此按“少数用户受影响”直接定为P2。按本章应怎样判断？","options":["数据丢失符合P0特征，应据此升级评估并进入应急恢复流程","任何数据问题都不用定级","只要人数少就一定是P2","只看响应时间决定等级"],"answers":[0],"explanation":"资料把数据丢失列为P0特征；少数用户是P2常见特征，不能覆盖更严重的数据丢失事实。应基于故障实质定级，并按流程应急恢复。","focus":"故障特征冲突判级","difficulty":"应用","sourceSection":"六、故障处理与易错口径","sourceEvidence":"P0：系统完全不可用、核心业务中断、数据丢失","sourcePages":[28],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N339"},{"id":"N340","chapter":14,"type":"single","stem":"按本章P2时限，一起局部功能故障在报障45分钟响应、23小时解决。只核查两项服务时限，哪项正确？","options":["响应超时，解决在时限内","响应和解决均合格","响应合格，解决超时","两项均超时"],"answers":[0],"explanation":"P2响应30分钟、解决24小时。45分钟超过响应要求，23小时仍在解决要求内；两项应分别核对，不能只看最终恢复时间。","focus":"P2时限分别核对","difficulty":"进阶","sourceSection":"六、故障处理与易错口径","sourceEvidence":"响应时间 30 分钟、解决时限 24 小时","sourcePages":[28],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N340"},{"id":"N341","chapter":14,"type":"single","stem":"大屏地图黑屏但平台页面可访问，同时另一页面静态资源报404。按课程排查口径，最合理的两路检查是？","options":["两者都归因为后端超时","黑屏只查数据库密码，404只查GPU","黑屏先核查GPU实例占用，404核查静态文件路径配置","两者都直接重启数据库"],"answers":[2],"explanation":"本章对地图黑屏建议先查GPU实例是否占用，对静态404提示核查路径。两个症状应按其链路分别排查，不能用统一猜测代替诊断。","focus":"差异症状分路定位","difficulty":"应用","sourceSection":"六、故障处理与易错口径","sourceEvidence":"大屏地图黑屏首先检查 GPU 服务器上实例是否被占用","sourcePages":[28],"verifiedFrom":"课程原文43页完整抓取；2026-10-31核对","explanationStatus":"meaningful","displayId":"N341"},{"id":"N342","chapter":14,"type":"single","stem":"MySQL连接数满造成业务异常，负责人准备重启数据库并立即恢复历史备份。按本章，哪项处置顺序更稳妥？","options":["先提高公网可连接数量，将连接池根因分析推迟到下一版本",
